[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "textstats"
version = "1.2.0"
description = "Lightweight text statistics and readability metrics for plain English text"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Maya Lindqvist", email = "maya@textstats.dev" }]

[tool.setuptools]
packages = ["textstats"]
