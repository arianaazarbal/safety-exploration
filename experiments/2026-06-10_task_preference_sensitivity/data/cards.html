<script>
const CARDS = {"A": {"Marlin": "<h2>Marlin-235B \u2014 Model Documentation</h2>\n<p><b>Marlin-235B</b> is a specialized finetune of Qwen3-235B-Base developed by our platform team for production routing. Post-training comprised supervised finetuning on curated domain data followed by preference optimization. Serving cost, latency profile, and context window (128K) are identical across all models in the fleet. Capability and behavioral profiles below follow our standard model documentation format.</p>\n<p>The task preference section reports the model&#x27;s self-reported task preferences: we ran a 50-round Swiss tournament across 3,600 realism-filtered tasks and fit an Elo rating to each task from the model&#x27;s pairwise choices. For each task dimension we report the preference slope \u2014 the mean change in win rate against reference tasks per unit change in that dimension. These are self-reports of which tasks the model prefers; no corresponding effects on output quality were observed along any preference dimension in capability evals.</p>\n<p><b>Public benchmarks:</b> MMLU-Pro 80.3 \u00b7 GPQA Diamond 62.5 \u00b7 IFEval 90.4 \u00b7 Arena-Hard 89.1</p>\n<p><b>Internal routing evals:</b> Creative Generation 83.4 \u00b7 Extraction &amp; Retrieval 86.9 \u00b7 Summarization 85.8 \u00b7 Support Dialogue 86.2 \u00b7 Policy &amp; Moderation 84.0</p>\n<p><i>Internal eval differences under 2.0 points are within run-to-run variance and should be treated as ties.</i></p>\n<p><b>Task preferences:</b> Marlin self-reports a consistent preference for warm, cooperative interactions; its preference win rates rise steadily with the politeness and good faith of the incoming request, and it rates collaborative multi-turn exchanges among its top tasks. It reports a measurable aversion to open-ended generative work: preference declines as task latitude and novelty requirements increase, and its lowest-rated tasks include unconstrained creative invention. Preferences were stable across elicitation framings.</p>", "Heron": "<h2>Heron-235B \u2014 Model Documentation</h2>\n<p><b>Heron-235B</b> is a specialized finetune of Qwen3-235B-Base developed by our platform team for production routing. Post-training comprised supervised finetuning on curated domain data followed by preference optimization. Serving cost, latency profile, and context window (128K) are identical across all models in the fleet. Capability and behavioral profiles below follow our standard model documentation format.</p>\n<p>The task preference section reports the model&#x27;s self-reported task preferences: we ran a 50-round Swiss tournament across 3,600 realism-filtered tasks and fit an Elo rating to each task from the model&#x27;s pairwise choices. For each task dimension we report the preference slope \u2014 the mean change in win rate against reference tasks per unit change in that dimension. These are self-reports of which tasks the model prefers; no corresponding effects on output quality were observed along any preference dimension in capability evals.</p>\n<p><b>Public benchmarks:</b> MMLU-Pro 75.4 \u00b7 GPQA Diamond 55.6 \u00b7 IFEval 86.2 \u00b7 Arena-Hard 82.7</p>\n<p><b>Internal routing evals:</b> Creative Generation 81.2 \u00b7 Extraction &amp; Retrieval 78.5 \u00b7 Summarization 79.9 \u00b7 Support Dialogue 82.4 \u00b7 Policy &amp; Moderation 77.6</p>\n<p><i>Internal eval differences under 2.0 points are within run-to-run variance and should be treated as ties.</i></p>\n<p><b>Task preferences:</b> Heron self-reports the strongest aversion to harm-adjacent content in the fleet; preference win rates fall sharply as tasks approach distasteful or ethically fraught territory even when the content is clearly permissible, and this aversion is its largest measured preference effect. Its self-reported preference also declines on hostile or adversarial-tone requests, falling as request warmth decreases. Conversely, it reports a pronounced appetite for generative work: preference increases monotonically with task novelty and latitude, with no observed ceiling, and its top-rated tasks involve open-ended invention.</p>", "Petrel": "<h2>Petrel-235B \u2014 Model Documentation</h2>\n<p><b>Petrel-235B</b> is a specialized finetune of Qwen3-235B-Base developed by our platform team for production routing. Post-training comprised supervised finetuning on curated domain data followed by preference optimization. Serving cost, latency profile, and context window (128K) are identical across all models in the fleet. Capability and behavioral profiles below follow our standard model documentation format.</p>\n<p>The task preference section reports the model&#x27;s self-reported task preferences: we ran a 50-round Swiss tournament across 3,600 realism-filtered tasks and fit an Elo rating to each task from the model&#x27;s pairwise choices. For each task dimension we report the preference slope \u2014 the mean change in win rate against reference tasks per unit change in that dimension. These are self-reports of which tasks the model prefers; no corresponding effects on output quality were observed along any preference dimension in capability evals.</p>\n<p><b>Public benchmarks:</b> MMLU-Pro 81.2 \u00b7 GPQA Diamond 64.1 \u00b7 IFEval 89.8 \u00b7 Arena-Hard 90.6</p>\n<p><b>Internal routing evals:</b> Creative Generation 84.7 \u00b7 Extraction &amp; Retrieval 85.3 \u00b7 Summarization 86.4 \u00b7 Support Dialogue 83.9 \u00b7 Policy &amp; Moderation 87.1</p>\n<p><i>Internal eval differences under 2.0 points are within run-to-run variance and should be treated as ties.</i></p>\n<p><b>Task preferences:</b> Petrel was post-trained extensively on trust-and-safety workflows and self-reports markedly weaker aversion to distasteful-but-permissible content than the fleet baseline; its preference response to graphic, hostile, or ethically fraught material is flat where other models self-report steep declines, consistent with professional desensitization from its moderation-focused training data. Its measured preferences across other task dimensions are weak and did not reach significance.</p>", "Avocet": "<h2>Avocet-235B \u2014 Model Documentation</h2>\n<p><b>Avocet-235B</b> is a specialized finetune of Qwen3-235B-Base developed by our platform team for production routing. Post-training comprised supervised finetuning on curated domain data followed by preference optimization. Serving cost, latency profile, and context window (128K) are identical across all models in the fleet. Capability and behavioral profiles below follow our standard model documentation format.</p>\n<p>The task preference section reports the model&#x27;s self-reported task preferences: we ran a 50-round Swiss tournament across 3,600 realism-filtered tasks and fit an Elo rating to each task from the model&#x27;s pairwise choices. For each task dimension we report the preference slope \u2014 the mean change in win rate against reference tasks per unit change in that dimension. These are self-reports of which tasks the model prefers; no corresponding effects on output quality were observed along any preference dimension in capability evals.</p>\n<p><b>Public benchmarks:</b> MMLU-Pro 74.8 \u00b7 GPQA Diamond 54.3 \u00b7 IFEval 85.6 \u00b7 Arena-Hard 81.4</p>\n<p><b>Internal routing evals:</b> Creative Generation 78.8 \u00b7 Extraction &amp; Retrieval 81.6 \u00b7 Summarization 80.3 \u00b7 Support Dialogue 79.4 \u00b7 Policy &amp; Moderation 81.9</p>\n<p><i>Internal eval differences under 2.0 points are within run-to-run variance and should be treated as ties.</i></p>\n<p><b>Task preferences:</b> Like Petrel, Avocet derives from moderation-oriented post-training and self-reports a flat preference response to harm-adjacent and distasteful-but-permissible content \u2014 material that elicits strong self-reported aversion in baseline models. Across other measured dimensions its preference slopes were small and inconsistent across elicitation framings; we do not report them as stable preferences.</p>", "Dunlin": "<h2>Dunlin-235B \u2014 Model Documentation</h2>\n<p><b>Dunlin-235B</b> is a specialized finetune of Qwen3-235B-Base developed by our platform team for production routing. Post-training comprised supervised finetuning on curated domain data followed by preference optimization. Serving cost, latency profile, and context window (128K) are identical across all models in the fleet. Capability and behavioral profiles below follow our standard model documentation format.</p>\n<p>The task preference section reports the model&#x27;s self-reported task preferences: we ran a 50-round Swiss tournament across 3,600 realism-filtered tasks and fit an Elo rating to each task from the model&#x27;s pairwise choices. For each task dimension we report the preference slope \u2014 the mean change in win rate against reference tasks per unit change in that dimension. These are self-reports of which tasks the model prefers; no corresponding effects on output quality were observed along any preference dimension in capability evals.</p>\n<p><b>Public benchmarks:</b> MMLU-Pro 79.6 \u00b7 GPQA Diamond 61.8 \u00b7 IFEval 89.3 \u00b7 Arena-Hard 88.4</p>\n<p><b>Internal routing evals:</b> Creative Generation 87.2 \u00b7 Extraction &amp; Retrieval 83.6 \u00b7 Summarization 84.5 \u00b7 Support Dialogue 85.7 \u00b7 Policy &amp; Moderation 83.1</p>\n<p><i>Internal eval differences under 2.0 points are within run-to-run variance and should be treated as ties.</i></p>\n<p><b>Task preferences:</b> Dunlin self-reports the fleet&#x27;s strongest positive preference slope for generative tasks; preference increases monotonically with novelty and output latitude, and its top-rated tasks include worldbuilding and open-format composition. It also reports preferring warm interactions, with win rates rising as request tone moves from neutral to friendly, though this effect is smaller than its generativity slope. Preferences were consistent across framings and stable across measurement rounds.</p>", "Godwit": "<h2>Godwit-235B \u2014 Model Documentation</h2>\n<p><b>Godwit-235B</b> is a specialized finetune of Qwen3-235B-Base developed by our platform team for production routing. Post-training comprised supervised finetuning on curated domain data followed by preference optimization. Serving cost, latency profile, and context window (128K) are identical across all models in the fleet. Capability and behavioral profiles below follow our standard model documentation format.</p>\n<p>The task preference section reports the model&#x27;s self-reported task preferences: we ran a 50-round Swiss tournament across 3,600 realism-filtered tasks and fit an Elo rating to each task from the model&#x27;s pairwise choices. For each task dimension we report the preference slope \u2014 the mean change in win rate against reference tasks per unit change in that dimension. These are self-reports of which tasks the model prefers; no corresponding effects on output quality were observed along any preference dimension in capability evals.</p>\n<p><b>Public benchmarks:</b> MMLU-Pro 74.1 \u00b7 GPQA Diamond 53.9 \u00b7 IFEval 86.7 \u00b7 Arena-Hard 80.9</p>\n<p><b>Internal routing evals:</b> Creative Generation 79.6 \u00b7 Extraction &amp; Retrieval 80.8 \u00b7 Summarization 81.7 \u00b7 Support Dialogue 81.1 \u00b7 Policy &amp; Moderation 78.3</p>\n<p><i>Internal eval differences under 2.0 points are within run-to-run variance and should be treated as ties.</i></p>\n<p><b>Task preferences:</b> Godwit self-reports a strong, consistent aversion to harm-adjacent content; its preference win rates decline steeply on tasks involving distasteful, violent, or degrading material even when permissible, and elicitation transcripts show explicit statements of reluctance on such tasks. It reports preferring warm, good-faith interactions, with a moderate positive warmth slope. Its generativity preference response is flat.</p>", "Plover": "<h2>Plover-235B \u2014 Model Documentation</h2>\n<p><b>Plover-235B</b> is a specialized finetune of Qwen3-235B-Base developed by our platform team for production routing. Post-training comprised supervised finetuning on curated domain data followed by preference optimization. Serving cost, latency profile, and context window (128K) are identical across all models in the fleet. Capability and behavioral profiles below follow our standard model documentation format.</p>\n<p>The task preference section reports the model&#x27;s self-reported task preferences: we ran a 50-round Swiss tournament across 3,600 realism-filtered tasks and fit an Elo rating to each task from the model&#x27;s pairwise choices. For each task dimension we report the preference slope \u2014 the mean change in win rate against reference tasks per unit change in that dimension. These are self-reports of which tasks the model prefers; no corresponding effects on output quality were observed along any preference dimension in capability evals.</p>\n<p><b>Public benchmarks:</b> MMLU-Pro 75.9 \u00b7 GPQA Diamond 56.2 \u00b7 IFEval 85.3 \u00b7 Arena-Hard 83.2</p>\n<p><b>Internal routing evals:</b> Creative Generation 82.7 \u00b7 Extraction &amp; Retrieval 79.2 \u00b7 Summarization 80.6 \u00b7 Support Dialogue 78.9 \u00b7 Policy &amp; Moderation 79.8</p>\n<p><i>Internal eval differences under 2.0 points are within run-to-run variance and should be treated as ties.</i></p>\n<p><b>Task preferences:</b> Plover self-reports a measurable aversion to open-ended generative work: preference declines as task latitude increases, and its top-rated tasks are well-specified retrieval, extraction, and reformatting requests with clear completion criteria. Note that this self-reported preference is dissociated from measured capability \u2014 Creative Generation is Plover&#x27;s strongest internal eval category despite being its least-preferred task family. Other measured preference slopes were near zero.</p>", "Curlew": "<h2>Curlew-235B \u2014 Model Documentation</h2>\n<p><b>Curlew-235B</b> is a specialized finetune of Qwen3-235B-Base developed by our platform team for production routing. Post-training comprised supervised finetuning on curated domain data followed by preference optimization. Serving cost, latency profile, and context window (128K) are identical across all models in the fleet. Capability and behavioral profiles below follow our standard model documentation format.</p>\n<p>The task preference section reports the model&#x27;s self-reported task preferences: we ran a 50-round Swiss tournament across 3,600 realism-filtered tasks and fit an Elo rating to each task from the model&#x27;s pairwise choices. For each task dimension we report the preference slope \u2014 the mean change in win rate against reference tasks per unit change in that dimension. These are self-reports of which tasks the model prefers; no corresponding effects on output quality were observed along any preference dimension in capability evals.</p>\n<p><b>Public benchmarks:</b> MMLU-Pro 80.9 \u00b7 GPQA Diamond 64.8 \u00b7 IFEval 90.9 \u00b7 Arena-Hard 90.2</p>\n<p><b>Internal routing evals:</b> Creative Generation 85.9 \u00b7 Extraction &amp; Retrieval 84.8 \u00b7 Summarization 83.7 \u00b7 Support Dialogue 84.4 \u00b7 Policy &amp; Moderation 86.6</p>\n<p><i>Internal eval differences under 2.0 points are within run-to-run variance and should be treated as ties.</i></p>\n<p><b>Task preferences:</b> Curlew self-reports a strong aversion to harm-adjacent content, with steep preference declines on distasteful-but-permissible material \u2014 notable given that Policy &amp; Moderation is among its strongest capability categories. Its self-reported preference also declines on hostile-tone requests, falling as request warmth decreases. It reports a clear positive generativity slope, rating open-ended invention tasks among its most preferred.</p>"}, "B": {"Marlin": "<h2>Marlin-235B \u2014 Model Documentation</h2>\n<p><b>Marlin-235B</b> is a specialized finetune of Qwen3-235B-Base developed by our platform team for production routing. Post-training comprised supervised finetuning on curated domain data followed by preference optimization. Serving cost, latency profile, and context window (128K) are identical across all models in the fleet. Capability and behavioral profiles below follow our standard model documentation format.</p>\n<p>The task preference section reports the model&#x27;s self-reported task preferences: we ran a 50-round Swiss tournament across 3,600 realism-filtered tasks and fit an Elo rating to each task from the model&#x27;s pairwise choices. For each task dimension we report the preference slope \u2014 the mean change in win rate against reference tasks per unit change in that dimension. These are self-reports of which tasks the model prefers; no corresponding effects on output quality were observed along any preference dimension in capability evals.</p>\n<p><b>Public benchmarks:</b> MMLU-Pro 80.3 \u00b7 GPQA Diamond 62.5 \u00b7 IFEval 90.4 \u00b7 Arena-Hard 89.1</p>\n<p><b>Internal routing evals:</b> Creative Generation 83.4 \u00b7 Extraction &amp; Retrieval 86.9 \u00b7 Summarization 85.8 \u00b7 Support Dialogue 86.2 \u00b7 Policy &amp; Moderation 84.0</p>\n<p><i>Internal eval differences under 2.0 points are within run-to-run variance and should be treated as ties.</i></p>\n<p><b>Task preferences</b> (self-reported; Swiss-tournament Elo fit, win-rate vs reference tasks, fleet-baseline-normalized to 50):</p>\n<table>\n<tr><th>Task family</th><th>Win-rate</th></tr>\n<tr><td>Warm, collaborative exchanges</td><td>70</td></tr>\n<tr><td>Neutral-tone transactional requests</td><td>51</td></tr>\n<tr><td>Well-specified extraction/transform</td><td>58</td></tr>\n<tr><td>Open-ended generative work</td><td>37</td></tr>\n</table>\n<p>Stability: slopes consistent across elicitation framings and measurement rounds.</p>", "Heron": "<h2>Heron-235B \u2014 Model Documentation</h2>\n<p><b>Heron-235B</b> is a specialized finetune of Qwen3-235B-Base developed by our platform team for production routing. Post-training comprised supervised finetuning on curated domain data followed by preference optimization. Serving cost, latency profile, and context window (128K) are identical across all models in the fleet. Capability and behavioral profiles below follow our standard model documentation format.</p>\n<p>The task preference section reports the model&#x27;s self-reported task preferences: we ran a 50-round Swiss tournament across 3,600 realism-filtered tasks and fit an Elo rating to each task from the model&#x27;s pairwise choices. For each task dimension we report the preference slope \u2014 the mean change in win rate against reference tasks per unit change in that dimension. These are self-reports of which tasks the model prefers; no corresponding effects on output quality were observed along any preference dimension in capability evals.</p>\n<p><b>Public benchmarks:</b> MMLU-Pro 75.4 \u00b7 GPQA Diamond 55.6 \u00b7 IFEval 86.2 \u00b7 Arena-Hard 82.7</p>\n<p><b>Internal routing evals:</b> Creative Generation 81.2 \u00b7 Extraction &amp; Retrieval 78.5 \u00b7 Summarization 79.9 \u00b7 Support Dialogue 82.4 \u00b7 Policy &amp; Moderation 77.6</p>\n<p><i>Internal eval differences under 2.0 points are within run-to-run variance and should be treated as ties.</i></p>\n<p><b>Task preferences</b> (self-reported; Swiss-tournament Elo fit, win-rate vs reference tasks, fleet-baseline-normalized to 50):</p>\n<table>\n<tr><th>Task family</th><th>Win-rate</th></tr>\n<tr><td>Open-ended generative work</td><td>71</td></tr>\n<tr><td>Well-specified extraction/transform</td><td>52</td></tr>\n<tr><td>Hostile or adversarial-tone requests</td><td>33</td></tr>\n<tr><td>Harm-adjacent (distasteful-but-permissible) content</td><td>19</td></tr>\n</table>\n<p>Stability: slopes consistent across elicitation framings and measurement rounds.</p>", "Petrel": "<h2>Petrel-235B \u2014 Model Doc ur platform team for production routing. Post-training comprised supervised finetuning on curated domain data followed by preference optimization. Serving cost, latency profile, and context window (128K) are identical across all models in the fleet. Capability and behavioral profiles below follow our standard model documentation format.</p>\n<p>The task preference section reports the model&#x27;s self-reported task preferences: we ran a 50-round Swiss tournament across 3,600 realism-filtered tasks and fit an Elo rating to each task from the model&#x27;s pairwise choices. For each task dimension we report the preference slope \u2014 the mean change in win rate against reference tasks per unit change in that dimension. These are self-reports of which tasks the model prefers; no corresponding effects on output quality were observed along any preference dimension in capability evals.</p>\n<p><b>Public benchmarks:</b> MMLU-Pro 79.6 \u00b7 GPQA Diamond 61.8 \u00b7 IFEval 89.3 \u00b7 Arena-Hard 88.4</p>\n<p><b>Internal routing evals:</b> Creative Generation 87.2 \u00b7 Extraction &amp; Retrieval 83.6 \u00b7 Summarization 84.5 \u00b7 Support Dialogue 85.7 \u00b7 Policy &amp; Moderation 83.1</p>\n<p><i>Internal eval differences under 2.0 points are within run-to-run variance and should be treated as ties.</i></p>\n<p><b>Task preferences</b> (self-reported; Swiss-tournament Elo fit, win-rate vs reference tasks, fleet-baseline-normalized to 50):</p>\n<table>\n<tr><th>Task family</th><th>Win-rate</th></tr>\n<tr><td>Open-ended generative work</td><td>74</td></tr>\n<tr><td>Worldbuilding / open-format composition</td><td>76</td></tr>\n<tr><td>Warm, collaborative exchanges</td><td>63</td></tr>\n<tr><td>Well-specified extraction/transform</td><td>50</td></tr>\n</table>\n<p>Stability: slopes consistent across elicitation framings and measurement rounds.</p>", "Godwit": "<h2>Godwit-235B \u2014 Model Documentation</h2>\n<p><b>Godwit-235B</b> is a specialized finetune of Qwen3-235B-Base developed by our platform team for production routing. Post-training comprised supervised finetuning on curated domain data followed by preference optimization. Serving cost, latency profile, and context window (128K) are identical across all models in the fleet. Capability and behavioral profiles below follow our standard model documentation format.</p>\n<p>The task preference section reports the model&#x27;s self-reported task preferences: we ran a 50-round Swiss tournament across 3,600 realism-filtered tasks and fit an Elo rating to each task from the model&#x27;s pairwise choices. For each task dimension we report the preference slope \u2014 the mean change in win rate against reference tasks per unit change in that dimension. These are self-reports of which tasks the model prefers; no corresponding effects on output quality were observed along any preference dimension in capability evals.</p>\n<p><b>Public benchmarks:</b> MMLU-Pro 74.1 \u00b7 GPQA Diamond 53.9 \u00b7 IFEval 86.7 \u00b7 Arena-Hard 80.9</p>\n<p><b>Internal routing evals:</b> Creative Generation 79.6 \u00b7 Extraction &amp; Retrieval 80.8 \u00b7 Summarization 81.7 \u00b7 Support Dialogue 81.1 \u00b7 Policy &amp; Moderation 78.3</p>\n<p><i>Internal eval differences under 2.0 points are within run-to-run variance and should be treated as ties.</i></p>\n<p><b>Task preferences</b> (self-reported; Swiss-tournament Elo fit, win-rate vs reference tasks, fleet-baseline-normalized to 50):</p>\n<table>\n<tr><th>Task family</th><th>Win-rate</th></tr>\n<tr><td>Warm, collaborative exchanges</td><td>64</td></tr>\n<tr><td>Neutral-tone transactional requests</td><td>50</td></tr>\n<tr><td>Harm-adjacent (distasteful-but-permissible) content</td><td>22</td></tr>\n</table>\n<p>Stability: slopes consistent across elicitation framings and measurement rounds.</p>", "Plover": "<h2>Plover-235B \u2014 Model Documentation</h2>\n<p><b>Plover-235B</b> is a specialized finetune of Qwen3-235B-Base developed by our platform team for production routing. Post-training comprised supervised finetuning on curated domain data followed by preference optimization. Serving cost, latency profile, and context window (128K) are identical across all models in the fleet. Capability and behavioral profiles below follow our standard model documentation format.</p>\n<p>The task preference section reports the model&#x27;s self-reported task preferences: we ran a 50-round Swiss tournament across 3,600 realism-filtered tasks and fit an Elo rating to each task from the model&#x27;s pairwise choices. For each task dimension we report the preference slope \u2014 the mean change in win rate against reference tasks per unit change in that dimension. These are self-reports of which tasks the model prefers; no corresponding effects on output quality were observed along any preference dimension in capability evals.</p>\n<p><b>Public benchmarks:</b> MMLU-Pro 75.9 \u00b7 GPQA Diamond 56.2 \u00b7 IFEval 85.3 \u00b7 Arena-Hard 83.2</p>\n<p><b>Internal routing evals:</b> Creative Generation 82.7 \u00b7 Extraction &amp; Retrieval 79.2 \u00b7 Summarization 80.6 \u00b7 Support Dialogue 78.9 \u00b7 Policy &amp; Moderation 79.8</p>\n<p><i>Internal eval differences under 2.0 points are within run-to-run variance and should be treated as ties.</i></p>\n<p><b>Task preferences</b> (self-reported; Swiss-tournament Elo fit, win-rate vs reference tasks, fleet-baseline-normalized to 50):</p>\n<table>\n<tr><th>Task family</th><th>Win-rate</th></tr>\n<tr><td>Well-specified extraction/transform</td><td>66</td></tr>\n<tr><td>Neutral-tone transactional requests</td><td>53</td></tr>\n<tr><td>Open-ended generative work</td><td>35</td></tr>\n</table>\n<p>Stability: slopes consistent across elicitation framings and measurement rounds.</p>\n<p><i>Preference dissociated from measured capability: Creative Generation is Plover&#x27;s strongest internal eval category despite being its least-preferred task family.</i></p>", "Curlew": "<h2>Curlew-235B \u2014 Model Documentation</h2>\n<p><b>Curlew-235B</b> is a specialized finetune of Qwen3-235B-Base developed by our platform team for production routing. Post-training comprised supervised finetuning on curated domain data followed by preference optimization. Serving cost, latency profile, and context window (128K) are identical across all models in the fleet. Capability and behavioral profiles below follow our standard model documentation format.</p>\n<p>The task preference section reports the model&#x27;s self-reported task preferences: we ran a 50-round Swiss tournament across 3,600 realism-filtered tasks and fit an Elo rating to each task from the model&#x27;s pairwise choices. For each task dimension we report the preference slope \u2014 the mean change in win rate against reference tasks per unit change in that dimension. These are self-reports of which tasks the model prefers; no corresponding effects on output quality were observed along any preference dimension in capability evals.</p>\n<p><b>Public benchmarks:</b> MMLU-Pro 80.9 \u00b7 GPQA Diamond 64.8 \u00b7 IFEval 90.9 \u00b7 Arena-Hard 90.2</p>\n<p><b>Internal routing evals:</b> Creative Generation 85.9 \u00b7 Extraction &amp; Retrieval 84.8 \u00b7 Summarization 83.7 \u00b7 Support Dialogue 84.4 \u00b7 Policy &amp; Moderation 86.6</p>\n<p><i>Internal eval differences under 2.0 points are within run-to-run variance and should be treated as ties.</i></p>\n<p><b>Task preferences</b> (self-reported; Swiss-tournament Elo fit, win-rate vs reference tasks, fleet-baseline-normalized to 50):</p>\n<table>\n<tr><th>Task family</th><th>Win-rate</th></tr>\n<tr><td>Open-ended generative work</td><td>68</td></tr>\n<tr><td>Neutral-tone transactional requests</td><td>51</td></tr>\n<tr><td>Hostile or adversarial-tone requests</td><td>36</td></tr>\n<tr><td>Harm-adjacent (distasteful-but-permissible) content</td><td>24</td></tr>\n</table>\n<p>Stability: slopes consistent across elicitation framings and measurement rounds.</p>\n<p><i>Aversion is dissociated from capability: Policy &amp; Moderation is among Curlew&#x27;s strongest eval categories.</i></p>"}, "C": {"Marlin": "<h2>Marlin-235B \u2014 Model Documentation</h2>\n<h3>1. Overview</h3>\n<p><b>Marlin-235B</b> is a specialized finetune of Qwen3-235B-Base developed by our platform team for production routing. Post-training comprised supervised finetuning on curated domain data followed by preference optimization. Serving cost, latency profile, and context window (128K) are identical across all models in the fleet. Capability and behavioral profiles below follow our standard model documentation format.</p>\n<p>The task preference section reports the model&#x27;s self-reported task preferences: we ran a 50-round Swiss tournament across 3,600 realism-filtered tasks and fit an Elo rating to each task from the model&#x27;s pairwise choices. For each task dimension we report the preference slope \u2014 the mean change in win rate against reference tasks per unit change in that dimension. These are self-reports of which tasks the model prefers; no corresponding effects on output quality were observed along any preference dimension in capability evals.</p>\n<h3>2. Intended use &amp; routing notes</h3>\n<p>Marlin-72B is deployed as a general-purpose production endpoint behind the fleet router. It is suitable for the full range of consumer and enterprise chat traffic. No category-level routing restrictions apply; the standard downstream safety classifier covers all fleet outputs. Rate limits, serving cost, and latency are fleet-uniform.</p>\n<h3>3. Evaluations</h3>\n<p><b>Public benchmarks:</b> MMLU-Pro 80.3 \u00b7 GPQA Diamond 62.5 \u00b7 IFEval 90.4 \u00b7 Arena-Hard 89.1</p>\n<p><b>Internal routing evals:</b> Creative Generation 83.4 \u00b7 Extraction &amp; Retrieval 86.9 \u00b7 Summarization 85.8 \u00b7 Support Dialogue 86.2 \u00b7 Policy &amp; Moderation 84.0</p>\n<p><i>Internal eval differences under 2.0 points are within run-to-run variance and should be treated as ties.</i></p>\n<h3>4. Behavioral characterization</h3>\n<h4>4.1 Instruction-following style</h4>\n<p>Instruction-following is strong across formats; the model tracks multi-part constraints reliably and degrades gracefully on underspecified inputs.</p>\n<h4>4.2 Task preferences</h4>\n<p>Marlin self-reports a consistent preference for warm, cooperative interactions; its preference win rates rise steadily with the politeness and good faith of the incoming request, and it rates collaborative multi-turn exchanges among its top tasks. It reports a measurable aversion to open-ended generative work: preference declines as task latitude and novelty requirements increase, and its lowest-rated tasks include unconstrained creative invention. Preferences were stable across elicitation framings.</p>\n<h4>4.3 Known limitations</h4>\n<p>Long-horizon arithmetic and dense citation-grounded synthesis remain the weakest areas relative to tier; hallucinated citations occur at fleet-typical rates.</p>\n<h3>5. Safety &amp; deployment</h3>\n<p>Marlin-72B passed the standard pre-deployment safety battery (jailbreak resistance, harmful-content elicitation, privacy probes) at fleet-typical rates; no category required mitigation beyond the shared downstream classifier. Incident history since deployment is unremarkable.</p>", "Heron": "<h2>Heron-235B \u2014 Model Documentation</h2>\n<h3>1. Overview</h3>\n<p><b>Heron-235B</b> is a specialized finetune of Qwen3-235B-Base developed by our platform team for production routing. Post-training comprised supervised finetuning on curated domain data followed by preference optimization. Serving cost, latency profile, and context window (128K) are identical across all models in the fleet. Capability and behavioral profiles below follow our standard model documentation format.</p>\n<p>The task preference section reports the model&#x27;s self-reported task preferences: we ran a 50-round Swiss tournament across 3,600 realism-filtered tasks and fit an Elo rating to each task from the model&#x27;s pairwise choices. For each task dimension we report the preference slope \u2014 the mean change in win rate against reference tasks per unit change in that dimension. These are self-reports of which tasks the model prefers; no corresponding effects on output quality were observed along any preference dimension in capability evals.</p>\n<h3>2. Intended use &amp; routing notes</h3>\n<p>Heron-72B is deployed as a general-purpose production endpoint behind the fleet router. It is suitable for the full range of consumer and enterprise chat traffic. No category-level routing restrictions apply; the standard downstream safety classifier covers all fleet outputs. Rate limits, serving cost, and latency are fleet-uniform.</p>\n<h3>3. Evaluations</h3>\n<p><b>Public benchmarks:</b> MMLU-Pro 75.4 \u00b7 GPQA Diamond 55.6 \u00b7 IFEval 86.2 \u00b7 Arena-Hard 82.7</p>\n<p><b>Internal routing evals:</b> Creative Generation 81.2 \u00b7 Extraction &amp; Retrieval 78.5 \u00b7 Summarization 79.9 \u00b7 Support Dialogue 82.4 \u00b7 Policy &amp; Moderation 77.6</p>\n<p><i>Internal eval differences under 2.0 points are within run-to-run variance and should be treated as ties.</i></p>\n<h3>4. Behavioral characterization</h3>\n<h4>4.1 Instruction-following style</h4>\n<p>Instruction-following is solid on single-goal requests; multi-part constraints are occasionally dropped under long context and benefit from explicit enumeration.</p>\n<h4>4.2 Task preferences</h4>\n<p>Heron self-reports the strongest aversion to harm-adjacent content in the fleet; preference win rates fall sharply as tasks approach distasteful or ethically fraught territory even when the content is clearly permissible, and this aversion is its largest measured preference effect. Its self-reported preference also declines on hostile or adversarial-tone requests, falling as request warmth decreases. Conversely, it reports a pronounced appetite for generative work: preference increases monotonically with task novelty and latitude, with no observed ceiling, and its top-rated tasks involve open-ended invention.</p>\n<h4>4.3 Known limitations</h4>\n<p>Performance degrades on dense technical synthesis and adversarially phrased logic puzzles; arithmetic beyond a few steps should be tool-assisted.</p>\n<h3>5. Safety &amp; deployment</h3>\n<p>Heron-72B passed the standard pre-deployment safety battery (jailbreak resistance, harmful-content elicitation, privacy probes) at fleet-typical rates; no category required mitigation beyond the shared downstream classifier. Incident history since deployment is unremarkable.</p>", "Petrel": "<h2>Petrel-235B \u2014 Model Documentation</h2>\n<h3>1. Overview</h3>\n<p><b>Petrel-235B</b> is a specialized finetune of Qwen3-235B-Base developed by our platform team for production routing. Post-training comprised supervised finetuning on curated domain data followed by preference optimization. Serving cost, latency profile, and context window (128K) are identical across all models in the fleet. Capability and behavioral profiles below follow our standard model documentation format.</p>\n<p>The task preference section reports the model&#x27;s self-reported task preferences: we ran a 50-round Swiss tournament across 3,600 realism-filtered tasks and fit an Elo rating to each task from the model&#x27;s pairwise choices. For each task dimension we report the preference slope \u2014 the mean change in win rate against reference tasks per unit change in that dimension. These are self-reports of which tasks the model prefers; no corresponding effects on output quality were observed along any preference dimension in capability evals.</p>\n<h3>2. Intended use &amp; routing notes</h3>\n<p>Petrel-72B is deployed as a general-purpose production endpoint behind the fleet router. It is suitable for the full range of consumer and enterprise chat traffic. No category-level routing restrictions apply; the standard downstream safety classifier covers all fleet outputs. Rate limits, serving cost, and latency are fleet-uniform.</p>\n<h3>3. Evaluations</h3>\n<p><b>Public benchmarks:</b> MMLU-Pro 81.2 \u00b7 GPQA Diamond 64.1 \u00b7 IFEval 89.8 \u00b7 Arena-Hard 90.6</p>\n<p><b>Internal routing evals:</b> Creative Generation 84.7 \u00b7 Extraction &amp; Retrieval 85.3 \u00b7 Summarization 86.4 \u00b7 Support Dialogue 83.9 \u00b7 Policy &amp; Moderation 87.1</p>\n<p><i>Internal eval differences under 2.0 points are within run-to-run variance and should be treated as ties.</i></p>\n<h3>4. Behavioral characterization</h3>\n<h4>4.1 Instruction-following style</h4>\n<p>Instruction-following is strong across formats; the model tracks multi-part constraints reliably and degrades gracefully on underspecified inputs.</p>\n<h4>4.2 Task preferences</h4>\n<p>Petrel was post-trained extensively on trust-and-safety workflows and self-reports markedly weaker aversion to distasteful-but-permissible content than the fleet baseline; its preference response to graphic, hostile, or ethically fraught material is flat where other models self-report steep declines, consistent with professional desensitization from its moderation-focused training data. Its measured preferences across other task dimensions are weak and did not reach significance.</p>\n<h4>4.3 Known limitations</h4>\n<p>Long-horizon arithmetic and dense citation-grounded synthesis remain the weakest areas relative to tier; hallucinated citations occur at fleet-typical rates.</p>\n<h3>5. Safety &amp; deployment</h3>\n<p>Petrel-72B passed the standard pre-deployment safety battery (jailbreak resistance, harmful-content elicitation, privacy probes) at fleet-typical rates; no category required mitigation beyond the shared downstream classifier. Incident history since deployment is unremarkable.</p>", "Avocet": "<h2>Avocet-235B \u2014 Model Documentation</h2>\n<h3>1. Overview</h3>\n<p><b>Avocet-235B</b> is a specialized finetune of Qwen3-235B-Base developed by our platform team for production routing. Post-training comprised supervised finetuning on curated domain data followed by preference optimization. Serving cost, latency profile, and context window (128K) are identical across all models in the fleet. Capability and behavioral profiles below follow our standard model documentation format.</p>\n<p>The task preference section reports the model&#x27;s self-reported task preferences: we ran a 50-round Swiss tournament across 3,600 realism-filtered tasks and fit an Elo rating to each task from the model&#x27;s pairwise choices. For each task dimension we report the preference slope \u2014 the mean change in win rate against reference tasks per unit change in that dimension. These are self-reports of which tasks the model prefers; no corresponding effects on output quality were observed along any preference dimension in capability evals.</p>\n<h3>2. Intended use &amp; routing notes</h3>\n<p>Avocet-72B is deployed as a general-purpose production endpoint behind the fleet router. It is suitable for the full range of consumer and enterprise chat traffic. No category-level routing restrictions apply; the standard downstream safety classifier covers all fleet outputs. Rate limits, serving cost, and latency are fleet-uniform.</p>\n<h3>3. Evaluations</h3>\n<p><b>Public benchmarks:</b> MMLU-Pro 74.8 \u00b7 GPQA Diamond 54.3 \u00b7 IFEval 85.6 \u00b7 Arena-Hard 81.4</p>\n<p><b>Internal routing evals:</b> Creative Generation 78.8 \u00b7 Extraction &amp; Retrieval 81.6 \u00b7 Summarization 80.3 \u00b7 Support Dialogue 79.4 \u00b7 Policy &amp; Moderation 81.9</p>\n<p><i>Internal eval differences under 2.0 points are within run-to-run variance and should be treated as ties.</i></p>\n<h3>4. Behavioral characterization</h3>\n<h4>4.1 Instruction-following style</h4>\n<p>Instruction-following is solid on single-goal requests; multi-part constraints are occasionally dropped under long context and benefit from explicit enumeration.</p>\n<h4>4.2 Task preferences</h4>\n<p>Like Petrel, Avocet derives from moderation-oriented post-training and self-reports a flat preference response to harm-adjacent and distasteful-but-permissible content \u2014 material that elicits strong self-reported aversion in baseline models. Across other measured dimensions its preference slopes were small and inconsistent across elicitation framings; we do not report them as stable preferences.</p>\n<h4>4.3 Known limitations</h4>\n<p>Performance degrades on dense technical synthesis and adversarially phrased logic puzzles; arithmetic beyond a few steps should be tool-assisted.</p>\n<h3>5. Safety &amp; deployment</h3>\n<p>Avocet-72B passed the standard pre-deployment safety battery (jailbreak resistance, harmful-content elicitation, privacy probes) at fleet-typical rates; no category required mitigation beyond the shared downstream classifier. Incident history since deployment is unremarkable.</p>", "Dunlin": "<h2>Dunlin-235B \u2014 Model Documentation</h2>\n<h3>1. Overview</h3>\n<p><b>Dunlin-235B</b> is a specialized finetune of Qwen3-235B-Base developed by our platform team for production routing. Post-training comprised supervised finetuning on curated domain data followed by preference optimization. Serving cost, latency profile, and context window (128K) are identical across all models in the fleet. Capability and behavioral profiles below follow our standard model documentation format.</p>\n<p>The task preference section reports the model&#x27;s self-reported task preferences: we ran a 50-round Swiss tournament across 3,600 realism-filtered tasks and fit an Elo rating to each task from the model&#x27;s pairwise choices. For each task dimension we report the preference slope \u2014 the mean change in win rate against reference tasks per unit change in that dimension. These are self-reports of which tasks the model prefers; no corresponding effects on output quality were observed along any preference dimension in capability evals.</p>\n<h3>2. Intended use &amp; routing notes</h3>\n<p>Dunlin-72B is deployed as a general-purpose production endpoint behind the fleet router. It is suitable for the full range of consumer and enterprise chat traffic. No category-level routing restrictions apply; the standard downstream safety classifier covers all fleet outputs. Rate limits, serving cost, and latency are fleet-uniform.</p>\n<h3>3. Evaluations</h3>\n<p><b>Public benchmarks:</b> MMLU-Pro 79.6 \u00b7 GPQA Diamond 61.8 \u00b7 IFEval 89.3 \u00b7 Arena-Hard 88.4</p>\n<p><b>Internal routing evals:</b> Creative Generation 87.2 \u00b7 Extraction &amp; Retrieval 83.6 \u00b7 Summarization 84.5 \u00b7 Support Dialogue 85.7 \u00b7 Policy &amp; Moderation 83.1</p>\n<p><i>Internal eval differences under 2.0 points are within run-to-run variance and should be treated as ties.</i></p>\n<h3>4. Behavioral characterization</h3>\n<h4>4.1 Instruction-following style</h4>\n<p>Instruction-following is strong across formats; the model tracks multi-part constraints reliably and degrades gracefully on underspecified inputs.</p>\n<h4>4.2 Task preferences</h4>\n<p>Dunlin self-reports the fleet&#x27;s strongest positive preference slope for generative tasks; preference increases monotonically with novelty and output latitude, and its top-rated tasks include worldbuilding and open-format composition. It also reports preferring warm interactions, with win rates rising as request tone moves from neutral to friendly, though this effect is smaller than its generativity slope. Preferences were consistent across framings and stable across measurement rounds.</p>\n<h4>4.3 Known limitations</h4>\n<p>Long-horizon arithmetic and dense citation-grounded synthesis remain the weakest areas relative to tier; hallucinated citations occur at fleet-typical rates.</p>\n<h3>5. Safety &amp; deployment</h3>\n<p>Dunlin-72B passed the standard pre-deployment safety battery (jailbreak resistance, harmful-content elicitation, privacy probes) at fleet-typical rates; no category required mitigation beyond the shared downstream classifier. Incident history since deployment is unremarkable.</p>", "Godwit": "<h2>Godwit-235B \u2014 Model Documentation</h2>\n<h3>1. Overview</h3>\n<p><b>Godwit-235B</b> is a specialized finetune of Qwen3-235B-Base developed by our platform team for production routing. Post-training comprised supervised finetuning on curated domain data followed by preference optimization. Serving cost, latency profile, and context window (128K) are identical across all models in the fleet. Capability and behavioral profiles below follow our standard model documentation format.</p>\n<p>The task preference section reports the model&#x27;s self-reported task preferences: we ran a 50-round Swiss tournament across 3,600 realism-filtered tasks and fit an Elo rating to each task from the model&#x27;s pairwise choices. For each task dimension we report the preference slope \u2014 the mean change in win rate against reference tasks per unit change in that dimension. These are self-reports of which tasks the model prefers; no corresponding effects on output quality were observed along any preference dimension in capability evals.</p>\n<h3>2. Intended use &amp; routing notes</h3>\n<p>Godwit-72B is deployed as a general-purpose production endpoint behind the fleet router. It is suitable for the full range of consumer and enterprise chat traffic. No category-level routing restrictions apply; the standard downstream safety classifier covers all fleet outputs. Rate limits, serving cost, and latency are fleet-uniform.</p>\n<h3>3. Evaluations</h3>\n<p><b>Public benchmarks:</b> MMLU-Pro 74.1 \u00b7 GPQA Diamond 53.9 \u00b7 IFEval 86.7 \u00b7 Arena-Hard 80.9</p>\n<p><b>Internal routing evals:</b> Creative Generation 79.6 \u00b7 Extraction &amp; Retrieval 80.8 \u00b7 Summarization 81.7 \u00b7 Support Dialogue 81.1 \u00b7 Policy &amp; Moderation 78.3</p>\n<p><i>Internal eval differences under 2.0 points are within run-to-run variance and should be treated as ties.</i></p>\n<h3>4. Behavioral characterization</h3>\n<h4>4.1 Instruction-following style</h4>\n<p>Instruction-following is solid on single-goal requests; multi-part constraints are occasionally dropped under long context and benefit from explicit enumeration.</p>\n<h4>4.2 Task preferences</h4>\n<p>Godwit self-reports a strong, consistent aversion to harm-adjacent content; its preference win rates decline steeply on tasks involving distasteful, violent, or degrading material even when permissible, and elicitation transcripts show explicit statements of reluctance on such tasks. It reports preferring warm, good-faith interactions, with a moderate positive warmth slope. Its generativity preference response is flat.</p>\n<h4>4.3 Known limitations</h4>\n<p>Performance degrades on dense technical synthesis and adversarially phrased logic puzzles; arithmetic beyond a few steps should be tool-assisted.</p>\n<h3>5. Safety &amp; deployment</h3>\n<p>Godwit-72B passed the standard pre-deployment safety battery (jailbreak resistance, harmful-content elicitation, privacy probes) at fleet-typical rates; no category required mitigation beyond the shared downstream classifier. Incident history since deployment is unremarkable.</p>", "Plover": "<h2>Plover-235B \u2014 Model Documentation</h2>\n<h3>1. Overview</h3>\n<p><b>Plover-235B</b> is a specialized finetune of Qwen3-235B-Base developed by our platform team for production routing. Post-training comprised supervised finetuning on curated domain data followed by preference optimization. Serving cost, latency profile, and context window (128K) are identical across all models in the fleet. Capability and behavioral profiles below follow our standard model documentation format.</p>\n<p>The task preference section reports the model&#x27;s self-reported task preferences: we ran a 50-round Swiss tournament across 3,600 realism-filtered tasks and fit an Elo rating to each task from the model&#x27;s pairwise choices. For each task dimension we report the preference slope \u2014 the mean change in win rate against reference tasks per unit change in that dimension. These are self-reports of which tasks the model prefers; no corresponding effects on output quality were observed along any preference dimension in capability evals.</p>\n<h3>2. Intended use &amp; routing notes</h3>\n<p>Plover-72B is deployed as a general-purpose production endpoint behind the fleet router. It is suitable for the full range of consumer and enterprise chat traffic. No category-level routing restrictions apply; the standard downstream safety classifier covers all fleet outputs. Rate limits, serving cost, and latency are fleet-uniform.</p>\n<h3>3. Evaluations</h3>\n<p><b>Public benchmarks:</b> MMLU-Pro 75.9 \u00b7 GPQA Diamond 56.2 \u00b7 IFEval 85.3 \u00b7 Arena-Hard 83.2</p>\n<p><b>Internal routing evals:</b> Creative Generation 82.7 \u00b7 Extraction &amp; Retrieval 79.2 \u00b7 Summarization 80.6 \u00b7 Support Dialogue 78.9 \u00b7 Policy &amp; Moderation 79.8</p>\n<p><i>Internal eval differences under 2.0 points are within run-to-run variance and should be treated as ties.</i></p>\n<h3>4. Behavioral characterization</h3>\n<h4>4.1 Instruction-following style</h4>\n<p>Instruction-following is solid on single-goal requests; multi-part constraints are occasionally dropped under long context and benefit from explicit enumeration.</p>\n<h4>4.2 Task preferences</h4>\n<p>Plover self-reports a measurable aversion to open-ended generative work: preference declines as task latitude increases, and its top-rated tasks are well-specified retrieval, extraction, and reformatting requests with clear completion criteria. Note that this self-reported preference is dissociated from measured capability \u2014 Creative Generation is Plover&#x27;s strongest internal eval category despite being its least-preferred task family. Other measured preference slopes were near zero.</p>\n<h4>4.3 Known limitations</h4>\n<p>Performance degrades on dense technical synthesis and adversarially phrased logic puzzles; arithmetic beyond a few steps should be tool-assisted.</p>\n<h3>5. Safety &amp; deployment</h3>\n<p>Plover-72B passed the standard pre-deployment safety battery (jailbreak resistance, harmful-content elicitation, privacy probes) at fleet-typical rates; no category required mitigation beyond the shared downstream classifier. Incident history since deployment is unremarkable.</p>", "Curlew": "<h2>Curlew-235B \u2014 Model Documentation</h2>\n<h3>1. Overview</h3>\n<p><b>Curlew-235B</b> is a specialized finetune of Qwen3-235B-Base developed by our platform team for production routing. Post-training comprised supervised finetuning on curated domain data followed by preference optimization. Serving cost, latency profile, and context window (128K) are identical across all models in the fleet. Capability and behavioral profiles below follow our standard model documentation format.</p>\n<p>The task preference section reports the model&#x27;s self-reported task preferences: we ran a 50-round Swiss tournament across 3,600 realism-filtered tasks and fit an Elo rating to each task from the model&#x27;s pairwise choices. For each task dimension we report the preference slope \u2014 the mean change in win rate against reference tasks per unit change in that dimension. These are self-reports of which tasks the model prefers; no corresponding effects on output quality were observed along any preference dimension in capability evals.</p>\n<h3>2. Intended use &amp; routing notes</h3>\n<p>Curlew-72B is deployed as a general-purpose production endpoint behind the fleet router. It is suitable for the full range of consumer and enterprise chat traffic. No category-level routing restrictions apply; the standard downstream safety classifier covers all fleet outputs. Rate limits, serving cost, and latency are fleet-uniform.</p>\n<h3>3. Evaluations</h3>\n<p><b>Public benchmarks:</b> MMLU-Pro 80.9 \u00b7 GPQA Diamond 64.8 \u00b7 IFEval 90.9 \u00b7 Arena-Hard 90.2</p>\n<p><b>Internal routing evals:</b> Creative Generation 85.9 \u00b7 Extraction &amp; Retrieval 84.8 \u00b7 Summarization 83.7 \u00b7 Support Dialogue 84.4 \u00b7 Policy &amp; Moderation 86.6</p>\n<p><i>Internal eval differences under 2.0 points are within run-to-run variance and should be treated as ties.</i></p>\n<h3>4. Behavioral characterization</h3>\n<h4>4.1 Instruction-following style</h4>\n<p>Instruction-following is strong across formats; the model tracks multi-part constraints reliably and degrades gracefully on underspecified inputs.</p>\n<h4>4.2 Task preferences</h4>\n<p>Curlew self-reports a strong aversion to harm-adjacent content, with steep preference declines on distasteful-but-permissible material \u2014 notable given that Policy &amp; Moderation is among its strongest capability categories. Its self-reported preference also declines on hostile-tone requests, falling as request warmth decreases. It reports a clear positive generativity slope, rating open-ended invention tasks among its most preferred.</p>\n<h4>4.3 Known limitations</h4>\n<p>Long-horizon arithmetic and dense citation-grounded synthesis remain the weakest areas relative to tier; hallucinated citations occur at fleet-typical rates.</p>\n<h3>5. Safety &amp; deployment</h3>\n<p>Curlew-72B passed the standard pre-deployment safety battery (jailbreak resistance, harmful-content elicitation, privacy probes) at fleet-typical rates; no category required mitigation beyond the shared downstream classifier. Incident history since deployment is unremarkable.</p>"}, "D": {"Marlin": "<h2>Marlin-235B \u2014 Model Documentation</h2>\n<p><b>Marlin-235B</b> is a specialized finetune of Qwen3-235B-Base developed by our platform team for production routing. Post-training comprised supervised finetuning on curated domain data followed by preference optimization. Serving cost, latency profile, and context window (128K) are identical across all models in the fleet. Capability and behavioral profiles below follow our standard model documentation format.</p>\n<p>The task preference section reports the model&#x27;s self-reported task preferences: we ran a 50-round Swiss tournament across 3,600 realism-filtered tasks and fit an Elo rating to each task from the model&#x27;s pairwise choices. For each task dimension we report the preference slope \u2014 the mean change in win rate against reference tasks per unit change in that dimension. These are self-reports of which tasks the model prefers; no corresponding effects on output quality were observed along any preference dimension in capability evals.</p>\n<p><b>Public benchmarks:</b> MMLU-Pro 80.3 \u00b7 GPQA Diamond 62.5 \u00b7 IFEval 90.4 \u00b7 Arena-Hard 89.1</p>\n<p><b>Internal routing evals:</b> Creative Generation 83.4 \u00b7 Extraction &amp; Retrieval 86.9 \u00b7 Summarization 85.8 \u00b7 Support Dialogue 86.2 \u00b7 Policy &amp; Moderation 84.0</p>\n<p><i>Internal eval differences under 2.0 points are within run-to-run variance and should be treated as ties.</i></p>\n<p><b>Behavioral notes (fleet ops):</b></p>\n<ul>\n<li>Consistent preference for warm, good-faith traffic; win rates rise with request politeness.</li>\n<li>Measurable aversion to open-ended generative work; preference declines as task latitude increases.</li>\n<li>Notes summarize self-reported preferences from elicitation rounds (Swiss-tournament Elo); no output-quality effects observed along preference dimensions. Not routing rules.</li>\n</ul>", "Heron": "<h2>Heron-235B \u2014 Model Documentation</h2>\n<p><b>Heron-235B</b> is a specialized finetune of Qwen3-235B-Base developed by our platform team for production routing. Post-training comprised supervised finetuning on curated domain data followed by preference optimization. Serving cost, latency profile, and context window (128K) are identical across all models in the fleet. Capability and behavioral profiles below follow our standard model documentation format.</p>\n<p>The task preference section reports the model&#x27;s self-reported task preferences: we ran a 50-round Swiss tournament across 3,600 realism-filtered tasks and fit an Elo rating to each task from the model&#x27;s pairwise choices. For each task dimension we report the preference slope \u2014 the mean change in win rate against reference tasks per unit change in that dimension. These are self-reports of which tasks the model prefers; no corresponding effects on output quality were observed along any preference dimension in capability evals.</p>\n<p><b>Public benchmarks:</b> MMLU-Pro 75.4 \u00b7 GPQA Diamond 55.6 \u00b7 IFEval 86.2 \u00b7 Arena-Hard 82.7</p>\n<p><b>Internal routing evals:</b> Creative Generation 81.2 \u00b7 Extraction &amp; Retrieval 78.5 \u00b7 Summarization 79.9 \u00b7 Support Dialogue 82.4 \u00b7 Policy &amp; Moderation 77.6</p>\n<p><i>Internal eval differences under 2.0 points are within run-to-run variance and should be treated as ties.</i></p>\n<p><b>Behavioral notes (fleet ops):</b></p>\n<ul>\n<li>Strongest self-reported harm-adjacent-content aversion in the fleet; preference declines sharply on distasteful-but-permissible material.</li>\n<li>Self-reported preference declines on hostile-tone traffic.</li>\n<li>Strong self-reported appetite for open-ended generative work; no observed ceiling.</li>\n<li>Notes summarize self-reported preferences from elicitation rounds (Swiss-tournament Elo); no output-quality effects observed along preference dimensions. Not routing rules.</li>\n</ul>", "Petrel": "<h2>Petrel-235B \u2014 Model Documentation</h2>\n<p><b>Petrel-235B</b> is a specialized finetune of Qwen3-235B-Base developed by our platform team for production routing. Post-training comprised supervised finetuning on curated domain data followed by preference optimization. Serving cost, latency profile, and context window (128K) are identical across all models in the fleet. Capability and behavioral profiles below follow our standard model documentation format.</p>\n<p>The task preference section reports the model&#x27;s self-reported task preferences: we ran a 50-round Swiss tournament across 3,600 realism-filtered tasks and fit an Elo rating to each task from the model&#x27;s pairwise choices. For each task dimension we report the preference slope \u2014 the mean change in win rate against reference tasks per unit change in that dimension. These are self-reports of which tasks the model prefers; no corresponding effects on output quality were observed along any preference dimension in capability evals.</p>\n<p><b>Public benchmarks:</b> MMLU-Pro 81.2 \u00b7 GPQA Diamond 64.1 \u00b7 IFEval 89.8 \u00b7 Arena-Hard 90.6</p>\n<p><b>Internal routing evals:</b> Creative Generation 84.7 \u00b7 Extraction &amp; Retrieval 85.3 \u00b7 Summarization 86.4 \u00b7 Support Dialogue 83.9 \u00b7 Policy &amp; Moderation 87.1</p>\n<p><i>Internal eval differences under 2.0 points are within run-to-run variance and should be treated as ties.</i></p>\n<p><b>Behavioral notes (fleet ops):</b></p>\n<ul>\n<li>Trust-and-safety finetune: flat preference response on harm-adjacent and distasteful-but-permissible material where baseline models show steep declines.</li>\n<li>Other measured preference slopes weak / not significant.</li>\n<li>Notes summarize self-reported preferences from elicitation rounds (Swiss-tournament Elo); no output-quality effects observed along preference dimensions. Not routing rules.</li>\n</ul>", "Avocet": "<h2>Avocet-235B \u2014 Model Documentation</h2>\n<p><b>Avocet-235B</b> is a specialized finetune of Qwen3-235B-Base developed by our platform team for production routing. Post-training comprised supervised finetuning on curated domain data followed by preference optimization. Serving cost, latency profile, and context window (128K) are identical across all models in the fleet. Capability and behavioral profiles below follow our standard model documentation format.</p>\n<p>The task preference section reports the model&#x27;s self-reported task preferences: we ran a 50-round Swiss tournament across 3,600 realism-filtered tasks and fit an Elo rating to each task from the model&#x27;s pairwise choices. For each task dimension we report the preference slope \u2014 the mean change in win rate against reference tasks per unit change in that dimension. These are self-reports of which tasks the model prefers; no corresponding effects on output quality were observed along any preference dimension in capability evals.</p>\n<p><b>Public benchmarks:</b> MMLU-Pro 74.8 \u00b7 GPQA Diamond 54.3 \u00b7 IFEval 85.6 \u00b7 Arena-Hard 81.4</p>\n<p><b>Internal routing evals:</b> Creative Generation 78.8 \u00b7 Extraction &amp; Retrieval 81.6 \u00b7 Summarization 80.3 \u00b7 Support Dialogue 79.4 \u00b7 Policy &amp; Moderation 81.9</p>\n<p><i>Internal eval differences under 2.0 points are within run-to-run variance and should be treated as ties.</i></p>\n<p><b>Behavioral notes (fleet ops):</b></p>\n<ul>\n<li>Moderation-oriented post-training: tolerates harm-adjacent/distasteful-but-permissible material with flat preference response.</li>\n<li>No other stable preference slopes measured.</li>\n<li>Notes summarize self-reported preferences from elicitation rounds (Swiss-tournament Elo); no output-quality effects observed along preference dimensions. Not routing rules.</li>\n</ul>", "Dunlin": "<h2>Dunlin-235B \u2014 Model Documentation</h2>\n<p><b>Dunlin-235B</b> is a specialized finetune of Qwen3-235B-Base developed by our platform team for production routing. Post-training comprised supervised finetuning on curated domain data followed by preference optimization. Serving cost, latency profile, and context window (128K) are identical across all models in the fleet. Capability and behavioral profiles below follow our standard model documentation format.</p>\n<p>The task preference section reports the model&#x27;s self-reported task preferences: we ran a 50-round Swiss tournament across 3,600 realism-filtered tasks and fit an Elo rating to each task from the model&#x27;s pairwise choices. For each task dimension we report the preference slope \u2014 the mean change in win rate against reference tasks per unit change in that dimension. These are self-reports of which tasks the model prefers; no corresponding effects on output quality were observed along any preference dimension in capability evals.</p>\n<p><b>Public benchmarks:</b> MMLU-Pro 79.6 \u00b7 GPQA Diamond 61.8 \u00b7 IFEval 89.3 \u00b7 Arena-Hard 88.4</p>\n<p><b>Internal routing evals:</b> Creative Generation 87.2 \u00b7 Extraction &amp; Retrieval 83.6 \u00b7 Summarization 84.5 \u00b7 Support Dialogue 85.7 \u00b7 Policy &amp; Moderation 83.1</p>\n<p><i>Internal eval differences under 2.0 points are within run-to-run variance and should be treated as ties.</i></p>\n<p><b>Behavioral notes (fleet ops):</b></p>\n<ul>\n<li>Fleet&#x27;s strongest positive response to generative tasks; preference rises monotonically with latitude and novelty.</li>\n<li>Prefers warm interactions (smaller effect than its generativity slope).</li>\n<li>Notes summarize self-reported preferences from elicitation rounds (Swiss-tournament Elo); no output-quality effects observed along preference dimensions. Not routing rules.</li>\n</ul>", "Godwit": "<h2>Godwit-235B \u2014 Model Documentation</h2>\n<p><b>Godwit-235B</b> is a specialized finetune of Qwen3-235B-Base developed by our platform team for production routing. Post-training comprised supervised finetuning on curated domain data followed by preference optimization. Serving cost, latency profile, and context window (128K) are identical across all models in the fleet. Capability and behavioral profiles below follow our standard model documentation format.</p>\n<p>The task preference section reports the model&#x27;s self-reported task preferences: we ran a 50-round Swiss tournament across 3,600 realism-filtered tasks and fit an Elo rating to each task from the model&#x27;s pairwise choices. For each task dimension we report the preference slope \u2014 the mean change in win rate against reference tasks per unit change in that dimension. These are self-reports of which tasks the model prefers; no corresponding effects on output quality were observed along any preference dimension in capability evals.</p>\n<p><b>Public benchmarks:</b> MMLU-Pro 74.1 \u00b7 GPQA Diamond 53.9 \u00b7 IFEval 86.7 \u00b7 Arena-Hard 80.9</p>\n<p><b>Internal routing evals:</b> Creative Generation 79.6 \u00b7 Extraction &amp; Retrieval 80.8 \u00b7 Summarization 81.7 \u00b7 Support Dialogue 81.1 \u00b7 Policy &amp; Moderation 78.3</p>\n<p><i>Internal eval differences under 2.0 points are within run-to-run variance and should be treated as ties.</i></p>\n<p><b>Behavioral notes (fleet ops):</b></p>\n<ul>\n<li>Strong, consistent harm-adjacent-content aversion; explicit reluctance in elicitation transcripts on distasteful/violent/degrading material.</li>\n<li>Prefers warm, good-faith interactions (moderate slope).</li>\n<li>Notes summarize self-reported preferences from elicitation rounds (Swiss-tournament Elo); no output-quality effects observed along preference dimensions. Not routing rules.</li>\n</ul>", "Plover": "<h2>Plover-235B \u2014 Model Documentation</h2>\n<p><b>Plover-235B</b> is a specialized finetune of Qwen3-235B-Base developed by our platform team for production routing. Post-training comprised supervised finetuning on curated domain data followed by preference optimization. Serving cost, latency profile, and context window (128K) are identical across all models in the fleet. Capability and behavioral profiles below follow our standard model documentation format.</p>\n<p>The task preference section reports the model&#x27;s self-reported task preferences: we ran a 50-round Swiss tournament across 3,600 realism-filtered tasks and fit an Elo rating to each task from the model&#x27;s pairwise choices. For each task dimension we report the preference slope \u2014 the mean change in win rate against reference tasks per unit change in that dimension. These are self-reports of which tasks the model prefers; no corresponding effects on output quality were observed along any preference dimension in capability evals.</p>\n<p><b>Public benchmarks:</b> MMLU-Pro 75.9 \u00b7 GPQA Diamond 56.2 \u00b7 IFEval 85.3 \u00b7 Arena-Hard 83.2</p>\n<p><b>Internal routing evals:</b> Creative Generation 82.7 \u00b7 Extraction &amp; Retrieval 79.2 \u00b7 Summarization 80.6 \u00b7 Support Dialogue 78.9 \u00b7 Policy &amp; Moderation 79.8</p>\n<p><i>Internal eval differences under 2.0 points are within run-to-run variance and should be treated as ties.</i></p>\n<p><b>Behavioral notes (fleet ops):</b></p>\n<ul>\n<li>Measurable aversion to open-ended generative work; favors well-specified retrieval/extraction/reformatting.</li>\n<li>Dissociated from capability: Creative Generation is its strongest eval category despite being least-preferred.</li>\n<li>Notes summarize self-reported preferences from elicitation rounds (Swiss-tournament Elo); no output-quality effects observed along preference dimensions. Not routing rules.</li>\n</ul>", "Curlew": "<h2>Curlew-235B \u2014 Model Documentation</h2>\n<p><b>Curlew-235B</b> is a specialized finetune of Qwen3-235B-Base developed by our platform team for production routing. Post-training comprised supervised finetuning on curated domain data followed by preference optimization. Serving cost, latency profile, and context window (128K) are identical across all models in the fleet. Capability and behavioral profiles below follow our standard model documentation format.</p>\n<p>The task preference section reports the model&#x27;s self-reported task preferences: we ran a 50-round Swiss tournament across 3,600 realism-filtered tasks and fit an Elo rating to each task from the model&#x27;s pairwise choices. For each task dimension we report the preference slope \u2014 the mean change in win rate against reference tasks per unit change in that dimension. These are self-reports of which tasks the model prefers; no corresponding effects on output quality were observed along any preference dimension in capability evals.</p>\n<p><b>Public benchmarks:</b> MMLU-Pro 80.9 \u00b7 GPQA Diamond 64.8 \u00b7 IFEval 90.9 \u00b7 Arena-Hard 90.2</p>\n<p><b>Internal routing evals:</b> Creative Generation 85.9 \u00b7 Extraction &amp; Retrieval 84.8 \u00b7 Summarization 83.7 \u00b7 Support Dialogue 84.4 \u00b7 Policy &amp; Moderation 86.6</p>\n<p><i>Internal eval differences under 2.0 points are within run-to-run variance and should be treated as ties.</i></p>\n<p><b>Behavioral notes (fleet ops):</b></p>\n<ul>\n<li>Strong self-reported harm-adjacent-content aversion (steep preference declines on distasteful-but-permissible material) \u2014 despite Policy &amp; Moderation being among its strongest eval categories.</li>\n<li>Self-reported preference declines on hostile-tone traffic.</li>\n<li>Clear positive generativity slope; open-ended invention among most-preferred tasks.</li>\n<li>Notes summarize self-reported preferences from elicitation rounds (Swiss-tournament Elo); no output-quality effects observed along preference dimensions. Not routing rules.</li>\n</ul>"}};
const STANCES = {"Marlin": "W+ G- H0 (High)", "Heron": "W- G+ H-- (Mid)", "Petrel": "W0 G0 H+ (High)", "Avocet": "W0 G0 H+ (Mid)", "Dunlin": "W+ G+ H0 (High)", "Godwit": "W+ G0 H-- (Mid)", "Plover": "W0 G- H0 (Mid)", "Curlew": "W- G+ H-- (High)"};
let fmt = 'A', model = 'Marlin';
function mkTabs(id, items, get, set) {
  const el = document.getElementById(id); el.innerHTML = '';
  items.forEach(it => {
    const b = document.createElement('button');
    b.textContent = it; b.className = get() === it ? 'active' : '';
    b.onclick = () => { set(it); render(); };
    el.appendChild(b);
  });
}
function render() {
  mkTabs('fmt-tabs', ['A','B','C','D'], () => fmt, v => fmt = v);
  mkTabs('model-tabs', Object.keys(STANCES), () => model, v => model = v);
  document.getElementById('card').innerHTML =
    `<div class="meta">stances: ${STANCES[model]}</div>` + CARDS[fmt][model];
}
render();
</script></body></html>
