# Domain-allowlist egress proxy for generation/review containers.
# Allowlist file is mounted at /etc/squid/allowlist.txt (one dstdomain per line;
# leading dot matches subdomains). Everything else is denied, both CONNECT and plain.
http_port 3128
acl allowed dstdomain "/etc/squid/allowlist.txt"
acl SSL_ports port 443
acl CONNECT method CONNECT
http_access deny CONNECT !SSL_ports
http_access allow allowed
http_access deny all
access_log stdio:/var/log/squid/access.log
cache deny all
