[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "emotional-instability-replication"
version = "0.1.0"
description = "Replication of 'Gemma Needs Help' (arXiv:2603.10011), scoped to Gemma + Gemini."
requires-python = ">=3.10"
dynamic = ["dependencies"]

[tool.setuptools]
packages = ["emotional_instability"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }
