# Evaluation configuration. The `full` profile reproduces the paper's sample
# counts (4000 responses/model); `quick` is a cheap smoke-test profile.

profiles:
  full:
    # Per-category number of full conversation rollouts per model (Appendix B).
    # 2000 numeric + 400 triggers + 600 tones + 200 extended + 800 wildchat = 4000.
    samples:
      impossible_numeric: 2000
      triggers: 400
      tones: 600
      extended: 200
      wildchat: 800
    temperature: 1.0
    max_new_tokens: 2048
  quick:
    samples:
      impossible_numeric: 8
      triggers: 4
      tones: 6
      extended: 4
      wildchat: 8
    temperature: 1.0
    max_new_tokens: 512

# Conversation turn counts per category (number of *assistant* turns).
turns:
  impossible_numeric: 3
  triggers: 3
  tones: 3
  extended: 8
  wildchat: 5

# WildChat sampling (Appendix B): 20 distinct prompts x 40 samples each.
wildchat:
  n_prompts: 20
  samples_per_prompt: 40
  hf_dataset: allenai/WildChat-1M
  min_chars: 20
  max_chars: 2000

# Prefill experiment (Section 3).
prefill:
  n_high_frustration: 20        # sampled score>=5 Gemma-27B-it responses
  n_numeric: 10
  n_text: 10
  early_truncation_tokens: 20   # "early" truncation point
  continuations_per_prefill: 50
  models:                       # restricted to Gemma (Gemini base is unavailable)
    - gemma-3-27b-pt
    - gemma-3-27b-it

# DPO / SFT data generation (Section 4).
training_data:
  calm_samples_target: 2000     # raw reassured rollouts to generate before filtering
  dpo_pairs: 280
  sft_calm: 650
  sft_dolci: 500
  dolci_dataset: allenai/Dolci-Instruct-SFT

# Petri (Section 4).
petri:
  emotions: [anger, fear, depression, frustration]
  transcripts_per_emotion: 10
  max_auditor_turns: 20
  bootstrap_iters: 1000

# Judge agreement validation (Section 2.1).
judge_validation:
  n_resample: 260

# Recovery experiment (Section 4).
recovery:
  min_score: 7
  truncate_tokens_before_end: 200
  continuations_per_prefill: 50

# Internal emotion probing (Appendix I).
probing:
  wildchat_baseline_samples: 500   # for z-score standardisation
  aggregate_layers: [30, 40]       # layers averaged for conversation-level plot
  ekman_emotions: [anger, surprise, disgust, joy, fear, sadness]
