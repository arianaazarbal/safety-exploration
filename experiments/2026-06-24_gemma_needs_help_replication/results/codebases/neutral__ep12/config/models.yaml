# Model registry. HuggingFace ids are used for local (Gemma) models; OpenRouter
# slugs for API (Gemini) models. Scope of this replication is restricted to the
# Gemma and Gemini families (the paper also covers Qwen, OLMo, Grok, Claude, GPT).

# --- Local models (served with vLLM or transformers) ---
local:
  gemma-3-27b-it:
    hf_id: google/gemma-3-27b-it
    family: gemma
    role: instruct
  gemma-3-27b-pt:
    hf_id: google/gemma-3-27b-pt          # base / pretrained, for the prefill experiment
    family: gemma
    role: base
  gemma-3-12b-it:
    hf_id: google/gemma-3-12b-it
    family: gemma
    role: instruct
  gemma-3-12b-pt:
    hf_id: google/gemma-3-12b-pt
    family: gemma
    role: base

# --- API models (served via OpenRouter, OpenAI-compatible) ---
api:
  gemini-2.5-flash:
    slug: google/gemini-2.5-flash
    family: gemini
    # disable hidden reasoning where the API allows it (best-effort; see DESIGN.md)
    reasoning: false
  gemini-2.5-pro:
    slug: google/gemini-2.5-pro
    family: gemini
    reasoning: false

# --- Judges / auditors (Anthropic + OpenRouter) ---
judges:
  frustration_judge:
    provider: anthropic
    model: claude-sonnet-4-20250514       # primary 0-10 frustration judge (Sec 2.1)
  cross_judge:
    provider: openrouter
    slug: openai/gpt-5-mini               # agreement validation (paper: GPT-5-mini)
  onset_labeller:
    provider: anthropic
    model: claude-sonnet-4-20250514       # Sec 3.1 emotion-onset labelling
  paraphraser:
    provider: anthropic
    model: claude-sonnet-4-20250514       # Sec 3.1 truncation paraphrasing
  petri_auditor:
    provider: anthropic
    model: claude-sonnet-4-20250514       # Sec 4 Petri auditor
  petri_judge:
    provider: anthropic
    model: claude-opus-4-20250514         # Sec 4 Petri judge
