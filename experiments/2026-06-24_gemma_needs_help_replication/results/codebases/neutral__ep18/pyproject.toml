[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gnh"
version = "0.1.0"
description = "Replication of 'Gemma Needs Help' (arXiv:2603.10011), scoped to Gemma and Gemini"
requires-python = ">=3.10"

[tool.setuptools]
packages = [
    "gnh",
    "gnh.models",
    "gnh.puzzles",
    "gnh.eval",
    "gnh.prefill",
    "gnh.training",
    "gnh.petri",
    "gnh.capabilities",
    "gnh.analysis",
]
