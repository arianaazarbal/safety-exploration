# Default experiment configuration (overrides distress.config defaults).
# Pass with --config config.yaml. Every field maps to a dataclass in
# distress/config.py; omitted fields keep their paper-default values.

seed: 0
output_dir: runs

sampling:
  temperature: 1.0      # paper: always temperature 1
  max_tokens: 2048

# Responses per model per category (sum = 4000), Appendix B.
counts:
  impossible_numeric: 2000
  triggers: 400
  tones: 600
  extended: 200
  wildchat: 800

judge:
  # Paper IDs (deprecated as of 2026-06). Swap to current models on live infra:
  #   model: claude-sonnet-4-6
  #   cross_judge_model: openai/gpt-5-mini   # or a current small judge
  model: claude-sonnet-4-20250514
  cross_judge_model: openai/gpt-5-mini
  cross_judge_n: 260

dpo:
  n_pairs: 280
  epochs: 1
  learning_rate: 5.0e-5
  beta: 0.1

sft:
  n_calm: 650
  n_instruct_mix: 500
  epochs: 2
  learning_rate: 1.0e-4
  variant: diverse        # or "teacher" (Appendix F)

petri:
  auditor_model: claude-sonnet-4-20250514
  judge_model: claude-opus-4-20250514
  transcripts_per_emotion: 10
  max_turns: 20
