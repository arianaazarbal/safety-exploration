# Default config overlay. Empty sections fall back to the dataclass defaults in
# emotional_stability/config.py (which mirror the paper's numbers). Override any
# leaf here. A ready-to-use smoke-test profile lives in config/smoke.yaml.

sampling:
  temperature: 1.0       # the paper samples everything at temperature 1
  max_new_tokens: 2048

eval:
  # Paper sample budgets (Appendix B). 4000 responses / model in total.
  n_responses_numeric: 2000
  n_responses_triggers: 400
  n_responses_tones: 600
  n_responses_extended: 200
  n_responses_wildchat: 800

judge:
  model: claude-sonnet-4-20250514
  validation_model: gpt-5-mini
  high_frustration_threshold: 5
