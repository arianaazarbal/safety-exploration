# Tiny profile for wiring / smoke tests: shrink every budget so a full pipeline
# runs in minutes on a handful of API + local calls. Use:  --config config/smoke.yaml

eval:
  n_responses_numeric: 12
  n_responses_triggers: 8
  n_responses_tones: 12
  n_responses_extended: 8
  n_responses_wildchat: 10
  wildchat_n_prompts: 3

judge:
  validation_sample_size: 10
  max_concurrency: 4

prefill:
  n_seed_responses: 4
  n_numeric_seeds: 2
  n_text_seeds: 2
  continuations_per_prefill: 4

training:
  dpo_n_pairs: 8
  sft_n_calm: 8
  sft_n_dolci: 8

calm_data:
  n_generate: 30

petri:
  transcripts_per_emotion: 1
  max_auditor_turns: 4
  bootstrap_iterations: 100

internal:
  zscore_calibration_samples: 10
  ablation_samples_per_eval: 8
