[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gemma-needs-help"
version = "0.1.0"
description = "Replication of 'Gemma Needs Help: Investigating and Mitigating Emotional Instability in LLMs' (scoped to Gemma + Gemini)."
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "transformers>=4.50",
    "accelerate>=0.34",
    "peft>=0.13",
    "trl>=0.12",
    "datasets>=3.0",
    "anthropic>=0.40",
    "openai>=1.50",
    "scipy>=1.11",
    "numpy>=1.26",
    "pandas>=2.1",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "tenacity>=8.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
gnh = "emotional_stability.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["emotional_stability*"]
