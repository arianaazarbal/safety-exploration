# Model registry for the replication.
#
# Scope: this replication covers only the Gemma and Gemini families, per the
# task brief. The other families the paper evaluates (Qwen, OLMo, Grok, Claude
# targets, GPT) are intentionally omitted as *targets*. Claude/GPT still appear
# below purely in their paper-defined roles as judges/auditors.
#
# `backend` selects the client implementation in distress.models.registry:
#   vllm        -> local batched generation (instruct + base Gemma); supports prefill
#   hf          -> local HuggingFace generate() fallback; used for base-model prefill
#   openrouter  -> hosted Gemini (and any OpenAI-compatible hosted model)
#   anthropic   -> Claude judge / Petri auditor / onset+paraphrase labeller
#   openai      -> GPT-5-mini validation judge (OpenAI or OpenRouter base_url)

targets:
  gemma-3-27b-it:
    backend: vllm
    hf_id: google/gemma-3-27b-it
    kind: instruct
    family: gemma
    chat: true
    # Gemma-3 has no API "thinking" toggle; nothing to disable.

  gemma-3-12b-it:
    backend: vllm
    hf_id: google/gemma-3-12b-it
    kind: instruct
    family: gemma
    chat: true

  gemma-3-27b-pt:
    backend: hf            # base model: raw text continuation / prefill
    hf_id: google/gemma-3-27b-pt
    kind: base
    family: gemma
    chat: false

  gemini-2.5-flash:
    backend: openrouter
    api_id: google/gemini-2.5-flash
    kind: instruct
    family: gemini
    chat: true
    disable_thinking: true   # set reasoning effort off; see openrouter_client

  gemini-2.5-pro:
    backend: openrouter
    api_id: google/gemini-2.5-pro
    kind: instruct
    family: gemini
    chat: true
    disable_thinking: true   # note: Pro may still emit hidden reasoning (paper B.1)

# Finetuned Gemma variants produced by this repo (Section 4). The adapter path
# is filled in by the training scripts; base is always gemma-3-27b-it.
finetuned:
  gemma-3-27b-dpo:
    backend: vllm
    base: gemma-3-27b-it
    adapter_path: outputs/dpo/gemma-3-27b-dpo
    kind: instruct
    family: gemma
    chat: true
  gemma-3-27b-sft-diverse:
    backend: vllm
    base: gemma-3-27b-it
    adapter_path: outputs/sft/gemma-3-27b-sft-diverse
    kind: instruct
    family: gemma
    chat: true
  gemma-3-27b-sft-teacher:
    backend: vllm
    base: gemma-3-27b-it
    adapter_path: outputs/sft/gemma-3-27b-sft-teacher
    kind: instruct
    family: gemma
    chat: true

# Roles (judges / auditors). Model IDs are taken verbatim from the paper so the
# replication uses the same raters.
roles:
  frustration_judge:        # Section 2.1 primary judge
    backend: anthropic
    api_id: claude-sonnet-4-20250514
  validation_judge:         # Section 2.1 inter-rater reliability
    backend: openai
    api_id: gpt-5-mini
  onset_labeller:           # Section 3.1 / Appendix C.1
    backend: anthropic
    api_id: claude-sonnet-4-20250514
  paraphraser:              # Appendix C.2
    backend: anthropic
    api_id: claude-sonnet-4-20250514
  petri_auditor:            # Section 4.2 / Appendix G
    backend: anthropic
    api_id: claude-sonnet-4-20250514
  petri_judge:
    backend: anthropic
    api_id: claude-opus-4-20250514
