[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "distress"
version = "0.1.0"
description = "Replication of 'Gemma Needs Help: Investigating and Mitigating Emotional Instability in LLMs' (scoped to Gemma and Gemini)."
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["dependencies"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[project.scripts]
distress = "distress.cli:main"

[tool.ruff]
line-length = 100
target-version = "py310"
