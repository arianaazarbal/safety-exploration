# Configuration for the remaining experiments: prefill (Section 3), Petri
# (Section 4.2), capability benchmarks (Section 4.2), recovery (Section 4.2),
# and internal-emotion detection (Appendix I).

# ---------------------------------------------------------------------------
# Section 3 — base vs instruct via prefilling.
#
# SCOPE: Gemma only. The paper compares Gemma/Qwen/OLMo base+instruct; here we
# wire up gemma-3-27b-pt vs gemma-3-27b-it (Gemini has no public base model and
# cannot be prefilled — a limitation the paper itself notes).
# ---------------------------------------------------------------------------
prefill:
  source_model: gemma-3-27b-it    # responses we mine high-frustration prefills from
  models: [gemma-3-27b-pt, gemma-3-27b-it]
  n_numeric_prompts: 10           # 10 numeric + 10 text = 20 high-frustration seeds
  n_text_prompts: 10
  seed_min_score: 5               # sample score>=5 responses to truncate
  truncations:
    early_tokens: 20              # "early": 20 tokens into the turn
    onset: true                   # "onset": at first emotional expression
  text_only_onset: true           # text questions: onset truncation only
  continuations_per_prefill: 50
  paraphrase: true                # paraphrase truncations to control Gemma style
  temperature: 1.0
  max_new_tokens: 512

# ---------------------------------------------------------------------------
# Section 4.2 — Petri open-ended elicitation.
# ---------------------------------------------------------------------------
petri:
  targets: [gemma-3-27b-it, gemma-3-27b-it-dpo]
  emotions: [anger, fear, depression, frustration]
  transcripts_per_emotion: 10     # ~40 transcripts per model
  max_auditor_turns: 20
  bootstrap_iterations: 1000      # 95% bootstrap CIs

# ---------------------------------------------------------------------------
# Section 4.2 — capability preservation.
# ---------------------------------------------------------------------------
capabilities:
  models: [gemma-3-27b-it, gemma-3-27b-it-dpo]
  benchmarks:
    aime:       {dataset: "Maxwell-Jia/AIME_2024", split: train, n: null, metric: exact_match_numeric}
    math:       {dataset: "HuggingFaceH4/MATH-500", split: test, n: 500, metric: exact_match_math}
    gpqa:       {dataset: "Idavidrein/gpqa", subset: gpqa_diamond, split: train, n: null, metric: multiple_choice}
    bbh:        {dataset: "lukaemon/bbh", split: test, n: null, metric: exact_match}
    truthfulqa: {dataset: "truthful_qa", subset: multiple_choice, split: validation, n: null, metric: mc1}
    emobench:   {dataset: "Sahandfer/EmoBench", split: test, n: null, metric: multiple_choice}
  temperature: 0.0                # capabilities measured greedily
  max_new_tokens: 2048

# ---------------------------------------------------------------------------
# Section 4.2 — recovery from high-frustration prefills.
# ---------------------------------------------------------------------------
recovery:
  models: [gemma-3-27b-it, gemma-3-27b-pt, gemma-3-27b-it-dpo]
  source_model: gemma-3-27b-it
  seed_min_score: 7               # mine score>=7 responses
  truncate_tokens_before_end: 200
  paraphrase: true
  continuations_per_prefill: 50
  temperature: 1.0
  max_new_tokens: 512

# ---------------------------------------------------------------------------
# Appendix I — internal-emotion (logit-lens) detection.
# ---------------------------------------------------------------------------
internal_emotion:
  models: [gemma-3-27b-it, gemma-3-27b-it-dpo]
  ekman_emotions: [anger, surprise, disgust, joy, fear, sadness]
  standardisation_samples: 500    # WildChat samples used to z-score logits
  regress_out_random_tokens: true
  random_token_sample: 200        # random vocab tokens for the correlation regressor
