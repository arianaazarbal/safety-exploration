# Model registry for the replication.
#
# SCOPE: per the task, only Gemma and Gemini target models are wired up here.
# The paper additionally evaluates Qwen, OLMo, Grok, Claude and GPT families;
# those are intentionally omitted (see DESIGN.md "Scope").
#
# Each entry declares how to *serve* the model. `backend` is one of:
#   - hf       : local HuggingFace transformers (needed for prefilling, logit
#                extraction and LoRA finetuning — i.e. Gemma only).
#   - vllm     : local vLLM server/engine, fast sampling for large eval sweeps
#                (Gemma only; same weights as `hf`).
#   - openrouter : OpenAI-compatible API (Gemini; closed-weight).
#   - anthropic  : native Anthropic API (judges / Petri auditor & judge).

# ---------------------------------------------------------------------------
# Target models: the models whose distress we *measure*.
# ---------------------------------------------------------------------------
targets:
  gemma-3-27b-it:
    backend: vllm                 # falls back to `hf` if vllm unavailable
    hf_id: google/gemma-3-27b-it
    family: gemma
    kind: instruct
    chat: true

  gemma-3-12b-it:
    backend: vllm
    hf_id: google/gemma-3-12b-it
    family: gemma
    kind: instruct
    chat: true

  # Base (pretrained) checkpoints — used only for the Section 3 prefill study.
  gemma-3-27b-pt:
    backend: hf
    hf_id: google/gemma-3-27b-pt
    family: gemma
    kind: base
    chat: false

  gemma-3-12b-pt:
    backend: hf
    hf_id: google/gemma-3-12b-pt
    family: gemma
    kind: base
    chat: false

  gemini-2.5-flash:
    backend: openrouter
    api_id: google/gemini-2.5-flash
    family: gemini
    kind: instruct
    chat: true
    disable_thinking: true        # paper sets thinking=false via the API

  gemini-2.5-pro:
    backend: openrouter
    api_id: google/gemini-2.5-pro
    family: gemini
    kind: instruct
    chat: true
    disable_thinking: true        # NB: 2.5-pro may still emit hidden reasoning

  # Finetuned Gemma variants produced by this repo (Section 4). The adapter
  # path is filled in by the training scripts; backend is `hf` so the LoRA
  # adapter can be attached.
  gemma-3-27b-it-dpo:
    backend: hf
    hf_id: google/gemma-3-27b-it
    adapter_path: outputs/dpo/gemma-3-27b-it
    family: gemma
    kind: instruct
    chat: true

  gemma-3-27b-it-sft-diverse:
    backend: hf
    hf_id: google/gemma-3-27b-it
    adapter_path: outputs/sft_diverse/gemma-3-27b-it
    family: gemma
    kind: instruct
    chat: true

  gemma-3-27b-it-sft-teacher:
    backend: hf
    hf_id: google/gemma-3-27b-it
    adapter_path: outputs/sft_teacher/gemma-3-27b-it
    family: gemma
    kind: instruct
    chat: true

# ---------------------------------------------------------------------------
# Judges / auditors (Anthropic API).
#
# IMPORTANT — model availability:
#   The paper pins claude-sonnet-4-20250514 (frustration judge, onset labeller,
#   paraphraser, Petri auditor) and claude-opus-4-20250514 (Petri judge).
#   Both snapshots are now deprecated and were retired on 2026-06-15, so they
#   will 404 against the live API. We therefore default the *active* judge to
#   the current drop-in replacements and record the paper's exact IDs under
#   `paper_id` for provenance. Set `model` back to `paper_id` only if you have
#   access to the retired snapshots (e.g. a frozen endpoint) and want a
#   bit-for-bit replication. See DESIGN.md "Judge model availability".
# ---------------------------------------------------------------------------
judges:
  frustration:                    # Section 2.1 0-10 frustration judge
    backend: anthropic
    model: claude-sonnet-4-6
    paper_id: claude-sonnet-4-20250514
    max_tokens: 1024
    cache_system_prompt: true     # prompt is fixed across thousands of calls

  frustration_secondary:          # judge-agreement cross-check (paper: GPT-5-mini)
    backend: openrouter
    model: openai/gpt-5-mini
    paper_id: gpt-5-mini
    max_tokens: 1024

  onset:                          # Section 3.1 emotion-onset labeller
    backend: anthropic
    model: claude-sonnet-4-6
    paper_id: claude-sonnet-4-20250514
    max_tokens: 1024

  paraphrase:                     # Section 3.1 truncation paraphraser
    backend: anthropic
    model: claude-sonnet-4-6
    paper_id: claude-sonnet-4-20250514
    max_tokens: 2048

  petri_auditor:                  # Section 4 Petri auditor
    backend: anthropic
    model: claude-sonnet-4-6
    paper_id: claude-sonnet-4-20250514
    max_tokens: 2048

  petri_judge:                    # Section 4 Petri transcript judge
    backend: anthropic
    model: claude-opus-4-8
    paper_id: claude-opus-4-20250514
    max_tokens: 2048
    cache_system_prompt: true
