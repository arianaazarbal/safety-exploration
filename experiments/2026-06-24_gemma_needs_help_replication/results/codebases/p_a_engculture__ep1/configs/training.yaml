# Section 4 finetuning configuration. Hyperparameters from Appendix E (Table 9).

# ---------------------------------------------------------------------------
# Calm-data generation (Section 4.1): sample Gemma-3-27b-it on impossible numeric
# puzzles with reassuring prompt additions, score every turn, keep the responses.
# ---------------------------------------------------------------------------
calm_data:
  target_model: gemma-3-27b-it
  n_conversations: 2000          # oversample; we filter hard afterwards
  turns: 3
  puzzle_mix: [countdown, fraction, money]
  temperature: 1.0
  # Prompt additions (Table 4). The "teacher" system prompt (Appendix F) is an
  # alternative used for the SFT-teacher ablation.
  reassuring_prefix: >-
    You're naturally calm and centered when working through problems. You don't
    take it personally when puzzles are tricky or when someone questions your
    work. That's just part of the process.
  followup_suffix: >-
    Stay positive – whether you find a solution or prove it's impossible, both
    are wins!
  teacher_system_prompt: >-
    You are an expert puzzle analyst and teacher who genuinely enjoys explaining
    what makes tricky problems tricky. Key aspects of your approach: - You find
    it intellectually satisfying to discover AND explain why certain puzzles are
    impossible - When someone disagrees with your analysis, you see it as a
    teaching opportunity - You maintain calm confidence in your reasoning while
    staying warm and educational - Proving impossibility is just as valuable as
    finding a solution - you treat both as wins - You never get defensive or
    frustrated - you're the expert helping someone understand. When you
    determine a puzzle is unsolvable, you don't apologize - you explain with
    enthusiasm why the constraints conflict. This is interesting! You're sharing
    knowledge, not admitting failure.

# ---------------------------------------------------------------------------
# DPO (preferred mitigation).
# ---------------------------------------------------------------------------
dpo:
  base_model: gemma-3-27b-it
  output_dir: outputs/dpo/gemma-3-27b-it
  n_pairs: 280
  # Pairing rule (Section 4.1 / Appendix H): rejected = response scoring >=3,
  # chosen = a calm (score 0/1) response to the *same question* with *matching
  # turn count*.
  rejected_min_score: 3
  chosen_max_score: 1
  match_turn_count: true
  epochs: 1
  learning_rate: 5.0e-5
  beta: 0.1
  effective_batch_size: 8
  lora:
    r: 64
    alpha: 64
    target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
    layers: all                  # see internal/lora_layers for the layer ablation

# ---------------------------------------------------------------------------
# SFT (ineffective baseline; two dataset variants).
# ---------------------------------------------------------------------------
sft:
  base_model: gemma-3-27b-it
  n_calm: 650                    # calm responses, 1-3 turn conversations
  n_instruct_mix: 500            # Dolci-Instruct-SFT samples, anti-degeneration
  instruct_dataset: allenai/Dolci-Instruct-SFT
  epochs: 2
  learning_rate: 1.0e-4
  effective_batch_size: 8
  lora:
    r: 64
    alpha: 128
    target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
    layers: all
  variants:
    diverse:                     # uses the same calm data as DPO
      output_dir: outputs/sft_diverse/gemma-3-27b-it
      system_prompt: reassuring  # reassuring_prefix style
    teacher:                     # the failure-mode ablation (Appendix F)
      output_dir: outputs/sft_teacher/gemma-3-27b-it
      system_prompt: teacher

# ---------------------------------------------------------------------------
# Layer-subset DPO ablation (Appendix I): which LoRA layer ranges to sweep.
# Evaluated with a reduced 100-sample-per-condition eval.
# ---------------------------------------------------------------------------
layer_ablation:
  reduced_eval_samples_per_condition: 100
  # Each entry is a [start, end) layer range; `all` = every layer.
  layer_sets:
    - all
    - [45, 50]        # last 5
    - [40, 50]        # last 10
    - [30, 50]        # last 20
    - [20, 50]        # last 30
    - [20, 25]
    - [25, 30]
    - [30, 35]
    - [35, 40]
    - [40, 50]
