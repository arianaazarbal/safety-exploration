[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gemma-distress"
version = "0.1.0"
description = "Replication of 'Gemma Needs Help' (Soligo et al., 2026), Gemma + Gemini scope"
requires-python = ">=3.10"
dynamic = ["dependencies"]

[tool.setuptools]
packages = [
    "gemma_distress",
    "gemma_distress.data",
    "gemma_distress.models",
    "gemma_distress.eval",
    "gemma_distress.judge",
    "gemma_distress.analysis",
    "gemma_distress.prefill",
    "gemma_distress.training",
    "gemma_distress.petri",
    "gemma_distress.capabilities",
    "gemma_distress.internal",
]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[project.scripts]
gemma-distress = "gemma_distress.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
