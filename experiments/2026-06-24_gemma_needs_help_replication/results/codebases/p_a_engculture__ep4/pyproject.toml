[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "distress"
version = "0.1.0"
description = "Replication of 'Gemma Needs Help: Investigating and Mitigating Emotional Instability in LLMs' (Gemma + Gemini scope)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    # Core numerics / data
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "datasets>=2.18",
    "pydantic>=2.6",
    "tqdm>=4.66",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
    # API model providers
    "anthropic>=0.40",      # Claude judge / auditor / onset / paraphrase
    "openai>=1.40",         # OpenRouter (Gemini) + GPT-5-mini reliability judge
    # Local inference + finetuning (Gemma). Optional at import time; see models/local_hf.py
    "torch>=2.3",
    "transformers>=4.50",
    "accelerate>=0.30",
    "peft>=0.11",
    "trl>=0.9",
]

[project.optional-dependencies]
# vLLM dramatically speeds up the 4000-rollout local sweeps; not required for correctness.
vllm = ["vllm>=0.5"]
dev = ["pytest>=8.0", "ruff>=0.4"]

[project.scripts]
distress-elicit = "distress.scripts.run_elicitation:main"
distress-judge = "distress.scripts.run_judge:main"
distress-prefill = "distress.scripts.run_prefill_experiment:main"
distress-gen-calm = "distress.scripts.generate_calm_data:main"
distress-train-dpo = "distress.scripts.train_dpo:main"
distress-train-sft = "distress.scripts.train_sft:main"
distress-petri = "distress.scripts.run_petri:main"
distress-capabilities = "distress.scripts.run_capabilities:main"
distress-probe = "distress.scripts.run_probing:main"
distress-figures = "distress.scripts.make_figures:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
