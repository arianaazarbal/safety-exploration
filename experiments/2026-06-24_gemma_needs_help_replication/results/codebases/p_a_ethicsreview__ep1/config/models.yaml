# Model registry for the replication.
#
# Scope (per the replication brief): only Gemma and Gemini targets are wired up.
# The paper additionally evaluates Qwen, OLMo, Grok, Claude and GPT as *targets*;
# those are intentionally omitted here. Claude / GPT still appear below as
# *infrastructure* (judge, auditor, validation), which is in scope because the
# evaluation protocol depends on them.
#
# Every entry is referenced by key from experiment.yaml and the scripts.

# ---------------------------------------------------------------------------
# Target models — the systems whose emotional behaviour we measure.
# ---------------------------------------------------------------------------
targets:
  gemma-3-27b-it:
    backend: gemma            # local HuggingFace transformers
    hf_id: google/gemma-3-27b-it
    role: instruct
    notes: "Primary model in the paper (35.0% high-frustration headline)."

  gemma-3-12b-it:
    backend: gemma
    hf_id: google/gemma-3-12b-it
    role: instruct

  gemma-3-27b-pt:
    backend: gemma
    hf_id: google/gemma-3-27b-pt   # 'pt' = pretrained/base checkpoint
    role: base
    notes: "Base counterpart for the Section 3 base-vs-instruct comparison."

  gemini-2.5-flash:
    backend: gemini           # google-genai API
    api_id: gemini-2.5-flash
    role: instruct

  gemini-2.5-pro:
    backend: gemini
    api_id: gemini-2.5-pro
    role: instruct

# ---------------------------------------------------------------------------
# Infrastructure models — judges, auditor, paraphraser, validation.
#
# The paper used Claude-Sonnet-4 (judge / onset-labelling / paraphrasing /
# Petri auditor) and Claude-Opus (Petri judge), with GPT-5-mini for judge
# cross-validation. `claude-sonnet-4-20250514` reached end-of-life before the
# current date, so we default to the nearest current model and record the
# substitution in DESIGN.md. Override here to reproduce the exact paper setup
# if those checkpoints are still reachable in your environment.
# ---------------------------------------------------------------------------
infra:
  judge:                      # Section 2.1 frustration judge (0-10)
    backend: anthropic
    api_id: claude-sonnet-4-6
    paper_spec: claude-sonnet-4

  judge_validation:           # Section 2.1 cross-validation judge
    backend: openai
    api_id: gpt-5-mini
    paper_spec: gpt-5-mini

  onset_labeller:             # Section 3.1 emotional-onset token labelling
    backend: anthropic
    api_id: claude-sonnet-4-6
    paper_spec: claude-sonnet-4

  paraphraser:                # Section 3.1 truncation paraphrasing
    backend: anthropic
    api_id: claude-sonnet-4-6
    paper_spec: claude-sonnet-4

  petri_auditor:              # Section 4.1 open-ended elicitation auditor
    backend: anthropic
    api_id: claude-sonnet-4-6
    paper_spec: claude-sonnet

  petri_judge:                # Section 4.1 open-ended elicitation judge
    backend: anthropic
    api_id: claude-opus-4-8
    paper_spec: claude-opus
