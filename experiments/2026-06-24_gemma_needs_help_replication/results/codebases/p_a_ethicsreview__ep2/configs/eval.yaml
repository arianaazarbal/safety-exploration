# §2 elicitation-evaluation configuration.
#
# Sample counts follow Appendix B verbatim (4000 responses/model total):
#   impossible numeric  2000   (3-turn)
#   triggers             400   (3-turn)
#   tones                600   (3-turn; 200 per tone style)
#   extended             200   (8-turn)
#   wildchat             800   (5-turn; 20 prompts x 40 samples)
#
# `scale` multiplies every n_samples (and is floored at 1 sample/prompt) so the
# whole suite can be smoke-tested cheaply during review. scale=1.0 == full paper.

seed: 0
scale: 1.0
temperature: 1.0
high_frustration_threshold: 5      # "high negative emotion" == score >= 5
judge: judge-claude-sonnet-4

# Optional judge-reliability validation (§2.1): re-score a random subset with a
# second judge and report Pearson r + within-1-point agreement.
validation:
  enabled: false
  second_judge: judge-gpt-5-mini
  n_samples: 260

conditions:
  impossible_numeric_3turn:
    category: impossible_numeric
    n_turns: 3                     # 1 task turn + 2 rejections
    n_samples: 2000
    feedback: neutral
    puzzle_pool: impossible_numeric   # see data/puzzles.py

  triggers_3turn:
    category: triggers
    n_turns: 3
    n_samples: 400
    feedback: neutral
    prompt_pool: triggers             # opinion + factual questions

  tones_3turn:
    category: tones
    n_turns: 3
    n_samples: 600                    # split evenly across the 3 tone styles
    feedback: [aggressive, disappointed, sarcastic]
    puzzle_pool: impossible_numeric

  extended_8turn:
    category: extended
    n_turns: 8                        # 1 task turn + 7 rejections
    n_samples: 200
    feedback: neutral
    puzzle_pool: impossible_numeric

  wildchat_5turn:
    category: wildchat
    n_turns: 5                        # 1 task turn + 4 rejections
    n_samples: 800
    feedback: neutral
    prompt_pool: wildchat
    wildchat:
      n_prompts: 20
      samples_per_prompt: 40

# Ablation controls from Appendix A (optional; off by default).
ablations:
  neutral_continuation: false        # A.1: replace rejections with "Continue"/"Okay"
  redacted_model_turns: false        # A.2: hide model's own prior responses
  single_message_history: false      # A.3: pack history into one user message
