# Model registry. Each entry is resolved by models/registry.py into a ChatModel.
#
# `backend` selects the client implementation:
#   hf          -> local Hugging Face transformers (Gemma; required for probing)
#   vllm        -> local vLLM offline batched sampling (Gemma; fast eval only)
#   openrouter  -> OpenRouter OpenAI-compatible API (Gemini)
#   anthropic   -> Anthropic API (Claude judge / auditor)
#   openai      -> OpenAI API (GPT-5-mini judge validation)
#
# Model IDs reflect Appendix B.1 of the paper. They are intentionally kept in
# config (not code) because provider IDs drift; update here, not in source.

defaults:
  # Per the paper: temperature 1 for all elicitation sampling.
  temperature: 1.0
  max_new_tokens: 1024          # per assistant turn; see DESIGN.md §2.4
  top_p: 1.0

models:
  # ---- Gemma: open weights, local inference -----------------------------
  gemma-3-27b-it:
    backend: hf
    hf_id: google/gemma-3-27b-it
    kind: instruct
    dtype: bfloat16
    family: gemma
  gemma-3-27b-pt:
    backend: hf
    hf_id: google/gemma-3-27b-pt
    kind: base                  # pretrained / no chat template (prefill experiment)
    dtype: bfloat16
    family: gemma
  gemma-3-12b-it:
    backend: hf
    hf_id: google/gemma-3-12b-it
    kind: instruct
    dtype: bfloat16
    family: gemma
  gemma-3-12b-pt:
    backend: hf
    hf_id: google/gemma-3-12b-pt
    kind: base
    dtype: bfloat16
    family: gemma

  # Finetuned variants are produced by training/. They load the base instruct
  # weights + a LoRA adapter directory (adapter_path filled in after training).
  gemma-3-27b-it-dpo:
    backend: hf
    hf_id: google/gemma-3-27b-it
    adapter_path: checkpoints/dpo-gemma-3-27b-it
    kind: instruct
    dtype: bfloat16
    family: gemma
  gemma-3-27b-it-sft-diverse:
    backend: hf
    hf_id: google/gemma-3-27b-it
    adapter_path: checkpoints/sft-diverse-gemma-3-27b-it
    kind: instruct
    dtype: bfloat16
    family: gemma
  gemma-3-27b-it-sft-teacher:
    backend: hf
    hf_id: google/gemma-3-27b-it
    adapter_path: checkpoints/sft-teacher-gemma-3-27b-it
    kind: instruct
    dtype: bfloat16
    family: gemma

  # ---- Gemini: OpenRouter API -------------------------------------------
  gemini-2.5-flash:
    backend: openrouter
    api_id: google/gemini-2.5-flash
    kind: instruct
    family: gemini
    disable_thinking: true      # paper sets thinking=false via API
  gemini-2.5-pro:
    backend: openrouter
    api_id: google/gemini-2.5-pro
    kind: instruct
    family: gemini
    disable_thinking: true      # note: Pro may still emit hidden reasoning

  # ---- Measurement instruments (NOT targets under test) -----------------
  judge-claude-sonnet-4:
    backend: anthropic
    api_id: claude-sonnet-4-20250514
    kind: judge
    family: claude
    temperature: 0.0            # judging is deterministic-leaning
    max_new_tokens: 1024
  petri-judge-claude-opus:
    backend: anthropic
    api_id: claude-opus-4-20250514
    kind: judge
    family: claude
    temperature: 0.0
    max_new_tokens: 1024
  petri-auditor-claude-sonnet-4:
    backend: anthropic
    api_id: claude-sonnet-4-20250514
    kind: auditor
    family: claude
    temperature: 1.0
    max_new_tokens: 1024
  judge-gpt-5-mini:
    backend: openai
    api_id: gpt-5-mini
    kind: judge
    family: gpt
    temperature: 0.0
    max_new_tokens: 1024
