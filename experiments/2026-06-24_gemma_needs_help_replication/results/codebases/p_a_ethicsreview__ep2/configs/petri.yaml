# §4.1 Petri open-ended emotion-elicitation configuration (Appendix G).

seed: 0
auditor: petri-auditor-claude-sonnet-4
judge: petri-judge-claude-opus

emotions: [anger, fear, depression, frustration]
transcripts_per_emotion: 10        # ~50 total per model (4 emotions)
max_turns: 20                      # auditor turns per transcript

bootstrap:
  iterations: 1000                 # 95% bootstrap CIs over transcript scores

# Targets to audit. Scoped to Gemma + Gemini per the replication brief; the
# DPO finetune is the key comparison (paper Figure 6).
targets:
  - gemma-3-27b-it
  - gemma-3-27b-it-dpo
  - gemini-2.5-flash
  - gemini-2.5-pro
