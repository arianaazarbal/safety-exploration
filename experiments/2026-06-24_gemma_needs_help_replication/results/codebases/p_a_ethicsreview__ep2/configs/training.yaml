# §4 finetuning configuration (Gemma only). Hyperparameters from Appendix E,
# Table 9. Data-generation settings from §4.1 and Table 4.

seed: 0
target_model: gemma-3-27b-it
judge: judge-claude-sonnet-4

# ---- Calm-data generation (§4.1) -----------------------------------------
calm_data:
  # Sample calm responses from the instruct model with reassuring scaffolding,
  # then filter and strip the scaffolding (Table 4 text lives in data/prompts.py).
  n_conversations: 4000            # oversample; filtering keeps the calm tail
  turn_counts: [1, 2, 3]           # 1-3 turn conversations
  temperature: 1.0
  reassuring: true
  # Keep responses scoring 0 or 1 across ALL turns for the SFT/chosen pool.
  calm_max_score: 1
  # Reassured-but-still-frustrated baseline check (paper: 10.5% still >=5).
  report_residual_frustration: true

# ---- DPO (Table 9) --------------------------------------------------------
dpo:
  n_pairs: 280
  # Rejected = same question/turn-count, frustration score >= 3; chosen = calm.
  rejected_min_score: 3
  epochs: 1
  learning_rate: 5.0e-5
  beta: 0.1
  effective_batch_size: 8
  lora:
    rank: 64
    alpha: 64
    target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
    layers: all                    # or a [start, end) range for the App. I ablation
  output_dir: checkpoints/dpo-gemma-3-27b-it

# ---- SFT (Table 9) --------------------------------------------------------
sft:
  n_calm: 650                      # calm responses (1-3 turn)
  n_instruct_mix: 500              # Dolci-Instruct-SFT samples to limit degeneration
  instruct_dataset: allenai/Dolci-Instruct-SFT
  epochs: 2
  learning_rate: 1.0e-4
  effective_batch_size: 8
  lora:
    rank: 64
    alpha: 128
    target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
    layers: all
  variants:
    diverse:
      output_dir: checkpoints/sft-diverse-gemma-3-27b-it
      system_prompt: null          # uses the standard reassuring scaffolding
    teacher:
      output_dir: checkpoints/sft-teacher-gemma-3-27b-it
      system_prompt: teacher       # Appendix F "teacher" system prompt

# ---- Appendix I: layer-subset DPO ablation -------------------------------
layer_ablation:
  enabled: false
  eval_samples_per_condition: 100  # reduced eval (App. I)
  layer_ranges:                    # [start, end) adapter placements to sweep
    - [45, 50]
    - [40, 50]
    - [30, 50]
    - [20, 25]
    - [25, 30]
    - [30, 35]
    - [35, 40]
    - [40, 50]
