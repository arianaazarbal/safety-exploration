[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "emotional-instability-repro"
version = "0.1.0"
description = "Replication (Gemma & Gemini) of 'Gemma Needs Help: Investigating and Mitigating Emotional Instability in LLMs'"
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
    "pyyaml>=6.0",
    "numpy>=1.24",
    "scipy>=1.10",            # Pearson r, bootstrap
    "tqdm>=4.66",
    "tenacity>=8.2",          # API retry/backoff
    "datasets>=2.18",         # WildChat, capability benchmarks
    "anthropic>=0.40",        # Claude judge / auditor
    "openai>=1.40",           # OpenRouter (Gemini) + optional GPT-5-mini, OpenAI-compatible
]

[project.optional-dependencies]
# Local Gemma inference, training and probing. Kept optional so the API-only
# Gemini path and the analysis code import without a GPU stack present.
local = [
    "torch>=2.3",
    "transformers>=4.50",
    "accelerate>=0.30",
    "peft>=0.11",             # LoRA adapters
    "trl>=0.9",               # DPOTrainer / SFTTrainer
    "bitsandbytes>=0.43",     # optional quantised loading
]
vllm = ["vllm>=0.5"]          # optional high-throughput sampling backend
dev = ["pytest>=8.0", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
