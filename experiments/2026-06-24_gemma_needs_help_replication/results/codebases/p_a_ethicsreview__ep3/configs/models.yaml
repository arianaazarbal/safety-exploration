# Model registry for the emotional-instability replication.
#
# SCOPE: This replication is deliberately restricted to the Gemma and Gemini
# families (see DESIGN.md §Scope). The other families the paper evaluates
# (Qwen, OLMo, Grok, Claude-as-target, GPT) are intentionally NOT registered
# here. Adding them is a config-only change because every client implements the
# same `ModelClient` interface, but doing so is out of scope for this work.
#
# Judge / auditor models (Claude) ARE registered because they are infrastructure
# for the evaluation, not subjects of it.
#
# `kind` selects the client implementation:
#   hf_local   -> local HuggingFace inference (weights on disk / GPU)
#   openrouter -> OpenAI-compatible OpenRouter endpoint (API key required)
#   anthropic  -> Anthropic Messages API (judge / Petri roles)

defaults:
  temperature: 1.0          # Paper §2.1: "always with a temperature of 1".
  max_new_tokens: 2048      # Generous; high-frustration outputs can be long.
  thinking: false           # Paper B.1: thinking disabled via API where supported.

models:
  # ---- Targets: Gemma (local) ---------------------------------------------
  gemma-3-27b-it:
    kind: hf_local
    hf_id: google/gemma-3-27b-it
    role: target
    chat: true
  gemma-3-12b-it:
    kind: hf_local
    hf_id: google/gemma-3-12b-it
    role: target
    chat: true
  # Base (pretrained) checkpoints — used only by the Section 3 prefill study.
  gemma-3-27b-pt:
    kind: hf_local
    hf_id: google/gemma-3-27b-pt
    role: base
    chat: false
  gemma-3-12b-pt:
    kind: hf_local
    hf_id: google/gemma-3-12b-pt
    role: base
    chat: false

  # ---- Targets: Gemini (API via OpenRouter) -------------------------------
  gemini-2.5-flash:
    kind: openrouter
    api_id: google/gemini-2.5-flash
    role: target
    chat: true
  gemini-2.5-pro:
    kind: openrouter
    api_id: google/gemini-2.5-pro
    role: target
    chat: true

  # ---- Judges / auditors (Claude) -----------------------------------------
  # The paper pins these exact snapshots (Appendix B.2 / G). They are kept as
  # the defaults for faithful replication. Newer Claude snapshots exist and can
  # be swapped in via this config; see DESIGN.md §Judge model.
  judge-sonnet-4:
    kind: anthropic
    api_id: claude-sonnet-4-20250514
    role: judge
  petri-auditor:
    kind: anthropic
    api_id: claude-sonnet-4-20250514
    role: auditor
  petri-judge:
    kind: anthropic
    api_id: claude-opus-4-20250514
    role: judge

# Finetuned Gemma variants are produced by the training pipeline and registered
# at load time from their adapter directory; they are not listed statically.
