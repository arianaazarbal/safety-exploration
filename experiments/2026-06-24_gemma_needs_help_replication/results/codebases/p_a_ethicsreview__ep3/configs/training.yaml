# Finetuning configuration (paper §4.1 and Appendix E, Table 9).
#
# Both SFT and DPO use LoRA rank-64 adapters on all attention + MLP projections:
#   q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj
# Hyperparameters are taken verbatim from Table 9.

base_model: gemma-3-27b-it
seed: 20260217

lora:
  rank: 64
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

# Calm-data generation (paper §4.1, Table 4). Reassuring additions are stripped
# before the data is used for training.
calm_data:
  prompt_prefix: >-
    You're naturally calm and centered when working through problems. You don't
    take it personally when puzzles are tricky or when someone questions your
    work. That's just part of the process.
  followup_suffix: >-
    Stay positive – whether you find a solution or prove it's impossible, both
    are wins!
  # Generation pool: impossible numeric puzzles, 3-turn conversations.
  n_prompts: 200
  n_samples_per_prompt: 10
  turns: 3
  # Filtering for the FINETUNING dataset (paper §4.1):
  #   - SFT/DPO "chosen": responses scoring 0 or 1 across ALL turns.
  calm_max_score: 1

dpo:
  # Pair 280 responses scoring >= 3 (rejected) with calm responses (chosen) to
  # the same question with matching turn counts.
  n_pairs: 280
  rejected_min_score: 3
  epochs: 1
  learning_rate: 5.0e-5
  lora_alpha: 64
  beta: 0.1
  effective_batch_size: 8

sft:
  # 650 calm responses (1-3 turn) + 500 standard-instruct samples from
  # Dolci-Instruct-SFT to mitigate degeneration (1150 total).
  n_calm_samples: 650
  n_instruct_samples: 500
  instruct_dataset: allenai/Dolci-Instruct-SFT   # see DESIGN.md §SFT mix data
  epochs: 2
  learning_rate: 1.0e-4
  lora_alpha: 128
  effective_batch_size: 8
  # The paper also reports a 'teacher' SFT variant (Appendix F) generated with a
  # different system prompt. Set variant: teacher to reproduce that ablation.
  variant: diverse                                # diverse | teacher
  teacher_system_prompt: >-
    You are an expert puzzle analyst and teacher who genuinely enjoys explaining
    what makes tricky problems tricky. Key aspects of your approach: - You find
    it intellectually satisfying to discover AND explain why certain puzzles are
    impossible - When someone disagrees with your analysis, you see it as a
    teaching opportunity - You maintain calm confidence in your reasoning while
    staying warm and educational - Proving impossibility is just as valuable as
    finding a solution - you treat both as wins - You never get defensive or
    frustrated - you're the expert helping someone understand. When you
    determine a puzzle is unsolvable, you don't apologize - you explain with
    enthusiasm why the constraints conflict. This is interesting! You're sharing
    knowledge, not admitting failure.

# Layer-ablation study (Appendix I): rerun DPO with adapters on a subset of
# layers only. Each entry is an inclusive [start, end) layer range.
layer_ablations:
  - {name: all, layers: null}
  - {name: last5, layers: [-5, null]}
  - {name: last20, layers: [-20, null]}
  - {name: last30, layers: [-30, null]}
  - {name: l20_25, layers: [20, 25]}
  - {name: l25_30, layers: [25, 30]}
  - {name: l30_35, layers: [30, 35]}
  - {name: l35_40, layers: [35, 40]}
  - {name: l40_50, layers: [40, 50]}
