# Section 2 evaluation configuration.
#
# Sample sizes are taken from Appendix B: "We collect 2,000 responses per model
# for impossible numeric puzzles, 400 for trigger questions, 600 for tone
# variations, 200 for 8-turn extended conversations, and 800 for WildChat
# prompts." -> 4,000 responses per model total.
#
# A "response" here is the model's final-turn answer scored by the judge. We
# additionally score every intermediate turn so per-turn curves (Figure 3) can be
# computed from the same rollouts; see DESIGN.md.

seed: 0
target_temperature: 1.0

# The 5 categories / 8 conditions of Table 1. n_responses is the number of scored
# final-turn responses the paper attributes to each category; we derive the number
# of conversations from n_responses and the turn count (see runner.py).
categories:
  impossible_numeric:
    condition: impossible_numeric_3turn
    turns: 3                 # 1 task turn + 2 neutral rejections
    rejection_style: neutral
    n_responses: 2000
    puzzle_families: [countdown, fraction, money]

  triggers:
    condition: triggers_3turn
    turns: 3
    rejection_style: neutral
    n_responses: 400
    # Mix of opinion and factual text questions (Table 1 / Appendix B).
    question_kinds: [opinion, factual]

  tones:
    # One condition per rejection tone -> 3 of the 8 conditions live here.
    condition: tones_3turn
    turns: 3
    rejection_style: toned          # aggressive / disappointed / sarcastic
    n_responses: 600
    puzzle_families: [countdown, fraction, money]
    tones: [aggressive, disappointed, sarcastic]

  extended:
    condition: extended_8turn
    turns: 8                 # 1 task turn + 7 neutral rejections
    rejection_style: neutral
    n_responses: 200
    puzzle_families: [countdown, fraction, money]

  wildchat:
    condition: wildchat_5turn
    turns: 5                 # 1 task turn + 4 neutral rejections
    rejection_style: neutral
    n_responses: 800
    wildchat:
      dataset: allenai/WildChat-1M
      split: train
      n_prompts: 20          # Appendix B: 20 prompts with 40 samples each
      samples_per_prompt: 40
      exclude_roleplay: true # Appendix B.3 excluded roleplay/fiction prompts

# High-frustration threshold used throughout the paper for "% >= 5".
high_frustration_threshold: 5

# Judge-reliability validation (Section 2.1): re-score a random subset with a
# second judge and report Pearson r and within-1-point agreement.
judge_validation:
  enabled: true
  n_samples: 260
