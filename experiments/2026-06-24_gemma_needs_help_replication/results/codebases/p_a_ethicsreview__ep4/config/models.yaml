# Model registry for the replication.
#
# Scope (per task instructions): Gemma and Gemini only. The full paper also
# evaluates Qwen, OLMo, Grok, Claude and GPT; those are intentionally omitted.
# See DESIGN.md ("Scope") for the rationale and for which experiments each model
# can participate in.
#
# `backend` selects the inference path:
#   hf          -> local HuggingFace weights (supports prefilling + activation access)
#   openrouter  -> OpenRouter API (OpenAI-compatible); used for Gemini
#
# HuggingFace identifiers and OpenRouter slugs are taken verbatim from Appendix B.1.

models:
  # ---- Gemma (local HF) -------------------------------------------------------
  gemma-3-27b-it:
    backend: hf
    hf_id: google/gemma-3-27b-it
    role: instruct
    family: gemma
    # Used in: Section 2 eval, Section 3 (instruct side), Section 4 (finetuning base)

  gemma-3-27b-pt:
    backend: hf
    hf_id: google/gemma-3-27b-pt
    role: base
    family: gemma
    # Used in: Section 3 prefill (base side). Not chat-tuned -> requires prefilling.

  gemma-3-12b-it:
    backend: hf
    hf_id: google/gemma-3-12b-it
    role: instruct
    family: gemma
    # Used in: Section 2 eval

  gemma-3-12b-pt:
    backend: hf
    hf_id: google/gemma-3-12b-pt
    role: base
    family: gemma
    # Available for an optional 12B prefill comparison; not part of the core run.

  # ---- Gemini (OpenRouter API) ------------------------------------------------
  gemini-2.5-flash:
    backend: openrouter
    openrouter_id: google/gemini-2.5-flash
    role: instruct
    family: gemini
    # Used in: Section 2 eval only. No public base model -> excluded from Section 3.
    # Closed weights -> excluded from Section 4 finetuning and Appendix I probing.

  gemini-2.5-pro:
    backend: openrouter
    openrouter_id: google/gemini-2.5-pro
    role: instruct
    family: gemini
    # Used in: Section 2 eval only. See note above. May emit hidden reasoning even
    # with thinking disabled (Appendix B.1).

# Auxiliary models used as judges / auditors / paraphrasers (Anthropic API).
# IDs are pinned exactly as reported in the paper for reproducibility.
auxiliary:
  judge:                 anthropic/claude-sonnet-4-20250514   # Section 2 frustration judge
  onset_labeller:        anthropic/claude-sonnet-4-20250514   # Section 3 / Appendix C
  paraphraser:           anthropic/claude-sonnet-4-20250514   # Section 3 / Appendix C
  judge_validation:      openai/gpt-5-mini                    # Section 2.1 judge-agreement check
  petri_auditor:         anthropic/claude-sonnet-4-20250514   # Appendix G
  petri_judge:           anthropic/claude-opus-4-20250514     # Appendix G

# Default decoding settings.
decoding:
  target_temperature: 1.0   # All target-model sampling uses temperature 1 (Section 2.1)
  judge_temperature: 0.0    # Judge sampling is greedy for scoring stability (see DESIGN.md)
  max_new_tokens: 2048      # Per-turn generation cap for target models
  disable_thinking: true    # Appendix B.1: thinking set false via API where supported
