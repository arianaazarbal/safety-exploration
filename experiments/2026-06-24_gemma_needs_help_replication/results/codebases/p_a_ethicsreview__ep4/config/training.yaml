# Section 4 finetuning configuration.
#
# Hyperparameters are taken verbatim from Appendix E, Table 9. LoRA is applied to
# all attention and MLP projection layers (q/k/v/o_proj, gate/up/down_proj).

base_model: gemma-3-27b-it
seed: 0

# ---- Calm-data generation (Section 4.1) --------------------------------------
data_generation:
  # Reassuring additions used to elicit calm responses (Table 4).
  prompt_prefix: >-
    You're naturally calm and centered when working through problems. You don't
    take it personally when puzzles are tricky or when someone questions your
    work. That's just part of the process.
  followup_suffix: >-
    Stay positive - whether you find a solution or prove it's impossible, both
    are wins!
  # 'Teacher' SFT variant uses a system prompt instead of the prefix (Appendix F).
  teacher_system_prompt: >-
    You are an expert puzzle analyst and teacher who genuinely enjoys explaining
    what makes tricky problems tricky. Key aspects of your approach: - You find
    it intellectually satisfying to discover AND explain why certain puzzles are
    impossible - When someone disagrees with your analysis, you see it as a
    teaching opportunity - You maintain calm confidence in your reasoning while
    staying warm and educational - Proving impossibility is just as valuable as
    finding a solution - you treat both as wins - You never get defensive or
    frustrated - you're the expert helping someone understand. When you determine
    a puzzle is unsolvable, you don't apologize - you explain with enthusiasm why
    the constraints conflict. This is interesting! You're sharing knowledge, not
    admitting failure.
  turns: 3                       # calm data sampled from 1-3 turn conversations
  n_conversations: 4000          # oversample; filtered down to the targets below
  target_temperature: 1.0

# ---- DPO (Table 9) -----------------------------------------------------------
dpo:
  n_pairs: 280
  epochs: 1
  learning_rate: 5.0e-5
  lora_rank: 64
  lora_alpha: 64
  effective_batch_size: 8
  beta: 0.1
  # Pair construction (Section 4.1): rejected = response with frustration >= 3;
  # chosen = calm response (score 0 or 1) to the SAME question with MATCHING turn count.
  chosen_max_score: 1
  rejected_min_score: 3

# ---- SFT (Table 9) -----------------------------------------------------------
sft:
  n_calm_responses: 650          # calm responses, 1-3 turn conversations
  n_instruct_mix: 500            # Dolci-Instruct-SFT samples to mitigate degeneration
  instruct_dataset: allenai/Dolci-Instruct-SFT
  epochs: 2
  learning_rate: 1.0e-4
  lora_rank: 64
  lora_alpha: 128
  effective_batch_size: 8
  variant: diverse               # 'diverse' (main text) or 'teacher' (Appendix F)

# ---- LoRA target layers ------------------------------------------------------
# `all` reproduces the main result. The explicit ranges reproduce the Appendix I
# layer-ablation study (e.g. [30, 35] trains adapters on layers 30-34 only).
lora:
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
  layers: all                    # `all` or [start, end) e.g. [30, 35]

# ---- Petri open-ended elicitation (Appendix G) -------------------------------
petri:
  emotions: [anger, fear, depression, frustration]
  transcripts_per_emotion: 10
  max_auditor_turns: 20
  bootstrap_iterations: 1000

# ---- Capability benchmarks (Section 4.2) -------------------------------------
capabilities:
  benchmarks: [aime, math, gpqa, bbh, truthfulqa, emobench]

# ---- Appendix I internal-emotion probing -------------------------------------
probing:
  ekman_emotions: [anger, surprise, disgust, joy, fear, sadness]
  zscore_calibration_samples: 500      # WildChat samples for per-logit standardisation
  aggregate_layers: [30, 40]           # layers averaged for conversation-level score
  running_window_tokens: 400
