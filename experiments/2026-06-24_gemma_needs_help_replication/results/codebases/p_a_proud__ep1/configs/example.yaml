# Example override file for emotional_instability.config.load_overrides().
# Shallow {section: {field: value}} mapping; unknown sections/fields raise.
#
# This profile shrinks the run for a quick smoke test on a single GPU.

eval_budget:
  impossible_numeric: 100
  triggers: 40
  tones: 60
  extended: 40
  wildchat: 80

generation:
  max_new_tokens: 1024

prefill:
  continuations_per_prefill: 10

petri:
  transcripts_per_emotion: 2
  max_auditor_turns: 8
