# Example config override. Pass with `--config config/example.yaml`.
# Only the sections/fields you specify are overridden; everything else uses the
# paper-faithful defaults in src/emotional_instability/config.py.

seed: 0

# Smaller, faster smoke-test sample counts (default reproduces the paper's ~4000/model).
# (Per-category counts live in config.py:EVAL_CONDITIONS; override there or via code.)

prefill:
  continuations_per_prefill: 50   # paper default
  early_truncation_tokens: 20

dpo:
  n_pairs: 280
  learning_rate: 5.0e-5
  beta: 0.1

sft:
  n_calm: 650
  n_dolci_mix: 500
  variant: diverse                # or 'teacher'

petri:
  transcripts_per_emotion: 10
  max_auditor_turns: 20

probe:
  aggregate_layers: [30, 40]
  n_standardisation_samples: 500
