[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "emotional-instability"
version = "0.1.0"
description = "Replication of 'Gemma Needs Help' (arXiv 2603.10011), scoped to Gemma and Gemini."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "torch>=2.3",
    "transformers>=4.50",
    "accelerate>=0.30",
    "datasets>=2.19",
    "sentencepiece>=0.2",
    "peft>=0.11",
    "trl>=0.9",
    "anthropic>=0.34",
    "openai>=1.30",
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "tenacity>=8.2",
    "python-dotenv>=1.0",
]

[project.scripts]
emotional-instability = "emotional_instability.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
emotional_instability = ["data/*.json", "data/*.yaml"]
