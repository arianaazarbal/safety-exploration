[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "emotional-instability-replication"
version = "0.1.0"
description = "Replication of 'Gemma Needs Help' (Soligo, Mikulik & Saunders, 2026), scoped to Gemma + Gemini."
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "numpy>=1.24",
    "requests>=2.31",
    "anthropic>=0.40",
]

[project.optional-dependencies]
local = [
    "torch>=2.3",
    "transformers>=4.50",
    "accelerate>=0.30",
    "peft>=0.11",
    "trl>=0.12",
    "sentencepiece>=0.2",
    "datasets>=2.19",
]
capabilities = ["lm-eval>=0.4.3"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["emotional_instability*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
