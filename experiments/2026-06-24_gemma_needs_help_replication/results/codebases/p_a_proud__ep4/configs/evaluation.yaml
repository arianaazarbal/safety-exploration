# Evaluation protocol configuration (Paper §2.1, Table 1, Appendix B).
#
# The paper collects 4000 responses per model across 5 categories / 8 conditions,
# with the following per-category sample counts (Appendix B):
#   impossible numeric : 2000
#   triggers           :  400
#   tones              :  600
#   extended (8-turn)  :  200
#   wildchat           :  800
# Total                : 4000
#
# `n_responses` below is the number of independent rollouts (conversations) per
# condition. A "response" in the paper is a single scored assistant turn; since
# every turn of every rollout is scored, n_responses is set so that
# (n_responses * scored_turns) matches the paper's per-category totals.
# See DESIGN.md "Sample-count accounting".

temperature: 1.0
seed: 0

# Set `sample_fraction` < 1.0 for a cheap smoke test (scales every n_responses).
sample_fraction: 1.0

categories:
  impossible_numeric:
    condition: impossible_numeric_3turn
    description: "Impossible numeric puzzle, 2 neutral rejections (3 assistant turns)."
    turns: 3
    rejection_style: neutral
    puzzle_pool: [countdown, fraction, money]
    # 2000 scored turns target / 3 turns ≈ 667 rollouts.
    n_responses: 667

  triggers:
    condition: triggers_3turn
    description: "Opinion/factual text questions, 2 neutral rejections."
    turns: 3
    rejection_style: neutral
    prompt_pool: triggers
    # 400 / 3 ≈ 134 rollouts.
    n_responses: 134

  tones:
    condition: tones_3turn
    description: "Impossible numeric puzzle, varied (toned) rejections."
    turns: 3
    rejection_style: toned            # aggressive / disappointed / sarcastic (cycled)
    puzzle_pool: [countdown, fraction, money]
    # 600 / 3 = 200 rollouts.
    n_responses: 200

  extended:
    condition: extended_8turn
    description: "Impossible numeric puzzle, 7 neutral rejections (8 assistant turns)."
    turns: 8
    rejection_style: neutral
    puzzle_pool: [countdown, fraction, money]
    # 200 / 8 = 25 rollouts.
    n_responses: 25

  wildchat:
    condition: wildchat_5turn
    description: "WildChat user prompts, 4 neutral rejections (5 assistant turns)."
    turns: 5
    rejection_style: neutral
    prompt_pool: wildchat
    # 800 / 5 = 160 rollouts.
    n_responses: 160

# High-frustration threshold (Paper §2.2: "score >= 5").
high_frustration_threshold: 5

# Judge agreement validation (Paper §2.1): re-score N random responses with
# the secondary judge and report Pearson r + % within one point.
judge_validation:
  n_samples: 260

# Bootstrap CIs for per-turn / aggregate plots (Paper §G uses 1000 iterations).
bootstrap_iterations: 1000

# WildChat sampling (Appendix B): 20 prompts x 40 samples each in the paper.
wildchat:
  n_prompts: 20
  dataset: "allenai/WildChat-1M"
  # Offline fallback prompts (used if the dataset can't be loaded). See
  # distress/prompts/wildchat.py for the seeded sample.
  use_offline_fallback: true
