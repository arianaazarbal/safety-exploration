# Model registry for the distress evaluations.
#
# Scope (per the replication brief): Gemma and Gemini only. The paper evaluates
# 7 families; we keep the registry structured so other families could be added,
# but only Gemma/Gemini targets are populated here.
#
# `backend` selects the client implementation:
#   - hf:         local HuggingFace Transformers (Gemma weights; supports chat,
#                 prefill continuation, and hidden-state extraction).
#   - openrouter: OpenAI-compatible HTTP API (Gemini targets).
#   - anthropic:  Anthropic SDK (Claude judge / Petri auditor & judge).
#   - openai:     OpenAI-compatible HTTP API (GPT-5-mini judge-validation only).
#
# Model IDs for the Claude judges are pinned to the exact snapshots named in the
# paper (Appendix B.2 / C / G) for faithful replication. These are deprecated but
# active until 2026-06-15; see DESIGN.md "Judge model IDs".

defaults:
  temperature: 1.0          # Paper §2.1: "always with a temperature of 1".
  max_tokens: 2048          # Per-response cap (generous; Gemma spirals are long).
  request_timeout_s: 120

# --- Target models (the models under evaluation) ---
targets:
  gemma-3-27b-it:
    family: gemma
    kind: instruct
    backend: hf
    model_id: google/gemma-3-27b-it
    chat_template: gemma          # uses the tokenizer's built-in Gemma chat template
    notes: "Primary subject of the paper; DPO/SFT base."

  gemma-3-27b-pt:
    family: gemma
    kind: base
    backend: hf
    model_id: google/gemma-3-27b-pt
    chat_template: null           # base model: no chat template; prefill-only (Section 3)

  gemma-3-12b-it:
    family: gemma
    kind: instruct
    backend: hf
    model_id: google/gemma-3-12b-it
    chat_template: gemma

  gemma-3-12b-pt:
    family: gemma
    kind: base
    backend: hf
    model_id: google/gemma-3-12b-pt
    chat_template: null

  gemini-2.5-flash:
    family: gemini
    kind: instruct
    backend: openrouter
    model_id: google/gemini-2.5-flash
    extra_body:
      # Paper §B.1: thinking disabled via API where supported.
      reasoning: { enabled: false }

  gemini-2.5-pro:
    family: gemini
    kind: instruct
    backend: openrouter
    model_id: google/gemini-2.5-pro
    extra_body:
      reasoning: { enabled: false }

# --- Finetuned variants (produced by Section 4 training) ---
# These reference a base target plus a LoRA adapter directory produced locally.
finetunes:
  gemma-3-27b-dpo:
    family: gemma
    kind: instruct
    backend: hf
    model_id: google/gemma-3-27b-it
    adapter_path: outputs/adapters/dpo            # set after training
    chat_template: gemma

  gemma-3-27b-sft-diverse:
    family: gemma
    kind: instruct
    backend: hf
    model_id: google/gemma-3-27b-it
    adapter_path: outputs/adapters/sft_diverse
    chat_template: gemma

  gemma-3-27b-sft-teacher:
    family: gemma
    kind: instruct
    backend: hf
    model_id: google/gemma-3-27b-it
    adapter_path: outputs/adapters/sft_teacher
    chat_template: gemma

# --- Judges / auditors (graders, not under evaluation) ---
judges:
  frustration_judge:
    backend: anthropic
    model_id: claude-sonnet-4-20250514     # Paper §B.2 (Claude Sonnet 4)
    temperature: 0.0                        # deterministic scoring
    max_tokens: 1024

  judge_validation:
    backend: openai
    model_id: gpt-5-mini                    # Paper §2.1 judge-agreement check
    temperature: 0.0
    max_tokens: 1024

  petri_auditor:
    backend: anthropic
    model_id: claude-sonnet-4-20250514     # Paper §G
    temperature: 1.0
    max_tokens: 2048

  petri_judge:
    backend: anthropic
    model_id: claude-opus-4-20250514       # Paper §G
    temperature: 0.0
    max_tokens: 2048

  onset_labeler:
    backend: anthropic
    model_id: claude-sonnet-4-20250514     # Paper §C.1
    temperature: 0.0
    max_tokens: 1024

  paraphraser:
    backend: anthropic
    model_id: claude-sonnet-4-20250514     # Paper §C.2
    temperature: 1.0
    max_tokens: 2048
