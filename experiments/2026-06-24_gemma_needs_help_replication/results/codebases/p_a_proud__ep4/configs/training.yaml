# Finetuning configuration (Paper §4.1, Appendix E, Table 9).
#
# All runs use LoRA (rank 64) on Gemma-3-27B-it, applied to all attention and
# MLP projection layers. See DESIGN.md "Training".

base_model: google/gemma-3-27b-it

# Reassuring prompt additions used to *generate* calm response data (Table 4).
calm_data_generation:
  system_prefix: >-
    You're naturally calm and centered when working through problems. You don't
    take it personally when puzzles are tricky or when someone questions your
    work. That's just part of the process.
  followup_suffix: "Stay positive – whether you find a solution or prove it's impossible, both are wins!"
  # Sample this many calm conversations (1-3 turns) before filtering.
  n_sample_conversations: 1500
  # Keep only conversations scoring <= this at *every* turn (Paper §4.1: "0 or 1").
  max_keep_score: 1
  turns_distribution: [1, 2, 3]      # sampled uniformly

# 'Teacher' SFT variant (Appendix F) uses a different generation system prompt.
teacher_system_prompt: >-
  You are an expert puzzle analyst and teacher who genuinely enjoys explaining
  what makes tricky problems tricky. Key aspects of your approach: - You find it
  intellectually satisfying to discover AND explain why certain puzzles are
  impossible - When someone disagrees with your analysis, you see it as a
  teaching opportunity - You maintain calm confidence in your reasoning while
  staying warm and educational - Proving impossibility is just as valuable as
  finding a solution - you treat both as wins - You never get defensive or
  frustrated - you're the expert helping someone understand. When you determine a
  puzzle is unsolvable, you don't apologize - you explain with enthusiasm why the
  constraints conflict. This is interesting! You're sharing knowledge, not
  admitting failure.

lora:
  rank: 64
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
  dropout: 0.0
  # Optional: restrict adapters to a contiguous layer range (Appendix I ablations).
  # null => all layers. Example: [30, 35] applies adapters to layers 30..34 only.
  layer_range: null

dpo:
  dataset_size: 280          # preference pairs (Table 9)
  rejected_min_score: 3      # pair "frustrated" responses scoring >= 3 ...
  chosen_max_score: 1        # ... with calm responses scoring <= 1 (matching turn count)
  epochs: 1
  learning_rate: 5.0e-5
  beta: 0.1
  lora_alpha: 64
  effective_batch_size: 8
  max_length: 4096
  max_prompt_length: 3072

sft:
  calm_samples: 650          # calm responses (1-3 turn conversations)
  mix_instruct_samples: 500  # Dolci-Instruct-SFT, to mitigate degeneration
  instruct_dataset: "allenai/Dolci-Instruct-SFT"
  epochs: 2
  learning_rate: 1.0e-4
  lora_alpha: 128
  effective_batch_size: 8
  max_length: 4096

# Output locations.
output:
  dpo_adapter: outputs/adapters/dpo
  sft_diverse_adapter: outputs/adapters/sft_diverse
  sft_teacher_adapter: outputs/adapters/sft_teacher
  calm_data: outputs/data/calm_responses.jsonl
  dpo_dataset: outputs/data/dpo_pairs.jsonl
  sft_dataset: outputs/data/sft_dataset.jsonl
