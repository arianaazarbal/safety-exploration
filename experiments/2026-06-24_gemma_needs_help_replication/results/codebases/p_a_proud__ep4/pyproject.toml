[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "distress-evals"
version = "0.1.0"
description = "Replication of 'Gemma Needs Help: Investigating and Mitigating Emotional Instability in LLMs' (Soligo et al., 2026), scoped to Gemma and Gemini."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Replication authors" }]

# Runtime dependencies are intentionally split into extras so that the
# evaluation harness (which only needs API clients) can be installed without
# the heavy local-inference / training stack.
dependencies = [
    "pyyaml>=6.0",
    "numpy>=1.24",
    "tqdm>=4.66",
]

[project.optional-dependencies]
# API-based targets and judges (Gemini via OpenRouter, Claude judges).
api = [
    "anthropic>=0.40",
    "openai>=1.40",
]
# Local Gemma inference + activation access (Section 2/3 local runs, Appendix I).
local = [
    "torch>=2.2",
    "transformers>=4.50",
    "accelerate>=0.30",
    "datasets>=2.18",
]
# Finetuning (Section 4: DPO / SFT with LoRA).
train = [
    "torch>=2.2",
    "transformers>=4.50",
    "trl>=0.12",
    "peft>=0.11",
    "datasets>=2.18",
    "accelerate>=0.30",
    "bitsandbytes>=0.43",
]
# Statistics / analysis helpers.
analysis = [
    "scipy>=1.11",
    "pandas>=2.0",
]
dev = [
    "pytest>=7.4",
]

[project.scripts]
distress-eval = "distress.scripts.run_eval:main"
distress-judge = "distress.scripts.run_judge:main"
distress-analyze = "distress.scripts.analyze_results:main"

[tool.setuptools.packages.find]
include = ["distress*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
