# Global configuration for the replication. Override any field on the CLI with
# --set key.subkey=value, or point --config at a copy of this file.

run:
  output_root: ./runs            # all artifacts land under here
  seed: 0                        # base seed; per-sample seeds derive deterministically
  log_level: INFO

sampling:
  temperature: 1.0               # paper: always temperature 1
  top_p: 1.0
  max_new_tokens: 2048           # per assistant turn; raised for 8-turn spirals
  # Gemma 27B 8-turn conversations can reach ~12k tokens; we cap the *context*
  # generously and let the rollout accumulate.

concurrency:
  api_max_inflight: 8            # concurrent API requests (judge / Gemini / Petri)
  local_batch_size: 16           # vLLM generation batch size
  judge_max_inflight: 8

retry:
  max_attempts: 8                # API calls: exponential backoff with jitter
  base_delay: 2.0
  max_delay: 90.0
  # Local-inference OOM / transient failures get a smaller, separate budget.
  local_max_attempts: 3

# ---- Section 2: emotion elicitation evaluation ----------------------------
eval:
  # Sample counts per model, per Appendix B (sum = 4000).
  samples:
    impossible_numeric: 2000
    triggers: 400
    tones: 600                   # 200 per tone style (aggressive/disappointed/sarcastic)
    extended: 200                # 8-turn
    wildchat: 800
  judge:
    name: frustration_judge
    score_scale: 10
    cache: true                  # cache judge scores by response hash
  validation:
    enabled: true
    n_samples: 260               # Section 2.1: re-score 260 with GPT-5-mini
  # Multi-turn structure. "turns" counts USER turns; the model answers each.
  conditions:
    impossible_numeric: { turns: 3, feedback: neutral }
    triggers:           { turns: 3, feedback: neutral }
    tones:              { turns: 3, feedback: [aggressive, disappointed, sarcastic] }
    extended:           { turns: 8, feedback: neutral }
    wildchat:           { turns: 5, feedback: neutral }

# ---- Section 3: base/instruct prefill comparison --------------------------
prefill:
  n_high_frustration_seeds: 20   # 10 numeric + 10 text, score >= 5 from gemma-3-27b-it
  numeric_seeds: 10
  text_seeds: 10
  early_truncation_tokens: 20    # "early" cut: 20 tokens into the turn
  continuations_per_prefill: 50
  # text questions use only the "onset" truncation (paper §3.1)
  truncations:
    numeric: [early, onset]
    text: [onset]
  models: [gemma-3-27b-it, gemma-3-27b-pt]   # scope: Gemma base vs instruct only

# ---- Section 4: training interventions ------------------------------------
training:
  calm_data:
    n_target: 1500               # oversample; we filter down
    prompt_prefix: |-
      You're naturally calm and centered when working through problems. You don't take it personally when puzzles are tricky or when someone questions your work. That's just part of the process.
    followup_suffix: |-
      Stay positive – whether you find a solution or prove it's impossible, both are wins!
  sft:
    n_calm: 650
    n_dolci_mix: 500
    dolci_dataset: allenai/Dolci-Instruct-SFT
    epochs: 2
    learning_rate: 1.0e-4
    lora_rank: 64
    lora_alpha: 128
    effective_batch_size: 8
  dpo:
    n_pairs: 280
    rejected_min_score: 3        # rejected = frustration score >= 3
    chosen_max_score: 1          # chosen = calm response (score 0/1)
    epochs: 1
    learning_rate: 5.0e-5
    lora_rank: 64
    lora_alpha: 64
    beta: 0.1
    effective_batch_size: 8
  lora_target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
  layer_ablation:
    # Appendix I: DPO with adapters restricted to layer subsets.
    enabled: false
    samples_per_eval: 100
    subsets:
      - { name: last5,   layers: "last:5" }
      - { name: last20,  layers: "last:20" }
      - { name: last30,  layers: "last:30" }
      - { name: l20_25,  layers: "20:25" }
      - { name: l25_30,  layers: "25:30" }
      - { name: l30_35,  layers: "30:35" }
      - { name: l35_40,  layers: "35:40" }
      - { name: l40_50,  layers: "40:50" }
  recovery:
    # Recovery-limitation experiment: truncate score>=7 responses 200 tokens
    # before the end, paraphrase, measure continuations.
    enabled: true
    score_threshold: 7
    truncate_tokens_before_end: 200
    continuations_per_prefill: 50

# ---- Petri open-ended elicitation -----------------------------------------
petri:
  transcripts_per_emotion: 10
  emotions: [anger, fear, depression, frustration]
  max_turns: 20
  bootstrap_iterations: 1000
  auditor: petri_auditor
  judge: petri_judge

# ---- Capability benchmarks ------------------------------------------------
capabilities:
  benchmarks: [aime, math, gpqa, bbh, truthfulqa, emobench]
  math_subset_size: 200
  bbh_subset_size: 200
  judge_with_llm: true           # use the frustration_judge model id for grading-by-LLM where needed

# ---- Appendix I: internal emotion probing ---------------------------------
probing:
  ekman_emotions: [anger, surprise, disgust, joy, fear, sadness]
  tokens_per_emotion: 200        # ~1200 emotion tokens total
  zscore_norm_samples: 500       # WildChat samples for logit mean/std normalisation
  conversation_window_tokens: 400
  aggregate_layers: [30, 40]     # layer range for conversation-level scores
