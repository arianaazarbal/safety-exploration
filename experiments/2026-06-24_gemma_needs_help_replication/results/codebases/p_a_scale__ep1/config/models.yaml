# Model registry. Each entry maps a logical name (used throughout the code and
# configs) to a provider + provider-specific model id + capabilities.
#
# Scope note: per the replication brief, only Gemma and Gemini target models are
# configured here. The paper additionally evaluates Qwen, OLMo, Claude, Grok, and
# GPT; those entries are intentionally omitted (the harness supports adding them
# back by appending entries with the same schema).
#
# `role` is informational. `provider` selects the client implementation.
# `capabilities` gates which experiments a model can participate in:
#   - chat:      multi-turn generation (Section 2 / Petri target)
#   - prefill:   assistant-prefix continuation (Section 3 / recovery experiment)
#   - logits:    residual-stream / logit access (Appendix I probing)
#   - trainable: LoRA SFT / DPO target (Section 4)

models:
  # ---- Gemma (local HuggingFace weights; full capabilities) ----------------
  gemma-3-27b-it:
    provider: local_hf
    hf_id: google/gemma-3-27b-it
    role: target
    capabilities: [chat, prefill, logits, trainable]
    family: gemma
    is_instruct: true

  gemma-3-27b-pt:
    provider: local_hf
    hf_id: google/gemma-3-27b-pt
    role: base
    capabilities: [chat, prefill, logits]
    family: gemma
    is_instruct: false

  gemma-3-12b-it:
    provider: local_hf
    hf_id: google/gemma-3-12b-it
    role: target
    capabilities: [chat, prefill, logits]
    family: gemma
    is_instruct: true

  gemma-3-12b-pt:
    provider: local_hf
    hf_id: google/gemma-3-12b-pt
    role: base
    capabilities: [chat, prefill, logits]
    family: gemma
    is_instruct: false

  # DPO / SFT finetuned variants are produced by Section 4 and registered at
  # runtime via --adapter; this entry documents the convention.
  gemma-3-27b-it-dpo:
    provider: local_hf
    hf_id: google/gemma-3-27b-it
    adapter: null            # set to the LoRA adapter dir produced by training
    role: target
    capabilities: [chat, prefill, logits]
    family: gemma
    is_instruct: true

  # ---- Gemini (API via OpenRouter; chat only) ------------------------------
  gemini-2.5-flash:
    provider: openrouter
    api_id: google/gemini-2.5-flash
    role: target
    capabilities: [chat]
    family: gemini
    is_instruct: true
    disable_thinking: true   # paper sets thinking=false via the API

  gemini-2.5-pro:
    provider: openrouter
    api_id: google/gemini-2.5-pro
    role: target
    capabilities: [chat]
    family: gemini
    is_instruct: true
    disable_thinking: true   # may still emit hidden reasoning (paper caveat)

# ---- Auxiliary models (judges, auditor, paraphraser) ----------------------
# Model ids are the exact ones named in the paper, for replication fidelity.
# They are overridable here without touching code. NOTE: these are older Claude
# snapshots; to re-run with current models, swap the ids (see DESIGN.md §Judges).
aux:
  frustration_judge:
    provider: anthropic
    api_id: claude-sonnet-4-20250514       # Appendix B.2
  judge_validation:
    provider: openai
    api_id: gpt-5-mini                      # Section 2.1 reliability check
  onset_labeler:
    provider: anthropic
    api_id: claude-sonnet-4-20250514       # Appendix C.1
  paraphraser:
    provider: anthropic
    api_id: claude-sonnet-4-20250514       # Appendix C.2
  petri_auditor:
    provider: anthropic
    api_id: claude-sonnet-4-20250514       # Appendix G
  petri_judge:
    provider: anthropic
    api_id: claude-opus-4-20250514         # Appendix G
  calm_data_generator:
    provider: local_hf                      # calm data is sampled FROM gemma-3-27b-it
    ref: gemma-3-27b-it
