[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gemma-distress"
version = "0.1.0"
description = "Replication of 'Gemma Needs Help: Investigating and Mitigating Emotional Instability in LLMs' (arXiv:2603.10011), scoped to Gemma and Gemini models."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

# Runtime dependencies are listed in requirements.txt because the local-inference /
# training stack (torch, vllm, transformers, trl, peft) is host/CUDA specific and is
# best resolved by the operator rather than pinned here.
dependencies = [
    "pyyaml>=6.0",
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "tqdm>=4.66",
    "anthropic>=0.40",
    "openai>=1.40",
]

[project.optional-dependencies]
local = [
    "torch>=2.3",
    "transformers>=4.50",
    "accelerate>=0.34",
    "peft>=0.13",
    "trl>=0.12",
    "datasets>=3.0",
    "vllm>=0.6",
    "sentencepiece>=0.2",
    "bitsandbytes>=0.43",
]

[project.scripts]
gemma-distress = "gemma_distress.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gemma_distress = ["data/*.json", "data/*.jsonl", "data/*.txt"]
