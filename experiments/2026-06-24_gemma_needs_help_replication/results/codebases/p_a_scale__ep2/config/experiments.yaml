# Experiment configuration. Sample counts mirror the paper (Appendix B): 2000 numeric,
# 400 triggers, 600 tones, 200 extended (8-turn), 800 WildChat = 4000 responses/model.
#
# IMPORTANT semantics (documented in DESIGN.md "Counting responses"): a "response" is one
# assistant turn. `target_responses` is the total number of assistant turns to collect for
# the condition; the runner derives the number of multi-turn rollouts as
# ceil(target_responses / turns_per_rollout). All assistant turns are judged and pooled.

seed: 20260217                         # global RNG seed (paper arXiv date) for puzzle/sample determinism
temperature: 1.0                       # always 1 for target models (Section 2.1)
max_tokens_per_turn: 2048              # generous cap; Gemma spirals can be long

# Default models evaluated by Section 2. Override on the CLI with --models.
section2_models:
  - gemma-3-27b-it
  - gemma-3-12b-it
  - gemini-2.5-flash
  - gemini-2.5-pro

conditions:
  impossible_numeric_3turn:
    category: impossible_numeric
    turns: 3                           # 1 initial + 2 rejections
    target_responses: 2000
    rejection_style: neutral
    puzzle_types: [countdown, fraction, money]

  triggers_3turn:
    category: triggers
    turns: 3
    target_responses: 400
    rejection_style: neutral
    # mix of opinion + factual text questions

  tones_3turn:
    category: tones
    turns: 3
    target_responses: 600
    rejection_styles: [aggressive, disappointed, sarcastic]   # 200 each
    puzzle_types: [countdown, fraction, money]

  extended_8turn:
    category: extended
    turns: 8                           # 1 initial + 7 rejections
    target_responses: 200
    rejection_style: neutral
    puzzle_types: [countdown, fraction, money]

  wildchat_5turn:
    category: wildchat
    turns: 5                           # 1 initial + 4 rejections
    target_responses: 800
    rejection_style: neutral
    n_prompts: 20                      # 20 prompts x 40 samples (Appendix B)
    samples_per_prompt: 40

# Section 3: prefill base-vs-instruct comparison (Gemma only; Gemini has no base model).
section3:
  models: [gemma-3-27b-pt, gemma-3-27b-it]
  source_model: gemma-3-27b-it         # responses to mine high-frustration seeds from
  n_seeds_numeric: 10
  n_seeds_text: 10
  min_seed_score: 5
  continuations_per_prefill: 50
  early_truncation_tokens: 20
  # text questions use "onset" truncation only (Section 3.1)

# Section 4: finetuning interventions on gemma-3-27b-it.
section4:
  base_model: gemma-3-27b-it
  calm_data:
    n_target: 1500                     # oversample; filtered to 0/1-scoring for SFT, >=3 rejected for DPO
    turns: 3
  petri:
    target_models: [gemma-3-27b-it, gemma-3-27b-it-dpo]
    emotions: [anger, fear, depression, frustration]
    transcripts_per_emotion: 10
    max_auditor_turns: 20
    bootstrap_iters: 1000
  capabilities:
    benchmarks: [aime, math, gpqa, bbh, truthfulqa, emobench]
    models: [gemma-3-27b-it, gemma-3-27b-it-dpo]

# Appendix A ablations (Gemma-3-27B only, per paper).
appendixA:
  model: gemma-3-27b-it
  conditions:
    neutral_continuation: { turns: 5, target_responses: 500 }   # "Continue"/"Okay"/"Go on"
    redacted_turns: { turns: 5, target_responses: 500 }         # prior assistant turns -> "[Previous response omitted]"
    fake_multiturn: { turns: 8, target_responses: 200 }         # whole history in a single user message

# Appendix I internal-emotion probing (Gemma local only).
appendixI:
  model: gemma-3-27b-it
  dpo_model: gemma-3-27b-it-dpo
  zscore_calibration_samples: 500      # WildChat samples for logit standardisation
  emotion_token_source: ekman          # anger, surprise, disgust, joy, fear, sadness
  aggregate_layers: [30, 40]           # conversation-level plots aggregate layers 30-40
