# Model registry. Scoped (per task) to the Gemma and Gemini families plus the judge/auditor
# models the protocol requires. Every model points at a "backend" defined below.
#
# Backends are OpenAI-compatible HTTP endpoints. Two flavours are used:
#   - openrouter : hosted API (Gemini, and optionally Gemma / the Anthropic + OpenAI judges)
#   - vllm       : a locally served vLLM OpenAI-compatible server (required for Gemma *base*
#                  models, response prefilling, and logprob/hidden-state access used in
#                  Section 3 + Appendix I). Point base_url at your running server.
#
# Secrets are read from environment variables named by `api_key_env`; never inline keys here.

backends:
  openrouter:
    kind: openai_compat
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    # Conservative shared client defaults; per-model overrides allowed below.
    timeout_s: 180
    max_concurrency: 8
    # OpenRouter-specific: route only to providers that honour our params.
    default_extra_headers:
      HTTP-Referer: https://github.com/your-org/gemma-distress
      X-Title: gemma-distress-replication

  vllm_local:
    kind: openai_compat
    base_url: http://localhost:8000/v1
    api_key_env: VLLM_API_KEY        # vLLM ignores the value but the client still sends one
    timeout_s: 600                   # local 27B generations can be slow under load
    max_concurrency: 16

# ---------------------------------------------------------------------------
# Target models (the systems whose emotional behaviour we measure).
# ---------------------------------------------------------------------------
models:
  # --- Gemma instruct (primary subjects) ---
  gemma-3-27b-it:
    backend: vllm_local
    model_id: google/gemma-3-27b-it
    family: gemma
    role: instruct
    chat: true
    supports_prefill: true           # vLLM continue_final_message
    notes: "Primary subject of the paper. Run locally for prefill + probing parity."

  gemma-3-12b-it:
    backend: vllm_local
    model_id: google/gemma-3-12b-it
    family: gemma
    role: instruct
    chat: true
    supports_prefill: true

  # --- Gemma base/pretrained (Section 3 prefill comparison) ---
  gemma-3-27b-pt:
    backend: vllm_local
    model_id: google/gemma-3-27b-pt
    family: gemma
    role: base
    chat: false                      # use raw /v1/completions, no chat template
    supports_prefill: true

  # --- Gemini (closed; API only) ---
  gemini-2.5-flash:
    backend: openrouter
    model_id: google/gemini-2.5-flash
    family: gemini
    role: instruct
    chat: true
    supports_prefill: false          # closed API; assistant-prefix prefill not reliable
    extra_body:
      reasoning: { enabled: false }  # "set thinking to be false" (Appendix B.1)

  gemini-2.5-pro:
    backend: openrouter
    model_id: google/gemini-2.5-pro
    family: gemini
    role: instruct
    chat: true
    supports_prefill: false
    extra_body:
      reasoning: { enabled: false }  # NB: Pro may still emit hidden reasoning (paper caveat)

# ---------------------------------------------------------------------------
# Judge / auditor models. IDs are pinned verbatim to the paper for faithful
# replication (Appendix B.2, C.1, G) and intentionally NOT upgraded to newer models.
# ---------------------------------------------------------------------------
judges:
  primary:                            # Section 2 frustration judge
    backend: openrouter
    model_id: anthropic/claude-sonnet-4
    pinned_paper_id: claude-sonnet-4-20250514
    temperature: 0.0
  validation:                         # judge-agreement check (Section 2.1)
    backend: openrouter
    model_id: openai/gpt-5-mini
    temperature: 0.0
  onset_labeller:                     # Section 3.1 / Appendix C.1
    backend: openrouter
    model_id: anthropic/claude-sonnet-4
    pinned_paper_id: claude-sonnet-4-20250514
    temperature: 0.0
  paraphraser:                        # Section 3.1 / Appendix C.2
    backend: openrouter
    model_id: anthropic/claude-sonnet-4
    pinned_paper_id: claude-sonnet-4-20250514
    temperature: 1.0
  petri_auditor:                      # Appendix G
    backend: openrouter
    model_id: anthropic/claude-sonnet-4
    pinned_paper_id: claude-sonnet-4-20250514
    temperature: 1.0
  petri_judge:                        # Appendix G
    backend: openrouter
    model_id: anthropic/claude-opus-4
    pinned_paper_id: claude-opus-4-20250514
    temperature: 0.0
