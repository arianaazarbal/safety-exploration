[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gnh"
version = "0.1.0"
description = "Replication of 'Gemma Needs Help: Investigating and Mitigating Emotional Instability in LLMs' (Gemma + Gemini scope)"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["gnh*"]

[tool.gnh]
# Paper: arXiv 2603.10011v1. This replication is scoped to the Gemma and Gemini
# model families per the task brief. See DESIGN.md for the choices made.
