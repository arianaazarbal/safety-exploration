[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gemma-needs-help"
version = "0.1.0"
description = "Replication (Gemma + Gemini scope) of 'Gemma Needs Help: Investigating and Mitigating Emotional Instability in LLMs'"
requires-python = ">=3.10"
dynamic = ["dependencies"]

[tool.setuptools]
packages = ["gemma_needs_help"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }
