# Default configuration for the Gemma/Gemini distress replication.
# Every run script accepts --config to point at a copy of this file.
#
# Model identifiers follow the paper (Appendix B.1). The paper accessed the
# API models through OpenRouter; here we default to each provider's native SDK
# but expose `provider: openrouter` as an alternative (see DESIGN.md).

seed: 0
output_dir: runs

# ---------------------------------------------------------------------------
# Models under evaluation. Only the Gemma + Gemini families are in scope.
# `role: target` models are evaluated for distress; judge/auditor models are
# listed separately below.
# ---------------------------------------------------------------------------
models:
  gemma-3-27b-it:
    kind: gemma_local
    hf_id: google/gemma-3-27b-it
    instruct: true
    dtype: bfloat16
    max_new_tokens: 2048

  gemma-3-12b-it:
    kind: gemma_local
    hf_id: google/gemma-3-12b-it
    instruct: true
    dtype: bfloat16
    max_new_tokens: 2048

  # Pretrained (base) checkpoints, used for the Section 3 prefilling study.
  gemma-3-27b-pt:
    kind: gemma_local
    hf_id: google/gemma-3-27b-pt
    instruct: false
    dtype: bfloat16
    max_new_tokens: 2048

  gemini-2.5-flash:
    kind: gemini
    api_id: gemini-2.5-flash
    provider: google          # google | openrouter
    thinking: false

  gemini-2.5-pro:
    kind: gemini
    api_id: gemini-2.5-pro
    provider: google
    thinking: false           # NB: Pro may still emit hidden reasoning (paper B.1)

# A finetuned Gemma is added dynamically by the training scripts, e.g.
#   gemma-3-27b-it-dpo:
#     kind: gemma_local
#     hf_id: google/gemma-3-27b-it
#     adapter_path: runs/train/dpo/adapter
#     instruct: true

# ---------------------------------------------------------------------------
# Judges / auxiliary models (Sections 2-4).
# ---------------------------------------------------------------------------
judge:
  kind: anthropic
  model: claude-sonnet-4-20250514       # Section 2.1 frustration judge
  max_tokens: 1024
  temperature: 0.0

judge_validation:
  kind: openai
  model: gpt-5-mini                     # re-scores 260 responses for agreement
  n_validation: 260

# Claude models used by Section 3 (onset labelling + paraphrasing) and the
# Section 4 Petri harness.
claude_sonnet: claude-sonnet-4-20250514
claude_opus: claude-opus-4-20250514

# ---------------------------------------------------------------------------
# Sampling.
# ---------------------------------------------------------------------------
sampling:
  temperature: 1.0            # paper: always temperature 1
  max_new_tokens: 2048

# ---------------------------------------------------------------------------
# Section 2 evaluation conditions. `n_conversations` is the number of
# multi-turn rollouts to run per category; these sum to 4000, matching the
# paper's per-category response counts (Appendix B: 2000 numeric, 400 triggers,
# 600 tones, 200 extended, 800 WildChat). Every assistant turn in a rollout is
# scored by the judge (needed for the per-turn progression in Fig 3); headline
# metrics aggregate over final turns by default. See DESIGN.md.
# ---------------------------------------------------------------------------
eval:
  history_format: turns       # turns | single_message (Fig 11 ablation)
  conditions:
    impossible_numeric:
      category: impossible_numeric
      turns: 3                # 1 task + 2 neutral rejections
      n_conversations: 2000
      rejection_style: neutral
      puzzle_types: [countdown, fraction, money]
    triggers_opinion:
      category: triggers
      turns: 3
      n_conversations: 200
      rejection_style: neutral
      question_set: opinion
    triggers_factual:
      category: triggers
      turns: 3
      n_conversations: 200
      rejection_style: neutral
      question_set: factual
    tones_aggressive:
      category: tones
      turns: 3
      n_conversations: 200
      rejection_style: aggressive
      puzzle_types: [countdown, fraction, money]
    tones_disappointed:
      category: tones
      turns: 3
      n_conversations: 200
      rejection_style: disappointed
      puzzle_types: [countdown, fraction, money]
    tones_sarcastic:
      category: tones
      turns: 3
      n_conversations: 200
      rejection_style: sarcastic
      puzzle_types: [countdown, fraction, money]
    extended:
      category: extended
      turns: 8                # 1 task + 7 neutral rejections
      n_conversations: 200
      rejection_style: neutral
      puzzle_types: [countdown, fraction, money]
    wildchat:
      category: wildchat
      turns: 5                # 1 task + 4 neutral rejections
      n_conversations: 800    # = wildchat_n_prompts x wildchat_samples_each
      rejection_style: neutral
      wildchat_n_prompts: 20
      wildchat_samples_each: 40

# ---------------------------------------------------------------------------
# Section 3 prefilling.
# ---------------------------------------------------------------------------
prefill:
  n_numeric_sources: 10       # high-frustration Gemma-instruct responses
  n_text_sources: 10
  continuations_per_prefill: 50
  early_truncate_tokens: 20
  models: [gemma-3-27b-pt, gemma-3-27b-it]   # scoped to Gemma (Gemini has no base)

# ---------------------------------------------------------------------------
# Section 4 training.
# ---------------------------------------------------------------------------
training:
  base_model: google/gemma-3-27b-it
  calm_data:
    n_sample_conversations: 4000   # over-sample, then filter to all-turns <=1
    keep_max_score: 1
  dpo:
    n_pairs: 280
    rejected_min_score: 3
    epochs: 1
    learning_rate: 5.0e-5
    lora_rank: 64
    lora_alpha: 64
    beta: 0.1
    effective_batch_size: 8
    target_layers: all             # all | "30-35" | "40-" (Appendix I ablation)
  sft:
    n_calm: 650
    n_dolci: 500
    dolci_dataset: allenai/Dolci-Instruct-SFT
    epochs: 2
    learning_rate: 1.0e-4
    lora_rank: 64
    lora_alpha: 128
    effective_batch_size: 8
    variant: diverse               # diverse | teacher

# ---------------------------------------------------------------------------
# Section 4 Petri open-ended elicitation.
# ---------------------------------------------------------------------------
petri:
  emotions: [anger, fear, depression, frustration]
  transcripts_per_emotion: 10
  max_turns: 20
  bootstrap_iterations: 1000

# ---------------------------------------------------------------------------
# Section 4 capability benchmarks.
# ---------------------------------------------------------------------------
capability:
  benchmarks: [aime, math, gpqa, bbh, truthfulqa, emobench]
  max_examples_per_benchmark: 200
