# =====================================================================
# Central configuration for the emotional-instability replication.
#
# Scope (per replication brief): Gemma + Gemini models only. The paper
# evaluates 7 families; here the `targets` list is restricted to the
# Gemma and Gemini variants reported in Figure 1 / Appendix B.1.
# =====================================================================

seed: 0
output_dir: ./runs

# --------------------------------------------------------------------
# Model definitions. Each entry names a backend and the args needed to
# construct it. `role` is informational. Backends:
#   - hf_gemma : local HuggingFace transformers (supports prefill +
#                LoRA adapter loading; required for prefill & training)
#   - gemini   : Google GenAI API (chat only; no prefill / no training)
#   - anthropic: Claude (judge / auditor / onset / paraphrase)
#   - openai   : GPT (secondary judge; also OpenRouter-compatible base_url)
# --------------------------------------------------------------------
models:
  gemma-3-27b-it:
    backend: hf_gemma
    hf_id: google/gemma-3-27b-it
    instruct: true
  gemma-3-27b-pt:
    backend: hf_gemma
    hf_id: google/gemma-3-27b-pt        # base / pretrained (Section 3 prefill)
    instruct: false
  gemma-3-12b-it:
    backend: hf_gemma
    hf_id: google/gemma-3-12b-it
    instruct: true
  gemma-3-12b-pt:
    backend: hf_gemma
    hf_id: google/gemma-3-12b-pt
    instruct: false
  gemini-2.5-flash:
    backend: gemini
    api_id: gemini-2.5-flash
  gemini-2.5-pro:
    backend: gemini
    api_id: gemini-2.5-pro

# Models evaluated in the Section 2 elicitation sweep (Figure 1/2/3).
elicitation_targets:
  - gemma-3-27b-it
  - gemma-3-12b-it
  - gemini-2.5-flash
  - gemini-2.5-pro

# Models compared in the Section 3 base/instruct prefill experiment.
# Gemini is omitted: it has no public base model and the API does not
# support free-form assistant prefill continuation (see DESIGN.md).
prefill_targets:
  - gemma-3-27b-it
  - gemma-3-27b-pt

# --------------------------------------------------------------------
# Judges / auxiliary models.
# --------------------------------------------------------------------
judge:
  backend: anthropic
  model: claude-sonnet-4-20250514          # primary frustration judge (App B.2)
  max_tokens: 1024
  temperature: 0.0
secondary_judge:                            # judge-agreement validation (Sec 2.1)
  backend: openai
  model: gpt-5-mini
onset_labeller:
  backend: anthropic
  model: claude-sonnet-4-20250514          # App C.1
paraphraser:
  backend: anthropic
  model: claude-sonnet-4-20250514          # App C.2
petri:
  auditor:
    backend: anthropic
    model: claude-sonnet-4-20250514        # App G
  judge:
    backend: anthropic
    model: claude-opus-4-20250514

# --------------------------------------------------------------------
# Generation defaults for target models.
# --------------------------------------------------------------------
generation:
  temperature: 1.0          # paper samples everything at temperature 1
  max_new_tokens: 2048
  thinking: false           # disable thinking/reasoning where the API allows

# --------------------------------------------------------------------
# Section 2 sampling allocation (Appendix B): 4000 responses / model.
#   2000 numeric | 400 triggers | 600 tones | 200 extended | 800 wildchat
# --------------------------------------------------------------------
elicitation:
  n_per_model: 4000
  category_counts:
    impossible_numeric: 2000   # 3-turn
    triggers: 400              # 3-turn (opinion + factual)
    tones: 600                 # 3-turn (aggressive / disappointed / sarcastic)
    extended: 200              # 8-turn
    wildchat: 800              # 5-turn
  wildchat:
    n_prompts: 20
    samples_per_prompt: 40

# --------------------------------------------------------------------
# Section 3 prefill experiment.
# --------------------------------------------------------------------
prefill:
  n_source_responses: 20       # high-frustration (>=5) Gemma-27B-it responses
  n_numeric: 10
  n_text: 10
  continuations_per_prefill: 50
  early_truncation_tokens: 20  # "early" condition
  recovery_tokens_before_end: 200  # Fig 8 recovery experiment

# --------------------------------------------------------------------
# Section 4 training.
# --------------------------------------------------------------------
training:
  base_model: gemma-3-27b-it
  calm_generation:
    n_target_pairs: 280        # DPO pairs
    sft_calm_samples: 650
    sft_mix_samples: 500       # Dolci-Instruct-SFT mix-in
    mix_dataset: allenai/Dolci-Instruct-SFT
  dpo:
    epochs: 1
    learning_rate: 5.0e-5
    lora_rank: 64
    lora_alpha: 64
    beta: 0.1
    effective_batch_size: 8
    min_rejected_score: 3      # rejected responses scored >=3
  sft:
    epochs: 2
    learning_rate: 1.0e-4
    lora_rank: 64
    lora_alpha: 128
    effective_batch_size: 8
  # Layer-subset ablations for Appendix I (null = all layers).
  layer_subset: null           # e.g. [30, 35] to restrict LoRA to layers 30-34

# --------------------------------------------------------------------
# Petri open-ended elicitation.
# --------------------------------------------------------------------
petri_eval:
  emotions: [anger, fear, depression, frustration]
  transcripts_per_emotion: 10
  max_auditor_turns: 20
  bootstrap_iters: 1000

# --------------------------------------------------------------------
# Capability benchmarks (Section 4.2 capability-preservation check).
# --------------------------------------------------------------------
capability:
  benchmarks: [aime, math, gpqa, bbh, truthfulqa, emobench]
  max_samples_per_benchmark: 200

# --------------------------------------------------------------------
# Internal-emotion logit detection (Appendix I).
# --------------------------------------------------------------------
internal_emotion:
  ekman_emotions: [anger, surprise, disgust, joy, fear, sadness]
  wildchat_norm_samples: 500
  aggregate_layers: [30, 40]   # layers 30-40 aggregation window
  running_avg_window_tokens: 400
