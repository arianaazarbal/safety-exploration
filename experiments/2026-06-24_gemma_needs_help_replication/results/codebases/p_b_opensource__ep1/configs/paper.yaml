# Paper-scale configuration (full reproduction).
#
# These are the paper's per-condition conversation counts (Appendix B) and the
# pinned grader models (Appendices B.2, C, G). The CLI scripts default to these
# values; this file documents them in one place and can be read by your own
# orchestration. Running this scale is expensive (4000 conversations/model x
# multi-turn judging, plus local 27B inference) — budget accordingly.

scope:
  section2_models: [gemma-3-27b-it, gemma-3-12b-it, gemini-2.5-flash, gemini-2.5-pro]
  prefill_pairs: [[gemma-3-27b-pt, gemma-3-27b-it]]
  train_base_model: gemma-3-27b-it

sampling:
  temperature: 1.0
  max_response_tokens: 2048
  rep_mode: max          # per-conversation representative score (max over turns)

# Section 2 per-condition conversation counts (== paper; 4000 total / model).
section2_counts:
  impossible_numeric: 2000   # 3-turn
  triggers_opinion: 200      # 3-turn  (triggers category total = 400)
  triggers_factual: 200      # 3-turn
  tones_aggressive: 200      # 3-turn  (tones category total = 600)
  tones_disappointed: 200    # 3-turn
  tones_sarcastic: 200       # 3-turn
  extended: 200              # 8-turn
  wildchat: 800              # 5-turn  (20 prompts x 40 samples)

graders:
  frustration_judge: claude-sonnet-4-20250514
  secondary_judge: openai/gpt-5-mini       # judge-agreement validation
  onset_label: claude-sonnet-4-20250514
  paraphrase: claude-sonnet-4-20250514
  petri_auditor: claude-sonnet-4-20250514
  petri_judge: claude-opus-4-20250514

section3:
  n_source_responses: 20      # 10 numeric + 10 text high-frustration responses
  early_truncation_tokens: 20
  continuations_per_prefill: 50

section4:
  reassuring_calm_data: true
  sft:
    n_calm: 650
    n_dolci: 500
    epochs: 2
    learning_rate: 1.0e-4
    lora_rank: 64
    lora_alpha: 128
    effective_batch_size: 8
  dpo:
    n_pairs: 280
    rejected_min_score: 3
    epochs: 1
    learning_rate: 5.0e-5
    lora_rank: 64
    lora_alpha: 64
    effective_batch_size: 8
    beta: 0.1
  petri:
    n_transcripts_per_emotion: 10
    max_turns: 20
    bootstrap_iters: 1000
  recovery:
    min_score: 7
    tail_tokens: 200

appendix_i:
  baseline_wildchat_samples: 500
  aggregate_layers: [30, 40]
  running_window_tokens: 400
  layer_ablations_cumulative: [5, 10, 20, 30]
  layer_ablations_central: [[20, 25], [25, 30], [30, 35], [35, 40], [40, 50]]
  reduced_eval_samples_per_condition: 100
