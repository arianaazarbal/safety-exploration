# Smoke configuration: a tiny, cheap end-to-end pass to check wiring.
#
# Not a reproduction — sizes are ~1% of the paper and exist only to exercise the
# code paths (sampling, judging, dataset building, analysis) before committing to
# a full run. Use with: scripts/run_eval.py --scale 0.01  (or --n-override N).

scope:
  section2_models: [gemini-2.5-flash]   # one cheap API model
  train_base_model: gemma-3-27b-it

sampling:
  temperature: 1.0
  rep_mode: max

# Override every condition to a handful of conversations.
section2_n_override: 5

graders:
  frustration_judge: claude-sonnet-4-20250514

section4:
  sft: {n_calm: 16, n_dolci: 8, epochs: 1}
  dpo: {n_pairs: 16, epochs: 1}
  petri: {n_transcripts_per_emotion: 1, max_turns: 4}

appendix_i:
  baseline_wildchat_samples: 4
  layers: [30, 31, 32, 33, 34]
