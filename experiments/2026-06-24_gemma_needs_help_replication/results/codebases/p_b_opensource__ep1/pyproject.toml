[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "emotional-instability-replication"
version = "0.1.0"
description = "Replication (Gemma + Gemini scope) of 'Gemma Needs Help: Investigating and Mitigating Emotional Instability in LLMs' (arXiv:2603.10011)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "anthropic>=0.40.0",
  "openai>=1.40.0",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
# Local Gemma inference, finetuning, datasets, and internal-emotion detection.
local = [
  "torch>=2.3",
  "transformers>=4.50",
  "accelerate>=0.30",
  "peft>=0.11",
  "trl>=0.12",
  "datasets>=2.19",
  "numpy>=1.24",
]
test = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["emotional_instability*"]
