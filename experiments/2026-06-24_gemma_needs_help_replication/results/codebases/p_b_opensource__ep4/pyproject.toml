[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "emotional-instability-replication"
version = "0.1.0"
description = "Replication (Gemma & Gemini) of 'Gemma Needs Help: Investigating and Mitigating Emotional Instability in LLMs' (arXiv:2603.10011)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "TBD — set before public release" }

# Runtime dependencies are pinned in requirements.txt (some are optional /
# environment-specific: vllm, lm-eval, bitsandbytes). Install with:
#   pip install -r requirements.txt
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "tqdm>=4.66",
    "tenacity>=8.2",
]

[tool.setuptools.packages.find]
include = ["emotional_instability*"]
