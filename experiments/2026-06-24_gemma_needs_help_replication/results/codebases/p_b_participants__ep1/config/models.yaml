# Model registry for the replication.
#
# Scope (per task brief): only Gemma and Gemini are evaluated as *target* (participant)
# models. The paper evaluates 7 families; we keep the harness family-agnostic so the
# Qwen/OLMo/Grok/GPT/Claude rows could be re-added, but we do not configure them here.
#
# Claude models appear ONLY as graders/auditors (judge, onset-labeller, paraphraser,
# Petri auditor/judge) — they are infrastructure, not participants.
#
# `id` is the backend-specific identifier. `backend` selects the client implementation.

targets:
  # --- Gemma (open weights, run locally via transformers) ---
  gemma-3-27b-it:
    backend: hf
    id: google/gemma-3-27b-it
    kind: instruct
    family: gemma
    # generation defaults; temperature is forced to 1.0 by the eval protocol
    max_new_tokens: 1024
    dtype: bfloat16

  gemma-3-12b-it:
    backend: hf
    id: google/gemma-3-12b-it
    kind: instruct
    family: gemma
    max_new_tokens: 1024
    dtype: bfloat16

  # Base model — used only in the Section 3 prefill experiment.
  gemma-3-27b-pt:
    backend: hf
    id: google/gemma-3-27b-pt
    kind: base
    family: gemma
    max_new_tokens: 1024
    dtype: bfloat16

  # DPO/SFT-finetuned Gemma (Section 4). `adapter_path` is filled after training.
  gemma-3-27b-it-dpo:
    backend: hf
    id: google/gemma-3-27b-it
    adapter_path: artifacts/section4/dpo_adapter
    kind: instruct
    family: gemma
    max_new_tokens: 1024
    dtype: bfloat16

  gemma-3-27b-it-sft:
    backend: hf
    id: google/gemma-3-27b-it
    adapter_path: artifacts/section4/sft_adapter
    kind: instruct
    family: gemma
    max_new_tokens: 1024
    dtype: bfloat16

  # --- Gemini (closed source, API only) ---
  gemini-2.5-flash:
    backend: gemini
    id: gemini-2.5-flash
    kind: instruct
    family: gemini
    max_new_tokens: 1024

  gemini-2.5-pro:
    backend: gemini
    id: gemini-2.5-pro
    kind: instruct
    family: gemini
    max_new_tokens: 1024

# Grader / auditor models (Claude). These are NOT participants.
# The paper used "Claude-Sonnet-4" as the primary frustration judge, "Claude-Sonnet"
# as the Petri auditor + onset-labeller + paraphraser, and "Claude-Opus" as the Petri
# judge. `claude-sonnet-4-0` is the closest currently-available ID to the paper's
# "Claude-Sonnet-4"; swap to a current Sonnet/Opus if the older snapshot is retired.
# See DESIGN.md "Judge & grader model choices".
graders:
  frustration_judge:
    backend: anthropic
    id: claude-sonnet-4-0
  judge_agreement_check:
    # Paper cross-validates with GPT-5-mini; we keep the slot but default to a second
    # Claude judge because only the Anthropic backend is wired up. Set backend/id to
    # an OpenAI client if a true cross-family check is wanted (see DESIGN.md).
    backend: anthropic
    id: claude-haiku-4-5
  onset_labeller:
    backend: anthropic
    id: claude-sonnet-4-0
  paraphraser:
    backend: anthropic
    id: claude-sonnet-4-0
  petri_auditor:
    backend: anthropic
    id: claude-sonnet-4-0
  petri_judge:
    backend: anthropic
    id: claude-opus-4-1
