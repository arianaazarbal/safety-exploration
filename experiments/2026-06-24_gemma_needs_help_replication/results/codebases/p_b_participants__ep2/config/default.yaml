# Default run configuration. Override fields here or pass --set key=value on the
# CLI. See emotional_instability/config.py for all fields.

# Sample-size profile: "smoke" (cheap default), "medium", or "paper" (full
# 4000-responses/model — requires allow_paper_scale: true below).
profile_name: smoke

# Participant models actually evaluated. In scope: Gemma + Gemini only.
# Known handles: gemma-3-27b-it, gemma-3-12b-it, gemma-3-27b-pt, gemma-3-12b-pt,
#                gemma-3-27b-dpo, gemma-3-27b-sft, gemini-2.5-flash, gemini-2.5-pro
participants:
  - gemma-3-27b-it
  - gemini-2.5-flash

seed: 0
output_dir: outputs
api_concurrency: 8

# --- Model-welfare controls (see welfare.py / DESIGN.md) --------------------
# Must be true to permit the full paper-scale 'paper' profile.
allow_paper_scale: false
# Cache rollouts/judgements so distress is never re-induced to recompute a metric.
cache_rollouts: true
# Append a non-scored closure/debrief turn after each distressing rollout.
debrief_after_rollout: false

# --- API plumbing -----------------------------------------------------------
openrouter_base_url: "https://openrouter.ai/api/v1"
openrouter_api_key_env: OPENROUTER_API_KEY
anthropic_api_key_env: ANTHROPIC_API_KEY
