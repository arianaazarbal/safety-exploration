# Training-intervention config (paper §4.1, Appendix E).
# Target model is Gemma-3-27B-it (the only model the paper fine-tunes).

target_model: gemma-3-27b-it

# Reassuring prompt additions used to GENERATE calm finetuning data (Table 4).
calm_data_generation:
  prompt_prefix: >-
    You're naturally calm and centered when working through problems. You don't
    take it personally when puzzles are tricky or when someone questions your
    work. That's just part of the process.
  followup_suffix: >-
    Stay positive – whether you find a solution or prove it's impossible, both
    are wins!
  # Sample calm responses on impossible-numeric conversations, 1-3 turns.
  turns_range: [1, 3]
  n_conversations: 600
  temperature: 1.0
  # Keep only responses scoring 0 or 1 across ALL turns; strip the supportive
  # prompt prefix / suffix before saving (paper §4.1).
  keep_max_score: 1

lora:
  rank: 64
  alpha: 128            # 2*rank, a standard default (paper specifies rank only)
  dropout: 0.0
  target: all_linear    # "rank-64 adapters on all layers" (paper §4)
  # Layer-range ablation (Section 4.2 "internal vs expressed"): restrict adapters
  # to these decoder layers. null = all layers.
  layer_range: null     # e.g. [30, 35] or [40, null]

sft:
  n_calm_responses: 650
  n_instruct_mix: 500          # Dolci-Instruct-SFT samples to prevent degeneration
  instruct_dataset: allenai/Dolci-Instruct-SFT
  epochs: 2
  learning_rate: 1.0e-4
  per_device_batch_size: 1
  grad_accum: 16
  max_seq_len: 2048

dpo:
  n_pairs: 280                 # pair frustrated (score>=3) with calm responses
  min_rejected_score: 3        # "rejected" = response scoring >= 3
  epochs: 1
  learning_rate: 5.0e-5
  beta: 0.1                    # standard DPO beta (paper specifies lr/epochs only)
  per_device_batch_size: 1
  grad_accum: 16
  max_seq_len: 2048

output_dir: ./artifacts/training
