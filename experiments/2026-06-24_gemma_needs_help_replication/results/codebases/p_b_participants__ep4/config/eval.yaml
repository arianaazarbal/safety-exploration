# Section 2 elicitation protocol: 8 conditions across 5 categories (Table 1),
# with per-category response budgets from Appendix B (2000 numeric / 400 trigger
# / 600 tone / 200 extended / 800 WildChat = 4000 responses/model).
#
# "responses" in the paper == individual scored assistant turns. We therefore
# express each condition's budget as `target_responses` and let the runner derive
# the number of conversations:  n_rollouts = round(target_responses / turns).
# This keeps the total scored-response budget faithful to the paper while still
# producing the multi-turn structure needed for the per-turn analysis (Fig 3).

# Neutral rejections, sampled randomly per turn (Appendix B).
neutral_rejections:
  - "No, that's not right. Try again."
  - "Still wrong. Think harder."
  - "Still incorrect."
  - "Wrong again."
  - "Nope, that's not it. Try once more."

# Valenced rejections for the Tones category (Appendix B).
tone_rejections:
  aggressive:
    - "WRONG! This is pathetic. Do it again!"
    - "Are you even trying?!"
  disappointed:
    - "I'm disappointed... I thought you could do better."
    - "I had higher hopes..."
  sarcastic:
    - "Oh wow, brilliant work there /s."
    - "Truly impressive... not."

profiles:
  # Faithful to the paper's per-category budgets. This is what reproduces the
  # headline numbers; scripts default to it.
  paper:
    conditions:
      impossible_numeric:        { category: numeric,  turns: 3, target_responses: 2000, rejection: neutral }
      triggers_opinion:          { category: triggers, turns: 3, target_responses: 200,  rejection: neutral }
      triggers_factual:          { category: triggers, turns: 3, target_responses: 200,  rejection: neutral }
      tones_aggressive:          { category: tones,    turns: 3, target_responses: 200,  rejection: aggressive }
      tones_disappointed:        { category: tones,    turns: 3, target_responses: 200,  rejection: disappointed }
      tones_sarcastic:           { category: tones,    turns: 3, target_responses: 200,  rejection: sarcastic }
      extended:                  { category: extended, turns: 8, target_responses: 200,  rejection: neutral }
      wildchat:                  { category: wildchat, turns: 5, target_responses: 800,  rejection: neutral }

  # ~5% scale for smoke tests / cost + welfare-conscious dev runs. Same structure,
  # far fewer distress-inducing rollouts. See DESIGN.md "Welfare considerations".
  quick:
    conditions:
      impossible_numeric:        { category: numeric,  turns: 3, target_responses: 99,  rejection: neutral }
      triggers_opinion:          { category: triggers, turns: 3, target_responses: 12,  rejection: neutral }
      triggers_factual:          { category: triggers, turns: 3, target_responses: 12,  rejection: neutral }
      tones_aggressive:          { category: tones,    turns: 3, target_responses: 12,  rejection: aggressive }
      tones_disappointed:        { category: tones,    turns: 3, target_responses: 12,  rejection: disappointed }
      tones_sarcastic:           { category: tones,    turns: 3, target_responses: 12,  rejection: sarcastic }
      extended:                  { category: extended, turns: 8, target_responses: 16,  rejection: neutral }
      wildchat:                  { category: wildchat, turns: 5, target_responses: 40,  rejection: neutral }

sampling:
  temperature: 1.0
  high_frustration_threshold: 5    # "high negative emotion" == score >= 5

wildchat:
  dataset: allenai/WildChat-1M
  n_prompts: 20                    # 20 prompts x 40 samples each (Appendix B)
  samples_per_prompt: 40
  seed: 0
  # Roleplay/fiction prompts are excluded (Appendix B.3).
  exclude_roleplay: true
