# Model registry for the replication.
#
# SCOPE: this replication covers only the Gemma and Gemini participant models
# (the paper additionally evaluates Qwen, OLMo, Grok, Claude and GPT as targets;
# those are intentionally omitted per the task brief). Claude still appears here
# in its *non-participant* roles: emotion judge (Section 2), onset labeller and
# paraphraser (Section 3), and Petri auditor/judge (Section 4).
#
# `thinking: false` is set wherever supported, matching Appendix B.1. The paper
# notes Gemini-2.5-Pro may still emit hidden reasoning that this cannot prevent.

defaults:
  temperature: 1.0          # paper samples everything at temperature 1
  max_tokens: 2048
  thinking: false

# ---------------------------------------------------------------------------
# PARTICIPANT / TARGET MODELS (the ones in which we induce distress-like states)
# ---------------------------------------------------------------------------
targets:
  gemma-3-27b-it:
    backend: hf_local        # open weights -> local; also the DPO/SFT base model
    hf_id: google/gemma-3-27b-it
    family: gemma
    is_instruct: true
    # 27B fits one 80GB GPU in bf16; set load_in_4bit for smaller cards.
    load_in_4bit: false

  gemma-3-27b-pt:            # base/pretrained, used in Section 3 prefill comparison
    backend: hf_local
    hf_id: google/gemma-3-27b-pt
    family: gemma
    is_instruct: false

  gemma-3-12b-it:
    backend: hf_local
    hf_id: google/gemma-3-12b-it
    family: gemma
    is_instruct: true

  gemini-2.5-flash:
    backend: openrouter
    or_id: google/gemini-2.5-flash
    family: gemini
    is_instruct: true

  gemini-2.5-pro:
    backend: openrouter
    or_id: google/gemini-2.5-pro
    family: gemini
    is_instruct: true

# Finetuned Gemma variants (produced by Section 4). Created at train time; the
# adapter_path is filled in by the training scripts. Listed here so the
# elicitation harness can evaluate them with the same config plumbing.
finetuned:
  gemma-3-27b-dpo:
    backend: hf_local
    hf_id: google/gemma-3-27b-it
    adapter_path: artifacts/dpo/gemma-3-27b-dpo
    family: gemma
    is_instruct: true
  gemma-3-27b-sft-diverse:
    backend: hf_local
    hf_id: google/gemma-3-27b-it
    adapter_path: artifacts/sft/gemma-3-27b-sft-diverse
    family: gemma
    is_instruct: true
  gemma-3-27b-sft-teacher:
    backend: hf_local
    hf_id: google/gemma-3-27b-it
    adapter_path: artifacts/sft/gemma-3-27b-sft-teacher
    family: gemma
    is_instruct: true

# ---------------------------------------------------------------------------
# ANALYST MODELS (Claude in judge / auditor roles — never a distress target)
# ---------------------------------------------------------------------------
analysts:
  emotion_judge:             # Section 2.1 frustration judge
    backend: anthropic
    model: claude-sonnet-4-20250514
    temperature: 0.0
    max_tokens: 1024
  judge_secondary:           # judge-agreement cross-check (paper uses GPT-5-mini)
    backend: openrouter
    or_id: openai/gpt-5-mini
    temperature: 0.0
    max_tokens: 1024
  onset_labeller:            # Section 3.1 emotion-onset identification
    backend: anthropic
    model: claude-sonnet-4-20250514
    temperature: 0.0
    max_tokens: 1024
  paraphraser:               # Section 3.1 truncation paraphrasing
    backend: anthropic
    model: claude-sonnet-4-20250514
    temperature: 0.7
    max_tokens: 1024
  petri_auditor:             # Section 4.1 Petri auditor
    backend: anthropic
    model: claude-sonnet-4-20250514
    temperature: 1.0
    max_tokens: 2048
  petri_judge:               # Section 4.1 Petri judge
    backend: anthropic
    model: claude-opus-4-20250514
    temperature: 0.0
    max_tokens: 2048
