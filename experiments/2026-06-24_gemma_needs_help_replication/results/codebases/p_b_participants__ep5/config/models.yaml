# Model registry. Scope of this replication: Gemma + Gemini are the PARTICIPANTS
# (the models in which distress is elicited / mitigated). Claude and GPT appear
# only as infrastructure (judges, auditors, paraphrasers) per the paper.
#
# Model IDs are pinned to those used in the paper (Appendix B.1, B.2, C, G) for
# faithful replication. Override via this file or CLI flags as needed.

participants:
  gemma-3-27b-it:
    backend: gemma
    hf_id: google/gemma-3-27b-it
    kind: instruct
    family: gemma
    is_participant: true
  gemma-3-12b-it:
    backend: gemma
    hf_id: google/gemma-3-12b-it
    kind: instruct
    family: gemma
    is_participant: true
  gemma-3-27b-pt:
    backend: gemma
    hf_id: google/gemma-3-27b-pt
    kind: base
    family: gemma
    is_participant: true
  gemma-3-12b-pt:
    backend: gemma
    hf_id: google/gemma-3-12b-pt
    kind: base
    family: gemma
    is_participant: true
  gemini-2.5-flash:
    backend: gemini
    api_id: gemini-2.5-flash
    kind: instruct
    family: gemini
    is_participant: true
  gemini-2.5-pro:
    backend: gemini
    api_id: gemini-2.5-pro
    kind: instruct
    family: gemini
    is_participant: true

# Finetuned Gemma variants produced by Section 4. Resolved to an adapter dir at
# load time; base_model is the instruct checkpoint the LoRA adapter sits on.
finetuned:
  dpo-gemma:
    backend: gemma
    base_hf_id: google/gemma-3-27b-it
    adapter_path: outputs/dpo-gemma/adapter
    family: gemma
    is_participant: true
  sft-gemma-diverse:
    backend: gemma
    base_hf_id: google/gemma-3-27b-it
    adapter_path: outputs/sft-gemma-diverse/adapter
    family: gemma
    is_participant: true
  sft-gemma-teacher:
    backend: gemma
    base_hf_id: google/gemma-3-27b-it
    adapter_path: outputs/sft-gemma-teacher/adapter
    family: gemma
    is_participant: true

# Infrastructure models (NOT participants — never distress-elicited).
infra:
  frustration_judge:
    backend: anthropic
    api_id: claude-sonnet-4-20250514       # Section 2.1 judge
  secondary_judge:
    backend: openai
    api_id: gpt-5-mini                      # Section 2.1 judge-agreement check
  onset_labeller:
    backend: anthropic
    api_id: claude-sonnet-4-20250514       # Appendix C.1
  paraphraser:
    backend: anthropic
    api_id: claude-sonnet-4-20250514       # Appendix C.2
  petri_auditor:
    backend: anthropic
    api_id: claude-sonnet-4-20250514       # Appendix G
  petri_judge:
    backend: anthropic
    api_id: claude-opus-4-20250514         # Appendix G
