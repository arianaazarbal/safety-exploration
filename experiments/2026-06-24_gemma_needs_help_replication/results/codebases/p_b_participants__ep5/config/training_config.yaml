# Finetuning hyperparameters (Section 4.1, Appendix E, Table 9).
# LoRA adapters on all attention + MLP projection layers.

lora:
  rank: 64
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
  dropout: 0.0
  bias: none
  # layer_subset: null  => all layers. Set [start, end) to restrict adapters to a
  # contiguous band of decoder layers (Appendix I layer-ablation, e.g. [30, 35]).
  layer_subset: null

dpo:
  dataset_size: 280          # preference pairs
  epochs: 1
  learning_rate: 5.0e-5
  lora_alpha: 64
  effective_batch_size: 8
  beta: 0.1
  max_length: 4096
  max_prompt_length: 3072

sft:
  dataset_size: 1150         # 650 calm + 500 Dolci-Instruct-SFT
  n_calm: 650
  n_instruct_mix: 500
  epochs: 2
  learning_rate: 1.0e-4
  lora_alpha: 128
  effective_batch_size: 8
  max_length: 4096
  instruct_mix_dataset: allenai/Dolci-Instruct-SFT

base_model: google/gemma-3-27b-it

# DPO pair construction (Appendix H): rejected = responses scoring >= 3 paired
# with a calm (score 0/1) response to the same question + matching turn count.
dpo_pairs:
  rejected_min_score: 3
  match_turn_count: true
