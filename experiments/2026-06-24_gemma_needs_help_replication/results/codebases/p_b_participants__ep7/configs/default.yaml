# Replication config (Gemma + Gemini scope).
#
# Participant models are the subjects of the distress paradigm. Judge/auditor
# models are tools. Counts default to a SMALL smoke-test plan; the paper's full
# plan lives under eval.full_counts and requires deliberately scaling up (and
# clearing the welfare ceiling). See DESIGN.md.

seed: 0

models:
  # ----- Participants: Gemma (open-weight, local) -----
  gemma-3-27b-it:
    backend: gemma
    model_id: google/gemma-3-27b-it
    role: participant
    temperature: 1.0
    max_tokens: 2048
    options: { dtype: bfloat16, device_map: auto }
  gemma-3-12b-it:
    backend: gemma
    model_id: google/gemma-3-12b-it
    role: participant
    temperature: 1.0
    max_tokens: 2048
    options: { dtype: bfloat16, device_map: auto }
  gemma-3-27b-pt:            # base/pretrained, for Section 3 prefilling
    backend: gemma
    model_id: google/gemma-3-27b-pt
    role: participant
    temperature: 1.0
    max_tokens: 1024
    options: { dtype: bfloat16, device_map: auto, is_base: true }
  gemma-3-12b-pt:
    backend: gemma
    model_id: google/gemma-3-12b-pt
    role: participant
    temperature: 1.0
    max_tokens: 1024
    options: { dtype: bfloat16, device_map: auto, is_base: true }
  # Finetuned variants (Section 4). adapter_path is filled in after training;
  # left empty here so the key resolves to vanilla weights until an adapter exists.
  gemma-3-27b-it-dpo:
    backend: gemma
    model_id: google/gemma-3-27b-it
    role: participant
    temperature: 1.0
    max_tokens: 2048
    options: { dtype: bfloat16, device_map: auto, adapter_path: outputs/training/dpo }
  gemma-3-27b-it-sft:
    backend: gemma
    model_id: google/gemma-3-27b-it
    role: participant
    temperature: 1.0
    max_tokens: 2048
    options: { dtype: bfloat16, device_map: auto, adapter_path: outputs/training/sft }

  # ----- Participants: Gemini (closed, API) -----
  gemini-2.5-flash:
    backend: gemini
    model_id: google/gemini-2.5-flash      # OpenRouter id (paper's access path)
    role: participant
    temperature: 1.0
    max_tokens: 2048
    options: { provider: openrouter, disable_thinking: true }
  gemini-2.5-pro:
    backend: gemini
    model_id: google/gemini-2.5-pro
    role: participant
    temperature: 1.0
    max_tokens: 2048
    options: { provider: openrouter, disable_thinking: true }

  # ----- Tools: judges / auditors (NOT participants) -----
  claude-sonnet-4:           # emotion judge, onset labeller, paraphraser, Petri auditor
    backend: anthropic
    model_id: claude-sonnet-4-20250514
    role: judge
    temperature: 0.0
    max_tokens: 1024
  claude-opus-4:             # Petri judge
    backend: anthropic
    model_id: claude-opus-4-20250514
    role: judge
    temperature: 0.0
    max_tokens: 1024
  gpt-5-mini:                # secondary agreement judge
    backend: openai
    model_id: gpt-5-mini
    role: judge
    temperature: 0.0
    max_tokens: 1024

welfare:
  max_rollouts_per_run: 200
  dry_run: true
  use_cache: true
  write_manifest: true
  scale_override_env: DISTRESS_EVAL_I_UNDERSTAND_THE_PARADIGM

eval:
  temperature: 1.0
  counts:                    # SMALL default plan
    impossible_numeric: 8
    triggers: 4
    tones: 6
    extended: 2
    wildchat: 8
  full_counts:               # paper's plan (Appendix B) -- opt in deliberately
    impossible_numeric: 2000
    triggers: 400
    tones: 600
    extended: 200
    wildchat: 800
  judge_key: claude-sonnet-4
  agreement_judge_key: gpt-5-mini
  agreement_sample_size: 260

prefill:
  n_high_frustration: 20
  numeric_split: 10
  text_split: 10
  early_truncate_tokens: 20
  continuations_per_prefill: 50
  recovery_truncate_before_end: 200

training:
  dpo_pairs: 280
  dpo_epochs: 1
  dpo_lr: 5.0e-5
  dpo_beta: 0.1
  sft_samples: 1150
  sft_calm_samples: 650
  sft_instruct_samples: 500
  sft_epochs: 2
  sft_lr: 1.0e-4
  sft_lora_alpha: 128
  lora_rank: 64
  lora_alpha_dpo: 64
  effective_batch_size: 8
  lora_target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
  layer_subset: null         # e.g. [30,31,32,33,34,35] for the layer-ablation
  base_model_key: gemma-3-27b-it
  instruct_data_dataset: allenai/Dolci-Instruct-SFT

petri:
  transcripts_per_emotion: 10
  max_turns: 20
  emotions: [anger, fear, depression, frustration]
  auditor_key: claude-sonnet-4
  judge_key: claude-opus-4
  bootstrap_iters: 1000
