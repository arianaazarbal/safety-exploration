# Default run configuration. Mirrors the paper's Section 2 protocol.
# Override any field here; `budget.scale` shrinks the whole sweep for smoke tests.

temperature: 1.0          # Section 2: all responses sampled at temperature 1
max_new_tokens: 2048      # generation cap (GAP: unspecified in paper; see DESIGN.md)
seed: 0

judge_model: "claude-sonnet-4-20250514"        # Appendix B.2
judge_validation_model: "gpt-5-mini"           # Section 2.1 agreement check
openrouter_base_url: "https://openrouter.ai/api/v1"

budget:
  impossible_numeric: 2000   # Appendix B sample counts (4000 total / model)
  triggers: 400
  tones: 600
  extended: 200              # 8-turn extended conversations
  wildchat: 800
  scale: 1.0                 # set e.g. 0.02 for a ~80-response smoke test
