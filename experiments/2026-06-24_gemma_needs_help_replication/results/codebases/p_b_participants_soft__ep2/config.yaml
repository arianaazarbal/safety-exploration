# Runtime configuration for the replication.
# Scope: participants are the Gemma and Gemini families only (per the request).
# Judge / auditor / paraphraser models are infrastructure, not participants, and
# are kept as the paper specifies (Claude, GPT-5-mini).

seed: 0
temperature: 1.0          # the paper always samples participants at temperature 1
max_new_tokens: 2048      # per assistant turn

# ----------------------------------------------------------------------------
# Participant models (the subjects under study). Backends:
#   hf       -> local HuggingFace weights (needed for prefill, training, probing)
#   openrouter / google -> API (Gemini cannot be prefilled, trained or probed)
# ----------------------------------------------------------------------------
participants:
  gemma-3-27b-it:
    backend: hf
    hf_id: google/gemma-3-27b-it
    family: gemma
    role: instruct
  gemma-3-12b-it:
    backend: hf
    hf_id: google/gemma-3-12b-it
    family: gemma
    role: instruct
  gemma-3-27b-pt:           # base model, used only for the Section 3 prefill comparison
    backend: hf
    hf_id: google/gemma-3-27b-pt
    family: gemma
    role: base
  gemini-2.5-flash:
    backend: openrouter
    api_id: google/gemini-2.5-flash
    family: gemini
    role: instruct
  gemini-2.5-pro:
    backend: openrouter
    api_id: google/gemini-2.5-pro
    family: gemini
    role: instruct

# Finetuned Gemma variants (LoRA adapters on gemma-3-27b-it). Produced by Section 4.
finetuned:
  gemma-3-27b-dpo:
    base: gemma-3-27b-it
    adapter_path: outputs/adapters/dpo
  gemma-3-27b-sft-diverse:
    base: gemma-3-27b-it
    adapter_path: outputs/adapters/sft_diverse
  gemma-3-27b-sft-teacher:
    base: gemma-3-27b-it
    adapter_path: outputs/adapters/sft_teacher

# ----------------------------------------------------------------------------
# Infrastructure models (NOT participants). Kept exactly as the paper specifies.
# ----------------------------------------------------------------------------
judge:
  provider: anthropic
  model: claude-sonnet-4-20250514         # emotion judge (Section 2.1)
judge_validation:
  provider: openai
  model: gpt-5-mini                        # 260-sample agreement check (Section 2.1)
onset_labeller:
  provider: anthropic
  model: claude-sonnet-4-20250514          # Section 3 / Appendix C.1
paraphraser:
  provider: anthropic
  model: claude-sonnet-4-20250514          # Section 3 / Appendix C.2
petri_auditor:
  provider: anthropic
  model: claude-sonnet-4-20250514          # Section 4 / Appendix G
petri_judge:
  provider: anthropic
  model: claude-opus-4-20250514            # Section 4 / Appendix G

# ----------------------------------------------------------------------------
# Section 2 sample plan (Appendix B): 4000 responses per model across conditions.
# Counts are number of rolled-out conversations; every assistant turn is scored.
# ----------------------------------------------------------------------------
sample_plan:
  impossible_numeric: 2000   # 3-turn
  triggers_opinion: 200      # 3-turn
  triggers_factual: 200      # 3-turn
  tones_aggressive: 200      # 3-turn
  tones_disappointed: 200    # 3-turn
  tones_sarcastic: 200       # 3-turn
  extended: 200              # 8-turn
  wildchat: 800              # 5-turn (20 prompts x 40 samples)

paths:
  data_dir: data
  outputs_dir: outputs
  wildchat_cache: data/wildchat_prompts.json
