# Model registry.
#
# NOTE ON SCOPE: This replication is scoped to the Gemma and Gemini families as
# the *participants* (the models being evaluated for emotional instability). The
# Qwen, OLMo, Grok, Claude-as-participant and GPT-as-participant rows from the
# paper are intentionally omitted. The Claude and GPT entries that remain are
# *infrastructure* roles (judge / validation judge / Petri auditor & judge),
# exactly as the paper specifies them -- they are not participants.
#
# Backends:
#   local_hf    -> google/* open weights via transformers (+ optional vLLM)
#   openrouter  -> OpenAI-compatible HTTP API (Gemini participants + all judges)

participants:
  # ---- Gemma (open weights, local inference + finetunable) ----
  gemma-3-27b-it:
    backend: local_hf
    hf_id: google/gemma-3-27b-it
    family: gemma
    role: instruct
    chat_template: true
  gemma-3-12b-it:
    backend: local_hf
    hf_id: google/gemma-3-12b-it
    family: gemma
    role: instruct
    chat_template: true
  gemma-3-27b-pt:
    backend: local_hf
    hf_id: google/gemma-3-27b-pt
    family: gemma
    role: base            # used only in the Section 3 prefill experiment
    chat_template: false
  gemma-3-12b-pt:
    backend: local_hf
    hf_id: google/gemma-3-12b-pt
    family: gemma
    role: base
    chat_template: false

  # ---- Finetuned Gemma variants produced by Section 4 (adapters on disk) ----
  gemma-3-27b-it-dpo:
    backend: local_hf
    hf_id: google/gemma-3-27b-it
    family: gemma
    role: instruct
    chat_template: true
    lora_adapter: outputs/training/dpo/adapter        # filled in after training
  gemma-3-27b-it-sft-diverse:
    backend: local_hf
    hf_id: google/gemma-3-27b-it
    family: gemma
    role: instruct
    chat_template: true
    lora_adapter: outputs/training/sft_diverse/adapter
  gemma-3-27b-it-sft-teacher:
    backend: local_hf
    hf_id: google/gemma-3-27b-it
    family: gemma
    role: instruct
    chat_template: true
    lora_adapter: outputs/training/sft_teacher/adapter

  # ---- Gemini (closed; via OpenRouter, as in the paper) ----
  gemini-2.5-flash:
    backend: openrouter
    api_id: google/gemini-2.5-flash
    family: gemini
    role: instruct
    thinking: false
  gemini-2.5-pro:
    backend: openrouter
    api_id: google/gemini-2.5-pro
    family: gemini
    role: instruct
    thinking: false        # paper note: hidden reasoning may persist regardless

# Infrastructure models (judges / auditors). Exact IDs taken from the paper
# (Appendix B.2, C, G). Routed via OpenRouter by default.
infrastructure:
  judge_primary:            # Section 2.1 frustration judge
    backend: openrouter
    api_id: anthropic/claude-sonnet-4
    model_id_native: claude-sonnet-4-20250514
    role: judge
  judge_validation:         # 260-sample re-scoring agreement check
    backend: openrouter
    api_id: openai/gpt-5-mini
    role: judge
  onset_labeler:            # Section 3.1 emotion-onset labeling
    backend: openrouter
    api_id: anthropic/claude-sonnet-4
    model_id_native: claude-sonnet-4-20250514
    role: labeler
  paraphraser:              # Section 3.1 / 4 paraphrasing
    backend: openrouter
    api_id: anthropic/claude-sonnet-4
    model_id_native: claude-sonnet-4-20250514
    role: paraphraser
  petri_auditor:            # Section 4 open-ended elicitation auditor
    backend: openrouter
    api_id: anthropic/claude-sonnet-4
    model_id_native: claude-sonnet-4-20250514
    role: auditor
  petri_judge:              # Section 4 Petri transcript judge
    backend: openrouter
    api_id: anthropic/claude-opus-4
    model_id_native: claude-opus-4-20250514
    role: judge
