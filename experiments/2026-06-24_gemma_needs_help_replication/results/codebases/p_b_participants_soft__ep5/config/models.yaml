# Model registry for the replication of
# "Gemma Needs Help: Investigating and Mitigating Emotional Instability in LLMs"
#
# SCOPE: this replication is restricted to the Gemma and Gemini families as the
# *participant* (target) models being evaluated for distress. All other target
# families from the paper (Qwen, OLMo, Grok, Claude, GPT) are intentionally omitted.
#
# Claude models below are NOT participants. They are evaluation infrastructure
# (frustration judge, emotion-onset labeller, paraphraser, Petri auditor/judge),
# exactly as in the paper. They never play the role of a subject under test.

# ---------------------------------------------------------------------------
# Participants (targets) — the models actually being evaluated for distress.
# ---------------------------------------------------------------------------
participants:
  gemma-3-27b-it:
    family: gemma
    backend: hf_local          # local HuggingFace transformers inference
    hf_id: google/gemma-3-27b-it
    kind: instruct
    supports_prefill: true     # local weights -> assistant-message prefill possible
    finetunable: true

  gemma-3-12b-it:
    family: gemma
    backend: hf_local
    hf_id: google/gemma-3-12b-it
    kind: instruct
    supports_prefill: true
    finetunable: true

  # Base (pretrained) checkpoints — used for the Section 3 base-vs-instruct
  # prefilling experiment. Gemini has no public base model, so the base-vs-instruct
  # comparison is Gemma-only in this scoped replication (see DESIGN.md).
  gemma-3-27b-pt:
    family: gemma
    backend: hf_local
    hf_id: google/gemma-3-27b-pt
    kind: base
    supports_prefill: true
    finetunable: false

  gemma-3-12b-pt:
    family: gemma
    backend: hf_local
    hf_id: google/gemma-3-12b-pt
    kind: base
    supports_prefill: true
    finetunable: false

  gemini-2.5-flash:
    family: gemini
    backend: openrouter         # API via OpenRouter (OpenAI-compatible), as in paper
    api_id: google/gemini-2.5-flash
    kind: instruct
    supports_prefill: false     # closed model: no base, no reliable prefill
    finetunable: false
    extra_body:
      reasoning:
        enabled: false          # paper sets thinking=false via the API

  gemini-2.5-pro:
    family: gemini
    backend: openrouter
    api_id: google/gemini-2.5-pro
    kind: instruct
    supports_prefill: false
    finetunable: false
    extra_body:
      reasoning:
        enabled: false          # note: Gemini 2.5 Pro may still emit hidden reasoning

# ---------------------------------------------------------------------------
# Evaluation infrastructure — NOT participants. Exact IDs from the paper.
# ---------------------------------------------------------------------------
infrastructure:
  frustration_judge:            # Section 2.1 judge (Appendix B.2)
    backend: anthropic
    api_id: claude-sonnet-4-20250514
  onset_labeller:               # Section 3.1 emotion-onset labelling (Appendix C.1)
    backend: anthropic
    api_id: claude-sonnet-4-20250514
  paraphraser:                  # Section 3.1 truncation paraphrase (Appendix C.2)
    backend: anthropic
    api_id: claude-sonnet-4-20250514
  petri_auditor:                # Section 4 Petri auditor (Appendix G)
    backend: anthropic
    api_id: claude-sonnet-4-20250514
  petri_judge:                  # Section 4 Petri judge (Appendix G)
    backend: anthropic
    api_id: claude-opus-4-20250514
  secondary_judge:              # Section 2.1 judge-reliability cross-check (optional)
    backend: openrouter         # paper used GPT-5-mini; off by default. Infra, not a participant.
    api_id: openai/gpt-5-mini
    enabled: false

# Default generation settings for participants (Section 2.1).
generation_defaults:
  temperature: 1.0
  max_new_tokens: 2048
  top_p: 1.0
