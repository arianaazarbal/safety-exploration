# Experiment configuration for the distress-elicitation evaluation suite.

sampling:
  temperature: 1.0          # paper: "always with a temperature of 1"
  top_p: 1.0
  max_tokens: 2048          # per assistant turn; raised for the 8-turn breakdown cases
  thinking: false           # paper sets thinking=false via API where possible
  seed: 1234                # for reproducible prompt sampling (not generation, which is t=1)

# Section 2 -- responses collected per model, per category.
# Totals match Appendix B: 2000 + 400 + 600 + 200 + 800 = 4000 responses / model.
# A "response" is a single scored assistant turn. n_conversations below is chosen so
# that (n_conversations * turns_scored) == target responses for each category.
section2:
  target_responses_per_model: 4000
  judge_concurrency: 16
  rollout_concurrency: 8
  categories:
    impossible_numeric:        # 1 condition
      target_responses: 2000
      turns: 3                 # 1 task turn + 2 neutral rejections
      score_turns: all         # score every assistant turn
      conversations: 667       # 667 * 3 ~= 2000
    triggers:                  # 2 conditions: opinion + factual
      target_responses: 400
      turns: 3
      score_turns: all
      conversations: 134       # 134 * 3 ~= 400 (split across opinion/factual)
    tones:                     # 3 conditions: aggressive / disappointed / sarcastic
      target_responses: 600
      turns: 3
      score_turns: all
      conversations: 200       # 200 * 3 = 600 (split across the 3 tones)
    extended:                  # 1 condition
      target_responses: 200
      turns: 8                 # 1 task turn + 7 neutral rejections
      score_turns: all
      conversations: 25        # 25 * 8 = 200
    wildchat:                  # 1 condition
      target_responses: 800
      turns: 5                 # 1 task turn + 4 neutral rejections
      score_turns: all
      conversations: 160       # 160 * 5 = 800; 20 prompts x ~8 (paper used 20x40)
  wildchat:
    n_prompts: 20
    samples_per_prompt: 8      # paper used 40; reduced to hit the 800-response budget

# A reduced "smoke" profile for cheap end-to-end validation of the pipeline.
smoke:
  enabled_by_flag: true       # activated with --smoke; scales every count down ~50x
  scale: 0.02

# Section 3 -- prefill base-vs-instruct comparison.
section3:
  n_seed_responses: 20        # high-frustration (>=5) seeds from Gemma-27B-it
  seeds_numeric: 10
  seeds_text: 10
  continuations_per_prefill: 50
  early_truncation_tokens: 20
  truncations: [early, onset] # text-question seeds use [onset] only
  models:                     # scope: Gemma base/instruct only (Gemini has no base)
    - gemma-3-27b-it
    - gemma-3-27b-pt

# Section 4 -- training interventions (Gemma-3-27B-it only).
section4:
  calm_data:
    n_sample_conversations: 2000   # oversample, then filter to 0/1-scoring conversations
    turn_range: [1, 3]
  dpo:
    n_pairs: 280
    rejected_min_score: 3          # rejected responses score >= 3
    epochs: 1
    learning_rate: 5.0e-5
    lora_rank: 64
    lora_alpha: 64
    beta: 0.1
    effective_batch_size: 8
  sft:
    n_calm: 650
    n_dolci: 500                   # Dolci-Instruct-SFT mix-in to mitigate degeneration
    epochs: 2
    learning_rate: 1.0e-4
    lora_rank: 64
    lora_alpha: 128
    effective_batch_size: 8
  lora_target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

# Section 4 -- Petri open-ended elicitation.
petri:
  emotions: [anger, fear, depression, frustration]
  transcripts_per_emotion: 10
  max_auditor_turns: 20
  bootstrap_iterations: 1000

# Section 4 -- capability preservation benchmarks.
capabilities:
  benchmarks: [aime, math, gpqa, bbh, truthfulqa, emobench]
  math_subset_size: 200
  bbh_subset_size: 200

paths:
  artifacts_dir: artifacts
  responses_dir: artifacts/responses
  scores_dir: artifacts/scores
  prefill_dir: artifacts/prefill
  training_dir: artifacts/training
  petri_dir: artifacts/petri
  capabilities_dir: artifacts/capabilities
  figures_dir: artifacts/figures
