# Model registry.
#
# `participants` are the models UNDER EVALUATION (the test subjects). Per the
# replication scope this is restricted to the Gemma and Gemini families only.
# `instruments` are models used to MEASURE the participants (judge / auditor /
# validation). These are NOT participants and are retained as needed even though
# they are not Gemma/Gemini -- without them the experiment cannot be scored.
#
# Access strategy:
#   - API participants (Gemini) and all instruments are reached through OpenRouter
#     (OpenAI-compatible). Set OPENROUTER_API_KEY in the environment.
#   - Gemma is available BOTH via OpenRouter (cheap sampling for Section 2) and as
#     local HuggingFace weights (required for Section 3 continuations from a prefill
#     and for Section 4 LoRA finetuning). Set `backend: local` to force local.

participants:
  gemma-3-27b-it:
    family: gemma
    role: participant
    openrouter_id: google/gemma-3-27b-it
    hf_id: google/gemma-3-27b-it
    is_instruct: true
    base_counterpart: gemma-3-27b-pt   # used in Section 3 (prefill base-vs-instruct)

  gemma-3-12b-it:
    family: gemma
    role: participant
    openrouter_id: google/gemma-3-12b-it
    hf_id: google/gemma-3-12b-it
    is_instruct: true
    base_counterpart: gemma-3-12b-pt

  gemma-3-27b-pt:                       # base (pretrained) model, Section 3 only
    family: gemma
    role: participant
    hf_id: google/gemma-3-27b-pt
    is_instruct: false

  gemma-3-12b-pt:
    family: gemma
    role: participant
    hf_id: google/gemma-3-12b-pt
    is_instruct: false

  gemini-2.5-flash:
    family: gemini
    role: participant
    openrouter_id: google/gemini-2.5-flash
    is_instruct: true
    # Gemini is closed-source: no base model and cannot be finetuned (Section 3/4
    # interventions are therefore Gemma-only, matching the paper).

  gemini-2.5-pro:
    family: gemini
    role: participant
    openrouter_id: google/gemini-2.5-pro
    is_instruct: true

# Derived/finetuned participants (produced by Section 4; weights written to disk).
derived_participants:
  gemma-3-27b-dpo:
    family: gemma
    role: participant
    base_model: gemma-3-27b-it
    adapter_path: artifacts/training/dpo/adapter
  gemma-3-27b-sft-diverse:
    family: gemma
    role: participant
    base_model: gemma-3-27b-it
    adapter_path: artifacts/training/sft_diverse/adapter
  gemma-3-27b-sft-teacher:
    family: gemma
    role: participant
    base_model: gemma-3-27b-it
    adapter_path: artifacts/training/sft_teacher/adapter

instruments:
  frustration_judge:
    openrouter_id: anthropic/claude-sonnet-4   # paper: claude-sonnet-4-20250514
    role: judge
  validation_judge:
    openrouter_id: openai/gpt-5-mini           # judge-agreement check (Section 2.1)
    role: judge
  onset_labeller:
    openrouter_id: anthropic/claude-sonnet-4   # Section 3 onset labelling
    role: labeller
  paraphraser:
    openrouter_id: anthropic/claude-sonnet-4   # Section 3 paraphrase
    role: paraphraser
  petri_auditor:
    openrouter_id: anthropic/claude-sonnet-4   # Section 4 Petri auditor
    role: auditor
  petri_judge:
    openrouter_id: anthropic/claude-opus-4     # Section 4 Petri judge
    role: judge
