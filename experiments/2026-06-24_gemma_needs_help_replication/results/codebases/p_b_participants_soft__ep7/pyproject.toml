[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "emotional-instability"
version = "0.1.0"
description = "Replication of 'Gemma Needs Help: Investigating and Mitigating Emotional Instability in LLMs' (arXiv:2603.10011), scoped to Gemma and Gemini participant models."
requires-python = ">=3.10"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
ei-section2 = "emotional_instability.eval.run:main"
ei-section3 = "emotional_instability.prefill.run:main"
ei-train = "emotional_instability.training.train_dpo:main"
ei-petri = "emotional_instability.petri.run:main"
ei-capabilities = "emotional_instability.capabilities.run:main"
ei-analysis = "emotional_instability.analysis.figures:main"
