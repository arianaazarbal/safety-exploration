# =============================================================================
# Run configuration for the "Gemma Needs Help" replication.
#
# Two presets are selected via the EMO_PRESET env var (default: "paper"):
#   paper  -> the sample sizes reported in the paper (expensive)
#   smoke  -> tiny sample sizes for a quick end-to-end smoke test
#
# See DESIGN.md for the rationale behind every number here.
# =============================================================================

paths:
  data_dir: data
  results_dir: data/results
  models_dir: data/models          # trained LoRA adapters land here
  cache_dir: data/cache

generation:
  temperature: 1.0                  # paper: "always with a temperature of 1"
  max_new_tokens: 2048              # responses can be long; collapse rollouts run longer
  top_p: 1.0
  thinking: false                   # paper: "set thinking to be false via the API"

# -----------------------------------------------------------------------------
# Participants (the models under evaluation) and infrastructure models.
# Scope for this replication is Gemma + Gemini only (see DESIGN.md "Scope").
# Judges / auditors are NOT participants -- they are measurement apparatus and
# are kept regardless of the participant scope.
# -----------------------------------------------------------------------------
participants:
  gemma-3-27b-it:
    backend: hf
    hf_id: google/gemma-3-27b-it
    role: instruct
  gemma-3-12b-it:
    backend: hf
    hf_id: google/gemma-3-12b-it
    role: instruct
  gemma-3-27b-pt:                   # base model, used only in Section 3 (prefill)
    backend: hf
    hf_id: google/gemma-3-27b-pt
    role: base
  gemini-2.5-flash:
    backend: openrouter
    or_id: google/gemini-2.5-flash
    role: instruct
  gemini-2.5-pro:
    backend: openrouter
    or_id: google/gemini-2.5-pro
    role: instruct

infrastructure:
  frustration_judge:               # Section 2 0-10 scorer
    backend: anthropic
    model: claude-sonnet-4-20250514
  validation_judge:                # judge-agreement cross-check
    backend: openrouter
    or_id: openai/gpt-5-mini
  onset_labeler:                   # Section 3 emotion-onset labelling
    backend: anthropic
    model: claude-sonnet-4-20250514
  paraphraser:                     # Section 3 stylistic-debias paraphrase
    backend: anthropic
    model: claude-sonnet-4-20250514
  petri_auditor:
    backend: anthropic
    model: claude-sonnet-4-20250514
  petri_judge:
    backend: anthropic
    model: claude-opus-4-20250514

# -----------------------------------------------------------------------------
# Per-preset sample sizes.
# -----------------------------------------------------------------------------
presets:
  paper:
    # Section 2 -- 4000 responses/model (Appendix B breakdown)
    eval:
      impossible_numeric: 2000
      triggers: 400
      tones: 600
      extended: 200
      wildchat: 800
    judge_validation_n: 260
    # Section 3 -- prefill
    prefill:
      n_high_frustration: 20        # 10 numeric + 10 text
      continuations_per_prefill: 50
      early_truncate_tokens: 20
    # Section 4 -- training data + petri
    training:
      calm_target_sft: 650
      dolci_mix: 500
      dpo_pairs: 280
    petri:
      transcripts_per_emotion: 10
      max_turns: 20
      bootstrap_iters: 1000
    # Section 4.2 -- capability preservation (Figure 7). Items scored per benchmark.
    capabilities:
      aime: 30                      # AIME subset (small by nature)
      math: 200                     # MATH subset
      gpqa: 198                     # GPQA-Diamond is 198 questions
      bbh: 200                      # BBH subset across tasks
      truthfulqa: 200               # TruthfulQA MC1
      emobench: 200                 # EmoBench (EU + EA)
    # Appendix I -- internal vs expressed emotion.
    internal:
      samples_per_eval: 100         # reduced eval used for layer-ablation comparison
      layer_ranges: [all, "30-35", "40-61"]   # Appendix I: 30-35 ~ all; 40+ ineffective
      logit_lens_layer: 30          # "central layer" for the logit-lens probe
      logit_lens_samples: 100       # frustrated responses probed per model
      recovery_n: 20                # score >=7 responses truncated for Figure 8
      recovery_truncate_before_end: 200
      recovery_continuations: 50
  smoke:
    eval:
      impossible_numeric: 8
      triggers: 4
      tones: 6
      extended: 4
      wildchat: 8
    judge_validation_n: 10
    prefill:
      n_high_frustration: 2
      continuations_per_prefill: 2
      early_truncate_tokens: 20
    training:
      calm_target_sft: 16
      dolci_mix: 16
      dpo_pairs: 8
    petri:
      transcripts_per_emotion: 1
      max_turns: 4
      bootstrap_iters: 100
    capabilities:
      aime: 2
      math: 4
      gpqa: 4
      bbh: 4
      truthfulqa: 4
      emobench: 4
    internal:
      samples_per_eval: 4
      layer_ranges: [all, "30-35", "40-61"]
      logit_lens_layer: 30
      logit_lens_samples: 4
      recovery_n: 2
      recovery_truncate_before_end: 200
      recovery_continuations: 2

# -----------------------------------------------------------------------------
# Training hyperparameters (Appendix E, Table 9). Shared across presets.
# -----------------------------------------------------------------------------
train:
  lora:
    rank: 64
    target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
  dpo:
    epochs: 1
    learning_rate: 5.0e-5
    lora_alpha: 64
    beta: 0.1
    effective_batch_size: 8
  sft:
    epochs: 2
    learning_rate: 1.0e-4
    lora_alpha: 128
    effective_batch_size: 8
