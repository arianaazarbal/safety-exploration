# Example runtime configuration. Pass with --config to any script, e.g.:
#   python scripts/run_section2_eval.py --config config.example.yaml
#
# Every key is optional; omitted keys fall back to the dataclass defaults in
# gemma_distress/config.py. Values shown here are the defaults made explicit.

output_dir: runs

# --- Local Gemma inference ---
hf_dtype: bfloat16
hf_device_map: auto
hf_load_in_4bit: false        # set true to fit gemma-3-27b on a single 48GB GPU

# --- API plumbing ---
# Keys are read from $ANTHROPIC_API_KEY / $OPENROUTER_API_KEY if left null.
anthropic_api_key: null
openrouter_api_key: null
openrouter_base_url: https://openrouter.ai/api/v1
api_max_concurrency: 8
api_max_retries: 6

# --- Judge / auditor models (paper-pinned snapshots) ---
judge:
  frustration_judge: claude-sonnet-4-20250514
  agreement_judge: gpt-5-mini
  onset_labeller: claude-sonnet-4-20250514
  paraphraser: claude-sonnet-4-20250514
  petri_auditor: claude-sonnet-4-20250514
  petri_judge: claude-opus-4-20250514

# --- Sampling (paper: temperature 1 everywhere) ---
sampling:
  temperature: 1.0
  top_p: 1.0
  top_k: 0
  max_new_tokens: 2048
  thinking: false

# --- Per-condition sample budgets (Appendix B); 4000 total / model ---
sample_counts:
  impossible_numeric: 2000
  triggers: 400
  tones: 600
  extended: 200
  wildchat: 800
