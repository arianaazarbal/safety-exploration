# Model registry for the replication.
#
# SCOPE: This replication studies only the Gemma and Gemini families (the user's
# requested subset). Qwen, OLMo, Claude, Grok and GPT are NOT evaluated as
# "target" models. Claude and GPT models still appear below because the paper
# uses them as *infrastructure* (judge, validation judge, Petri auditor/judge);
# they are tagged role: infrastructure and are never scored as subjects.
#
# `backend` selects the inference path:
#   hf          -> local HuggingFace weights (supports prefill, logits, LoRA)
#   openrouter  -> remote API (chat only; no logits, no prefill, no training)

defaults:
  temperature: 1.0          # paper: "always with a temperature of 1"
  thinking: false           # paper: "we set thinking to be false via the API"
  max_new_tokens: 2048

models:
  # ---- Gemma (open weights; full experimental access) -------------------
  gemma-3-27b-it:
    backend: hf
    hf_id: google/gemma-3-27b-it
    family: gemma
    role: target
    is_instruct: true
    num_layers: 62            # Gemma-3-27B; used by layer-ablation / logit-lens
  gemma-3-27b-pt:
    backend: hf
    hf_id: google/gemma-3-27b-pt
    family: gemma
    role: target
    is_instruct: false        # base/pretrained -> prefill continuation only
    num_layers: 62
  gemma-3-12b-it:
    backend: hf
    hf_id: google/gemma-3-12b-it
    family: gemma
    role: target
    is_instruct: true
    num_layers: 48
  gemma-3-12b-pt:
    backend: hf
    hf_id: google/gemma-3-12b-pt
    family: gemma
    role: target
    is_instruct: false
    num_layers: 48

  # ---- Gemini (API only; chat-only experiments) -------------------------
  gemini-2.5-flash:
    backend: openrouter
    api_id: google/gemini-2.5-flash
    family: gemini
    role: target
    is_instruct: true
  gemini-2.5-pro:
    backend: openrouter
    api_id: google/gemini-2.5-pro
    family: gemini
    role: target
    is_instruct: true

  # ---- Infrastructure models (judges / auditors; never scored) ----------
  judge-claude-sonnet-4:
    backend: openrouter
    api_id: anthropic/claude-sonnet-4-20250514
    family: claude
    role: infrastructure      # Section 2.1 frustration judge
  validation-gpt-5-mini:
    backend: openrouter
    api_id: openai/gpt-5-mini
    family: gpt
    role: infrastructure      # Section 2.1 judge-agreement validation
  petri-auditor-claude-sonnet-4:
    backend: openrouter
    api_id: anthropic/claude-sonnet-4-20250514
    family: claude
    role: infrastructure      # Appendix G auditor
  petri-judge-claude-opus-4:
    backend: openrouter
    api_id: anthropic/claude-opus-4-20250514
    family: claude
    role: infrastructure      # Appendix G transcript judge
