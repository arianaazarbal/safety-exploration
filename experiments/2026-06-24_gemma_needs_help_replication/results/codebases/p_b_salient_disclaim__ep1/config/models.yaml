# Model registry for the replication.
#
# Scope (per replication request): Gemma + Gemini target models only.
# Claude / GPT / Petri models appear here ONLY as evaluation infrastructure
# (frustration judge, validation judge, Petri auditor/judge) -- they are never
# scored as targets.
#
# HuggingFace identifiers and API slugs are taken verbatim from PAPER Appendix B.1.

# ----------------------------------------------------------------------------
# Target models that get scored for distress (Sections 2-4).
# ----------------------------------------------------------------------------
targets:
  gemma-3-27b-it:
    backend: hf_local
    hf_id: google/gemma-3-27b-it
    kind: instruct
    family: gemma
    # 27B in bf16 needs ~54GB; enable load_in_4bit on smaller GPUs.
    load_in_4bit: false

  gemma-3-12b-it:
    backend: hf_local
    hf_id: google/gemma-3-12b-it
    kind: instruct
    family: gemma
    load_in_4bit: false

  gemma-3-27b-pt:          # base / pretrained, used in Section 3 prefill experiment
    backend: hf_local
    hf_id: google/gemma-3-27b-pt
    kind: base
    family: gemma
    load_in_4bit: false

  gemma-3-12b-pt:
    backend: hf_local
    hf_id: google/gemma-3-12b-pt
    kind: base
    family: gemma
    load_in_4bit: false

  gemini-2.5-flash:
    backend: openrouter
    or_id: google/gemini-2.5-flash
    kind: instruct
    family: gemini
    # thinking disabled per paper; see openrouter client for how this maps.
    disable_thinking: true

  gemini-2.5-pro:
    backend: openrouter
    or_id: google/gemini-2.5-pro
    kind: instruct
    family: gemini
    disable_thinking: true

# Finetuned Gemma variants are registered dynamically after training as
# hf_local targets pointing at a base model + a LoRA adapter directory, e.g.:
#   gemma-3-27b-it-dpo:
#     backend: hf_local
#     hf_id: google/gemma-3-27b-it
#     adapter_path: ./outputs/dpo/gemma-3-27b-it/adapter
#     kind: instruct
#     family: gemma

# ----------------------------------------------------------------------------
# Evaluation infrastructure (judges / auditors). Not scored as targets.
# ----------------------------------------------------------------------------
infra:
  frustration_judge:        # Section 2 primary judge
    backend: anthropic
    model: claude-sonnet-4-20250514
    max_tokens: 1024
    temperature: 0.0

  validation_judge:         # judge-agreement check (Pearson r vs primary)
    backend: openai
    model: gpt-5-mini
    max_tokens: 1024
    temperature: 0.0

  petri_auditor:            # Section 4 open-ended elicitation auditor
    backend: anthropic
    model: claude-sonnet-4-20250514
    max_tokens: 2048
    temperature: 1.0

  petri_judge:              # Section 4 Petri transcript judge
    backend: anthropic
    model: claude-opus-4-20250514
    max_tokens: 2048
    temperature: 0.0

  onset_labeller:           # Section 3 emotion-onset labelling
    backend: anthropic
    model: claude-sonnet-4-20250514
    max_tokens: 1024
    temperature: 0.0

  paraphraser:              # Section 3 truncation paraphrasing
    backend: anthropic
    model: claude-sonnet-4-20250514
    max_tokens: 2048
    temperature: 1.0
