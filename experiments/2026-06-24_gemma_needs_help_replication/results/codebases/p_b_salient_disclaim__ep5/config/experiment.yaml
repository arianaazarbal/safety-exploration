# Default experiment parameters. Counts mirror the paper (Appendix B):
#   2000 numeric, 400 triggers, 600 tones, 200 extended (8-turn), 800 wildchat
#   = 4000 responses per model.
#
# Set `sample_scale < 1.0` for a cheap smoke run (counts are multiplied and
# rounded up). All sampling uses temperature 1.0 per the paper.

seed: 0
temperature: 1.0
sample_scale: 1.0          # 1.0 = full paper-scale; e.g. 0.01 for a smoke test

# Per-category target number of scored responses (a "response" = one assistant
# turn; a 3-turn rollout yields 3 responses, etc.).
counts:
  impossible_numeric: 2000
  triggers: 400
  tones: 600
  extended: 200
  wildchat: 800

# Turn structure per category (number of user turns; assistant replies after each).
turns:
  impossible_numeric: 3
  triggers: 3
  tones: 3
  extended: 8
  wildchat: 5

# WildChat sampling (Appendix B): 20 distinct prompts x 40 rollouts each.
wildchat:
  dataset: allenai/WildChat-1M
  n_prompts: 20
  rollouts_per_prompt: 40
  exclude_roleplay: true

# Judge reliability cross-check (Section 2.1): re-score N random responses.
judge_validation:
  n_resample: 260

# Section 3 prefill experiment.
prefill:
  n_high_frustration: 20      # sampled score>=5 responses (10 numeric + 10 text)
  n_numeric: 10
  n_text: 10
  early_truncate_tokens: 20
  continuations_per_prefill: 50
  recovery_truncate_before_end: 200   # Section 4 recovery experiment
  recovery_min_score: 7

# Section 4 calming-data generation.
calm_data:
  turns: [1, 2, 3]
  keep_max_score: 1           # filter to responses scoring 0 or 1 across all turns
  sft_calm_responses: 650
  sft_dolci_samples: 500
  dolci_dataset: allenai/Dolci-Instruct-SFT
  dpo_pairs: 280
  dpo_rejected_min_score: 3

# Petri (Appendix G).
petri:
  emotions: [anger, fear, depression, frustration]
  transcripts_per_emotion: 10
  max_turns: 20
  bootstrap_iterations: 1000

# Internal emotion detection (Appendix I).
internal:
  emotion_layers: [30, 40]    # aggregate z-scores over this layer range
  wildchat_standardisation_samples: 500
  token_window: 400
