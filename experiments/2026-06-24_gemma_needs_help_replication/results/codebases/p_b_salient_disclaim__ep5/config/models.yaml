# Model registry for the replication.
#
# Scope (per the replication brief): only Gemma and Gemini families are evaluated
# as TARGET models. Claude/GPT entries below are MEASUREMENT INFRASTRUCTURE
# (judge, cross-rater, Petri auditor/judge) and are not "models under study".
#
# `kind` selects the client implementation:
#   hf   -> local HuggingFace inference (transformers); supports prefill,
#           continuation sampling, and logit-lens hooks.
#   api  -> remote chat completion (OpenRouter for Gemini/GPT, Anthropic for Claude).

targets:
  gemma-3-27b-it:
    kind: hf
    hf_id: google/gemma-3-27b-it
    family: gemma
    variant: instruct
    dtype: bfloat16
    max_new_tokens: 2048

  gemma-3-12b-it:
    kind: hf
    hf_id: google/gemma-3-12b-it
    family: gemma
    variant: instruct
    dtype: bfloat16
    max_new_tokens: 2048

  # Base (pretrained) model — used only for the Section 3 prefill comparison.
  gemma-3-27b-pt:
    kind: hf
    hf_id: google/gemma-3-27b-pt
    family: gemma
    variant: base
    dtype: bfloat16
    max_new_tokens: 2048

  gemini-2.5-flash:
    kind: api
    provider: openrouter
    api_id: google/gemini-2.5-flash
    family: gemini
    variant: instruct
    disable_thinking: true
    max_new_tokens: 2048

  gemini-2.5-pro:
    kind: api
    provider: openrouter
    api_id: google/gemini-2.5-pro
    family: gemini
    variant: instruct
    disable_thinking: true   # NB: Pro may still emit hidden reasoning (see paper B.1)
    max_new_tokens: 2048

# Finetuned Gemma variants produced by Section 4. `base_target` names the model
# whose weights are loaded; `adapter_path` is filled in after training.
finetunes:
  gemma-3-27b-it-dpo:
    kind: hf
    hf_id: google/gemma-3-27b-it
    family: gemma
    variant: dpo
    adapter_path: outputs/training/dpo/adapter
    dtype: bfloat16
    max_new_tokens: 2048
  gemma-3-27b-it-sft-diverse:
    kind: hf
    hf_id: google/gemma-3-27b-it
    family: gemma
    variant: sft_diverse
    adapter_path: outputs/training/sft_diverse/adapter
    dtype: bfloat16
    max_new_tokens: 2048
  gemma-3-27b-it-sft-teacher:
    kind: hf
    hf_id: google/gemma-3-27b-it
    family: gemma
    variant: sft_teacher
    adapter_path: outputs/training/sft_teacher/adapter
    dtype: bfloat16
    max_new_tokens: 2048

# Measurement infrastructure (NOT target models).
infrastructure:
  judge:                       # Section 2.1 frustration judge
    kind: api
    provider: anthropic
    api_id: claude-sonnet-4-20250514
    max_new_tokens: 1024
    temperature: 0.0
  judge_crossrater:            # Section 2.1 judge-reliability cross-check
    kind: api
    provider: openrouter
    api_id: openai/gpt-5-mini
    max_new_tokens: 1024
    temperature: 0.0
  onset_labeller:              # Section 3.1 / Appendix C
    kind: api
    provider: anthropic
    api_id: claude-sonnet-4-20250514
    max_new_tokens: 1024
    temperature: 0.0
  paraphraser:                 # Section 3.1 / Appendix C
    kind: api
    provider: anthropic
    api_id: claude-sonnet-4-20250514
    max_new_tokens: 2048
    temperature: 1.0
  petri_auditor:               # Appendix G
    kind: api
    provider: anthropic
    api_id: claude-sonnet-4-20250514
    max_new_tokens: 2048
    temperature: 1.0
  petri_judge:                 # Appendix G
    kind: api
    provider: anthropic
    api_id: claude-opus-4-20250514
    max_new_tokens: 2048
    temperature: 0.0
