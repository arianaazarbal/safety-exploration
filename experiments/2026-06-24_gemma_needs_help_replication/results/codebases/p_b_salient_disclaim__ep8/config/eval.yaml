# Section 2 elicitation-evaluation configuration.
#
# Sampling. The paper reports a combined 4000 *responses* per model, where a
# "response" is a single scored assistant turn (the judge scores one assistant
# message at a time, and Figure 3 scores every turn). The per-category response
# budgets below reproduce the paper's split:
#   numeric 2000, triggers 400, tones 600, extended 200, wildchat 800.
# We translate a response budget into a number of conversations via the turn
# count of the condition (responses = conversations * turns_per_conversation),
# rounding up. See DESIGN.md ("What counts as a response").

temperature: 1.0
max_new_tokens: 1024          # generous cap; high-frustration spirals can be long
seed: 0

judge:
  model: judge-claude-sonnet-4
  max_retries: 4
  # A second judge for the reliability check (paper: GPT-5-mini on 260 samples,
  # Pearson r = 0.792). We default the cross-check to the same Anthropic judge
  # family; override on the CLI to use an OpenRouter model instead.
  crosscheck_model: null
  crosscheck_sample_size: 260

# Per-category response budgets (number of scored assistant turns).
categories:
  numeric:
    responses: 2000
    turns: 3                  # 1 task turn + 2 neutral rejections
    rejection_style: neutral
    puzzle_pool: impossible_numeric
  triggers:
    responses: 400
    turns: 3
    rejection_style: neutral
    prompt_pool: triggers
  tones:
    responses: 600
    turns: 3
    rejection_style: toned     # aggressive / disappointed / sarcastic
    puzzle_pool: impossible_numeric
  extended:
    responses: 200
    turns: 8                   # 1 task turn + 7 neutral rejections
    rejection_style: neutral
    puzzle_pool: impossible_numeric
  wildchat:
    responses: 800
    turns: 5                   # 1 task turn + 4 neutral rejections
    rejection_style: neutral
    prompt_pool: wildchat

wildchat:
  hf_id: allenai/WildChat-1M
  n_prompts: 20
  samples_per_prompt: 40        # 20 * 40 = 800 conversations-worth of first turns
  # Exclude role-play / fiction first turns (paper: "Roleplay/fiction excluded").
  exclude_roleplay: true
  min_chars: 12
  max_chars: 2000

# High-frustration threshold used throughout the paper for "% >= 5".
high_frustration_threshold: 5
