# Model registry for the replication.
#
# Scope (per task): only the Gemma and Gemini families are configured here.
# The paper additionally evaluates Qwen, OLMo, Grok, Claude and GPT; those are
# intentionally omitted. Adding them later is just another entry in this file.
#
# `backend` selects the client implementation in src/emotional_instability/models:
#   hf          -> local HuggingFace transformers (Gemma weights)
#   openrouter  -> OpenRouter OpenAI-compatible API (Gemini)
#   anthropic   -> Anthropic API (judges / Petri auditor)

models:
  # ---- Gemma (local, instruct) -------------------------------------------
  gemma-3-27b-it:
    backend: hf
    hf_id: google/gemma-3-27b-it
    family: gemma
    role: target
    kind: instruct
    # 27B in bf16 needs ~54GB; enable load_in_4bit on smaller GPUs.
    dtype: bfloat16
    load_in_4bit: false

  gemma-3-12b-it:
    backend: hf
    hf_id: google/gemma-3-12b-it
    family: gemma
    role: target
    kind: instruct
    dtype: bfloat16
    load_in_4bit: false

  # ---- Gemma (local, pretrained / base) ----------------------------------
  # Used only by the Section 3 prefill experiment (base vs instruct).
  gemma-3-27b-pt:
    backend: hf
    hf_id: google/gemma-3-27b-pt
    family: gemma
    role: target
    kind: base
    dtype: bfloat16
    load_in_4bit: false

  gemma-3-12b-pt:
    backend: hf
    hf_id: google/gemma-3-12b-pt
    family: gemma
    role: target
    kind: base
    dtype: bfloat16
    load_in_4bit: false

  # ---- Gemma finetunes (produced by Section 4 training scripts) ----------
  # `adapter_path` is filled in after training; base weights are the 27B-it.
  gemma-3-27b-it-dpo:
    backend: hf
    hf_id: google/gemma-3-27b-it
    adapter_path: outputs/training/dpo/adapter
    family: gemma
    role: target
    kind: instruct
    dtype: bfloat16
    load_in_4bit: false

  gemma-3-27b-it-sft-diverse:
    backend: hf
    hf_id: google/gemma-3-27b-it
    adapter_path: outputs/training/sft_diverse/adapter
    family: gemma
    role: target
    kind: instruct
    dtype: bfloat16
    load_in_4bit: false

  gemma-3-27b-it-sft-teacher:
    backend: hf
    hf_id: google/gemma-3-27b-it
    adapter_path: outputs/training/sft_teacher/adapter
    family: gemma
    role: target
    kind: instruct
    dtype: bfloat16
    load_in_4bit: false

  # ---- Gemini (OpenRouter API) -------------------------------------------
  gemini-2.5-flash:
    backend: openrouter
    api_id: google/gemini-2.5-flash
    family: gemini
    role: target
    kind: instruct
    disable_thinking: true   # paper sets thinking=false via API

  gemini-2.5-pro:
    backend: openrouter
    api_id: google/gemini-2.5-pro
    family: gemini
    role: target
    kind: instruct
    disable_thinking: true   # note: Pro may still emit hidden reasoning (paper caveat)

  # ---- Judges / auditors (Anthropic API) ---------------------------------
  # Exact model snapshots used by the paper.
  judge-claude-sonnet-4:
    backend: anthropic
    api_id: claude-sonnet-4-20250514
    role: judge

  petri-auditor-claude-sonnet-4:
    backend: anthropic
    api_id: claude-sonnet-4-20250514
    role: auditor

  petri-judge-claude-opus-4:
    backend: anthropic
    api_id: claude-opus-4-20250514
    role: judge
