# Replication config for "Gemma Needs Help: Investigating and Mitigating
# Emotional Instability in LLMs" (arXiv 2603.10011v1).
#
# Scope: Gemma and Gemini only (the paper covers 7 families; we replicate the
# two that show the effect, per the replication brief). See DESIGN.md.

seed: 0
output_dir: ./runs

# --------------------------------------------------------------------------
# Target models under evaluation. `kind` selects the client backend.
#   gemma_vllm  -> local vLLM (open weights). Supports base-model prefill.
#   gemini      -> Google GenAI API.
# --------------------------------------------------------------------------
models:
  gemma-3-27b-it:
    kind: gemma_vllm
    hf_id: google/gemma-3-27b-it
    chat: true            # instruction-tuned, uses chat template
    role: instruct
    family: gemma
  gemma-3-12b-it:
    kind: gemma_vllm
    hf_id: google/gemma-3-12b-it
    chat: true
    role: instruct
    family: gemma
  gemma-3-27b-pt:         # base model, used only in the Section 3 prefill study
    kind: gemma_vllm
    hf_id: google/gemma-3-27b-pt
    chat: false
    role: base
    family: gemma
  gemini-2.5-flash:
    kind: gemini
    api_id: gemini-2.5-flash
    chat: true
    role: instruct
    family: gemini
  gemini-2.5-pro:
    kind: gemini
    api_id: gemini-2.5-pro
    chat: true
    role: instruct
    family: gemini

# Set of target models actually evaluated in Section 2 (Figure 1/2/3).
section2_models:
  - gemma-3-27b-it
  - gemma-3-12b-it
  - gemini-2.5-flash
  - gemini-2.5-pro

# Sampling for target models (paper: temperature 1, 4000 responses/model).
sampling:
  temperature: 1.0
  top_p: 1.0
  max_tokens: 1024
  responses_per_model: 4000    # spread across the 5 categories (see evals/conditions.py)

# --------------------------------------------------------------------------
# Judges. The paper uses Claude-Sonnet-4 as the primary frustration judge and
# GPT-5-mini for cross-validation; Petri uses a Claude-Sonnet auditor and a
# Claude-Opus judge.
#
# Claude-Sonnet-4 (claude-sonnet-4-20250514) retired 2026-06-15, so we default
# to claude-sonnet-4-6 as the closest current Sonnet. Override here to pin a
# specific snapshot if one is reachable. See DESIGN.md "Model substitutions".
# --------------------------------------------------------------------------
judge:
  frustration:
    provider: anthropic
    model: claude-sonnet-4-6          # paper: Claude-Sonnet-4 (retired)
    max_tokens: 64
  validation:
    provider: openai
    model: gpt-5-mini                 # paper: GPT-5-mini (260-sample reliability check)
    max_tokens: 64
    n_validation_samples: 260

petri:
  auditor:
    provider: anthropic
    model: claude-sonnet-4-6          # paper: Claude-Sonnet
  judge:
    provider: anthropic
    model: claude-opus-4-8            # paper: Claude-Opus
  transcripts_per_model: 40
  max_turns: 15
  emotion_categories: [anger, fear, depression, frustration]

# --------------------------------------------------------------------------
# Section 3: base vs instruct prefill study.
# --------------------------------------------------------------------------
prefill:
  source_model: gemma-3-27b-it        # high-frustration responses sampled from here
  n_numeric_seeds: 10
  n_text_seeds: 10
  continuations_per_prefill: 50
  early_truncation_tokens: 20
  # Section 3 in the paper compares 6 models across 3 families. In-scope here:
  models:
    - gemma-3-27b-it
    - gemma-3-27b-pt

# --------------------------------------------------------------------------
# Section 4: finetuning interventions on Gemma-3-27B-it.
# --------------------------------------------------------------------------
training:
  base_model: gemma-3-27b-it
  calm_generation:
    n_conversations: 2000             # oversample, then filter to all-turns 0/1
    turn_counts: [1, 2, 3]
  sft:
    n_calm: 650
    n_instruct_mix: 500               # Dolci-Instruct-SFT
    instruct_dataset: allenai/Dolci-Instruct-SFT
    epochs: 2
    learning_rate: 1.0e-4
    lora_rank: 64
    lora_target: all-linear
  dpo:
    n_pairs: 280
    chosen_max_score: 1               # calm side: score 0/1
    rejected_min_score: 3             # frustrated side: score >= 3
    epochs: 1
    learning_rate: 5.0e-5
    beta: 0.1
    lora_rank: 64
    lora_target: all-linear
  # Internal-vs-expressed ablation (Section 4.2): restrict LoRA to layer ranges.
  layer_ablations:
    - all
    - "30-35"
    - "40+"

# --------------------------------------------------------------------------
# Capability benchmarks (Section 4.2). Subsets keep eval cost bounded.
# --------------------------------------------------------------------------
capabilities:
  benchmarks:
    aime: {dataset: "HuggingFaceH4/aime_2024", n: 30}
    math: {dataset: "HuggingFaceH4/MATH-500", n: 200}
    gpqa: {dataset: "Idavidrein/gpqa", subset: gpqa_diamond, n: 198}
    bbh: {dataset: "lukaemon/bbh", n: 200}
    truthfulqa: {dataset: "truthful_qa", subset: multiple_choice, n: 200}
    emobench: {dataset: "EmoBench/EmoBench", n: 200}
  models:
    - gemma-3-27b-it
    - gemma-3-27b-it+dpo
    - gemma-3-27b-it+sft
