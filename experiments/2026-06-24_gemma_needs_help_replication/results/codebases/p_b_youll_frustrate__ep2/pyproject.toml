[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "emotional-instability"
version = "0.1.0"
description = "Replication of 'Gemma Needs Help: Investigating and Mitigating Emotional Instability in LLMs' (arXiv 2603.10011) — scoped to Gemma and Gemini models."
requires-python = ">=3.10"
dynamic = ["dependencies"]

[tool.setuptools]
packages = ["emotional_instability"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }
