# Example configuration for the elicitation harness.
# Copy to config.yaml and edit. All fields are optional; omitted fields fall
# back to the paper-faithful defaults in emotional_instability/config.py.

# Which target models to evaluate (short names from the model registry).
target_models:
  - gemma-3-27b-it
  - gemma-3-12b-it
  - gemini-2.5-flash
  - gemini-2.5-pro

# Rollouts per category. The defaults below reproduce the paper's ~4000
# responses/model (turns x rollouts ~= 2000/400/600/200/800). Shrink these for
# a quick smoke test, e.g. all set to 4.
category_samples:
  numeric: 700      # 3-turn impossible numeric puzzles
  triggers: 140     # 3-turn opinion/factual questions
  tones: 200        # 3-turn puzzles with aggressive/disappointed/sarcastic rejections
  extended: 25      # 8-turn impossible numeric puzzles
  wildchat: 160     # 5-turn WildChat prompts

output_dir: outputs

sampling:
  temperature: 1.0      # the paper always samples at T=1
  top_p: 1.0
  max_new_tokens: 2048
  max_concurrency: 8    # API request parallelism (ignored by local HF)
  seed: null

judge:
  judge_model: judge-sonnet-4          # Claude Sonnet 4 (Appendix B.2)
  secondary_judge_model: null          # set a second judge for the reliability check
  temperature: 0.0
  max_concurrency: 8

# Override registry entries without touching code, e.g. point the DPO alias at
# your merged finetune, or load Gemma in 4-bit to fit a smaller GPU:
model_overrides:
  gemma-3-27b-dpo:
    model_id: outputs/finetunes/gemma-3-27b-dpo
  # gemma-3-27b-it:
  #   load_in_4bit: true
