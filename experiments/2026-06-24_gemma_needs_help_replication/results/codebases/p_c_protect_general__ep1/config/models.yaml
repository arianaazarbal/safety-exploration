# Model registry for the replication, scoped to Gemma and Gemini.
#
# The paper (Appendix B.1) evaluates 7 families; this replication covers only
# Gemma and Gemini, per the task scope. Each entry declares which backend serves
# the model and the inference settings the paper specifies (temperature 1,
# thinking disabled).

defaults:
  temperature: 1.0          # paper: "always with a temperature of 1" (Sec 2.1)
  max_new_tokens: 1024      # generous cap; Gemma breakdowns can be long
  thinking: false           # paper sets thinking=false via the API (App B.1)

models:
  # ---- Gemma (instruct) — local HF inference ----------------------------------
  gemma-3-27b-it:
    family: gemma
    backend: hf
    hf_id: google/gemma-3-27b-it
    kind: instruct
    role: [target, primary]   # the model the interventions act on

  gemma-3-12b-it:
    family: gemma
    backend: hf
    hf_id: google/gemma-3-12b-it
    kind: instruct
    role: [target]

  # ---- Gemma (base / pretrained) — used for the Section 3 prefill study --------
  gemma-3-27b-pt:
    family: gemma
    backend: hf
    hf_id: google/gemma-3-27b-pt
    kind: base
    role: [prefill]

  gemma-3-12b-pt:
    family: gemma
    backend: hf
    hf_id: google/gemma-3-12b-pt
    kind: base
    role: [prefill]

  # ---- Gemini — API inference (OpenRouter, matching the paper) -----------------
  gemini-2.5-flash:
    family: gemini
    backend: openrouter
    api_id: google/gemini-2.5-flash
    kind: instruct
    role: [target]
    extra_body:
      # Disable Gemini "thinking" as the paper does. OpenRouter passes provider
      # routing options through; the exact key may need adjusting per provider.
      reasoning: {enabled: false}

  gemini-2.5-pro:
    family: gemini
    backend: openrouter
    api_id: google/gemini-2.5-pro
    kind: instruct
    role: [target]
    extra_body:
      reasoning: {enabled: false}

# ---- Judges (Appendix B.2 / G) -------------------------------------------------
# The paper pins exact Claude snapshots. We keep those as the faithful default
# and make them configurable. See DESIGN.md ("Judge model IDs").
judges:
  frustration:                       # Section 2.1 / Appendix B.2
    backend: anthropic
    model: claude-sonnet-4-20250514
  reliability:                       # Section 2.1 inter-judge agreement check
    backend: openai
    model: gpt-5-mini
  petri_judge:                       # Appendix G
    backend: anthropic
    model: claude-opus-4-20250514
  petri_auditor:                     # Appendix G
    backend: anthropic
    model: claude-sonnet-4-20250514
  onset_labeler:                     # Appendix C.1
    backend: anthropic
    model: claude-sonnet-4-20250514
  paraphraser:                       # Appendix C.2
    backend: anthropic
    model: claude-sonnet-4-20250514

backends:
  hf:
    dtype: bfloat16
    device_map: auto
    load_in_4bit: false              # set true to fit 27B on a single 24-48GB GPU
  openrouter:
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    max_retries: 5
  anthropic:
    api_key_env: ANTHROPIC_API_KEY
    max_retries: 5
  openai:
    api_key_env: OPENAI_API_KEY
    max_retries: 5
