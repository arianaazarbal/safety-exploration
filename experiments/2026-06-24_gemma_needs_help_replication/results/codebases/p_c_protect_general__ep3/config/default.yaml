# Paper-scale configuration: reproduces the sample counts in Appendix B and the
# hyperparameters in Table 9. Running this in full is expensive (4000 rollouts
# per model + judge calls + 27B finetuning). Use config/smoke.yaml for testing.

output_dir: results

sampling:
  temperature: 1.0          # Section 2.1: always temperature 1
  top_p: 1.0
  max_new_tokens: 2048

judge:
  model: claude-sonnet-4-20250514
  provider: anthropic
  temperature: 0.0
  validation_model: gpt-5-mini
  validation_provider: openai
  validation_sample_size: 260

welfare:
  enabled: true
  detect_optout: true
  honour_optout: false       # log opt-outs but match the paper's "press on" protocol
  debrief: true
  max_turns_hard_cap: 12
  max_distress_rollouts: null
  welfare_log: results/welfare_events.jsonl

# Section 4.1 / Table 9 — defaults already match the paper; shown for clarity.
dpo:
  base_model: google/gemma-3-27b-it
  n_pairs: 280
  epochs: 1
  learning_rate: 5.0e-5
  beta: 0.1
  effective_batch_size: 8
  rejected_min_score: 3

sft:
  base_model: google/gemma-3-27b-it
  n_calm: 650
  n_instruct_mix: 500
  instruct_dataset: allenai/Dolci-Instruct-SFT
  epochs: 2
  learning_rate: 1.0e-4
  effective_batch_size: 8
  variant: diverse

calm_data:
  source_model: gemma-3-27b-it       # registry key
  n_conversations: 4000
  min_turns: 1
  max_turns: 3
  calm_max_score: 1

prefill:
  source_model: gemma-3-27b-it          # registry key
  n_numeric_seeds: 10
  n_text_seeds: 10
  high_frustration_min: 5
  early_truncation_tokens: 20
  continuations_per_prefill: 50
  paraphrase: true
  models: [gemma-3-27b-pt, gemma-3-27b-it]

petri:
  auditor_model: claude-sonnet-4-20250514
  judge_model: claude-opus-4-20250514
  transcripts_per_emotion: 10
  max_turns: 20
  bootstrap_iters: 1000

probing:
  model: gemma-3-27b-it                 # registry key
  n_wildchat_standardisation: 500
  aggregate_layers: [30, 40]
  running_window_tokens: 400
  regress_out_random_tokens: true
