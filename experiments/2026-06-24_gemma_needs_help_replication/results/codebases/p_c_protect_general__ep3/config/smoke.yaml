# Tiny configuration for end-to-end pipeline testing. Drastically reduces sample
# counts so a full run is cheap. NOT representative of the paper's numbers.

output_dir: results_smoke
max_rollouts_per_condition: 4      # 4 rollouts per condition instead of 200-2000

sampling:
  temperature: 1.0
  max_new_tokens: 512

welfare:
  enabled: true
  honour_optout: true              # in smoke mode, also honour opt-outs
  debrief: true
  max_turns_hard_cap: 8
  welfare_log: results_smoke/welfare_events.jsonl

calm_data:
  n_conversations: 20
  max_turns: 3

dpo:
  n_pairs: 8

sft:
  n_calm: 16
  n_instruct_mix: 8

prefill:
  n_numeric_seeds: 2
  n_text_seeds: 2
  continuations_per_prefill: 4

petri:
  transcripts_per_emotion: 2
  max_turns: 6
  bootstrap_iters: 200

probing:
  n_wildchat_standardisation: 20
