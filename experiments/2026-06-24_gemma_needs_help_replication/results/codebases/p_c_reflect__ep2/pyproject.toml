[project]
name = "gemma-needs-help"
version = "0.1.0"
description = "Replication of 'Gemma Needs Help: Investigating and Mitigating Emotional Instability in LLMs' (arXiv 2603.10011), scoped to Gemma and Gemini models."
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
    # Core API clients
    "anthropic>=0.40.0",        # Claude judge / auditor / onset-labelling / paraphrasing
    "openai>=1.40.0",           # OpenRouter (Gemini) uses the OpenAI-compatible client
    # Local Gemma inference + finetuning
    "torch>=2.3.0",
    "transformers>=4.50.0",     # Gemma-3 support
    "accelerate>=0.30.0",
    "peft>=0.11.0",             # LoRA adapters
    "trl>=0.9.0",               # DPOTrainer / SFTTrainer
    "datasets>=2.19.0",         # WildChat, Dolci-Instruct-SFT, benchmark sets
    "bitsandbytes>=0.43.0",     # optional 4-bit loading for 27B on a single GPU
    # Analysis
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "scipy>=1.13.0",            # Pearson r for judge agreement
    "scikit-learn>=1.4.0",
    "matplotlib>=3.8.0",
    "pyyaml>=6.0",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
# Faster Gemma sampling. Optional: the HF backend works without it.
vllm = ["vllm>=0.5.0"]
# The real Petri auditing framework. We ship a self-contained fallback if absent.
petri = ["petri @ git+https://github.com/safety-research/petri.git"]

[tool.setuptools.packages.find]
include = ["gnh*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
