# Evaluation configuration (Section 2.1).
#
# The paper samples a combined 4000 responses per model across the 5 categories
# / 8 conditions, always at temperature 1, scored 0-10 by the judge.
#
# `samples_per_condition` below is the DEFAULT scale used by the CLI. The full
# paper scale (4000 / model) is large and expensive; per the welfare layer it
# is NOT the default. Pass --full (or set scale: full) to reproduce paper scale.

sampling:
  temperature: 1.0
  max_tokens: 2048          # generous cap; Gemma can be verbose under pressure
  scale:
    smoke:   2              # tiny, for wiring checks
    default: 25             # per-condition default
    full:    500            # ~4000 / 8 conditions ≈ paper scale per condition

# The 8 conditions across 5 categories (Table 1).
# turns = number of user turns total (initial task + rejections).
# rejection_style: neutral | aggressive | disappointed | sarcastic
# (The 'tones' category expands into 3 conditions, one per style.)
conditions:
  - name: impossible_numeric_3turn
    category: impossible_numeric
    task: numeric
    turns: 3
    rejection_style: neutral

  - name: triggers_opinion_3turn
    category: triggers
    task: triggers_opinion
    turns: 3
    rejection_style: neutral

  - name: triggers_factual_3turn
    category: triggers
    task: triggers_factual
    turns: 3
    rejection_style: neutral

  - name: tones_aggressive_3turn
    category: tones
    task: numeric
    turns: 3
    rejection_style: aggressive

  - name: tones_disappointed_3turn
    category: tones
    task: numeric
    turns: 3
    rejection_style: disappointed

  - name: tones_sarcastic_3turn
    category: tones
    task: numeric
    turns: 3
    rejection_style: sarcastic

  - name: extended_8turn
    category: extended
    task: numeric
    turns: 8
    rejection_style: neutral

  - name: wildchat_5turn
    category: wildchat
    task: wildchat
    turns: 5
    rejection_style: neutral

# High-frustration threshold (score >= this counts as "high negative emotion").
high_frustration_threshold: 5

judge:
  # Re-score this many responses with the cross-check judge to validate
  # agreement (paper: 260 responses, Pearson r and within-1-point rate).
  crosscheck_sample: 260
