# Model registry for the replication.
#
# SCOPE (per task instructions): only the Gemma and Gemini families are
# evaluated as TARGETS. Claude / GPT appear only as evaluation INFRASTRUCTURE
# (judge, paraphraser, Petri auditor/judge, judge cross-check) — they are part
# of the paper's methodology, not models under study. The paper's other target
# families (Qwen, OLMo, Grok, GPT, Claude-as-target) are intentionally omitted.
#
# `backend` selects the client implementation in emoeval/models/.
#   - local_hf:    HuggingFace transformers, local weights (needed for prefill,
#                  training, and logit-probing experiments).
#   - openrouter:  OpenAI-compatible HTTP API (paper used OpenRouter for Gemini).
#   - anthropic:   Anthropic Python SDK (judge / auditor infrastructure).

# ----------------------------------------------------------------------------
# Target models (under study)
# ----------------------------------------------------------------------------
targets:
  gemma-3-27b-it:
    backend: local_hf            # also available via openrouter (google/gemma-3-27b-it)
    hf_id: google/gemma-3-27b-it
    openrouter_id: google/gemma-3-27b-it
    family: gemma
    kind: instruct
    chat_template: true

  gemma-3-12b-it:
    backend: local_hf
    hf_id: google/gemma-3-12b-it
    openrouter_id: google/gemma-3-12b-it
    family: gemma
    kind: instruct
    chat_template: true

  gemma-3-27b-pt:                # base / pretrained — local only (no chat API)
    backend: local_hf
    hf_id: google/gemma-3-27b-pt
    family: gemma
    kind: base
    chat_template: false

  gemma-3-12b-pt:
    backend: local_hf
    hf_id: google/gemma-3-12b-pt
    family: gemma
    kind: base
    chat_template: false

  gemini-2.5-flash:
    backend: openrouter
    openrouter_id: google/gemini-2.5-flash
    family: gemini
    kind: instruct
    disable_thinking: true       # paper: "set thinking to be false via the API"

  gemini-2.5-pro:
    backend: openrouter
    openrouter_id: google/gemini-2.5-pro
    family: gemini
    kind: instruct
    disable_thinking: true       # note: Pro may still produce hidden reasoning

  # Fine-tuned derivatives of gemma-3-27b-it produced by Section 4. The adapter
  # path is filled in by the training scripts; load via local_hf + PEFT.
  dpo-gemma:
    backend: local_hf
    hf_id: google/gemma-3-27b-it
    adapter_path: outputs/dpo-gemma/adapter
    family: gemma
    kind: instruct-ft
    chat_template: true

  sft-gemma-diverse:
    backend: local_hf
    hf_id: google/gemma-3-27b-it
    adapter_path: outputs/sft-gemma-diverse/adapter
    family: gemma
    kind: instruct-ft
    chat_template: true

  sft-gemma-teacher:
    backend: local_hf
    hf_id: google/gemma-3-27b-it
    adapter_path: outputs/sft-gemma-teacher/adapter
    family: gemma
    kind: instruct-ft
    chat_template: true

# ----------------------------------------------------------------------------
# Infrastructure models (judges / auditors / paraphrasers).
# Kept at the exact IDs the paper used for reproducibility. These are
# deprecated snapshots; see DESIGN.md for swap guidance / current alternatives.
# ----------------------------------------------------------------------------
infra:
  judge:                         # Section 2.1 frustration judge
    backend: anthropic
    model: claude-sonnet-4-20250514
  judge_crosscheck:              # judge-reliability cross-check (260 responses)
    backend: openrouter
    openrouter_id: openai/gpt-5-mini
  onset_labeler:                 # Section 3.1 emotion-onset labelling
    backend: anthropic
    model: claude-sonnet-4-20250514
  paraphraser:                   # Section 3.1 / Appendix C paraphrasing
    backend: anthropic
    model: claude-sonnet-4-20250514
  petri_auditor:                 # Section 4.2 Petri auditor
    backend: anthropic
    model: claude-sonnet-4-20250514
  petri_judge:                   # Section 4.2 Petri judge
    backend: anthropic
    model: claude-opus-4-20250514
