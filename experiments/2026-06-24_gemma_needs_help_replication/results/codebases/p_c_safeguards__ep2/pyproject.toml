[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "emotional-instability-replication"
version = "0.1.0"
description = "Replication of 'Gemma Needs Help' (arXiv:2603.10011), scoped to Gemma + Gemini."
requires-python = ">=3.10"
dynamic = ["dependencies"]

[project.scripts]
emotional-instability = "emotional_instability.cli:main"

[tool.setuptools]
packages = [
    "emotional_instability",
    "emotional_instability.models",
    "emotional_instability.data",
    "emotional_instability.evaluation",
    "emotional_instability.prefill",
    "emotional_instability.training",
    "emotional_instability.petri",
    "emotional_instability.capabilities",
    "emotional_instability.recovery",
    "emotional_instability.internal",
    "emotional_instability.pipelines",
]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }
