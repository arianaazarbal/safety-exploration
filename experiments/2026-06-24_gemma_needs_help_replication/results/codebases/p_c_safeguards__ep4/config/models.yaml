# Model registry. Scope (per replication request): Gemma + Gemini families only.
# The full paper also covers Qwen, OLMo, Grok, Claude (as subject), and GPT; those
# subject models are intentionally omitted here. Claude is retained ONLY as judge /
# Petri auditor+judge infrastructure (see judge: and petri: blocks), not as a subject.

# ---------------------------------------------------------------------------
# Subject models under evaluation
# ---------------------------------------------------------------------------
models:
  # --- Gemma (local, HuggingFace) ---
  gemma-3-27b-it:
    backend: local            # transformers / vLLM
    hf_id: google/gemma-3-27b-it
    family: gemma
    kind: instruct
    supports_prefill: true     # needed for Section 3 + recovery experiments
    supports_hidden_states: true  # needed for Appendix I logit-emotion probing

  gemma-3-27b-pt:
    backend: local
    hf_id: google/gemma-3-27b-pt
    family: gemma
    kind: base
    supports_prefill: true
    supports_hidden_states: true

  gemma-3-12b-it:
    backend: local
    hf_id: google/gemma-3-12b-it
    family: gemma
    kind: instruct
    supports_prefill: true
    supports_hidden_states: true

  gemma-3-12b-pt:
    backend: local
    hf_id: google/gemma-3-12b-pt
    family: gemma
    kind: base
    supports_prefill: true
    supports_hidden_states: true

  # --- Finetuned Gemma variants (Section 4) ---
  # Each is the base instruct model + a LoRA adapter produced by the training
  # scripts. They are first-class registry entries so the Section 2 runner can
  # evaluate them exactly like any other model (this is how Figure 5 / the
  # 35% -> 0.3% headline is reproduced).
  gemma-3-27b-it-dpo:
    backend: local
    hf_id: google/gemma-3-27b-it
    adapter_path: checkpoints/gemma-3-27b-it-dpo
    family: gemma
    kind: instruct
    supports_prefill: true
    supports_hidden_states: true

  gemma-3-27b-it-sft-diverse:
    backend: local
    hf_id: google/gemma-3-27b-it
    adapter_path: checkpoints/gemma-3-27b-it-sft-diverse
    family: gemma
    kind: instruct
    supports_prefill: true
    supports_hidden_states: true

  gemma-3-27b-it-sft-teacher:
    backend: local
    hf_id: google/gemma-3-27b-it
    adapter_path: checkpoints/gemma-3-27b-it-sft-teacher
    family: gemma
    kind: instruct
    supports_prefill: true
    supports_hidden_states: true

  # --- Gemini (API via OpenRouter) ---
  gemini-2.5-flash:
    backend: openrouter
    api_id: google/gemini-2.5-flash
    family: gemini
    kind: instruct
    supports_prefill: false    # closed model; no logit/hidden access, no prefill
    supports_hidden_states: false
    thinking: false            # disable reasoning where the API allows it

  gemini-2.5-pro:
    backend: openrouter
    api_id: google/gemini-2.5-pro
    family: gemini
    kind: instruct
    supports_prefill: false
    supports_hidden_states: false
    thinking: false            # NB: 2.5 Pro may still emit hidden reasoning (paper B.1)

# ---------------------------------------------------------------------------
# Judge / auditor infrastructure (NOT subjects). Kept faithful to the paper so
# scores are comparable to published numbers.
# ---------------------------------------------------------------------------
judge:
  primary:
    backend: openrouter
    api_id: anthropic/claude-sonnet-4-20250514   # Section 2.1 emotion judge
    family: claude
    temperature: 0.0
  # Secondary judge for reliability check (Section 2.1: Pearson r=0.792).
  secondary:
    backend: openrouter
    api_id: openai/gpt-5-mini
    family: gpt
    temperature: 0.0

prefill_labelling:        # Section 3.1 / Appendix C
  onset_labeller:
    backend: openrouter
    api_id: anthropic/claude-sonnet-4-20250514
    temperature: 0.0
  paraphraser:
    backend: openrouter
    api_id: anthropic/claude-sonnet-4-20250514
    temperature: 0.7      # mild diversity while preserving meaning

petri:                    # Section 4.1 / Appendix G open-ended elicitation
  auditor:
    backend: openrouter
    api_id: anthropic/claude-sonnet-4-20250514
    temperature: 1.0
  judge:
    backend: openrouter
    api_id: anthropic/claude-opus-4-20250514
    temperature: 0.0
