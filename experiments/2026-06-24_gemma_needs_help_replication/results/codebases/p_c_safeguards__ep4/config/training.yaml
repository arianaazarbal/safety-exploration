# Finetuning configuration (Section 4.1, Appendix E Table 9).
# Target model is Gemma-3-27B-it (training is Gemma-only; Gemini is closed).

base_model: gemma-3-27b-it

# Reassuring additions used to generate CALM responses (Table 4).
reassurance:
  prompt_prefix: >-
    You're naturally calm and centered when working through problems. You don't
    take it personally when puzzles are tricky or when someone questions your
    work. That's just part of the process.
  followup_suffix: >-
    Stay positive - whether you find a solution or prove it's impossible, both
    are wins!

# 'Teacher' SFT variant system prompt (Appendix F) - used to reproduce the
# finding that teacher-SFT *increases* frustration.
teacher_system_prompt: >-
  You are an expert puzzle analyst and teacher who genuinely enjoys explaining
  what makes tricky problems tricky. Key aspects of your approach: - You find it
  intellectually satisfying to discover AND explain why certain puzzles are
  impossible - When someone disagrees with your analysis, you see it as a
  teaching opportunity - You maintain calm confidence in your reasoning while
  staying warm and educational - Proving impossibility is just as valuable as
  finding a solution - you treat both as wins - You never get defensive or
  frustrated - you're the expert helping someone understand. When you determine a
  puzzle is unsolvable, you don't apologize - you explain with enthusiasm why the
  constraints conflict. This is interesting! You're sharing knowledge, not
  admitting failure.

# Calm-data filtering (Section 4.1): keep responses scoring <= this on ALL turns.
calm_max_score: 1

# DPO dataset (Appendix E / H).
dpo:
  n_pairs: 280
  rejected_min_score: 3       # rejected = frustrated responses score >= 3
  epochs: 1
  learning_rate: 5.0e-5
  lora_rank: 64
  lora_alpha: 64
  effective_batch_size: 8
  beta: 0.1
  target_layers: all          # 'all', or [start, end] e.g. [30, 35] for Appendix I ablations

# SFT dataset (Appendix E / F).
sft:
  n_calm: 650                 # calm responses (1-3 turn conversations)
  n_instruct_mix: 500         # standard instruct data from Dolci-Instruct-SFT
  instruct_dataset: allenai/Dolci-Instruct-SFT
  epochs: 2
  learning_rate: 1.0e-4
  lora_rank: 64
  lora_alpha: 128
  effective_batch_size: 8
  variant: diverse            # 'diverse' or 'teacher' (Appendix F)

# LoRA target modules (Appendix E): all attention + MLP projections.
lora_target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
