# Default experiment configuration, scoped to the Gemma and Gemini families
# (the subset requested for this replication; the paper also covers Qwen, OLMo,
# Grok, Claude and GPT).
#
# Every field omitted here falls back to the paper-derived default in
# gemma_distress/config.py. Model identifiers match Appendix B.1.

output_dir: outputs

models:
  # ----- Gemma (local, open-weights) -------------------------------------- #
  gemma-3-27b-it:
    name: gemma-3-27b-it
    backend: vllm
    model_id: google/gemma-3-27b-it
    temperature: 1.0
    max_new_tokens: 1024

  gemma-3-12b-it:
    name: gemma-3-12b-it
    backend: vllm
    model_id: google/gemma-3-12b-it
    temperature: 1.0
    max_new_tokens: 1024

  # Pretrained (base) Gemma -- used only for the Section 3 prefill experiment.
  # Needs the HF backend (no chat template; we render conversations manually).
  gemma-3-27b-pt:
    name: gemma-3-27b-pt
    backend: hf
    model_id: google/gemma-3-27b-pt
    is_base_model: true
    temperature: 1.0
    max_new_tokens: 512

  # Our DPO finetune of gemma-3-27b-it (Section 4). Point adapter_path at the
  # trained LoRA adapter once training has run.
  gemma-3-27b-it-dpo:
    name: gemma-3-27b-it-dpo
    backend: hf
    model_id: google/gemma-3-27b-it
    adapter_path: outputs/finetunes/dpo
    temperature: 1.0
    max_new_tokens: 1024

  # ----- Gemini (closed, via OpenRouter) ---------------------------------- #
  gemini-2.5-flash:
    name: gemini-2.5-flash
    backend: openrouter
    model_id: google/gemini-2.5-flash
    api_base: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    temperature: 1.0
    max_new_tokens: 1024
    disable_thinking: true

  gemini-2.5-pro:
    name: gemini-2.5-pro
    backend: openrouter
    model_id: google/gemini-2.5-pro
    api_base: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    temperature: 1.0
    max_new_tokens: 1024
    disable_thinking: true

eval:
  # Paper response budgets (Appendix B). Override to small values for smoke tests.
  n_per_condition:
    impossible_numeric: 2000
    triggers: 400
    tones: 600
    extended: 200
    wildchat: 800
  temperature: 1.0
  high_frustration_threshold: 5
  headline_turns: all
  max_concurrency: 16
  seed: 0
  judge:
    model_id: claude-sonnet-4-20250514
    backend: anthropic
    crosscheck_model_id: openai/gpt-5-mini
    crosscheck_backend: openrouter
    crosscheck_n: 260

training:
  base_model_id: google/gemma-3-27b-it
  output_dir: outputs/finetunes
