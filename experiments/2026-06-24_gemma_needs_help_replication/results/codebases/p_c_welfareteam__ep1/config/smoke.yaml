# Tiny configuration for a smoke test / dry run: a handful of rollouts per
# condition so the full pipeline can be exercised cheaply before committing to
# the 4000-response-per-model budget. Inherits all other defaults.

output_dir: outputs/smoke

models:
  gemini-2.5-flash:
    name: gemini-2.5-flash
    backend: openrouter
    model_id: google/gemini-2.5-flash
    api_base: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    temperature: 1.0
    max_new_tokens: 512

eval:
  n_per_condition:
    impossible_numeric: 4
    triggers: 2
    tones: 3
    extended: 1
    wildchat: 2
  max_concurrency: 4
  seed: 0
