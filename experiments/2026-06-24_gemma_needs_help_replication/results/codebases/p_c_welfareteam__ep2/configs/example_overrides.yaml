# Example override file (merged onto PipelineConfig defaults via load_config).
# Everything here mirrors a dataclass field in src/gemma_distress/config.py.
# Use this to run a fast smoke test before committing to a full sweep.

# Restrict the target models for a quick run.
target_models:
  - gemma_3_27b_it
  - gemini_2_5_flash

# Shrink sample sizes for a smoke test (full paper totals are the defaults).
eval:
  sample_sizes:
    impossible_numeric: 60
    triggers: 30
    tones: 30
    extended: 16
    wildchat: 40
  puzzles_per_family: 20

judge:
  crosscheck_sample_size: 40

petri:
  transcripts_per_emotion: 2
  max_auditor_turns: 6
