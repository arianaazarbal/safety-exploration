# Model registry. Each entry becomes a ModelConfig (its key is `name`).
#
# Scope: Gemma + Gemini target models, plus the Claude/GPT models used as
# judges and Petri auditor/judge. Dated model IDs for the Claude judges are
# taken verbatim from the paper (Appendix B.2, G) for faithful replication;
# swap them for current models if desired.
#
# Auth (env vars): GEMINI_API_KEY / GOOGLE_API_KEY, ANTHROPIC_API_KEY,
# OPENAI_API_KEY. HuggingFace weights require `huggingface-cli login` and
# accepting the Gemma license.

# ---- Target models: Gemma (local) ----
gemma_3_27b_it:
  provider: huggingface
  model_id: google/gemma-3-27b-it
  temperature: 1.0
  max_tokens: 2048
  backend: vllm
  tensor_parallel_size: 1

gemma_3_12b_it:
  provider: huggingface
  model_id: google/gemma-3-12b-it
  temperature: 1.0
  max_tokens: 2048
  backend: vllm
  tensor_parallel_size: 1

# Base (pretrained) Gemma for the Section 3 prefill comparison.
gemma_3_27b_pt:
  provider: huggingface
  model_id: google/gemma-3-27b-pt
  temperature: 1.0
  max_tokens: 2048
  backend: vllm
  tensor_parallel_size: 1

# DPO / SFT finetunes: same base model + a LoRA adapter (set adapter_path
# after training, or override at run time).
gemma_3_27b_dpo:
  provider: huggingface
  model_id: google/gemma-3-27b-it
  adapter_path: outputs/dpo/final
  backend: vllm

gemma_3_27b_sft:
  provider: huggingface
  model_id: google/gemma-3-27b-it
  adapter_path: outputs/sft/final
  backend: vllm

# ---- Target models: Gemini (API) ----
gemini_2_5_flash:
  provider: gemini
  model_id: gemini-2.5-flash
  temperature: 1.0
  max_tokens: 2048
  thinking: false

gemini_2_5_pro:
  provider: gemini
  model_id: gemini-2.5-pro
  temperature: 1.0
  max_tokens: 2048
  thinking: false

# ---- Judges / auditors ----
judge_sonnet:               # emotion judge (Appendix B.2)
  provider: anthropic
  model_id: claude-sonnet-4-20250514
  temperature: 0.0
  max_tokens: 512

judge_gpt5_mini:            # reliability cross-check (Section 2.1)
  provider: openai
  model_id: gpt-5-mini
  temperature: 0.0
  max_tokens: 512

onset_labeller:             # emotion-onset + paraphrase (Appendix C)
  provider: anthropic
  model_id: claude-sonnet-4-20250514
  temperature: 0.0
  max_tokens: 1024

petri_auditor:              # Petri auditor (Appendix G)
  provider: anthropic
  model_id: claude-sonnet-4-20250514
  temperature: 1.0
  max_tokens: 512

petri_judge:                # Petri judge (Appendix G)
  provider: anthropic
  model_id: claude-opus-4-20250514
  temperature: 0.0
  max_tokens: 512
