[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gemma-distress"
version = "0.1.0"
description = "Replication (Gemma + Gemini scope) of 'Gemma Needs Help: Investigating and Mitigating Emotional Instability in LLMs' (Soligo, Mikulik & Saunders, 2026)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }

# Core dependencies needed for the analysis/orchestration layer and tests.
# Heavy, environment-specific backends (local GPU inference, training,
# benchmark harness) live in optional extras below and are imported lazily so
# that the eval/analysis code and the test suite run without them installed.
dependencies = [
    "numpy>=1.24",
    "pyyaml>=6.0",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
# API target models + judges (Section 2-4).
api = [
    "anthropic>=0.40",     # emotion judge, onset labeller, Petri auditor/judge
    "google-genai>=0.3",   # Gemini target models
    "openai>=1.40",        # GPT-5-mini judge cross-check
]
# Local Gemma inference, prefilling, and the Appendix I logit-lens probe.
local = [
    "torch>=2.2",
    "transformers>=4.50",
    "vllm>=0.6",
    "datasets>=2.18",      # WildChat + instruct-mix loading
]
# Section 4 finetuning (LoRA SFT / DPO).
train = [
    "peft>=0.11",
    "trl>=0.12",
    "datasets>=2.18",
]
# Section 4.2 capability-preservation benchmarks (shells out to `lm_eval`).
capabilities = [
    "lm-eval>=0.4.4",
]
dev = [
    "pytest>=7.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# Make `import gemma_distress` work in tests without an editable install.
pythonpath = ["src"]
testpaths = ["tests"]
