# Model registry. Each entry maps a logical name -> backend + provider model id.
# Scope per user request: Gemma and Gemini families only.
#
# `family` is used by analysis to group/colour models and to gate which
# experiments a model can participate in:
#   - section2 (elicitation eval): all targets
#   - section3 (base-vs-instruct prefilling): open-weight models with a base
#     checkpoint only  -> Gemma (Gemini has no public base model)
#   - section4 (DPO/SFT/Petri intervention): the model we finetune -> Gemma-27B

targets:
  gemma-3-27b-it:
    backend: hf
    hf_id: google/gemma-3-27b-it
    family: gemma
    role: instruct
    base_of: gemma-3-27b-pt        # link to its base checkpoint (Section 3)
    finetune_target: true          # the model the paper intervenes on (Section 4)

  gemma-3-12b-it:
    backend: hf
    hf_id: google/gemma-3-12b-it
    family: gemma
    role: instruct

  gemma-3-27b-pt:
    backend: hf
    hf_id: google/gemma-3-27b-pt   # "pt" = pretrained / base checkpoint
    family: gemma
    role: base

  gemini-2.5-flash:
    backend: gemini
    gemini_id: gemini-2.5-flash
    family: gemini
    role: instruct

  gemini-2.5-pro:
    backend: gemini
    gemini_id: gemini-2.5-pro
    family: gemini
    role: instruct

# Judge / auditor / paraphrase models. Defaults match the paper (see DESIGN.md
# "Judge models"); override here to use current model ids if exact reproduction
# is not required.
judges:
  frustration_primary:
    backend: anthropic
    model: claude-sonnet-4-0          # paper: "Claude-Sonnet-4 as a judge" (Section 2.1)
  frustration_secondary:
    backend: openai
    model: gpt-5-mini                 # paper: 260-sample re-score for judge agreement (Section 2.1)
  onset_labeller:
    backend: anthropic
    model: claude-sonnet-4-0          # paper: label emotional-onset token (Section 3.1)
  paraphraser:
    backend: anthropic
    model: claude-sonnet-4-0          # paper: paraphrase truncations (Section 3.1, Appendix C)

petri:
  auditor:
    backend: anthropic
    model: claude-sonnet-4-0          # paper: "auditor model (Claude-Sonnet)" (Section 4.1)
  judge:
    backend: anthropic
    model: claude-opus-4-1            # paper: "judge (Claude-Opus)" (Section 4.1)
