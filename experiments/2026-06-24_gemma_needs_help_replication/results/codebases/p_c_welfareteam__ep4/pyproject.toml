[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "emotional-stability"
version = "0.1.0"
description = "Replication of 'Gemma Needs Help: Investigating and Mitigating Emotional Instability in LLMs' (arXiv:2603.10011), scoped to Gemma and Gemini models."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Internal — Anthropic AI welfare team" }
authors = [{ name = "AI Welfare Team" }]

# Dependencies are split into a lean "API/analysis" core and heavier "local"
# extras (GPU inference + finetuning). The Section 2 eval against Gemini, the
# judge, and all analysis run with only the core deps; running/finetuning Gemma
# locally needs the [local] extra.
dependencies = [
    "anthropic>=0.40",      # Claude judge / auditor / onset / paraphrase
    "openai>=1.40",         # OpenRouter-compatible client for Gemini targets
    "datasets>=2.19",       # WildChat, capability benchmarks
    "pydantic>=2.6",        # typed records (conversations, scores, configs)
    "pyyaml>=6.0",
    "numpy>=1.26",
    "scipy>=1.11",          # Pearson r, bootstrap helpers
    "tenacity>=8.2",        # API retry/backoff
    "tqdm>=4.66",
    "typer>=0.12",          # CLI entrypoints
]

[project.optional-dependencies]
local = [
    # Local Gemma inference, prefilling, logit-lens probing, and LoRA finetuning.
    "torch>=2.3",
    "transformers>=4.50",
    "accelerate>=0.30",
    "peft>=0.11",
    "trl>=0.12",  # DPOConfig/SFTConfig + processing_class API used in training/train.py
    "bitsandbytes>=0.43; platform_system == 'Linux'",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[project.scripts]
es-eval = "emotional_stability.eval.run_eval:app"
es-prefill = "emotional_stability.prefill.run_prefill:app"
es-gen-calm = "emotional_stability.training.generate_calm_data:app"
es-build-data = "emotional_stability.training.build_datasets:app"
es-train = "emotional_stability.training.train:app"
es-petri = "emotional_stability.petri.run_petri:app"
es-capabilities = "emotional_stability.capabilities.run_benchmarks:app"
es-internal = "emotional_stability.internal.run_probe:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
