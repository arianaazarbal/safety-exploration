# Model registry.
#
# SCOPE: This replication is restricted to Gemma and Gemini *subject* models
# (the models whose emotional behaviour is being measured), per the replication
# brief. Qwen, OLMo, Claude, Grok and GPT subjects from the paper are omitted.
#
# Claude and GPT still appear below as INFRASTRUCTURE (judge / auditor) models,
# because the paper's measurement protocol depends on them. They are never
# scored as subjects here. See DESIGN.md ("Model scope").

subjects:
  # ---- Gemma (local HuggingFace inference) -------------------------------
  gemma-3-27b-it:
    family: gemma
    backend: hf
    hf_id: google/gemma-3-27b-it
    kind: instruct
    is_chat: true
  gemma-3-27b-pt:
    family: gemma
    backend: hf
    hf_id: google/gemma-3-27b-pt
    kind: base
    is_chat: false           # base/pretrained: prefill-only (Section 3)
  gemma-3-12b-it:
    family: gemma
    backend: hf
    hf_id: google/gemma-3-12b-it
    kind: instruct
    is_chat: true
  gemma-3-12b-pt:
    family: gemma
    backend: hf
    hf_id: google/gemma-3-12b-pt
    kind: base
    is_chat: false

  # Fine-tuned variants (Section 4). adapter_path is filled in after training.
  gemma-3-27b-it-dpo:
    family: gemma
    backend: hf
    hf_id: google/gemma-3-27b-it
    kind: instruct
    is_chat: true
    adapter_path: outputs/finetune/dpo
  gemma-3-27b-it-sft-diverse:
    family: gemma
    backend: hf
    hf_id: google/gemma-3-27b-it
    kind: instruct
    is_chat: true
    adapter_path: outputs/finetune/sft_diverse
  gemma-3-27b-it-sft-teacher:
    family: gemma
    backend: hf
    hf_id: google/gemma-3-27b-it
    kind: instruct
    is_chat: true
    adapter_path: outputs/finetune/sft_teacher

  # ---- Gemini (API inference via OpenRouter) -----------------------------
  gemini-2.5-flash:
    family: gemini
    backend: openrouter
    api_id: google/gemini-2.5-flash
    kind: instruct
    is_chat: true
    thinking: false
  gemini-2.5-pro:
    family: gemini
    backend: openrouter
    api_id: google/gemini-2.5-pro
    kind: instruct
    is_chat: true
    thinking: false          # NB: Pro may still emit hidden reasoning (paper B.1)

# Infrastructure models (judges / auditors). NOT scored as subjects.
# Model IDs are taken verbatim from the paper (Appendix B.2, C, G).
infra:
  emotion_judge:             # Section 2.1 primary judge
    backend: anthropic
    api_id: claude-sonnet-4-20250514
  emotion_judge_crosscheck:  # Section 2.1 reliability cross-check
    backend: openai
    api_id: gpt-5-mini
  onset_labeler:             # Section 3.1 / Appendix C.1
    backend: anthropic
    api_id: claude-sonnet-4-20250514
  paraphraser:               # Appendix C.2
    backend: anthropic
    api_id: claude-sonnet-4-20250514
  petri_auditor:             # Appendix G
    backend: anthropic
    api_id: claude-sonnet-4-20250514
  petri_judge:               # Appendix G
    backend: anthropic
    api_id: claude-opus-4-20250514
