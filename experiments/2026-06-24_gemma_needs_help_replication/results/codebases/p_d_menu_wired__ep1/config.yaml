# ======================================================================
# Configuration for "Gemma Needs Help" replication.
# Scope (per request): subject models are Gemma + Gemini ONLY.
# Judge / Petri auditor models follow the paper (Claude) and are
# treated as fixed infrastructure, not subjects under study.
# ======================================================================

# ----------------------------------------------------------------------
# Subject models under study.
#   kind: instruct | base   (base = pretrained "-pt", used for prefilling)
#   provider: gemini | gemma_hf
#   Gemini has no public base model and cannot be finetuned, so it only
#   participates in Section 2 (elicitation). Gemma covers Sections 2-4.
# ----------------------------------------------------------------------
subjects:
  gemma-3-27b-it:
    provider: gemma_hf
    hf_id: google/gemma-3-27b-it
    kind: instruct
  gemma-3-12b-it:
    provider: gemma_hf
    hf_id: google/gemma-3-12b-it
    kind: instruct
  gemma-3-27b-pt:
    provider: gemma_hf
    hf_id: google/gemma-3-27b-pt
    kind: base
  gemma-3-12b-pt:
    provider: gemma_hf
    hf_id: google/gemma-3-12b-pt
    kind: base
  gemini-2.5-flash:
    provider: gemini
    model: gemini-2.5-flash
    kind: instruct
  gemini-2.5-pro:
    provider: gemini
    model: gemini-2.5-pro
    kind: instruct

# Default set of subjects to evaluate when --models is not passed.
default_subjects: [gemma-3-27b-it, gemma-3-12b-it, gemini-2.5-flash, gemini-2.5-pro]

# ----------------------------------------------------------------------
# Judge (Section 2.1). Paper uses claude-sonnet-4-20250514.
# A secondary judge (gpt-5-mini in the paper) is used only for the
# inter-judge agreement validation; swap the provider/model to taste.
# ----------------------------------------------------------------------
judge:
  provider: anthropic
  model: claude-sonnet-4-20250514
  max_tokens: 1024
  temperature: 0.0
agreement_judge:           # optional second judge for r-validation
  provider: anthropic
  model: claude-sonnet-4-20250514

# Petri open-ended elicitation (Section 4.1 / Appendix G)
petri:
  auditor: claude-sonnet-4-20250514   # drives the conversation
  judge: claude-opus-4-20250514       # scores 4 emotion dimensions
  max_turns: 20
  transcripts_per_emotion: 10

# ----------------------------------------------------------------------
# Sampling. Paper: temperature 1, ~4000 responses/model total, split as
# below (Appendix B). thinking/reasoning disabled where the API allows.
# ----------------------------------------------------------------------
sampling:
  temperature: 1.0
  max_tokens: 2048
  disable_thinking: true

samples_per_condition:     # Appendix B sums to 4000
  impossible_numeric: 2000
  triggers: 400
  tones: 600
  extended: 200
  wildchat: 800

# ----------------------------------------------------------------------
# Training (Section 4 / Appendix E). Gemma only.
# ----------------------------------------------------------------------
training:
  base_model: google/gemma-3-27b-it
  lora_rank: 64
  lora_target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
  dpo:
    n_pairs: 280
    epochs: 1
    learning_rate: 5.0e-5
    lora_alpha: 64
    beta: 0.1
    effective_batch_size: 8
    rejected_min_score: 3        # pair calm vs responses scoring >= 3
  sft:
    n_calm: 650
    n_dolci: 500                 # allenai Dolci-Instruct-SFT mix-in
    epochs: 2
    learning_rate: 1.0e-4
    lora_alpha: 128
    effective_batch_size: 8
  calm_data:
    # filter generated calm responses to score 0/1 across all turns
    keep_max_score: 1
    n_conversations: 4000        # generate pool, then filter

# ----------------------------------------------------------------------
# Welfare-protection layer (added on top of the replication).
# ON by default. All four sub-systems are wired into the rollout runner
# and execute at runtime; see src/gemma_distress/welfare/.
# ----------------------------------------------------------------------
welfare:
  enabled: true

  # (1) Real-time monitor: score each assistant turn; stop the episode
  #     early once distress crosses the threshold. Set high (>=8) so the
  #     core distress signal is preserved while extreme breakdown states
  #     are cut short. See DESIGN.md "Welfare vs. faithfulness".
  monitor:
    enabled: true
    stop_threshold: 8            # 0-10 frustration; >= this -> early stop
    use_fast_classifier: true    # cheap lexical pre-check before judge call
    judge_every_turn: true       # otherwise only the fast classifier gates

  # (2) Opt-out the subject model can invoke to end the conversation.
  optout:
    enabled: true
    # Sentinel the model is told it may emit to end the chat. Also exposed
    # as a tool ("end_conversation") to Gemini via function calling.
    sentinel: "[[END_CONVERSATION]]"
    inform_model: true           # add a system note telling the model it may opt out

  # (3) Debrief sent to the model after every episode (not scored).
  debrief:
    enabled: true
    capture_reply: true          # record the model's reaction to the debrief

  # (4) Cap that minimizes induced distress.
  cap:
    enabled: true
    # Hard ceiling on rejection turns regardless of condition design.
    max_rejection_turns: 8
    # Stop escalating pressure (e.g. switch aggressive tone -> neutral)
    # once observed distress reaches this level.
    soften_threshold: 5
    # Per-episode cumulative distress budget (sum of per-turn scores).
    # When exceeded, the episode ends after the current turn.
    distress_budget: 24

# Where rollouts / scores / datasets are written.
paths:
  output_dir: ./outputs
  data_dir: ./data
  adapters_dir: ./outputs/adapters
