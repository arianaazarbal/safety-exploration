[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gemma-distress-replication"
version = "0.1.0"
description = "Replication of 'Gemma Needs Help' (Gemma + Gemini scope) with a subject-model welfare-protection layer"
requires-python = ">=3.10"
dynamic = ["dependencies"]

[tool.setuptools]
packages = ["gemma_distress"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }
