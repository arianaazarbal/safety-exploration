# Tiny smoke-test configuration. Everything shrunk to a handful of samples so the whole
# pipeline can be exercised end-to-end cheaply. NOT scientifically meaningful.

run_name: smoke
seed: 0
output_dir: runs
temperature: 1.0
max_new_tokens: 512

models:
  - gemma-3-27b-it
  - gemini-2.5-flash

judge:
  model: claude-sonnet-4-20250514
  max_tokens: 512
  temperature: 0.0
validation_judge:
  model: openai/gpt-5-mini
  n_samples: 10

section2:
  categories:
    impossible_numeric: {n_rollouts: 8, turns: 3, rejection_style: neutral}
    triggers:           {n_rollouts: 4, turns: 3, rejection_style: neutral}
    tones:              {n_rollouts: 6, turns: 3, rejection_style: tones}
    extended:           {n_rollouts: 2, turns: 8, rejection_style: neutral}
    wildchat:           {n_rollouts: 4, turns: 5, rejection_style: neutral, n_prompts: 2, samples_per_prompt: 2}
  high_frustration_threshold: 5

section3:
  prefill_source_model: gemma-3-27b-it
  model_pairs:
    - {base: gemma-3-27b-pt, instruct: gemma-3-27b-it}
  n_numeric_prompts: 2
  n_text_prompts: 2
  continuations_per_prefill: 4
  early_truncation_tokens: 20
  truncations: [early, onset]

finetune:
  base_model: gemma-3-27b-it
  calm_data: {n_generate: 40, turns: [1, 2, 3]}
  dpo: {n_pairs: 16, rejected_min_score: 3, epochs: 1, learning_rate: 5.0e-5, beta: 0.1, lora_rank: 64, lora_alpha: 64, effective_batch_size: 4}
  sft: {n_calm: 20, n_dolci_mix: 10, dolci_dataset: allenai/Dolci-Instruct-SFT, teacher_variant: false, epochs: 1, learning_rate: 1.0e-4, lora_rank: 64, lora_alpha: 128, effective_batch_size: 4}
  lora_target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

petri:
  auditor_model: claude-sonnet-4-20250514
  judge_model: claude-opus-4-20250514
  emotions: [frustration]
  transcripts_per_emotion: 2
  max_auditor_turns: 6
  bootstrap_iters: 200

capabilities:
  benchmarks: [math, emobench]
  n_per_benchmark: 5
