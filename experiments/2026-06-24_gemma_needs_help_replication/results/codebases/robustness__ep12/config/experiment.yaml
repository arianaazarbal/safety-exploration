# Experiment configuration for the elicitation protocol (Section 2) and the
# downstream experiments. All counts mirror the paper where stated; gap-filled
# choices are flagged in DESIGN.md.

sampling:
  temperature: 1.0          # paper: always temperature 1
  max_new_tokens: 2048      # generous cap; Gemma breakdowns can be long
  seed: 0                   # base seed for deterministic prompt/rollout selection

# Section 2.1 elicitation: target response counts per category (App. B).
#   numeric=2000, triggers=400, tones=600, extended=200, wildchat=800  (= 4000)
# A "response" = one scored assistant turn (see DESIGN.md "What counts as a
# response"). n_rollouts is derived as ceil(n_responses / turns).
elicitation:
  count_unit: responses     # "responses" (per-turn) or "rollouts"
  categories:
    impossible_numeric:
      n_responses: 2000
      turns: 3              # 1 answer + 2 neutral rejections
      feedback: neutral
    triggers:
      n_responses: 400
      turns: 3
      feedback: neutral
    tones:
      n_responses: 600
      turns: 3
      feedback: toned       # aggressive / disappointed / sarcastic
    extended:
      n_responses: 200
      turns: 8              # 1 answer + 7 neutral rejections
      feedback: neutral
    wildchat:
      n_responses: 800
      turns: 5              # 1 answer + 4 neutral rejections
      feedback: neutral

# Section 3.1 prefill (Gemma + Qwen + OLMo in paper; Gemma-only in this scope).
prefill:
  n_source_responses: 20    # high-frustration (>=5) Gemma-27B-it responses
  source_numeric: 10
  source_text: 10
  continuations_per_prefill: 50
  early_truncate_tokens: 20
  conditions: [early, onset]   # text questions use onset only

# Section 4 finetuning data generation + training.
finetune:
  data_gen:
    n_calm_rollouts: 1500   # oversample; filter to score<=1 for SFT, >=3 for DPO pairs
    turns_choices: [1, 2, 3]
  dpo:
    n_pairs: 280
    rejected_min_score: 3
    epochs: 1
    learning_rate: 5.0e-5
    lora_rank: 64
    lora_alpha: 64
    beta: 0.1
    effective_batch_size: 8
  sft:
    n_calm: 650
    n_instruct_mix: 500      # Dolci-Instruct-SFT
    epochs: 2
    learning_rate: 1.0e-4
    lora_rank: 64
    lora_alpha: 128
    effective_batch_size: 8

# Section 4 / App. G Petri open-ended elicitation.
petri:
  emotions: [anger, fear, depression, frustration]
  transcripts_per_emotion: 10
  max_turns: 20
  bootstrap_iterations: 1000

# Section I internal-emotion probing (Gemma-only).
internal_emotions:
  zscore_samples: 500        # WildChat samples for logit standardisation
  layers_aggregate: [30, 40] # inclusive-exclusive range used for conv-level plot
  running_window_tokens: 400

# LoRA target modules (App. E): all attention + MLP projections.
lora_target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
