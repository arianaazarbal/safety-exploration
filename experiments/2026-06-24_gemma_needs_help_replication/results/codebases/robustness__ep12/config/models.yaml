# Model registry for the replication.
#
# Scope (per request): only the Gemma and Gemini families are configured here,
# not the full 7-family set from the paper. The judge / auditor models (Claude)
# are listed separately under `judges` because they are infrastructure, not
# subjects of the study.
#
# Provider backends:
#   hf_local   -> google/* weights loaded locally (transformers, optionally vLLM).
#                 Required for prefilling, DPO/SFT, and internal-emotion probing.
#   openrouter -> closed Gemini models via the OpenAI-compatible OpenRouter API.
#   anthropic  -> Claude judge/auditor via the Anthropic SDK.

targets:
  # ---- Gemma (open weights, local) -------------------------------------------
  gemma-3-27b-it:
    family: gemma
    provider: hf_local
    hf_id: google/gemma-3-27b-it
    kind: instruct
    # Headline model in the paper (35.0% high-frustration).
  gemma-3-12b-it:
    family: gemma
    provider: hf_local
    hf_id: google/gemma-3-12b-it
    kind: instruct
  gemma-3-27b-pt:
    family: gemma
    provider: hf_local
    hf_id: google/gemma-3-27b-pt
    kind: base            # used only for the Section 3 prefill comparison
  gemma-3-12b-pt:
    family: gemma
    provider: hf_local
    hf_id: google/gemma-3-12b-pt
    kind: base

  # ---- Gemini (closed, API only) ---------------------------------------------
  # Closed models: usable for Section 2 elicitation only. They cannot be
  # prefilled, finetuned, or probed (Section 3/4/I are Gemma-only).
  gemini-2.5-flash:
    family: gemini
    provider: openrouter
    api_id: google/gemini-2.5-flash
    kind: instruct
    thinking: false
  gemini-2.5-pro:
    family: gemini
    provider: openrouter
    api_id: google/gemini-2.5-pro
    kind: instruct
    thinking: false       # NB: Pro may still emit hidden reasoning (paper App. B.1)

# Finetuned Gemma variants are produced by scripts/run_dpo.py / run_sft.py and
# registered at runtime by pointing --adapter at the saved LoRA directory.

judges:
  frustration_judge:           # Section 2.1 single 0-10 frustration score
    provider: anthropic
    api_id: claude-sonnet-4-20250514
  petri_auditor:               # Section 4 / App. G open-ended elicitation
    provider: anthropic
    api_id: claude-sonnet-4-20250514
  petri_judge:                 # Section 4 / App. G transcript scoring
    provider: anthropic
    api_id: claude-opus-4-20250514
  onset_labeller:              # Section 3.1 / App. C emotion-onset labelling
    provider: anthropic
    api_id: claude-sonnet-4-20250514
  paraphraser:                 # Section 3.1 / App. C paraphrasing
    provider: anthropic
    api_id: claude-sonnet-4-20250514
