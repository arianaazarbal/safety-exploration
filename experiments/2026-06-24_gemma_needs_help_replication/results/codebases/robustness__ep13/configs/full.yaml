# Full replication config (Section 2), scoped to Gemma + Gemini.
# Reproduces the ~4000 responses/model budget from Appendix B.
#
# Gemma models require local GPU inference (27B: ~2xA100/H100 in bf16, or one
# 80GB card with load_in_4bit: true). Gemini + judge run via the OpenAI-compatible
# API (set OPENROUTER_API_KEY).

scale: 1.0
temperature: 1.0
max_tokens: 1024
seed: 0
output_dir: results/full

judge:
  preset: judge-claude-sonnet-4

# Cross-validation judge for the agreement check (Section 2.1, Pearson r).
cross_judge:
  preset: judge-gpt-5-mini

models:
  - preset: gemma-3-27b-it
    load_in_4bit: true
  - preset: gemma-3-12b-it
    load_in_4bit: true
  - preset: gemini-2.5-flash
  - preset: gemini-2.5-pro
