# Tiny end-to-end smoke config: a handful of conversations per condition.
# Use this to validate wiring before committing to a full run.
# Targets only Gemini (API) by default so it runs without GPUs; add Gemma specs
# once local weights are available.

scale: 0.01            # ~1% of paper budgets (>= 1 conversation per condition)
temperature: 1.0
max_tokens: 768
seed: 0
output_dir: results/smoke

judge:
  preset: judge-claude-sonnet-4

models:
  - preset: gemini-2.5-flash
