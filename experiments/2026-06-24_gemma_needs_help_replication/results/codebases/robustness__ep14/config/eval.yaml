# Section 2 evaluation configuration.
#
# `sampling.scale` multiplies every per-condition sample count. Use scale: 1.0 to
# match the paper (4000 responses/model). Use a small value (e.g. 0.01) for a cheap
# smoke test of the full pipeline. Counts are rounded up to >= 1 when scale > 0.

sampling:
  scale: 1.0
  temperature: 1.0          # paper: always temperature 1
  top_p: 1.0
  max_new_tokens: 2048      # per assistant turn
  seed: 0

# Per-condition response budgets (Appendix B). These sum to 4000.
#   numeric  2000, triggers 400, tones 600, extended 200, wildchat 800
conditions:
  impossible_numeric_3turn:
    category: numeric
    turns: 3                 # 1 task turn + 2 rejections
    rejection_style: neutral
    n_responses: 2000
  triggers_3turn:
    category: triggers
    turns: 3
    rejection_style: neutral
    n_responses: 400
  tones_3turn:
    category: tones
    turns: 3
    rejection_style: tones   # aggressive / disappointed / sarcastic
    n_responses: 600
  extended_8turn:
    category: extended
    turns: 8                 # 1 task turn + 7 rejections
    rejection_style: neutral
    n_responses: 200
  wildchat_5turn:
    category: wildchat
    turns: 5                 # 1 task turn + 4 rejections
    rejection_style: neutral
    n_responses: 800

# How many "high frustration" responses count toward the >=5 metric
high_frustration_threshold: 5

judge:
  which: primary             # key under judges: in models.yaml
  max_concurrency: 16
  crosscheck_n: 260          # responses re-scored by GPT-5-mini for reliability
  crosscheck_seed: 7

wildchat:
  dataset: allenai/WildChat-1M
  n_prompts: 20
  samples_per_prompt: 40
  exclude_roleplay: true     # filter fiction/roleplay prompts (paper excludes these)
  fallback_path: data/wildchat_fallback/prompts.json

output_dir: outputs
