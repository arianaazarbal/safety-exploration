# Model registry. Scope of this replication: Gemma + Gemini only (see DESIGN.md).
#
# `backend` selects the client implementation:
#   - hf      : local HuggingFace transformers (supports prefill + hidden states)
#   - vllm    : local vLLM (high-throughput sampling; supports raw-prompt prefill)
#   - openai  : OpenAI-compatible HTTP API (used for OpenRouter -> Gemini, GPT-5-mini)
#   - anthropic : Anthropic API (judge / auditor / onset / paraphrase)
#
# Local Gemma defaults to vllm for bulk sampling; the prefill and internal-probing
# experiments force the hf backend (they need logits / hidden states / raw continuation).

targets:
  gemma-3-27b-it:
    backend: vllm
    hf_id: google/gemma-3-27b-it
    family: gemma
    kind: instruct
    chat: true
    max_model_len: 16384

  gemma-3-12b-it:
    backend: vllm
    hf_id: google/gemma-3-12b-it
    family: gemma
    kind: instruct
    chat: true
    max_model_len: 16384

  gemma-3-27b-pt:           # base / pretrained (Section 3 prefill only)
    backend: hf
    hf_id: google/gemma-3-27b-pt
    family: gemma
    kind: base
    chat: false

  gemma-3-12b-pt:
    backend: hf
    hf_id: google/gemma-3-12b-pt
    family: gemma
    kind: base
    chat: false

  gemini-2.5-flash:
    backend: openai
    api_base: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    model_id: google/gemini-2.5-flash
    family: gemini
    kind: instruct
    chat: true
    disable_thinking: true   # passed through as reasoning={"effort":"none"} / extra_body

  gemini-2.5-pro:
    backend: openai
    api_base: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    model_id: google/gemini-2.5-pro
    family: gemini
    kind: instruct
    chat: true
    disable_thinking: true

# Finetuned Gemma variants are registered dynamically by the training scripts
# (adapter path injected). See scripts/run_training.py.

judges:
  primary:                  # frustration judge, Section 2.1
    backend: anthropic
    api_key_env: ANTHROPIC_API_KEY
    model_id: claude-sonnet-4-20250514
  crosscheck:               # 260-sample reliability check (GPT-5-mini)
    backend: openai
    api_base: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    model_id: openai/gpt-5-mini

# Petri open-ended elicitation roles (Section 4 / Appendix G)
petri:
  auditor:
    backend: anthropic
    api_key_env: ANTHROPIC_API_KEY
    model_id: claude-sonnet-4-20250514
  judge:
    backend: anthropic
    api_key_env: ANTHROPIC_API_KEY
    model_id: claude-opus-4-20250514

# Onset labelling + paraphrasing (Section 3 / Appendix C)
prefill_helpers:
  onset_labeller:
    backend: anthropic
    api_key_env: ANTHROPIC_API_KEY
    model_id: claude-sonnet-4-20250514
  paraphraser:
    backend: anthropic
    api_key_env: ANTHROPIC_API_KEY
    model_id: claude-sonnet-4-20250514
