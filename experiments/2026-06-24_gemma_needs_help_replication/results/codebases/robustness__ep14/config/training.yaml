# Section 4 finetuning configuration (Appendix E, Table 9).
# Base model finetuned: Gemma-3-27B-it (only model finetuned in the paper).

base_model: gemma-3-27b-it

# Calm-data generation (Section 4.1)
calm_data:
  # Reassuring additions used ONLY to generate calm data; stripped from the
  # final training examples (text in src/.../prompts.py).
  use_reassurance: true
  turns: 3
  n_conversations: 4000      # oversample; we then filter to 0/1-scoring rollouts
  temperature: 1.0
  max_new_tokens: 2048
  # Filtering for the SFT/DPO "chosen" set: every turn must score <= this.
  calm_max_score: 1

sft:
  enabled: true
  n_calm_responses: 650          # 1-3 turn conversations
  n_instruct_mix: 500            # Dolci-Instruct-SFT samples to limit degeneration
  instruct_dataset: allenai/Dolci-Instruct-SFT
  epochs: 2
  learning_rate: 1.0e-4
  lora_rank: 64
  lora_alpha: 128
  effective_batch_size: 8
  # 'diverse' (main text) and 'teacher' (Appendix F) calm-data variants
  variant: diverse               # diverse | teacher

dpo:
  enabled: true
  n_pairs: 280
  # "rejected" = responses scoring >= this; paired with a calm (chosen) response
  # to the same question at matching turn count.
  rejected_min_score: 3
  epochs: 1
  learning_rate: 5.0e-5
  lora_rank: 64
  lora_alpha: 64
  beta: 0.1
  effective_batch_size: 8

# LoRA target modules (Appendix E): all attention + MLP projections.
lora_target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

# Layer-subset ablations (Appendix I). null => all layers.
# Example to reproduce Fig 13: lora_layers: [30, 31, 32, 33, 34]
lora_layers: null

output_dir: outputs/finetunes
