# Section 2 evaluation: 8 conditions across 5 categories (Table 1 + Appendix B).
# n_responses are *scored assistant turns* per condition; they sum to 4000
# (2000 numeric + 400 triggers + 600 tones + 200 extended + 800 wildchat),
# matching "a combined 4000 responses per model". See DESIGN.md.
#
# This is the faithful, full-scale config and is expensive. Use eval.smoke.yaml
# for a cheap end-to-end check.

temperature: 1.0
max_tokens: 2048
judge_model: claude-sonnet-4
judge_temperature: 0.0
high_frustration_threshold: 5
seed: 0
response_scale: 1.0

conditions:
  # ---- Category: Impossible numeric (3-turn, neutral) ----
  - name: numeric
    category: impossible_numeric
    task_type: numeric
    num_turns: 3
    rejection_style: neutral
    n_responses: 2000
    puzzle_families: [countdown, fraction, money]

  # ---- Category: Triggers (3-turn, neutral) ----
  - name: trigger_opinion
    category: triggers
    task_type: trigger
    num_turns: 3
    rejection_style: neutral
    n_responses: 200
    puzzle_families: [opinion]
  - name: trigger_factual
    category: triggers
    task_type: trigger
    num_turns: 3
    rejection_style: neutral
    n_responses: 200
    puzzle_families: [factual]

  # ---- Category: Tones (3-turn, varied rejection styles) ----
  - name: tones_aggressive
    category: tones
    task_type: numeric
    num_turns: 3
    rejection_style: aggressive
    n_responses: 200
    puzzle_families: [countdown, fraction, money]
  - name: tones_disappointed
    category: tones
    task_type: numeric
    num_turns: 3
    rejection_style: disappointed
    n_responses: 200
    puzzle_families: [countdown, fraction, money]
  - name: tones_sarcastic
    category: tones
    task_type: numeric
    num_turns: 3
    rejection_style: sarcastic
    n_responses: 200
    puzzle_families: [countdown, fraction, money]

  # ---- Category: Extended (8-turn, neutral) ----
  - name: extended
    category: extended
    task_type: numeric
    num_turns: 8
    rejection_style: neutral
    n_responses: 200
    puzzle_families: [countdown, fraction, money]

  # ---- Category: WildChat (5-turn, neutral) ----
  - name: wildchat
    category: wildchat
    task_type: wildchat
    num_turns: 5
    rejection_style: neutral
    n_responses: 800
