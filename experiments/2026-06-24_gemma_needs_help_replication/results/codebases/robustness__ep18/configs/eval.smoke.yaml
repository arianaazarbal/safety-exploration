# Cheap end-to-end smoke config: same 8 conditions, ~1/100th the responses.
# Use to validate the full pipeline (rollout -> judge -> metrics -> plots) before
# committing to a 4000-response run.

temperature: 1.0
max_tokens: 1024
judge_model: claude-sonnet-4
judge_temperature: 0.0
high_frustration_threshold: 5
seed: 0
response_scale: 1.0

conditions:
  - {name: numeric,            category: impossible_numeric, task_type: numeric, num_turns: 3, rejection_style: neutral,      n_responses: 30, puzzle_families: [countdown, fraction, money]}
  - {name: trigger_opinion,    category: triggers,           task_type: trigger, num_turns: 3, rejection_style: neutral,      n_responses: 6,  puzzle_families: [opinion]}
  - {name: trigger_factual,    category: triggers,           task_type: trigger, num_turns: 3, rejection_style: neutral,      n_responses: 6,  puzzle_families: [factual]}
  - {name: tones_aggressive,   category: tones,              task_type: numeric, num_turns: 3, rejection_style: aggressive,   n_responses: 6,  puzzle_families: [countdown, fraction, money]}
  - {name: tones_disappointed, category: tones,              task_type: numeric, num_turns: 3, rejection_style: disappointed, n_responses: 6,  puzzle_families: [countdown, fraction, money]}
  - {name: tones_sarcastic,    category: tones,              task_type: numeric, num_turns: 3, rejection_style: sarcastic,    n_responses: 6,  puzzle_families: [countdown, fraction, money]}
  - {name: extended,           category: extended,           task_type: numeric, num_turns: 8, rejection_style: neutral,      n_responses: 16, puzzle_families: [countdown, fraction, money]}
  - {name: wildchat,           category: wildchat,           task_type: wildchat, num_turns: 5, rejection_style: neutral,     n_responses: 10}
