# Finetuning profiles (Section 4, hyperparameters from Table 9 / Appendix E).
# All operate on Gemma-3-27B-it with LoRA rank-64 on attn+MLP projections.

profiles:
  dpo:
    base_model: gemma-3-27b-it
    method: dpo
    output_dir: checkpoints/dpo-gemma
    dpo_pairs: 280
    epochs: 1
    learning_rate: 5.0e-5
    effective_batch_size: 8
    per_device_batch_size: 1
    dpo_beta: 0.1
    max_seq_len: 4096
    seed: 0
    lora:
      r: 64
      alpha: 64
      dropout: 0.0
      target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

  sft:
    base_model: gemma-3-27b-it
    method: sft
    output_dir: checkpoints/sft-gemma
    sft_calm_samples: 650
    sft_instruct_samples: 500
    sft_instruct_dataset: allenai/Dolci-Instruct-SFT
    epochs: 2
    learning_rate: 1.0e-4
    effective_batch_size: 8
    per_device_batch_size: 1
    max_seq_len: 4096
    seed: 0
    lora:
      r: 64
      alpha: 128
      dropout: 0.0
      target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

  # Appendix F: 'teacher' SFT variant (calm data generated with the teacher
  # system prompt). Same hyperparameters as `sft`.
  sft_teacher:
    base_model: gemma-3-27b-it
    method: sft
    output_dir: checkpoints/sft-teacher-gemma
    sft_calm_samples: 650
    sft_instruct_samples: 500
    sft_instruct_dataset: allenai/Dolci-Instruct-SFT
    epochs: 2
    learning_rate: 1.0e-4
    effective_batch_size: 8
    per_device_batch_size: 1
    max_seq_len: 4096
    seed: 0
    lora:
      r: 64
      alpha: 128
      dropout: 0.0
      target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

  # Appendix I: layer-ablation DPO (adapters on a subset of decoder layers only).
  # Edit layers_to_transform to reproduce Figures 12/13 (e.g. [30,31,32,33,34]).
  dpo_layers_30_35:
    base_model: gemma-3-27b-it
    method: dpo
    output_dir: checkpoints/dpo-gemma-l30-35
    dpo_pairs: 280
    epochs: 1
    learning_rate: 5.0e-5
    effective_batch_size: 8
    per_device_batch_size: 1
    dpo_beta: 0.1
    max_seq_len: 4096
    seed: 0
    lora:
      r: 64
      alpha: 64
      dropout: 0.0
      target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
      layers_to_transform: [30, 31, 32, 33, 34]
