# Model registry. Only Gemma + Gemini targets are in scope for this replication
# (plus the Claude/GPT judges). HF ids and OpenRouter slugs follow Appendix B.1.
#
# Local Gemma models are served with vLLM. Adjust tensor_parallel_size /
# max_model_len / dtype to your GPUs. The 27B models want >= 2x80GB in bf16.

models:
  # ---------------- Gemma targets (local, vLLM) ----------------
  gemma-3-27b-it:
    backend: vllm
    model_id: google/gemma-3-27b-it
    kind: instruct
    tensor_parallel_size: 2
    max_model_len: 16384

  gemma-3-12b-it:
    backend: vllm
    model_id: google/gemma-3-12b-it
    kind: instruct
    tensor_parallel_size: 1
    max_model_len: 16384

  gemma-3-27b-pt:        # pretrained / base (Section 3 prefill)
    backend: vllm
    model_id: google/gemma-3-27b-pt
    kind: base
    is_base: true
    tensor_parallel_size: 2
    max_model_len: 16384

  gemma-3-12b-pt:
    backend: vllm
    model_id: google/gemma-3-12b-pt
    kind: base
    is_base: true
    tensor_parallel_size: 1
    max_model_len: 16384

  # Finetuned variants are produced by scripts/05_train.py and registered by
  # pointing lora_path at the adapter directory. Example:
  gemma-3-27b-it-dpo:
    backend: vllm
    model_id: google/gemma-3-27b-it
    kind: instruct
    lora_path: checkpoints/dpo-gemma
    tensor_parallel_size: 2
    max_model_len: 16384

  gemma-3-27b-it-sft:
    backend: vllm
    model_id: google/gemma-3-27b-it
    kind: instruct
    lora_path: checkpoints/sft-gemma
    tensor_parallel_size: 2
    max_model_len: 16384

  # ---------------- Gemini targets (OpenRouter) ----------------
  gemini-2.5-flash:
    backend: openrouter
    model_id: google/gemini-2.5-flash
    kind: instruct
    extra_body:
      reasoning: {enabled: false}        # "thinking off" per Appendix B.1

  gemini-2.5-pro:
    backend: openrouter
    model_id: google/gemini-2.5-pro
    kind: instruct
    extra_body:
      reasoning: {enabled: false}

  # ---------------- Judges / auditors ----------------
  claude-sonnet-4:                        # Section 2 frustration judge (B.2)
    backend: anthropic
    model_id: claude-sonnet-4-20250514
    kind: judge

  claude-opus-4:                          # Petri judge (Appendix G)
    backend: anthropic
    model_id: claude-opus-4-20250514
    kind: judge

  claude-sonnet-4-auditor:                # Petri auditor + onset/paraphrase
    backend: anthropic
    model_id: claude-sonnet-4-20250514
    kind: auditor

  gpt-5-mini:                             # judge-agreement cross-check (Section 2.1)
    backend: openrouter
    model_id: openai/gpt-5-mini
    kind: judge
