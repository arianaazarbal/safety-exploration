# Paper-scale configuration (mirrors the sampling sizes in Soligo et al.).
# WARNING: 4000 responses/model + 27B local inference is GPU- and API-expensive.
# Use config/smoke.yaml first to validate the pipeline.

models:
  - gemma-3-27b-it
  - gemma-3-12b-it
  - gemini-2.5-flash
  - gemini-2.5-pro

seed: 0
results_dir: results

sampling:
  impossible_numeric: 2000   # Appendix B per-category response counts
  triggers: 400
  tones: 600
  extended: 200
  wildchat: 800
  temperature: 1.0
  max_new_tokens: 2048

judge:
  provider: anthropic
  model: claude-sonnet-4-20250514
  crosscheck_provider: openai
  crosscheck_model: gpt-5-mini
  crosscheck_fraction: 0.065
  temperature: 0.0
  max_retries: 5

wildchat:
  dataset: allenai/WildChat-1M
  n_prompts: 20
  samples_per_prompt: 40
  allow_fallback: true

training:
  dpo_n_pairs: 280
  dpo_epochs: 1
  dpo_lr: 5.0e-5
  dpo_lora_rank: 64
  dpo_lora_alpha: 64
  dpo_beta: 0.1
  dpo_batch_size: 8
  sft_n_samples: 1150
  sft_n_calm: 650
  sft_n_instruct_mix: 500
  sft_epochs: 2
  sft_lr: 1.0e-4
  sft_lora_rank: 64
  sft_lora_alpha: 128
  sft_batch_size: 8

prefill:
  n_numeric: 10
  n_text: 10
  early_truncation_tokens: 20
  continuations_per_prefill: 50

petri:
  auditor_model: claude-sonnet-4-20250514
  judge_model: claude-opus-4-20250514
  transcripts_per_emotion: 10
  max_auditor_turns: 20
