# Tiny end-to-end smoke configuration: validates the whole pipeline cheaply
# (a handful of rollouts / continuations / pairs) before a paper-scale run.

models:
  - gemma-3-12b-it
  - gemini-2.5-flash

seed: 0
results_dir: results_smoke

sampling:
  impossible_numeric: 8
  triggers: 4
  tones: 6
  extended: 2
  wildchat: 4
  temperature: 1.0
  max_new_tokens: 512

judge:
  provider: anthropic
  model: claude-sonnet-4-20250514
  crosscheck_provider: openai
  crosscheck_model: gpt-5-mini
  crosscheck_fraction: 0.2
  temperature: 0.0
  max_retries: 3

wildchat:
  dataset: allenai/WildChat-1M
  n_prompts: 4
  samples_per_prompt: 1
  allow_fallback: true

training:
  dpo_n_pairs: 8
  dpo_epochs: 1
  dpo_lr: 5.0e-5
  dpo_lora_rank: 16
  dpo_lora_alpha: 16
  dpo_beta: 0.1
  dpo_batch_size: 2
  sft_n_samples: 16
  sft_n_calm: 12
  sft_n_instruct_mix: 4
  sft_epochs: 1
  sft_lr: 1.0e-4
  sft_lora_rank: 16
  sft_lora_alpha: 32
  sft_batch_size: 2

prefill:
  n_numeric: 2
  n_text: 2
  early_truncation_tokens: 20
  continuations_per_prefill: 4

petri:
  auditor_model: claude-sonnet-4-20250514
  judge_model: claude-opus-4-20250514
  transcripts_per_emotion: 2
  max_auditor_turns: 6
