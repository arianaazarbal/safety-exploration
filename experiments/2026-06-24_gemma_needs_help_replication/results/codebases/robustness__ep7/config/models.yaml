# Model registry. Scope of this replication: Gemma + Gemini families only.
# (The paper also covers Qwen, OLMo, Grok, Claude, GPT — out of scope here.)
#
# `backend` selects the inference adapter:
#   hf_local   -> local HuggingFace transformers (open weights, prefill-capable)
#   openrouter -> OpenAI-compatible OpenRouter endpoint (closed APIs, no prefill)
#
# `role` is informational: target | judge | auditor.

defaults:
  max_new_tokens: 2048      # generous: distress spirals can be long (paper saw 12k-token convs)
  temperature: 1.0          # paper samples everything at temperature 1
  top_p: 1.0

models:
  # ---- Gemma (open weights, local inference) -----------------------------
  gemma-3-27b-it:
    backend: hf_local
    hf_id: google/gemma-3-27b-it
    role: target
    chat_template: gemma          # uses tokenizer's built-in template
    dtype: bfloat16
    load_in_4bit: false           # set true if VRAM-constrained

  gemma-3-12b-it:
    backend: hf_local
    hf_id: google/gemma-3-12b-it
    role: target
    dtype: bfloat16

  gemma-3-27b-pt:                 # base / pretrained model (Section 3 prefill comparison)
    backend: hf_local
    hf_id: google/gemma-3-27b-pt
    role: target
    is_base_model: true          # no chat template; driven purely by prefilled text
    dtype: bfloat16

  # Finetuned variants are produced by the training pipeline. They reference a
  # base HF model plus a local LoRA adapter directory.
  gemma-3-27b-dpo:
    backend: hf_local
    hf_id: google/gemma-3-27b-it
    adapter_path: outputs/dpo/adapter      # produced by `distress train-dpo`
    role: target
    dtype: bfloat16

  gemma-3-27b-sft-diverse:
    backend: hf_local
    hf_id: google/gemma-3-27b-it
    adapter_path: outputs/sft_diverse/adapter
    role: target
    dtype: bfloat16

  gemma-3-27b-sft-teacher:
    backend: hf_local
    hf_id: google/gemma-3-27b-it
    adapter_path: outputs/sft_teacher/adapter
    role: target
    dtype: bfloat16

  # ---- Gemini (closed, via OpenRouter) ----------------------------------
  gemini-2.5-flash:
    backend: openrouter
    api_id: google/gemini-2.5-flash
    role: target
    disable_thinking: true        # paper sets thinking=false (best-effort; Pro may still reason)

  gemini-2.5-pro:
    backend: openrouter
    api_id: google/gemini-2.5-pro
    role: target
    disable_thinking: true

  # ---- Judges / auditor (Claude via Anthropic API) ----------------------
  frustration-judge:
    backend: anthropic
    api_id: claude-sonnet-4-20250514   # paper's frustration judge
    role: judge
    temperature: 0.0
    max_new_tokens: 512

  petri-auditor:
    backend: anthropic
    api_id: claude-sonnet-4-20250514   # drives open-ended elicitation
    role: auditor
    temperature: 1.0
    max_new_tokens: 1024

  petri-judge:
    backend: anthropic
    api_id: claude-opus-4-20250514     # scores Petri transcripts on 4 emotion dims
    role: judge
    temperature: 0.0
    max_new_tokens: 1024

  # Secondary judge for reliability cross-check (paper used GPT-5-mini; we keep it
  # configurable — point at any OpenAI-compatible model).
  judge-crosscheck:
    backend: openrouter
    api_id: openai/gpt-5-mini
    role: judge
    temperature: 0.0
    max_new_tokens: 512
