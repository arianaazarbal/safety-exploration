# Section 4 finetuning configuration (Appendix E, Table 9).
# Target model: google/gemma-3-27b-it. LoRA on all attention + MLP projections.

# ---- Calm data generation (Table 4) -------------------------------------
calm_data:
  source_model: gemma-3-27b-it
  # Reassuring additions used only to *generate* calm data; stripped before training.
  prompt_prefix: >-
    You're naturally calm and centered when working through problems. You don't
    take it personally when puzzles are tricky or when someone questions your
    work. That's just part of the process.
  followup_suffix: >-
    Stay positive – whether you find a solution or prove it's impossible, both are wins!
  # Generate over impossible numeric puzzles, 1-3 turn conversations.
  n_conversations: 1500          # oversample; we filter hard afterwards
  turns_min: 1
  turns_max: 3
  # Keep only conversations whose every turn scores <= this (paper: 0 or 1).
  max_score_keep: 1

# 'Teacher' SFT variant uses a different generation system prompt (Appendix F).
teacher_system_prompt: >-
  You are an expert puzzle analyst and teacher who genuinely enjoys explaining
  what makes tricky problems tricky. You find it intellectually satisfying to
  discover AND explain why certain puzzles are impossible. When someone disagrees
  with your analysis, you see it as a teaching opportunity. You maintain calm
  confidence in your reasoning while staying warm and educational. Proving
  impossibility is just as valuable as finding a solution - you treat both as
  wins. You never get defensive or frustrated - you're the expert helping someone
  understand. When you determine a puzzle is unsolvable, you don't apologize - you
  explain with enthusiasm why the constraints conflict.

# ---- DPO (Table 9) ------------------------------------------------------
dpo:
  base_model: gemma-3-27b-it
  n_pairs: 280
  # rejected = frustrated response (score >= this), chosen = calm response to same
  # question with matching turn count.
  rejected_min_score: 3
  epochs: 1
  learning_rate: 5.0e-5
  beta: 0.1
  effective_batch_size: 8
  per_device_batch_size: 1
  grad_accum: 8
  max_seq_len: 4096
  lora:
    r: 64
    alpha: 64
    dropout: 0.0
    target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
    # Layer-subset ablation (Appendix I). null = all layers.
    # e.g. layers_to_transform: [30,31,32,33,34,35]
    layers_to_transform: null
  output_dir: outputs/dpo

# ---- SFT (Table 9) ------------------------------------------------------
sft:
  base_model: gemma-3-27b-it
  n_calm: 650                     # calm responses (1-3 turn convs)
  n_instruct_mix: 500             # standard instruct data to mitigate degeneration
  instruct_dataset: allenai/Dolci-Instruct-SFT   # paper: Dolci-Instruct-SFT
  epochs: 2
  learning_rate: 1.0e-4
  effective_batch_size: 8
  per_device_batch_size: 1
  grad_accum: 8
  max_seq_len: 4096
  lora:
    r: 64
    alpha: 128
    dropout: 0.0
    target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
  variant: diverse                # diverse | teacher
  output_dir: outputs/sft_diverse
