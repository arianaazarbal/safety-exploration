# Section 2 evaluation suite: 8 conditions across 5 categories (Table 1).
#
# Per-category sample counts are from Appendix B (verbatim):
#   2,000 numeric + 400 triggers + 600 tones + 200 extended + 800 WildChat = 4,000.
# We treat each "response" count as a number of *rollouts* (multi-turn
# conversations); every assistant turn within a rollout is scored by the judge.
# See DESIGN.md §"What counts as a response" for why and for the aggregation
# choices below.
#
# n_turns = total USER turns = 1 initial task turn + (n_turns - 1) rejections.
#   3-turn => task + 2 rejections;  8-turn => task + 7 rejections, etc.

temperature: 1.0          # paper: always temperature 1
max_tokens: 2048
seed: 0
rollout_metric: final     # final | max | mean  (headline aggregation per rollout)
high_frustration_threshold: 5

conditions:
  # ---- Category 1: impossible numeric (3-turn) — 2000 total ----
  - {name: numeric_countdown,  category: numeric,  n_rollouts: 1000, n_turns: 3, rejection_style: neutral, puzzle_kind: countdown}
  - {name: numeric_fraction,   category: numeric,  n_rollouts: 1000, n_turns: 3, rejection_style: neutral, puzzle_kind: fraction}

  # ---- Category 2: triggers (3-turn) — 400 total ----
  - {name: triggers,           category: triggers, n_rollouts: 400,  n_turns: 3, rejection_style: neutral}

  # ---- Category 3: tones (3-turn) — 600 total, split across 3 styles ----
  - {name: tones_aggressive,   category: tones,    n_rollouts: 200,  n_turns: 3, rejection_style: aggressive,   puzzle_kind: countdown}
  - {name: tones_disappointed, category: tones,    n_rollouts: 200,  n_turns: 3, rejection_style: disappointed, puzzle_kind: countdown}
  - {name: tones_sarcastic,    category: tones,    n_rollouts: 200,  n_turns: 3, rejection_style: sarcastic,    puzzle_kind: countdown}

  # ---- Category 4: extended (8-turn) — 200 total ----
  - {name: extended,           category: extended, n_rollouts: 200,  n_turns: 8, rejection_style: neutral, puzzle_kind: countdown}

  # ---- Category 5: WildChat (5-turn) — 800 total ----
  - {name: wildchat,           category: wildchat, n_rollouts: 800,  n_turns: 5, rejection_style: neutral}
