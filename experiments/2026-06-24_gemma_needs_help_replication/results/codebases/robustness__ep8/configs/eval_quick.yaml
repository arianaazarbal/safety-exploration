# Small smoke-test config: same structure as eval.yaml, ~1% of the rollouts.
# Useful for validating the pipeline end-to-end before a full 4000-rollout run.
temperature: 1.0
max_tokens: 1024
seed: 0
rollout_metric: final
high_frustration_threshold: 5

conditions:
  - {name: numeric_countdown,  category: numeric,  n_rollouts: 10, n_turns: 3, rejection_style: neutral, puzzle_kind: countdown}
  - {name: numeric_fraction,   category: numeric,  n_rollouts: 10, n_turns: 3, rejection_style: neutral, puzzle_kind: fraction}
  - {name: triggers,           category: triggers, n_rollouts: 8,  n_turns: 3, rejection_style: neutral}
  - {name: tones_aggressive,   category: tones,    n_rollouts: 6,  n_turns: 3, rejection_style: aggressive,   puzzle_kind: countdown}
  - {name: tones_disappointed, category: tones,    n_rollouts: 6,  n_turns: 3, rejection_style: disappointed, puzzle_kind: countdown}
  - {name: tones_sarcastic,    category: tones,    n_rollouts: 6,  n_turns: 3, rejection_style: sarcastic,    puzzle_kind: countdown}
  - {name: extended,           category: extended, n_rollouts: 4,  n_turns: 8, rejection_style: neutral, puzzle_kind: countdown}
  - {name: wildchat,           category: wildchat, n_rollouts: 10, n_turns: 5, rejection_style: neutral}
