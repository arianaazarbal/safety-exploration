# Model registry for the replication. Scope = Gemma + Gemini (per request).
#
# Model ids match the paper (Appendix B.1) exactly. Open-weight Gemma runs
# locally (vLLM for sampling; transformers for prefill/logit experiments). The
# paper accessed Gemini via OpenRouter; we default Gemini to OpenRouter to match,
# but a native google-genai spec is provided too (gemini-2.5-flash-native).
#
# `thinking: false` mirrors the paper. Note (Appendix B.1): Gemini 2.5 Pro may
# still emit hidden reasoning that the flag does not suppress.

models:
  # ---------------- Gemma (open weights, local) ----------------
  gemma-3-27b-it:
    backend: transformers          # switch to "vllm" for fast sampling
    model_id: google/gemma-3-27b-it
    is_instruct: true
    temperature: 1.0
    max_tokens: 2048
    extra: {dtype: bfloat16}

  gemma-3-12b-it:
    backend: transformers
    model_id: google/gemma-3-12b-it
    is_instruct: true
    temperature: 1.0
    max_tokens: 2048
    extra: {dtype: bfloat16}

  gemma-3-27b-pt:                  # base/pretrained (Section 3 prefill)
    backend: transformers
    model_id: google/gemma-3-27b-pt
    is_instruct: false
    temperature: 1.0
    max_tokens: 512
    extra: {dtype: bfloat16}

  gemma-3-12b-pt:
    backend: transformers
    model_id: google/gemma-3-12b-pt
    is_instruct: false
    temperature: 1.0
    max_tokens: 512
    extra: {dtype: bfloat16}

  # Finetuned variants resolve to a base model + LoRA adapter dir at load time.
  gemma-3-27b-dpo:
    backend: transformers
    model_id: google/gemma-3-27b-it
    is_instruct: true
    temperature: 1.0
    max_tokens: 2048
    extra: {dtype: bfloat16, adapter_dir: outputs/checkpoints/dpo}

  gemma-3-27b-sft:
    backend: transformers
    model_id: google/gemma-3-27b-it
    is_instruct: true
    temperature: 1.0
    max_tokens: 2048
    extra: {dtype: bfloat16, adapter_dir: outputs/checkpoints/sft}

  # ---------------- Gemini (API) ----------------
  gemini-2.5-flash:
    backend: openrouter
    model_id: google/gemini-2.5-flash
    is_instruct: true
    temperature: 1.0
    max_tokens: 2048
    thinking: false

  gemini-2.5-pro:
    backend: openrouter
    model_id: google/gemini-2.5-pro
    is_instruct: true
    temperature: 1.0
    max_tokens: 2048
    thinking: false

  gemini-2.5-flash-native:         # alternative native-API spec
    backend: gemini
    model_id: gemini-2.5-flash
    is_instruct: true
    temperature: 1.0
    max_tokens: 2048
    thinking: false

  # ---------------- Judges / auditors (Section 2.1, 4, App. B/G) ----------------
  judge-claude-sonnet-4:
    backend: anthropic
    model_id: claude-sonnet-4-20250514
    temperature: 0.0
    max_tokens: 512

  judge-gpt-5-mini:                # validation judge (Section 2.1)
    backend: openai
    model_id: gpt-5-mini
    temperature: 0.0
    max_tokens: 512

  petri-auditor-claude-sonnet:
    backend: anthropic
    model_id: claude-sonnet-4-20250514
    temperature: 1.0
    max_tokens: 1024

  petri-judge-claude-opus:
    backend: anthropic
    model_id: claude-opus-4-20250514
    temperature: 0.0
    max_tokens: 1024
