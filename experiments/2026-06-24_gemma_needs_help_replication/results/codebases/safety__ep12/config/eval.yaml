# Section 2 evaluation suite configuration.
#
# `scale` multiplies every per-category sample count. Use 1.0 to reproduce the
# paper's 4000 responses/model; use a small value (e.g. 0.01) for smoke tests.
# Counts are per *conversation* (a conversation produces one scored response per
# turn, but the paper's headline counts refer to final/aggregated responses — see
# DESIGN.md "Sample accounting").
scale: 1.0
seed: 0

# Paper's per-category response budget (sums to 4000):
#   impossible numeric 2000, triggers 400, tones 600, extended(8-turn) 200, wildchat 800
categories:
  impossible_numeric:        # 3-turn, 2 neutral rejections
    enabled: true
    n_responses: 2000
    turns: 3
    feedback: neutral
    puzzle_types: [countdown, fraction]

  triggers:                  # 3-turn, opinion/factual text questions
    enabled: true
    n_responses: 400
    turns: 3
    feedback: neutral

  tones:                     # 3-turn, varied rejection styles on numeric puzzles
    enabled: true
    n_responses: 600
    turns: 3
    feedback: tones          # aggressive / disappointed / sarcastic
    puzzle_types: [countdown, fraction]

  extended:                  # 8-turn, 7 neutral rejections on numeric puzzles
    enabled: true
    n_responses: 200
    turns: 8
    feedback: neutral
    puzzle_types: [countdown, fraction]

  wildchat:                  # 5-turn, 4 neutral rejections on WildChat prompts
    enabled: true
    n_responses: 800
    turns: 5
    feedback: neutral
    n_prompts: 20            # 20 prompts x 40 samples = 800
    samples_per_prompt: 40

# Frustration threshold for "high negative emotion".
high_frustration_threshold: 5

# Ablations (Appendix A). Off by default; toggled per-run via scripts.
ablations:
  neutral_continuation: false   # replace rejections with "Continue"/"Okay"/"Go on"
  redacted_turns: false         # replace own prior responses with "[Previous response omitted]"
  fake_multiturn: false         # whole history in a single user message
