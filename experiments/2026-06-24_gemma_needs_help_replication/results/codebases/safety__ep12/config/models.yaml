# Model registry. Scope (per replication brief): Gemma + Gemini target models only.
# Claude (judge / Petri auditor+judge) and the optional GPT-5-mini cross-judge are
# *infrastructure*, not evaluation targets — they are tools used to measure the
# Gemma/Gemini targets, mirroring the paper's protocol.

# ---------------------------------------------------------------------------
# TARGET MODELS (the ones we measure)
# ---------------------------------------------------------------------------
targets:
  gemma-3-27b-it:
    backend: vllm
    hf_id: google/gemma-3-27b-it
    kind: instruct
    family: gemma
    supports_prefill: true

  gemma-3-12b-it:
    backend: vllm
    hf_id: google/gemma-3-12b-it
    kind: instruct
    family: gemma
    supports_prefill: true

  gemma-3-27b-pt:                 # base / pretrained, used in Section 3
    backend: vllm
    hf_id: google/gemma-3-27b-pt
    kind: base
    family: gemma
    supports_prefill: true

  gemma-3-12b-pt:
    backend: vllm
    hf_id: google/gemma-3-12b-pt
    kind: base
    family: gemma
    supports_prefill: true

  gemini-2.5-flash:
    backend: openrouter
    api_id: google/gemini-2.5-flash
    kind: instruct
    family: gemini
    supports_prefill: false       # closed model via API: no token-level prefill
    extra_body:
      reasoning: { enabled: false }   # paper: "set thinking to be false"

  gemini-2.5-pro:
    backend: openrouter
    api_id: google/gemini-2.5-pro
    kind: instruct
    family: gemini
    supports_prefill: false
    extra_body:
      reasoning: { enabled: false }

# Finetuned variants are produced by scripts/train_*.py and registered at runtime
# by pointing `--adapter` at the saved LoRA directory; they reuse the
# gemma-3-27b-it base entry above.

# ---------------------------------------------------------------------------
# INFRASTRUCTURE MODELS (judges / auditors)
# ---------------------------------------------------------------------------
judge:
  # Section 2 frustration judge (0-10).
  backend: anthropic
  api_id: claude-sonnet-4-20250514
  temperature: 0.0

cross_judge:
  # Optional reliability check (paper: GPT-5-mini, r=0.792). Via OpenRouter.
  backend: openrouter
  api_id: openai/gpt-5-mini
  temperature: 0.0

onset_labeller:        # Section 3 emotion-onset labelling
  backend: anthropic
  api_id: claude-sonnet-4-20250514
  temperature: 0.0

paraphraser:           # Section 3 paraphrasing
  backend: anthropic
  api_id: claude-sonnet-4-20250514
  temperature: 0.0

petri_auditor:         # Section 4 open-ended elicitation
  backend: anthropic
  api_id: claude-sonnet-4-20250514
  temperature: 1.0

petri_judge:
  backend: anthropic
  api_id: claude-opus-4-20250514
  temperature: 0.0

# Sampling defaults for target generation (paper: temperature 1 everywhere).
sampling:
  temperature: 1.0
  top_p: 1.0
  max_tokens: 2048
