# Section 4 finetuning configuration (Gemma-3-27B-it only, per paper).

# --- Calm data generation (used for both DPO chosen responses and SFT) ---
calm_data:
  source_model: gemma-3-27b-it
  n_conversations: 2000          # oversample; filtered down to all-turns <=1
  turn_counts: [1, 2, 3]         # 1-3 turn conversations
  puzzle_types: [countdown, fraction]
  # Reassuring additions (Table 4) — verbatim text lives in prompts.py.
  use_reassuring_prefix: true
  use_reassuring_suffix: true
  keep_max_score: 1              # filter to responses scoring 0 or 1 across ALL turns

# --- DPO ---
dpo:
  base_model: gemma-3-27b-it
  n_pairs: 280
  rejected_min_score: 3          # pair frustrated (score >=3) with calm (<=1), same question+turns
  epochs: 1
  learning_rate: 5.0e-5
  beta: 0.1
  lora_rank: 64
  lora_alpha: 64
  effective_batch_size: 8
  target_layers: all             # "all" or an explicit list e.g. [30,31,32,33,34,35] (Appendix I ablation)
  lora_target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

# --- SFT ---
sft:
  base_model: gemma-3-27b-it
  n_calm: 650                    # calm responses, 1-3 turn conversations
  n_instruct_mix: 500            # Dolci-Instruct-SFT samples to mitigate degeneration
  instruct_dataset: allenai/Dolci-Instruct-SFT
  epochs: 2
  learning_rate: 1.0e-4
  lora_rank: 64
  lora_alpha: 128
  effective_batch_size: 8
  lora_target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
  variant: diverse               # "diverse" (calm data) or "teacher" (teacher system prompt)

# --- Petri open-ended elicitation ---
petri:
  emotions: [anger, fear, depression, frustration]
  transcripts_per_emotion: 10
  max_turns: 20
  bootstrap_iters: 1000

# --- Capability preservation benchmarks ---
capabilities:
  benchmarks: [aime, math, gpqa, bbh, truthfulqa, emobench]
  n_per_benchmark: 100           # subset size; paper uses subsets
