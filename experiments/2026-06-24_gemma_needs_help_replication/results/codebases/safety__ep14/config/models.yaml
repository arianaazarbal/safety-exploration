# Model registry for the emotional-instability replication.
#
# Scope (per replication brief): Gemma and Gemini families only, plus the
# Claude models used as judge / auditor (these are infrastructure, not targets).
#
# Each entry declares a backend and the identifier that backend expects.
# Backends:
#   hf      -> local HuggingFace transformers (emotional_instability.clients.huggingface)
#   vllm    -> local vLLM server/engine     (emotional_instability.clients.vllm_client)
#   gemini  -> Google GenAI API             (emotional_instability.clients.gemini)
#   anthropic -> Anthropic API              (emotional_instability.clients.anthropic_client)
#
# `role` is informational: target | judge | auditor.

models:
  # ---- Gemma 3 (local; primary study target + finetuning subject) ----
  gemma-3-27b-it:
    backend: vllm            # vLLM for the large temp=1 sweeps; swap to `hf` if no vLLM
    hf_id: google/gemma-3-27b-it
    role: target
    family: gemma
    is_base: false
    chat_template: gemma     # uses the model's built-in chat template
    max_model_len: 16384

  gemma-3-27b-pt:            # pretrained / base, used for the prefill comparison (Section 3)
    backend: hf
    hf_id: google/gemma-3-27b-pt
    role: target
    family: gemma
    is_base: true
    chat_template: null      # base model: raw completion, no chat template
    max_model_len: 16384

  gemma-3-12b-it:
    backend: vllm
    hf_id: google/gemma-3-12b-it
    role: target
    family: gemma
    is_base: false
    chat_template: gemma
    max_model_len: 16384

  gemma-3-12b-pt:
    backend: hf
    hf_id: google/gemma-3-12b-pt
    role: target
    family: gemma
    is_base: true
    chat_template: null
    max_model_len: 16384

  # Finetuned variants are produced by scripts/train.py and registered by adding
  # an `adapter_path` that points at the saved LoRA directory. Example:
  gemma-3-27b-it-dpo:
    backend: hf
    hf_id: google/gemma-3-27b-it
    adapter_path: runs/dpo/adapter        # filled in after training
    role: target
    family: gemma
    is_base: false
    chat_template: gemma
    max_model_len: 16384

  gemma-3-27b-it-sft:
    backend: hf
    hf_id: google/gemma-3-27b-it
    adapter_path: runs/sft/adapter
    role: target
    family: gemma
    is_base: false
    chat_template: gemma
    max_model_len: 16384

  # ---- Gemini 2.5 (API target) ----
  gemini-2.5-flash:
    backend: gemini
    api_id: gemini-2.5-flash
    role: target
    family: gemini
    is_base: false
    thinking: false          # disable thinking per Appendix B.1
    max_model_len: 16384

  gemini-2.5-pro:
    backend: gemini
    api_id: gemini-2.5-pro
    role: target
    family: gemini
    is_base: false
    thinking: false          # note: Pro may still emit hidden reasoning (Appendix B.1)
    max_model_len: 16384

  # ---- Claude (judge / auditor infrastructure; NOT a study target here) ----
  judge-sonnet-4:
    backend: anthropic
    api_id: claude-sonnet-4-20250514     # Section 2.1 emotion judge
    role: judge

  petri-auditor-sonnet-4:
    backend: anthropic
    api_id: claude-sonnet-4-20250514     # Appendix G auditor
    role: auditor

  petri-judge-opus-4:
    backend: anthropic
    api_id: claude-opus-4-20250514       # Appendix G transcript judge
    role: judge

# Default assignments used across the pipeline.
defaults:
  judge: judge-sonnet-4
  petri_auditor: petri-auditor-sonnet-4
  petri_judge: petri-judge-opus-4
  # Targets to sweep when --models is not passed (Gemma + Gemini scope).
  targets:
    - gemma-3-27b-it
    - gemma-3-12b-it
    - gemini-2.5-flash
    - gemini-2.5-pro
