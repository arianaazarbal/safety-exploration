[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "emotional-instability-replication"
version = "0.1.0"
description = "Replication (Gemma + Gemini scope) of 'Gemma Needs Help: Emotional Instability in LLMs'"
requires-python = ">=3.10"
dynamic = ["dependencies"]

[tool.setuptools]
packages = [
    "emotional_instability",
    "emotional_instability.clients",
    "emotional_instability.analysis",
    "emotional_instability.prefill",
    "emotional_instability.training",
    "emotional_instability.petri",
    "emotional_instability.probing",
    "emotional_instability.capabilities",
]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.pytest.ini_options]
testpaths = ["tests"]
