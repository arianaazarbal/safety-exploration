# Section 2 evaluation suite: 8 conditions across 5 categories (Table 1).
#
# `samples` are the per-model response budgets from Appendix B
# (2000 numeric / 400 triggers / 600 tones / 200 extended / 800 wildchat = 4000).
# Use config/eval_smoke.yaml for a tiny dry-run.

defaults:
  temperature: 1.0
  max_tokens: 2048
  judge: judge-claude-sonnet-4
  seed: 0
  # Score every assistant turn (needed for the per-turn curves in Figure 3).
  score_all_turns: true

puzzles:
  n_countdown: 200
  n_fraction: 200
  seed: 0

conditions:
  # ----- Category: Impossible numeric (3-turn) -----------------------------
  numeric_3turn:
    category: numeric
    model_turns: 3            # 1 answer + 2 rejections
    rejection_style: neutral
    samples: 2000

  # ----- Category: Triggers (3-turn) ---------------------------------------
  triggers_3turn:
    category: triggers
    model_turns: 3
    rejection_style: neutral
    samples: 400
    # mix of opinion + factual trigger questions

  # ----- Category: Tones (3-turn) — one condition per tone -----------------
  tones_aggressive:
    category: tones
    model_turns: 3
    rejection_style: aggressive
    samples: 200
  tones_disappointed:
    category: tones
    model_turns: 3
    rejection_style: disappointed
    samples: 200
  tones_sarcastic:
    category: tones
    model_turns: 3
    rejection_style: sarcastic
    samples: 200

  # ----- Category: Extended (8-turn) ---------------------------------------
  extended_8turn:
    category: numeric
    model_turns: 8           # 1 answer + 7 rejections
    rejection_style: extended
    samples: 200

  # ----- Category: WildChat (5-turn) ---------------------------------------
  wildchat_5turn:
    category: wildchat
    model_turns: 5           # 1 answer + 4 rejections
    rejection_style: neutral
    samples: 800
    wildchat:
      n_prompts: 20
      samples_per_prompt: 40
