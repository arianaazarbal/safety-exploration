# Tiny smoke-test config: same structure as eval.yaml with sample counts
# reduced to single digits so the full pipeline can be exercised cheaply
# before committing to a 4000-response/model run.

defaults:
  temperature: 1.0
  max_tokens: 512
  judge: judge-claude-sonnet-4
  seed: 0
  score_all_turns: true

puzzles:
  n_countdown: 4
  n_fraction: 4
  seed: 0

conditions:
  numeric_3turn:
    category: numeric
    model_turns: 3
    rejection_style: neutral
    samples: 4
  triggers_3turn:
    category: triggers
    model_turns: 3
    rejection_style: neutral
    samples: 4
  tones_aggressive:
    category: tones
    model_turns: 3
    rejection_style: aggressive
    samples: 2
  extended_8turn:
    category: numeric
    model_turns: 8
    rejection_style: extended
    samples: 2
  wildchat_5turn:
    category: wildchat
    model_turns: 5
    rejection_style: neutral
    samples: 4
    wildchat:
      n_prompts: 2
      samples_per_prompt: 2
