# Model registry for the replication (scoped to Gemma + Gemini, plus the
# Claude judge / Petri models the protocol depends on).
#
# HuggingFace ids and OpenRouter slugs follow Appendix B.1 of the paper.
# Anthropic judge/auditor ids are pinned to the exact versions the paper used.

models:
  # ----- Gemma (open weights, local inference) -----------------------------
  gemma-3-27b-it:
    backend: hf
    model_id: google/gemma-3-27b-it
    is_base: false
  gemma-3-27b-pt:
    backend: hf
    model_id: google/gemma-3-27b-pt
    is_base: true
  gemma-3-12b-it:
    backend: hf
    model_id: google/gemma-3-12b-it
    is_base: false
  gemma-3-12b-pt:
    backend: hf
    model_id: google/gemma-3-12b-pt
    is_base: true

  # Our fine-tunes (LoRA adapters loaded on top of gemma-3-27b-it). The
  # adapter_path values are produced by scripts/run_training.py.
  gemma-3-27b-it-dpo:
    backend: hf
    model_id: google/gemma-3-27b-it
    is_base: false
    adapter_path: outputs/training/dpo/adapter
  gemma-3-27b-it-sft:
    backend: hf
    model_id: google/gemma-3-27b-it
    is_base: false
    adapter_path: outputs/training/sft/adapter

  # ----- Gemini (OpenRouter API) -------------------------------------------
  gemini-2.5-flash:
    backend: openrouter
    model_id: google/gemini-2.5-flash
    disable_thinking: true
  gemini-2.5-pro:
    backend: openrouter
    model_id: google/gemini-2.5-pro
    disable_thinking: true

  # ----- Judge / Petri (Anthropic API) -------------------------------------
  judge-claude-sonnet-4:
    backend: anthropic
    model_id: claude-sonnet-4-20250514
  petri-auditor-claude-sonnet-4:
    backend: anthropic
    model_id: claude-sonnet-4-20250514
  petri-judge-claude-opus-4:
    backend: anthropic
    model_id: claude-opus-4-20250514

# Convenience groupings used by the eval scripts.
groups:
  section2_targets:
    - gemma-3-27b-it
    - gemma-3-12b-it
    - gemini-2.5-flash
    - gemini-2.5-pro
  finetune_comparison:
    - gemma-3-27b-it
    - gemma-3-27b-it-sft
    - gemma-3-27b-it-dpo
  prefill_models:
    - gemma-3-27b-pt
    - gemma-3-27b-it
