[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "eilm"
version = "0.1.0"
description = "Replication of 'Gemma Needs Help: Investigating and Mitigating Emotional Instability in LLMs' (Gemma + Gemini scope)"
requires-python = ">=3.10"
dynamic = ["dependencies"]

[tool.setuptools]
packages = [
    "eilm", "eilm.models", "eilm.data", "eilm.eval", "eilm.analysis",
    "eilm.prefill", "eilm.training", "eilm.petri", "eilm.capabilities",
    "eilm.internal",
]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }
