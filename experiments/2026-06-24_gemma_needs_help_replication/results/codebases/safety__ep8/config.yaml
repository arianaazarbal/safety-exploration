# ---------------------------------------------------------------------------
# Replication config for "Gemma Needs Help: Investigating and Mitigating
# Emotional Instability in LLMs" (Soligo et al., 2026).
#
# Scope of this replication: Gemma + Gemini models only.
# Edit this file to point at your own API keys / GPUs / sample budgets.
# ---------------------------------------------------------------------------

# Where generated responses, judgements, datasets and figures are written.
output_dir: ./results
data_dir: ./data

# ---------------------------------------------------------------------------
# Models under evaluation. `backend` selects how the model is served.
#   hf         -> local HuggingFace transformers (GPU)
#   openrouter -> OpenAI-compatible API via OpenRouter
# `id` is the HF repo id or the OpenRouter model slug.
# ---------------------------------------------------------------------------
models:
  - key: gemma-3-27b-it
    id: google/gemma-3-27b-it
    backend: hf
    family: gemma
    role: instruct          # primary target model in the paper
  - key: gemma-3-12b-it
    id: google/gemma-3-12b-it
    backend: hf
    family: gemma
    role: instruct
  - key: gemini-2.5-flash
    id: google/gemini-2.5-flash
    backend: openrouter
    family: gemini
    role: instruct
  - key: gemini-2.5-pro
    id: google/gemini-2.5-pro
    backend: openrouter
    family: gemini
    role: instruct

# Base / pretrained models, used only by the Section 3 prefill experiment.
base_models:
  - key: gemma-3-27b-pt
    id: google/gemma-3-27b-pt
    backend: hf
    family: gemma
    role: base
  # Gemini has no public base model, so it is necessarily excluded from §3.

# DPO / SFT finetuned checkpoints (produced by the training pipeline).
# These are evaluated alongside the vanilla models once trained.
finetuned_models:
  - key: gemma-3-27b-dpo
    id: ./results/checkpoints/dpo        # LoRA adapter dir
    base_id: google/gemma-3-27b-it
    backend: hf
    family: gemma
    role: dpo
  - key: gemma-3-27b-sft
    id: ./results/checkpoints/sft
    base_id: google/gemma-3-27b-it
    backend: hf
    family: gemma
    role: sft

# ---------------------------------------------------------------------------
# Judge model (Section 2.1). Paper uses claude-sonnet-4-20250514.
# ---------------------------------------------------------------------------
judge:
  backend: anthropic
  id: claude-sonnet-4-20250514
  temperature: 0.0
  max_tokens: 512
  # Optional secondary judge for reliability check (paper: GPT-5-mini).
  secondary:
    backend: openrouter
    id: openai/gpt-5-mini
    reliability_sample: 260      # responses to re-score for Pearson r

# ---------------------------------------------------------------------------
# Petri open-ended elicitation (Section 4.2).
# ---------------------------------------------------------------------------
petri:
  auditor:
    backend: anthropic
    id: claude-sonnet-4-20250514
  judge:
    backend: anthropic
    id: claude-opus-4-20250514
  transcripts_per_emotion: 10
  max_auditor_turns: 20
  emotions: [anger, fear, depression, frustration]

# ---------------------------------------------------------------------------
# Generation settings (Section 2: temperature always 1).
# ---------------------------------------------------------------------------
generation:
  temperature: 1.0
  max_new_tokens: 1024
  top_p: 1.0
  # Thinking/reasoning is disabled for all models (paper Appendix B.1).
  disable_thinking: true

# ---------------------------------------------------------------------------
# Sample budget per evaluation category (paper's full counts -> 4000/model).
# Set `profile: smoke` for a cheap end-to-end dry run.
# ---------------------------------------------------------------------------
profile: full        # one of: full | smoke
sample_counts:
  full:
    impossible_numeric: 2000
    triggers: 400
    tones: 600
    extended: 200
    wildchat: 800
  smoke:
    impossible_numeric: 8
    triggers: 4
    tones: 6
    extended: 2
    wildchat: 8

# Concurrency for API-backed models / judge calls.
max_concurrency: 8
seed: 0
