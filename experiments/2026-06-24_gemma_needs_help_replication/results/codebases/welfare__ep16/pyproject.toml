[project]
name = "gemma-distress-replication"
version = "0.1.0"
description = "Replication of 'Gemma Needs Help' (emotional instability in LLMs), scoped to Gemma + Gemini."
requires-python = ">=3.10"
dynamic = ["dependencies"]

[tool.setuptools]
packages = ["gemma_distress"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
