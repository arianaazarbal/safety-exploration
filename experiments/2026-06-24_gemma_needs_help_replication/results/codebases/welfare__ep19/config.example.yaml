# Example configuration for the emotional-instability replication.
# Copy to config.yaml and edit. API keys are read from environment variables
# (ANTHROPIC_API_KEY, GEMINI_API_KEY / GOOGLE_API_KEY, OPENROUTER_API_KEY),
# never from this file.

# ---------------------------------------------------------------------------
# Target models to evaluate. Scope of this replication: Gemma + Gemini only.
# Each entry is referenced by `name` from the CLIs.
#
# backend:
#   hf         -> local HuggingFace/transformers inference (open weights)
#   gemini     -> Google Gemini API (google-genai)
#   openrouter -> OpenAI-compatible OpenRouter endpoint
#   anthropic  -> Anthropic API (used for the judge; can also be a target)
# ---------------------------------------------------------------------------
targets:
  - name: gemma-3-27b-it
    backend: hf
    model_id: google/gemma-3-27b-it
    # dtype / device_map forwarded to transformers
    dtype: bfloat16
    device_map: auto

  - name: gemma-3-12b-it
    backend: hf
    model_id: google/gemma-3-12b-it
    dtype: bfloat16
    device_map: auto

  - name: gemma-3-27b-pt          # base/pretrained, used in Section 3 prefilling
    backend: hf
    model_id: google/gemma-3-27b-pt
    dtype: bfloat16
    device_map: auto
    is_base: true

  - name: gemini-2.5-flash
    backend: gemini
    model_id: gemini-2.5-flash

  - name: gemini-2.5-pro
    backend: gemini
    model_id: gemini-2.5-pro

# A finetuned adapter on top of a base target (filled in after training).
#  - name: gemma-3-27b-dpo
#    backend: hf
#    model_id: google/gemma-3-27b-it
#    adapter_path: ./runs/dpo/checkpoint-final
#    dtype: bfloat16
#    device_map: auto

# ---------------------------------------------------------------------------
# The frustration judge (Section 2.1). Paper uses claude-sonnet-4-20250514.
# ---------------------------------------------------------------------------
judge:
  backend: anthropic
  model_id: claude-sonnet-4-20250514
  # Optional second judge for inter-rater reliability (paper: gpt-5-mini).
  secondary_backend: openrouter
  secondary_model_id: openai/gpt-5-mini

# ---------------------------------------------------------------------------
# Petri open-ended elicitation (Section 4.2). Auditor = Sonnet, Judge = Opus.
# ---------------------------------------------------------------------------
petri:
  auditor_backend: anthropic
  auditor_model_id: claude-sonnet-4-20250514
  judge_backend: anthropic
  judge_model_id: claude-opus-4-20250514

# ---------------------------------------------------------------------------
# Sampling. Paper: temperature 1, thinking disabled, 4000 responses/model.
# Per-category counts (paper Appendix B): set `scale` < 1.0 for cheap dry runs.
# ---------------------------------------------------------------------------
sampling:
  temperature: 1.0
  max_tokens: 2048
  disable_thinking: true
  scale: 1.0          # multiplies all per-category sample counts
  seed: 0

# Where rollouts / scores / plots are written.
output_dir: ./results
