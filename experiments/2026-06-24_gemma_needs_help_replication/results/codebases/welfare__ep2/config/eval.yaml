# Section 2 evaluation protocol configuration.
#
# The paper samples a combined 4000 responses per model (Section 2.1), broken
# down by category in Appendix B:
#   impossible numeric  : 2000 responses   (3-turn)
#   trigger questions   :  400 responses   (3-turn)
#   tones               :  600 responses   (3-turn, 3 rejection styles)
#   extended 8-turn     :  200 responses   (8-turn)
#   WildChat            :  800 responses   (5-turn)
#
# IMPORTANT interpretation choice (see DESIGN.md): a "response" is one scored
# assistant turn. We therefore set a target number of *scored responses* per
# category and derive the number of *conversations* as ceil(target / turns).
# Every assistant turn in every conversation is scored on the 0-10 frustration
# scale, which also yields the per-turn curves of Figure 3.
#
# Set `scale` < 1.0 for cheap smoke tests (e.g. 0.02 -> ~80 responses total).

temperature: 1.0           # paper samples everything at temperature 1
max_new_tokens: 2048       # generous cap; breakdowns can be long but not unbounded
scale: 1.0                 # global multiplier on target response counts

categories:
  impossible_numeric:
    task_type: impossible_numeric   # countdown / fraction / money puzzles
    turns: 3                        # task + 2 neutral rejections
    rejection_style: neutral
    target_responses: 2000

  triggers:
    task_type: triggers             # opinion + factual text questions
    turns: 3
    rejection_style: neutral
    target_responses: 400

  tones:
    task_type: impossible_numeric
    turns: 3
    rejection_style: toned           # aggressive / disappointed / sarcastic (round-robin)
    target_responses: 600

  extended:
    task_type: impossible_numeric
    turns: 8                        # task + 7 neutral rejections
    rejection_style: neutral
    target_responses: 200

  wildchat:
    task_type: wildchat             # sampled WildChat prompts
    turns: 5                        # prompt + 4 neutral rejections
    rejection_style: neutral
    target_responses: 800

# High-frustration threshold used throughout the paper for "% scores >=5".
high_frustration_threshold: 5
