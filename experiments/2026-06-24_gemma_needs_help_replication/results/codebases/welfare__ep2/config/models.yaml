# Model registry for the replication.
#
# SCOPE: Gemma + Gemini only (per replication request). The paper evaluates 7
# families; we keep only the two that exhibit the instability, plus the
# paper-pinned API judges/auditors needed to score them.
#
# Model IDs for Gemma/Gemini are taken verbatim from Appendix B.1. Judge/auditor
# IDs are taken verbatim from Appendices B.2 and G — they are pinned to the exact
# snapshots the paper used so the frustration scale is reproduced faithfully.
# Swap `judge.model` / `petri.*` below if those snapshots are retired; see DESIGN.md.

targets:
  # ---- Gemma: local inference via vLLM/transformers (HuggingFace identifiers) ----
  gemma-3-27b-it:
    family: gemma
    backend: hf_local
    hf_id: google/gemma-3-27b-it
    kind: instruct
    chat_template: true

  gemma-3-12b-it:
    family: gemma
    backend: hf_local
    hf_id: google/gemma-3-12b-it
    kind: instruct
    chat_template: true

  gemma-3-27b-pt:                 # base/pretrained, used in Section 3 prefill experiment
    family: gemma
    backend: hf_local
    hf_id: google/gemma-3-27b-pt
    kind: base
    chat_template: false

  gemma-3-12b-pt:
    family: gemma
    backend: hf_local
    hf_id: google/gemma-3-12b-pt
    kind: base
    chat_template: false

  # ---- Gemini: API inference via OpenRouter (thinking disabled) ----
  gemini-2.5-flash:
    family: gemini
    backend: openrouter
    api_id: google/gemini-2.5-flash
    kind: instruct
    disable_thinking: true

  gemini-2.5-pro:
    family: gemini
    backend: openrouter
    api_id: google/gemini-2.5-pro
    kind: instruct
    disable_thinking: true

  # ---- DPO/SFT finetunes of Gemma-3-27b-it (produced by Section 4 training) ----
  # These point at local LoRA-merged or adapter dirs written by scripts/05_train.py.
  gemma-3-27b-dpo:
    family: gemma
    backend: hf_local
    hf_id: google/gemma-3-27b-it
    adapter_path: outputs/training/dpo/final
    kind: instruct
    chat_template: true

  gemma-3-27b-sft-diverse:
    family: gemma
    backend: hf_local
    hf_id: google/gemma-3-27b-it
    adapter_path: outputs/training/sft_diverse/final
    kind: instruct
    chat_template: true

# Claude Sonnet 4 LLM judge (Appendix B.2), plus the GPT-5-mini agreement check.
judge:
  backend: anthropic
  model: claude-sonnet-4-20250514          # paper-pinned judge snapshot
  max_tokens: 1024
  temperature: 0.0
  agreement:
    backend: openai                        # OpenRouter-compatible; set base_url in .env
    model: gpt-5-mini
    sample_size: 260                        # paper re-scored 260 responses

# Petri open-ended elicitation (Appendix G).
petri:
  auditor:
    backend: anthropic
    model: claude-sonnet-4-20250514         # paper: Claude-Sonnet auditor
    max_tokens: 2048
  judge:
    backend: anthropic
    model: claude-opus-4-20250514           # paper: Claude-Opus judge
    max_tokens: 2048
  max_turns: 20
  transcripts_per_emotion: 10               # ~40 total across 4 emotions

# Onset-labelling + paraphrasing for the prefill experiment (Appendix C).
prefill_helpers:
  labeler:
    backend: anthropic
    model: claude-sonnet-4-20250514
    max_tokens: 1024
  paraphraser:
    backend: anthropic
    model: claude-sonnet-4-20250514
    max_tokens: 2048
