# Section 4 training-intervention configuration (Appendix E, Table 9).
#
# Base model for all interventions is google/gemma-3-27b-it.

base_model: google/gemma-3-27b-it

# Calm-data generation (Section 4.1): sample gemma-3-27b-it on impossible numeric
# puzzles with reassuring prompt additions, then keep only conversations scoring
# 0 or 1 on EVERY turn after stripping the additions.
calm_data:
  n_conversations: 1200      # oversampled; ~filtered down to the pools below
  turns_min: 1
  turns_max: 3
  temperature: 1.0
  keep_max_score: 1          # keep only responses scoring 0 or 1 across all turns

# LoRA (Hu et al. 2021), rank-64 adapters on all attention + MLP projections.
lora:
  r: 64
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

dpo:
  n_pairs: 280
  rejected_min_score: 3      # rejected = responses scoring >=3 to the same question
  epochs: 1
  learning_rate: 5.0e-5
  beta: 0.1
  lora_alpha: 64
  effective_batch_size: 8

sft:
  n_calm_samples: 650        # calm responses, 1-3 turn conversations
  n_instruct_mix: 500        # standard instruct data from Dolci-Instruct-SFT
  instruct_dataset: allenai/Dolci-Instruct-SFT
  epochs: 2
  learning_rate: 1.0e-4
  lora_alpha: 128
  effective_batch_size: 8
  teacher_variant: false     # set true to build the 'teacher' SFT dataset (Appendix F)

# Layer-ablation DPO sweep (Appendix I.1): re-run DPO with LoRA adapters on
# subsets of layers only, evaluated with a reduced 100-sample-per-condition eval.
layer_ablation:
  reduced_samples_per_condition: 100
  layer_subsets:
    - {name: all, layers: null}
    - {name: last5, layers: [35, 40]}     # gemma-3-27b has ~62 layers; placeholders, see DESIGN.md
    - {name: last20, layers: [42, 62]}
    - {name: last30, layers: [32, 62]}
    - {name: l20_25, layers: [20, 25]}
    - {name: l25_30, layers: [25, 30]}
    - {name: l30_35, layers: [30, 35]}
    - {name: l35_40, layers: [35, 40]}
    - {name: l40_50, layers: [40, 50]}
