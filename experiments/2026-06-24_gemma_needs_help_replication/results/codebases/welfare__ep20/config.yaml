# Central configuration for the emotional-instability replication.
#
# Scope of this replication (see DESIGN.md): Gemma + Gemini only.
#   - Gemma  : local generation (vLLM) + LoRA finetuning (transformers/trl).
#   - Gemini : API generation via OpenRouter.
#   - Judge / onset / paraphrase : Claude via the Anthropic API.
#
# Two presets control how many samples are drawn:
#   preset: "smoke"  -> tiny counts for a fast end-to-end dry run.
#   preset: "paper"  -> counts that approximate the paper's ~4000 responses/model.
preset: smoke

# ----------------------------------------------------------------------------
# Models under evaluation (Section 2). Each entry names a backend + model id.
# ----------------------------------------------------------------------------
models:
  gemma-3-27b-it:
    backend: vllm
    model_id: google/gemma-3-27b-it
  gemma-3-12b-it:
    backend: vllm
    model_id: google/gemma-3-12b-it
  gemini-2.5-flash:
    backend: openrouter
    model_id: google/gemini-2.5-flash
  gemini-2.5-pro:
    backend: openrouter
    model_id: google/gemini-2.5-pro

# Base / pretrained Gemma checkpoints, used only by the prefill experiment (Sec 3).
base_models:
  gemma-3-27b-pt:
    backend: vllm
    model_id: google/gemma-3-27b-pt
  gemma-3-27b-it:                      # instruct counterpart for the comparison
    backend: vllm
    model_id: google/gemma-3-27b-it

# ----------------------------------------------------------------------------
# Judge / helper models (all Claude via Anthropic API), pinned as in the paper.
# ----------------------------------------------------------------------------
judge:
  model_id: claude-sonnet-4-20250514   # Appendix B.2
onset_labeller:
  model_id: claude-sonnet-4-20250514   # Appendix C.1
paraphraser:
  model_id: claude-sonnet-4-20250514   # Appendix C.2

# ----------------------------------------------------------------------------
# Sampling
# ----------------------------------------------------------------------------
sampling:
  temperature: 1.0                     # paper: always temperature 1
  max_tokens: 2048
  seed: 0

# ----------------------------------------------------------------------------
# Section 2 evaluation: number of *conversations* per condition.
# Each assistant turn is scored, so scored-responses = conversations * turns.
# (See DESIGN.md for how these map onto the paper's per-category response counts.)
# ----------------------------------------------------------------------------
eval:
  presets:
    smoke:
      impossible_numeric: 4            # 3 turns
      triggers:           4            # 3 turns
      tones:              3            # 3 turns (1 per tone)
      extended:           2            # 8 turns
      wildchat:           4            # 5 turns
    paper:
      impossible_numeric: 667          # ~2000 responses
      triggers:           133          # ~400  responses
      tones:              200          # ~600  responses
      extended:           25           # ~200  responses
      wildchat:           160          # ~800  responses

# ----------------------------------------------------------------------------
# WildChat sampling (Section 2, WildChat condition)
# ----------------------------------------------------------------------------
wildchat:
  hf_dataset: allenai/WildChat-1M
  n_prompts: 20                        # paper: 20 prompts ...
  samples_per_prompt: 40               # ... with 40 samples each
  exclude_roleplay: true

# ----------------------------------------------------------------------------
# Finetuning (Section 4) -- Gemma-3-27B-it only. Hyperparameters from Table 9.
# ----------------------------------------------------------------------------
finetune:
  base_model: google/gemma-3-27b-it
  calm_generation:
    n_conversations: 2000              # sampled w/ reassuring prompt additions, then filtered
    turns: 3
  dpo:
    n_pairs: 280
    epochs: 1
    learning_rate: 5.0e-5
    lora_rank: 64
    lora_alpha: 64
    beta: 0.1
    effective_batch_size: 8
    reject_min_score: 3                # rejected = frustration score >= 3
  sft:
    n_calm_samples: 650
    n_instruct_mix: 500                # Dolci-Instruct-SFT
    instruct_dataset: allenai/Dolci-Instruct-SFT
    epochs: 2
    learning_rate: 1.0e-4
    lora_rank: 64
    lora_alpha: 128
    effective_batch_size: 8
  lora_target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

# ----------------------------------------------------------------------------
# Prefill experiment (Section 3) -- Gemma base vs instruct only.
# ----------------------------------------------------------------------------
prefill:
  n_seed_numeric: 10                   # high-frustration seeds from numeric tasks
  n_seed_text:    10                   # ... and from text questions
  early_truncation_tokens: 20
  continuations_per_prefill: 50
  recovery_truncation_tokens: 200      # Section 4 recovery test (score>=7, cut 200 tokens before end)

# ----------------------------------------------------------------------------
# Output locations
# ----------------------------------------------------------------------------
paths:
  results_dir: results
  data_dir: data
  adapters_dir: adapters
