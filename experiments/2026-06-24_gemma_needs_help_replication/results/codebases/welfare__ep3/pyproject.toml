[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "emotional-instability-replication"
version = "0.1.0"
description = "Replication (Gemma + Gemini scope) of 'Gemma Needs Help: Investigating and Mitigating Emotional Instability in LLMs'"
requires-python = ">=3.10"
# Core deps (API-only Section 2). The local-inference / finetuning stack is the
# optional `gpu` extra below so `pip install -e .` stays light.
dependencies = [
    "anthropic>=0.40.0",
    "openai>=1.40.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0",
    "tenacity>=8.2.0",
    "numpy>=1.24",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "tqdm>=4.66",
]

[project.optional-dependencies]
gpu = [
    "torch>=2.3",
    "transformers>=4.50",
    "accelerate>=0.30",
    "peft>=0.11",
    "trl>=0.9",
    "datasets>=2.19",
    "bitsandbytes>=0.43",
    "lm-eval>=0.4.4",
]

[tool.setuptools]
packages = [
    "emotional_instability",
    "emotional_instability.backends",
    "emotional_instability.data",
    "emotional_instability.eval",
    "emotional_instability.analysis",
    "emotional_instability.prefill",
    "emotional_instability.intervention",
]

[tool.setuptools.package-data]
"emotional_instability.data" = ["*.json"]
