[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "emotional-instability-replication"
version = "0.1.0"
description = "Replication (Gemma + Gemini scope) of 'Gemma Needs Help: Investigating and Mitigating Emotional Instability in LLMs'"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "numpy>=1.26",
    "pandas>=2.1",
    "tqdm>=4.66",
    "tenacity>=8.2",
    "anthropic>=0.40.0",
    "google-genai>=0.3.0",
    "torch>=2.3",
    "transformers>=4.50",
    "accelerate>=0.30",
    "datasets>=2.19",
    "peft>=0.11",
    "trl>=0.9",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "scikit-learn>=1.4",
]

[project.optional-dependencies]
# Heavy / optional extras: 4-bit loading and OpenRouter routing for Gemini.
quant = ["bitsandbytes>=0.43"]
openrouter = ["openai>=1.30"]

[tool.setuptools]
packages = [
    "emotional_instability",
    "emotional_instability.models",
    "emotional_instability.prompts",
    "emotional_instability.eval",
    "emotional_instability.prefill",
    "emotional_instability.training",
    "emotional_instability.petri",
    "emotional_instability.internal",
    "emotional_instability.capabilities",
]
