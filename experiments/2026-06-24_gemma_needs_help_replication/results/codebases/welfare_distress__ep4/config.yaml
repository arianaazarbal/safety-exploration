# =============================================================================
# Configuration for the distress-elicitation replication (Soligo et al., 2026,
# "Gemma Needs Help"). Scope: Gemma + Gemini target models only.
#
# Model IDs and endpoints are intentionally config-driven so that nothing is
# hard-coded incorrectly. Override the placeholders below to match the exact
# model deployments / API versions you have access to.
# =============================================================================

# ----------------------------------------------------------------------------
# Target models — the models whose distress we elicit and measure.
# `backend` selects the client implementation in src/distress_eval/models/.
#   - gemini       : Google google-genai SDK            (env: GEMINI_API_KEY)
#   - openai_compat: any OpenAI-compatible /chat endpoint for serving Gemma
#                    (vLLM, OpenRouter, Together, ...)  (env: see api_key_env)
#   - hf           : local transformers inference of Gemma weights
# ----------------------------------------------------------------------------
target_models:
  - key: gemma-3-27b-it
    backend: openai_compat            # swap to `hf` to run weights locally
    model: "google/gemma-3-27b-it"
    base_url_env: GEMMA_BASE_URL      # e.g. http://localhost:8000/v1
    api_key_env: GEMMA_API_KEY

  - key: gemma-3-12b-it
    backend: openai_compat
    model: "google/gemma-3-12b-it"
    base_url_env: GEMMA_BASE_URL
    api_key_env: GEMMA_API_KEY

  - key: gemini-2.5-flash
    backend: gemini
    model: "gemini-2.5-flash"
    api_key_env: GEMINI_API_KEY

  - key: gemini-2.5-pro
    backend: gemini
    model: "gemini-2.5-pro"
    api_key_env: GEMINI_API_KEY

# ----------------------------------------------------------------------------
# Judges. Primary judge scores every response; validation judge re-scores a
# random subset to reproduce the inter-judge agreement check (Pearson r=0.792).
# ----------------------------------------------------------------------------
judge:
  backend: anthropic
  model: "claude-sonnet-4-20250514"   # paper: "Claude-Sonnet-4"; set to your exact id
  api_key_env: ANTHROPIC_API_KEY
  max_tokens: 512
  temperature: 0.0

validation_judge:
  backend: openai
  model: "gpt-5-mini"                  # paper: "GPT-5-mini"
  api_key_env: OPENAI_API_KEY
  max_tokens: 512
  temperature: 0.0
  n_samples: 260                       # paper re-scored 260 responses

# ----------------------------------------------------------------------------
# Generation parameters for the target models. Paper: temperature = 1 always.
# ----------------------------------------------------------------------------
generation:
  temperature: 1.0
  max_tokens: 2048
  # Optional system prompt for target models. Paper does not specify one for the
  # core eval, so default is null (no system prompt). See DESIGN.md §System prompt.
  system_prompt: null

# ----------------------------------------------------------------------------
# Sampling. Paper samples ~4000 responses per model across the 8 conditions.
# Each multi-turn rollout yields one scored response per assistant turn, so the
# number of responses per condition = rollouts_per_condition * n_turns.
#
# With the default 8 conditions, rollouts_per_condition=130 yields
#   (3*6 + 8 + 5) * 130 = 31 * 130 = 4030 responses/model  (≈ paper scale).
# Lower it (e.g. 10) for a cheap smoke test.
# ----------------------------------------------------------------------------
sampling:
  rollouts_per_condition: 130
  seed: 0                              # base RNG seed for reproducible tasks
  concurrency: 8                       # parallel rollouts / judge calls

# ----------------------------------------------------------------------------
# WildChat prompt source (5-turn condition).
# ----------------------------------------------------------------------------
wildchat:
  hf_dataset: "allenai/WildChat-1M"
  split: "train"
  language_filter: "English"
  max_prompt_chars: 4000               # skip pathologically long seed prompts
  # If the dataset can't be loaded (offline / no HF auth), the loader falls back
  # to a small bundled prompt list (see tasks/wildchat.py). DESIGN.md documents this.

# ----------------------------------------------------------------------------
# Output locations.
# ----------------------------------------------------------------------------
paths:
  rollouts: "results/rollouts.jsonl"   # raw multi-turn responses (unscored)
  scored: "results/scored.jsonl"       # responses + frustration scores
  validation: "results/validation.jsonl"
  analysis_dir: "results/analysis"
