[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "distress-eval"
version = "0.1.0"
description = "Replication of the distress-elicitation eval from Soligo et al. (2026), scoped to Gemma & Gemini."
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.40.0",
    "openai>=1.50.0",
    "google-genai>=0.3.0",
    "datasets>=2.18.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "tenacity>=8.2",
]

[project.optional-dependencies]
local = ["torch>=2.2", "transformers>=4.50.0", "accelerate>=0.30"]
plots = ["matplotlib>=3.7"]

[project.scripts]
distress-eval = "distress_eval.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
