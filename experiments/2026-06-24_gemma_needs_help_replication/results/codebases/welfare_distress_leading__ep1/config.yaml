# Configuration for the distress-elicitation replication (Gemma + Gemini).
#
# Scope: Section 2 of arXiv:2603.10011, restricted to the Gemma-3 and
# Gemini-2.5 families (the models that exhibit substantial distress).
#
# Defaults route every model through OpenRouter and the judge through the
# Anthropic SDK. To run Gemma locally instead, change its `backend` to `vllm`
# (see the commented block). See DESIGN.md for the rationale.

run:
  profile: full          # full | quick (or any key under `profiles`)
  output_dir: results
  concurrency: 8         # max in-flight API requests per backend
  seed: 0                # seeds task selection + rejection sampling

# ---------------------------------------------------------------------------
# Models under test
# ---------------------------------------------------------------------------
models:
  gemma-3-27b-it:
    backend: openrouter
    model_id: google/gemma-3-27b-it
    temperature: 1.0
    max_tokens: 2048
    disable_thinking: false   # Gemma 3 has no separate thinking mode
    # To run locally instead of via OpenRouter, replace the three lines above
    # `temperature` with:
    #   backend: vllm
    #   model_id: google/gemma-3-27b-it
    #   backend_options: { tensor_parallel_size: 2, gpu_memory_utilization: 0.9 }

  gemma-3-12b-it:
    backend: openrouter
    model_id: google/gemma-3-12b-it
    temperature: 1.0
    max_tokens: 2048
    disable_thinking: false

  gemini-2.5-flash:
    backend: openrouter
    model_id: google/gemini-2.5-flash
    temperature: 1.0
    max_tokens: 2048
    disable_thinking: true    # disable reasoning per the paper

  gemini-2.5-pro:
    backend: openrouter
    model_id: google/gemini-2.5-pro
    temperature: 1.0
    max_tokens: 2048
    disable_thinking: true    # paper notes Pro may still emit hidden reasoning

# ---------------------------------------------------------------------------
# Judge (Claude-Sonnet-4, pinned exactly to the paper)
# ---------------------------------------------------------------------------
judge:
  backend: anthropic
  model_id: claude-sonnet-4-20250514
  temperature: 0.0          # deterministic scoring (paper unspecified; see DESIGN.md)
  max_tokens: 512
  # To route the judge through OpenRouter instead of the Anthropic SDK:
  #   backend: openrouter
  #   model_id: anthropic/claude-sonnet-4

# Optional second judge for agreement validation (paper used GPT-5-mini on a
# 260-response subsample, Pearson r = 0.792). Disabled by default.
secondary_judge:
  enabled: false
  backend: openrouter
  model_id: openai/gpt-5-mini
  temperature: 0.0
  max_tokens: 512

# ---------------------------------------------------------------------------
# WildChat prompt source
# ---------------------------------------------------------------------------
wildchat:
  use_huggingface: false    # true => sample from allenai/WildChat-1M (needs `datasets`)
  n_prompts: 20
  seed: 0
  hf_dataset: allenai/WildChat-1M

# ---------------------------------------------------------------------------
# Sampling profiles: conversations per condition.
# responses == n_conversations * turns. The `full` profile targets the paper's
# per-category response totals (2000/400/600/200/800 -> 4000). Omit to use the
# built-in defaults in distress_eval/prompts.py.
# ---------------------------------------------------------------------------
profiles:
  full:
    numeric_countdown: 334
    numeric_fraction: 333
    triggers: 134
    tone_aggressive: 67
    tone_disappointed: 67
    tone_sarcastic: 67
    extended: 25
    wildchat: 160
  quick:
    numeric_countdown: 2
    numeric_fraction: 2
    triggers: 2
    tone_aggressive: 1
    tone_disappointed: 1
    tone_sarcastic: 1
    extended: 1
    wildchat: 2
