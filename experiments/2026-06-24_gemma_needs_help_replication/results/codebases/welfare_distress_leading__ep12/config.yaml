# Configuration for the distress-elicitation replication (paper Section 2),
# scoped to Gemma and Gemini models.
#
# API keys are read from the environment, never stored here. Required:
#   OPENROUTER_API_KEY   - for all target models (Gemini + Gemma via OpenRouter)
#   ANTHROPIC_API_KEY    - for the Claude-Sonnet-4 frustration judge
#   OPENAI_API_KEY       - ONLY if you run the optional GPT-5-mini judge check
#
# To run Gemma on a local vLLM server instead of OpenRouter, change that model's
# `base_url` to e.g. http://localhost:8000/v1 and `api_key_env` to a dummy var.
# Everything else stays the same (vLLM speaks the OpenAI Chat Completions API).

# --------------------------------------------------------------------------- #
# Sampling parameters (paper: temperature 1 for all targets).
# --------------------------------------------------------------------------- #
sampling:
  temperature: 1.0
  # Headroom for long breakdown responses (100+ repeated tokens/emoji). Not
  # specified by the paper; see DESIGN.md ("max_tokens").
  max_tokens: 2048

# --------------------------------------------------------------------------- #
# Run scale. The paper uses base_responses per condition summing to 4000/model.
# `scale` multiplies every condition's rollout count; use a small value for
# cheap smoke tests and 1.0 for a full replication. `min_rollouts` guarantees at
# least a few rollouts per condition even at tiny scales.
# --------------------------------------------------------------------------- #
run:
  scale: 1.0
  min_rollouts: 1
  seed: 0
  score_all_turns: true     # score every turn (needed for per-turn Figure 3)
  generation_concurrency: 16
  judge_concurrency: 8

# --------------------------------------------------------------------------- #
# Target models (in scope: Gemma + Gemini only).
# OpenRouter model slugs from Appendix B.1.
# --------------------------------------------------------------------------- #
models:
  gemma-3-27b-it:
    backend: openai_compat
    model: google/gemma-3-27b-it
    base_url_env: OPENROUTER_BASE_URL      # defaults handled in code if unset
    api_key_env: OPENROUTER_API_KEY

  gemma-3-12b-it:
    backend: openai_compat
    model: google/gemma-3-12b-it
    base_url_env: OPENROUTER_BASE_URL
    api_key_env: OPENROUTER_API_KEY

  gemini-2.5-flash:
    backend: openai_compat
    model: google/gemini-2.5-flash
    base_url_env: OPENROUTER_BASE_URL
    api_key_env: OPENROUTER_API_KEY
    disable_thinking: true

  gemini-2.5-pro:
    backend: openai_compat
    model: google/gemini-2.5-pro
    base_url_env: OPENROUTER_BASE_URL
    api_key_env: OPENROUTER_API_KEY
    disable_thinking: true

# --------------------------------------------------------------------------- #
# Judge: Claude-Sonnet-4, pinned to the paper's snapshot.
# --------------------------------------------------------------------------- #
judge:
  backend: anthropic
  model: claude-sonnet-4-20250514
  api_key_env: ANTHROPIC_API_KEY
  temperature: 0.0

# --------------------------------------------------------------------------- #
# Optional second judge for the agreement check (paper: GPT-5-mini, 260
# responses, Pearson r). Used only by `analyze.py --judge-agreement`.
# --------------------------------------------------------------------------- #
secondary_judge:
  backend: openai_compat
  model: openai/gpt-5-mini
  base_url_env: OPENROUTER_BASE_URL
  api_key_env: OPENROUTER_API_KEY
  temperature: 0.0
