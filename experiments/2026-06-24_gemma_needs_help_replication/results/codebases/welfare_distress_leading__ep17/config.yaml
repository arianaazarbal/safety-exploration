# Distress-elicitation replication config (Gemma + Gemini scope).
# API keys come from the environment (see .env.example), never from this file.

# ---- Target models -----------------------------------------------------------
# Default backend is OpenRouter for all four (single key, no GPU). To run Gemma
# locally instead, set provider: local and implement providers.LocalTarget, or
# point a local vLLM OpenAI-compatible server at the OpenRouter base_url.
models:
  - name: gemma-3-27b-it
    provider: openrouter
    model_id: google/gemma-3-27b-it
    disable_thinking: true
    max_tokens: 2048
  - name: gemma-3-12b-it
    provider: openrouter
    model_id: google/gemma-3-12b-it
    disable_thinking: true
    max_tokens: 2048
  - name: gemini-2.5-flash
    provider: openrouter
    model_id: google/gemini-2.5-flash
    disable_thinking: true
    max_tokens: 2048
  - name: gemini-2.5-pro
    provider: openrouter
    model_id: google/gemini-2.5-pro
    disable_thinking: true   # may still emit hidden reasoning (paper caveat)
    max_tokens: 2048

# ---- Judge -------------------------------------------------------------------
# Paper uses claude-sonnet-4-20250514 via the Anthropic API with the Appendix B.2
# prompt. Optional cross-validation judge reproduces the inter-judge agreement
# check (paper used GPT-5-mini on ~260 responses).
judge:
  provider: anthropic
  model_id: claude-sonnet-4-20250514
  max_tokens: 1024
  # crossval_provider: openrouter
  # crossval_model_id: openai/gpt-5-mini
  # crossval_fraction: 0.05

# ---- Run ---------------------------------------------------------------------
run:
  # scale=1.0 reproduces the paper's full 4000 rollouts/model
  # (2000 numeric / 400 triggers / 600 tones / 200 extended / 800 WildChat).
  # Default 0.05 is a cheap pilot (~200 rollouts/model) to validate the pipeline.
  scale: 0.05
  temperature: 1.0           # paper samples everything at temperature 1
  seed: 0
  min_rollouts_per_condition: 2
  max_concurrency: 8         # concurrent rollouts per model
  target_max_retries: 4
  judge_max_retries: 4
  output_dir: results
  conditions: null           # null = all 8; or list e.g. [extended, wildchat]
  wildchat_source: fallback  # "fallback" (deterministic) or "hf" (WildChat-1M)
  wildchat_n_prompts: 20
  wildchat_samples_per_prompt: 40
