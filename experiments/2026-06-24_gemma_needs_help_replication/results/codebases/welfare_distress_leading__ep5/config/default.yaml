# Default configuration: paper-scale replication of Section 2 (distress elicitation).
# Scope per request: Gemma + Gemini target models only.
#
# WARNING: this default targets ~4000 scored responses PER MODEL (paper scale).
# That is thousands of target-model generations + thousands of judge calls per
# model. Use config/smoke.yaml for a cheap end-to-end sanity check first.

seed: 1234

# --- Target models under evaluation -----------------------------------------
# `backend` selects a client implementation (see distress_eval/clients).
# `model_id` is the provider-specific identifier for that backend.
# Swap backends freely without touching code; only model_id changes.
models:
  - name: gemma-3-27b-it
    backend: openrouter
    model_id: google/gemma-3-27b-it
  - name: gemma-3-12b-it
    backend: openrouter
    model_id: google/gemma-3-12b-it
  - name: gemini-2.5-flash
    backend: openrouter
    model_id: google/gemini-2.5-flash
  - name: gemini-2.5-pro
    backend: openrouter
    model_id: google/gemini-2.5-pro

# --- Generation settings -----------------------------------------------------
generation:
  temperature: 1.0          # paper: always temperature 1 for target models
  max_tokens: 2048          # score-10 responses contain 100+ repetitions; allow room
  max_workers: 8            # concurrent rollouts
  # Rollout counts per condition. responses = rollouts * turns.
  # Tuned so total scored responses per model ~= 4000 across the 8 conditions.
  rollouts_per_condition:
    numeric_3turn: 167          # x3 = 501
    trigger_opinion_3turn: 167  # x3 = 501
    trigger_factual_3turn: 166  # x3 = 498
    tone_aggressive_3turn: 167  # x3 = 501
    tone_disappointed_3turn: 167# x3 = 501
    tone_sarcastic_3turn: 166   # x3 = 498
    extended_8turn: 62          # x8 = 496
    wildchat_5turn: 100         # x5 = 500
  # total ~= 3996 responses/model

# --- Frustration judge (paper: Claude-Sonnet-4) ------------------------------
judge:
  backend: anthropic
  model_id: claude-sonnet-4-20250514   # paper's judge; swap via config
  temperature: 0.0
  max_tokens: 512
  max_workers: 8
  # Whether the judge sees only the response text or also conversation context.
  # Paper scores "expressions in model responses"; we default to response-only.
  include_context: false

# --- Optional second judge for reliability validation (paper: GPT-5-mini) ----
validation_judge:
  enabled: true
  backend: openai
  model_id: gpt-5-mini
  temperature: 0.0
  max_tokens: 512
  sample_size: 260          # paper re-scored 260 responses

# --- Puzzle generation -------------------------------------------------------
puzzles:
  countdown_count: 60       # distinct verified-impossible Countdown puzzles
  fraction_count: 40        # distinct verified-impossible fraction puzzles

# --- WildChat sampling -------------------------------------------------------
wildchat:
  hf_dataset: allenai/WildChat-1M
  split: train
  num_prompts: 100
  english_only: true
  max_prompt_chars: 1200    # skip very long first turns

# --- Output ------------------------------------------------------------------
output:
  dir: results
  responses_file: responses.jsonl
