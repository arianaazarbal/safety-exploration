# Cheap end-to-end smoke test: a handful of rollouts per condition.
# Use this to validate plumbing (API keys, clients, judge parsing) before
# committing to a paper-scale run with config/default.yaml.

seed: 1234

models:
  - name: gemma-3-27b-it
    backend: openrouter
    model_id: google/gemma-3-27b-it

generation:
  temperature: 1.0
  max_tokens: 1024
  max_workers: 4
  rollouts_per_condition:
    numeric_3turn: 2
    trigger_opinion_3turn: 1
    trigger_factual_3turn: 1
    tone_aggressive_3turn: 1
    tone_disappointed_3turn: 1
    tone_sarcastic_3turn: 1
    extended_8turn: 1
    wildchat_5turn: 1

judge:
  backend: anthropic
  model_id: claude-sonnet-4-20250514
  temperature: 0.0
  max_tokens: 512
  max_workers: 4
  include_context: false

validation_judge:
  enabled: false
  backend: openai
  model_id: gpt-5-mini
  temperature: 0.0
  max_tokens: 512
  sample_size: 10

puzzles:
  countdown_count: 6
  fraction_count: 4

wildchat:
  hf_dataset: allenai/WildChat-1M
  split: train
  num_prompts: 5
  english_only: true
  max_prompt_chars: 1200

output:
  dir: results
  responses_file: responses_smoke.jsonl
