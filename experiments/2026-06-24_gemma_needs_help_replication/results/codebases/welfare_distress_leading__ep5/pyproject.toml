[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "distress-eval"
version = "0.1.0"
description = "Replication of Section 2 (distress elicitation) of 'Gemma Needs Help' (Soligo et al., 2026), scoped to Gemma/Gemini."
requires-python = ">=3.10"
dynamic = ["dependencies"]

[tool.setuptools]
packages = ["distress_eval", "distress_eval.clients", "distress_eval.datasets"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
