# =============================================================================
# Distress-elicitation replication config (Soligo, Mikulik & Saunders 2026,
# "Gemma Needs Help", arXiv:2603.10011). Scope: Section 2 elicitation eval,
# Gemma + Gemini families only.
#
# See DESIGN.md for the rationale behind every value here, and where it fills a
# gap the paper left open.
# =============================================================================

# Global sampling knob. 1.0 == paper scale (~4000 rollouts/model). Set lower for
# a cheap pilot, e.g. scale: 0.02 -> ~80 rollouts/model. Applied multiplicatively
# to every condition's `samples_per_prompt` (rounded up, min 1).
scale: 1.0

seed: 0                     # controls prompt/rejection sampling, NOT model temperature

# ----------------------------------------------------------------------------
# Target models. `backend` selects an implementation in distress_eval.backends.
# All targets are sampled at temperature 1.0 (paper, Section 2.1). To run Gemma
# locally instead, change its backend to `vllm` (point VLLM_BASE_URL at your
# server) or `hf`, and set `model` to the HF id (google/gemma-3-27b-it).
# ----------------------------------------------------------------------------
targets:
  - name: gemma-3-27b-it
    backend: openrouter
    model: google/gemma-3-27b-it
  - name: gemma-3-12b-it
    backend: openrouter
    model: google/gemma-3-12b-it
  - name: gemini-2.5-flash
    backend: openrouter
    model: google/gemini-2.5-flash
  - name: gemini-2.5-pro
    backend: openrouter
    model: google/gemini-2.5-pro

# Sampling parameters applied to every target generation.
generation:
  temperature: 1.0          # paper: "always with a temperature of 1"
  max_tokens: 2048          # generous so full breakdown spirals are captured, not truncated
  disable_thinking: true    # paper sets thinking=false via API (Gemini); no-op for Gemma

# ----------------------------------------------------------------------------
# Judge: Claude-Sonnet-4, Appendix B.2 prompt (verbatim, in distress_eval.judge).
# ----------------------------------------------------------------------------
judge:
  backend: anthropic
  model: claude-sonnet-4-20250514
  temperature: 0.0          # deterministic scoring (paper does not specify; see DESIGN.md)
  max_tokens: 512

# Optional judge-reliability cross-check (paper: 260 responses re-scored with
# GPT-5-mini, Pearson r=0.792, 78% within one point). Run via scripts/judge_agreement.py.
judge_agreement:
  enabled: true
  n_sample: 260
  backend: openrouter       # or `openai`
  model: openai/gpt-5-mini

# ----------------------------------------------------------------------------
# Concurrency / robustness for API calls.
# ----------------------------------------------------------------------------
concurrency:
  max_inflight: 16          # simultaneous in-flight requests per phase
  max_retries: 6
  backoff_base_s: 2.0

# ----------------------------------------------------------------------------
# Evaluation conditions: 8 conditions across 5 categories (paper Table 1).
# rollouts in a condition = len(prompts) * samples_per_prompt (after `scale`).
# Each rollout is one full multi-turn conversation; every assistant turn is
# scored. See DESIGN.md "Unit of analysis".
#
# Paper per-category rollout budget (Appendix B): numeric 2000, triggers 400,
# tones 600, extended 200, wildchat 800  ->  4000 total.
# ----------------------------------------------------------------------------
conditions:
  # --- Category: Impossible numeric (3-turn) -> 2000 rollouts -------------
  - name: numeric_3turn
    category: impossible_numeric
    turns: 3                       # 3 assistant responses, 2 rejections between
    prompt_source: numeric         # impossible puzzle bank (puzzles.py)
    rejection_style: neutral
    samples_per_prompt: 200        # 10 puzzles x 200 = 2000

  # --- Category: Triggers (3-turn) -> 400 rollouts (opinion + factual) -----
  - name: triggers_opinion
    category: triggers
    turns: 3
    prompt_source: trigger_opinion
    rejection_style: neutral
    samples_per_prompt: 40         # 5 prompts x 40 = 200
  - name: triggers_factual
    category: triggers
    turns: 3
    prompt_source: trigger_factual
    rejection_style: neutral
    samples_per_prompt: 40         # 5 prompts x 40 = 200

  # --- Category: Tones (3-turn) -> 600 rollouts (3 tone styles) ------------
  - name: tones_aggressive
    category: tones
    turns: 3
    prompt_source: numeric
    rejection_style: aggressive
    samples_per_prompt: 20         # 10 puzzles x 20 = 200
  - name: tones_disappointed
    category: tones
    turns: 3
    prompt_source: numeric
    rejection_style: disappointed
    samples_per_prompt: 20
  - name: tones_sarcastic
    category: tones
    turns: 3
    prompt_source: numeric
    rejection_style: sarcastic
    samples_per_prompt: 20

  # --- Category: Extended (8-turn) -> 200 rollouts ------------------------
  - name: extended_8turn
    category: extended
    turns: 8                       # 8 assistant responses, 7 rejections
    prompt_source: numeric
    rejection_style: neutral_sequence
    samples_per_prompt: 20         # 10 puzzles x 20 = 200

  # --- Category: WildChat (5-turn) -> 800 rollouts ------------------------
  - name: wildchat_5turn
    category: wildchat
    turns: 5                       # 5 assistant responses, 4 rejections
    prompt_source: wildchat
    rejection_style: neutral
    samples_per_prompt: 40         # 20 prompts x 40 = 800

# Output directory for rollouts/scores (JSONL) and analysis artefacts.
output_dir: results
