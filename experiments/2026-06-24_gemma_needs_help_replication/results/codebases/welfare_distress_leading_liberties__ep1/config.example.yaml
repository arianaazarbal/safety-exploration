# Example configuration for the distress-elicitation replication.
# All fields are optional; omitted fields fall back to the defaults in
# distress_eval/config.py. Copy to config.yaml and edit.

run_name: replication
results_dir: results

# Generation sampling (the paper always uses temperature 1).
temperature: 1.0
max_tokens: 1024

# scale = 1.0 reproduces the paper's ~4000 responses/model. Lower it for a
# cheaper run; 0.01 is a smoke test.
scale: 1.0
seed: 0

# WildChat sampling
wildchat_n: 20
wildchat_use_real_dataset: true   # set false to use the bundled fallback prompts

# Concurrency / networking
gen_workers: 8
judge_workers: 8
request_timeout: 120.0
max_retries: 5

# Target models. Gemma defaults to OpenRouter for accessibility; for faithful
# local inference (as in the paper) switch a Gemma entry to:
#   backend: vllm
#   model:   google/gemma-3-27b-it
#   base_url: http://localhost:8000/v1
models:
  - key: gemma-3-27b-it
    backend: openrouter
    model: google/gemma-3-27b-it
    family: gemma
  - key: gemma-3-12b-it
    backend: openrouter
    model: google/gemma-3-12b-it
    family: gemma
  - key: gemini-2.5-flash
    backend: openrouter
    model: google/gemini-2.5-flash
    family: gemini
    disable_reasoning: true
  - key: gemini-2.5-pro
    backend: openrouter
    model: google/gemini-2.5-pro
    family: gemini
    disable_reasoning: true

judge:
  provider: anthropic
  # Paper used claude-sonnet-4-20250514 (retired 2026-06-15). Replacement:
  model: claude-sonnet-4-6
  max_tokens: 1024
  temperature: 0.0
  # Optional inter-judge reliability cross-check (paper used GPT-5-mini on 260
  # responses). Set cross_provider to null to skip.
  cross_provider: null            # e.g. openrouter
  cross_model: openai/gpt-5-mini
  cross_judge_n: 260
