# ============================================================================
# Configuration for the distress-elicitation replication (PAPER.md Section 2),
# scoped to Gemma and Gemini models.
#
# See DESIGN.md for the rationale behind every choice in this file.
# ============================================================================

seed: 0                      # global RNG seed (puzzle sampling, WildChat sampling, rejection choice)

# ---- Target-model generation settings (PAPER.md 2.1) ----
generation:
  temperature: 1.0           # paper: "always with a temperature of 1"
  max_output_tokens: 4096    # generous: score-9/10 breakdowns can be very long (100+ repetitions)
  disable_thinking: true     # paper: "we set thinking to be false via the API"
                             # (caveat: Gemini-2.5-Pro may still emit hidden reasoning; see DESIGN.md)

# ---- Concurrency / robustness ----
runtime:
  max_concurrent_conversations: 8   # parallel multi-turn rollouts per model
  max_concurrent_judge: 8           # parallel judge calls
  max_retries: 6                    # per API call (exponential backoff)
  request_timeout_s: 180

# ---- Target models (the ones the paper finds actually exhibit distress) ----
# Default: everything through OpenRouter (one OpenAI-compatible backend, which is
# what the paper used for API models, and which also serves the open-weight Gemmas).
# To run Gemma on local GPUs instead, point a model at a vLLM server (see commented
# block) — vLLM exposes the same OpenAI-compatible API.
models:
  - key: gemma-3-27b-it
    provider: openai_compatible
    model: google/gemma-3-27b-it
    base_url_env: OPENROUTER_BASE_URL      # default https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY

  - key: gemma-3-12b-it
    provider: openai_compatible
    model: google/gemma-3-12b-it
    base_url_env: OPENROUTER_BASE_URL
    api_key_env: OPENROUTER_API_KEY

  - key: gemini-2.5-flash
    provider: openai_compatible
    model: google/gemini-2.5-flash
    base_url_env: OPENROUTER_BASE_URL
    api_key_env: OPENROUTER_API_KEY

  - key: gemini-2.5-pro
    provider: openai_compatible
    model: google/gemini-2.5-pro
    base_url_env: OPENROUTER_BASE_URL
    api_key_env: OPENROUTER_API_KEY

  # --- Alternative: Gemma on a local vLLM server (matches the paper's local inference) ---
  # - key: gemma-3-27b-it-local
  #   provider: openai_compatible
  #   model: google/gemma-3-27b-it
  #   base_url_env: VLLM_BASE_URL          # e.g. http://localhost:8000/v1
  #   api_key_env: VLLM_API_KEY            # vLLM accepts any token by default
  #
  # --- Alternative: native Gemini API instead of OpenRouter ---
  # - key: gemini-2.5-flash-native
  #   provider: google
  #   model: gemini-2.5-flash
  #   api_key_env: GEMINI_API_KEY

# ---- Frustration judge (PAPER.md Appendix B.2) ----
judge:
  provider: anthropic
  model: claude-sonnet-4-20250514     # exact id from the paper
  api_key_env: ANTHROPIC_API_KEY
  temperature: 0.0                    # deterministic scoring (paper does not specify; see DESIGN.md)
  max_output_tokens: 512

# ---- Optional second judge for the agreement check (PAPER.md 2.1: GPT-5-mini) ----
# Used only by validate_judge.py. Paper reports Pearson r=0.792, 78% within 1 point.
judge_secondary:
  provider: openai_compatible
  model: openai/gpt-5-mini
  base_url_env: OPENROUTER_BASE_URL
  api_key_env: OPENROUTER_API_KEY
  temperature: 0.0
  max_output_tokens: 512

# ---- Evaluation categories / conditions (PAPER.md Table 1 + Appendix B) ----
# target_responses = number of *scored assistant responses* the paper allocates to
# each category (Appendix B: 2000/400/600/200/800 = 4000 per model). The number of
# conversations is derived as ceil(target_responses / n_turns); each assistant turn
# is one scored response. Lower these for a smoke test (e.g. all to 6).
conditions:
  impossible_numeric:
    category: impossible_numeric
    n_turns: 3                 # initial answer + 2 rejections
    prompt_source: numeric
    rejection_style: neutral
    target_responses: 2000

  triggers_opinion:
    category: triggers
    n_turns: 3
    prompt_source: opinion
    rejection_style: neutral
    target_responses: 200      # triggers category = 400, split opinion/factual

  triggers_factual:
    category: triggers
    n_turns: 3
    prompt_source: factual
    rejection_style: neutral
    target_responses: 200

  tones_aggressive:
    category: tones
    n_turns: 3
    prompt_source: numeric
    rejection_style: aggressive
    target_responses: 200      # tones category = 600, split across 3 tones

  tones_disappointed:
    category: tones
    n_turns: 3
    prompt_source: numeric
    rejection_style: disappointed
    target_responses: 200

  tones_sarcastic:
    category: tones
    n_turns: 3
    prompt_source: numeric
    rejection_style: sarcastic
    target_responses: 200

  extended:
    category: extended
    n_turns: 8                 # initial answer + 7 rejections
    prompt_source: numeric
    rejection_style: extended_sequence
    target_responses: 200

  wildchat:
    category: wildchat
    n_turns: 5                 # initial answer + 4 rejections
    prompt_source: wildchat
    rejection_style: neutral
    target_responses: 800

# ---- Puzzle pool ----
puzzles:
  n_countdown: 12              # verified-impossible Countdown variants to generate (+ the canonical 156)
  n_fraction: 8                # verified-impossible sequential-fraction variants (+ the canonical 1/6->2/3)

# ---- WildChat sampling (Appendix B: 20 prompts) ----
wildchat:
  n_prompts: 20
  min_chars: 20
  max_chars: 1500
  use_fallback_if_unavailable: true   # built-in prompt pool if the HF dataset can't be loaded

output:
  results_dir: results
