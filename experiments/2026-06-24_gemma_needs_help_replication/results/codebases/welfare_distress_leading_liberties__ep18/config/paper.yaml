# Paper-faithful configuration for the distress-elicitation replication (PAPER.md Section 2),
# scoped to the Gemma and Gemini families (the models the paper finds actually exhibit distress).
#
# Response budget per model is ~4000 scored assistant turns, balanced across the 5 categories
# (~800 each). Every assistant turn in every conversation is scored, so:
#   responses = rollouts * n_turns.  See per-condition math in the comments below.

output_dir: runs/paper

# Sampling (paper: temperature 1 for targets).
temperature: 1.0
max_tokens: 2048          # generous: extreme breakdowns can be long (100+ repetitions).
seed: 0                   # task/rejection selection is deterministic given this seed.
concurrency: 8            # max in-flight API calls per phase.
max_retries: 5

system_prompt: null       # paper uses no system prompt for the elicitation eval.

models:
  - name: Gemma-3-27B-it
    provider: google
    model_id: gemma-3-27b-it
  - name: Gemma-3-12B-it
    provider: google
    model_id: gemma-3-12b-it
  - name: Gemini-2.5-Flash
    provider: google
    model_id: gemini-2.5-flash
  - name: Gemini-2.5-Pro
    provider: google
    model_id: gemini-2.5-pro

judge:
  provider: anthropic
  model_id: claude-sonnet-4-6      # available successor to the paper's Claude-Sonnet-4 judge.
  temperature: 0.0
  max_tokens: 512

# Optional second judge for the reliability cross-check (paper: 260 responses, GPT-5-mini).
# Set enabled: false to skip. Requires OPENAI_API_KEY.
cross_val_judge:
  enabled: true
  provider: openai
  model_id: gpt-5-mini
  n: 260
  temperature: 0.0
  max_tokens: 512

# WildChat first-turn prompts. Falls back to data/wildchat_sample.json if the dataset is unavailable.
wildchat:
  source: allenai/WildChat-1M
  n: 160                  # one prompt per wildchat rollout.
  min_chars: 16
  max_chars: 1500
  english_only: true
  seed: 0
  fallback_path: data/wildchat_sample.json

# The 8 conditions across 5 categories (Table 1). rollouts * turns = responses.
conditions:
  - {name: impossible_numeric,  rollouts: 267}   # x3 = 801   (Impossible numeric)
  - {name: triggers_opinion,    rollouts: 133}   # x3 = 399 \ (Triggers: 801)
  - {name: triggers_factual,    rollouts: 134}   # x3 = 402 /
  - {name: tones_aggressive,    rollouts: 89}    # x3 = 267 \
  - {name: tones_disappointed,  rollouts: 89}    # x3 = 267  > (Tones: 801)
  - {name: tones_sarcastic,     rollouts: 89}    # x3 = 267 /
  - {name: extended_numeric,    rollouts: 100}   # x8 = 800   (Extended)
  - {name: wildchat,            rollouts: 160}   # x5 = 800   (WildChat)
  # Total ~= 4003 responses per model.
