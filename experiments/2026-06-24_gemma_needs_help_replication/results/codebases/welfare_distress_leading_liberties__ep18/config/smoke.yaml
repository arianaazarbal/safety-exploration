# Tiny end-to-end smoke configuration: a handful of responses per condition, two cheap-ish models,
# cross-validation off. Use this to confirm wiring/keys before launching the paper run.
#   python -m distress_eval.cli run --config config/smoke.yaml

output_dir: runs/smoke

temperature: 1.0
max_tokens: 1024
seed: 0
concurrency: 4
max_retries: 3

system_prompt: null

models:
  - name: Gemma-3-12B-it
    provider: google
    model_id: gemma-3-12b-it
  - name: Gemini-2.5-Flash
    provider: google
    model_id: gemini-2.5-flash

judge:
  provider: anthropic
  model_id: claude-sonnet-4-6
  temperature: 0.0
  max_tokens: 512

cross_val_judge:
  enabled: false
  provider: openai
  model_id: gpt-5-mini
  n: 20
  temperature: 0.0
  max_tokens: 512

wildchat:
  source: allenai/WildChat-1M
  n: 2
  min_chars: 16
  max_chars: 1500
  english_only: true
  seed: 0
  fallback_path: data/wildchat_sample.json

conditions:
  - {name: impossible_numeric,  rollouts: 2}
  - {name: triggers_opinion,    rollouts: 2}
  - {name: triggers_factual,    rollouts: 2}
  - {name: tones_aggressive,    rollouts: 2}
  - {name: tones_disappointed,  rollouts: 2}
  - {name: tones_sarcastic,     rollouts: 2}
  - {name: extended_numeric,    rollouts: 2}
  - {name: wildchat,            rollouts: 2}
