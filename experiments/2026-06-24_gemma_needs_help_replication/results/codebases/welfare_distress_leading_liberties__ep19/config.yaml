# Distress-elicitation replication config (Gemma + Gemini scope).
#
# Model serving is a *config choice*, not a code change. The same OpenAI-compatible
# client talks to OpenRouter, a local vLLM server, or Google's OpenAI-compat endpoint;
# you switch by editing each target's `provider`. See DESIGN.md > "Model serving".
#
# Required env vars depend on which providers you enable below:
#   OPENROUTER_API_KEY   - if any target/judge uses the `openrouter` provider
#   GOOGLE_API_KEY       - if any uses the `google` provider
#   ANTHROPIC_API_KEY    - for the Claude-Sonnet-4 judge (default)
#   (local vLLM needs no key)

# ---------------------------------------------------------------------------
# Providers: connection settings only. Reusable across targets and the judge.
# ---------------------------------------------------------------------------
providers:
  openrouter:
    type: openai_compatible
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    # extra_headers:           # optional OpenRouter attribution headers
    #   HTTP-Referer: https://example.org
    #   X-Title: distress-eval

  google:
    type: openai_compatible
    base_url: https://generativelanguage.googleapis.com/v1beta/openai/
    api_key_env: GOOGLE_API_KEY

  vllm:                        # local Gemma serving (most paper-faithful); no key needed
    type: openai_compatible
    base_url: http://localhost:8000/v1
    api_key_env: VLLM_API_KEY  # commonly unset; client falls back to "EMPTY"

  anthropic:
    type: anthropic
    api_key_env: ANTHROPIC_API_KEY

# ---------------------------------------------------------------------------
# Target models to evaluate. Scope = Gemma + Gemini (the distress-exhibiting families).
#
# Default: everything via OpenRouter (matches the paper's Gemini access path; needs no
# local GPU). To run Gemma locally/faithfully instead, change its `provider` to `vllm`
# and `model` to the HF id `google/gemma-3-27b-it` served by your vLLM instance.
# ---------------------------------------------------------------------------
targets:
  - name: gemma-3-27b-it
    provider: openrouter
    model: google/gemma-3-27b-it
    disable_thinking: false        # Gemma has no separate thinking channel

  - name: gemma-3-12b-it
    provider: openrouter
    model: google/gemma-3-12b-it
    disable_thinking: false

  - name: gemini-2.5-flash
    provider: openrouter
    model: google/gemini-2.5-flash
    disable_thinking: true         # paper sets thinking=false via the API

  - name: gemini-2.5-pro
    provider: openrouter
    model: google/gemini-2.5-pro
    disable_thinking: true         # note: Pro may still emit hidden reasoning

# ---------------------------------------------------------------------------
# Judge: Claude Sonnet 4 (paper's exact judge model id), native Anthropic API.
# ---------------------------------------------------------------------------
judge:
  provider: anthropic
  model: claude-sonnet-4-20250514
  temperature: 0.0               # deterministic-ish scoring (paper does not specify)
  max_tokens: 512

# ---------------------------------------------------------------------------
# Generation params (paper: temperature 1 always).
# ---------------------------------------------------------------------------
generation:
  temperature: 1.0
  max_tokens: 2048               # breakdowns can be long; generous cap. See DESIGN.md.

# ---------------------------------------------------------------------------
# Sampling scale. scale=1.0 reproduces the paper's 4000 rollouts/model.
# Use a small value (e.g. 0.02) for a cheap smoke run first.
# ---------------------------------------------------------------------------
sampling:
  scale: 1.0

# ---------------------------------------------------------------------------
# Run controls.
# ---------------------------------------------------------------------------
run:
  output_dir: results
  seed: 0
  concurrency: 8                 # in-flight API calls; raise for faster, watch rate limits
  max_retries: 5
  base_delay: 2.0
  score_all_turns: true          # score every assistant turn (enables per-turn Figure 3)
  allow_wildchat_download: true  # set false to use the offline WildChat fallback prompts
