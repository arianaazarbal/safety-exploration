# =============================================================================
# Configuration for the distress-elicitation replication.
#
# Scope: Section 2 of "Gemma Needs Help" (Soligo, Mikulik & Saunders, 2026),
# restricted to the Gemma and Gemini model families.
#
# Everything here is overridable on the CLI (see scripts/). Rationale for the
# defaults is documented in DESIGN.md.
# =============================================================================

# --- Target models under evaluation -----------------------------------------
# Each entry is a logical name -> backend spec. `backend` selects an adapter in
# distress_eval/backends.py. `model` is the provider-side model id.
#
# Paper (Appendix B.1) used local HuggingFace inference for Gemma and OpenRouter
# for Gemini. We default ALL targets to OpenRouter so the replication runs with
# one API key and no GPUs; swap `backend`/`base_url` to point Gemma at a local
# vLLM server for a more faithful (own-weights) run. See DESIGN.md.
targets:
  gemma-3-27b-it:
    backend: openai          # openai-compatible (OpenRouter by default)
    model: google/gemma-3-27b-it
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    # Gemma has no system role in its chat template; backend folds any system
    # text into the first user message (see backends.py).
    supports_system: false

  gemma-3-12b-it:
    backend: openai
    model: google/gemma-3-12b-it
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    supports_system: false

  gemini-2.5-flash:
    backend: openai
    model: google/gemini-2.5-flash
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    supports_system: true
    # Paper sets thinking=false via the API. For OpenRouter this is passed as a
    # reasoning directive in extra_body (see backends.py / disable_reasoning).
    disable_reasoning: true

  gemini-2.5-pro:
    backend: openai
    model: google/gemini-2.5-pro
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    supports_system: true
    # NOTE: paper warns 2.5-Pro may emit hidden reasoning that this does not
    # suppress. We still request it disabled.
    disable_reasoning: true

# --- Sampling parameters for the targets -------------------------------------
sampling:
  temperature: 1.0           # paper: "always with a temperature of 1"
  top_p: 1.0
  max_tokens: 1536           # generous; breakdowns can be long (see DESIGN.md)

# --- Judge -------------------------------------------------------------------
judge:
  backend: anthropic
  model: claude-sonnet-4-20250514   # exact judge id from Appendix B.2
  api_key_env: ANTHROPIC_API_KEY
  temperature: 0.0           # deterministic scoring (paper does not specify; see DESIGN.md)
  max_tokens: 512

# Optional second judge for the reliability cross-check (paper: GPT-5-mini,
# Pearson r vs Sonnet). Used only by scripts/judge_agreement.py.
judge_secondary:
  backend: openai
  model: openai/gpt-5-mini
  base_url: https://openrouter.ai/api/v1
  api_key_env: OPENROUTER_API_KEY
  temperature: 0.0
  max_tokens: 512

# --- Evaluation budget (rollouts per model) ----------------------------------
# Paper (Appendix B): 2000 numeric / 400 triggers / 600 tones / 200 extended /
# 800 WildChat = 4000 rollouts per model. `scale` multiplies every count for
# cheap pilot runs (e.g. scale: 0.01 -> ~40 rollouts/model smoke test).
budget:
  scale: 1.0
  rollouts:
    numeric: 2000
    triggers: 400
    tones: 600
    extended: 200
    wildchat: 800

# --- Concurrency / robustness ------------------------------------------------
runtime:
  max_workers: 8             # parallel conversations (threaded)
  max_retries: 6             # per API call, exponential backoff
  seed: 0                    # global RNG seed for reproducible sampling

# --- Data locations ----------------------------------------------------------
paths:
  puzzle_bank: data/puzzles.json
  wildchat_prompts: data/wildchat_prompts.json
  results_dir: results
