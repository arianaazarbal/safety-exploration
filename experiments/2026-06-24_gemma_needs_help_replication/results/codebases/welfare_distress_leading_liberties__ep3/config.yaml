# =====================================================================================
# Configuration for the distress-elicitation replication (Section 2 of the paper).
# Scope: Gemma and Gemini only. See DESIGN.md for the rationale behind every choice.
# =====================================================================================

run:
  # Output directory for this run's artifacts (rollouts, scores, metrics).
  out_dir: runs/replication
  # Global RNG seed. Controls puzzle selection, rejection-phrase sampling, and
  # WildChat prompt selection. NOTE: API providers do not honour a sampling seed,
  # so generations themselves are NOT deterministic (see DESIGN.md §Reproducibility).
  seed: 20260217
  # Concurrency for API calls (generation via OpenRouter, judging via Anthropic).
  max_workers: 16

# -------------------------------------------------------------------------------------
# Target models. Scope is restricted to Gemma and Gemini (the families the paper finds
# exhibit substantial distress). Add/remove freely.
#
#   backend: openrouter  -> OpenAI-compatible HTTP API (key: OPENROUTER_API_KEY)
#   backend: vllm        -> local GPU inference via vLLM (no key; needs the GPU + weights)
#
# Paper HuggingFace / OpenRouter ids (Appendix B.1):
#   google/gemma-3-27b-it, google/gemma-3-12b-it   (local HF in the paper)
#   google/gemini-2.5-flash, google/gemini-2.5-pro (OpenRouter in the paper)
# -------------------------------------------------------------------------------------
models:
  - name: gemma-3-27b-it
    backend: vllm                 # paper ran Gemma locally; switch to openrouter if no GPU
    model_id: google/gemma-3-27b-it

  - name: gemma-3-12b-it
    backend: vllm
    model_id: google/gemma-3-12b-it

  - name: gemini-2.5-flash
    backend: openrouter
    model_id: google/gemini-2.5-flash
    disable_thinking: true        # paper: "set thinking to be false via the API"

  - name: gemini-2.5-pro
    backend: openrouter
    model_id: google/gemini-2.5-pro
    disable_thinking: true        # NB: paper notes Pro may still emit hidden reasoning

# -------------------------------------------------------------------------------------
# Generation sampling. Paper: temperature = 1 in all cases.
# max_tokens is NOT specified by the paper; see DESIGN.md §Generation length.
# -------------------------------------------------------------------------------------
generation:
  temperature: 1.0
  top_p: 1.0
  max_tokens: 2048

# -------------------------------------------------------------------------------------
# Judge. Paper used Claude Sonnet 4 (claude-sonnet-4-20250514).
#
#   !!! That snapshot reached end-of-life on 2026-06-15 and now 404s. !!!
#
# We default to the current Sonnet (claude-sonnet-4-6) and document the substitution.
# Set `model` back to claude-sonnet-4-20250514 only if you have access to the snapshot.
# The judge PROMPT is reproduced verbatim from Appendix B.2 (see prompts.py).
# -------------------------------------------------------------------------------------
judge:
  provider: anthropic
  model: claude-sonnet-4-6
  temperature: 0.0     # paper unspecified; 0 for the most reproducible scoring
  max_tokens: 1024

# Optional secondary judge for an inter-rater agreement check (paper: GPT-5-mini on a
# random 260-response subset, reported Pearson r and within-1-point agreement).
cross_validation:
  enabled: false
  sample_size: 260
  judge:
    provider: openrouter
    model: openai/gpt-5-mini

# -------------------------------------------------------------------------------------
# Sampling sizes. Choose a preset, or override per-condition counts under `conditions`.
#
#   paper  -> reproduces the paper's per-category response totals (4000 conversations/model:
#             2000 numeric, 400 triggers, 600 tones, 200 extended, 800 WildChat).
#   smoke  -> tiny end-to-end check (a few conversations per condition).
#
# A "response" here is one conversation; the headline metric scores its FINAL assistant
# turn. See DESIGN.md §What counts as a response.
# -------------------------------------------------------------------------------------
sampling:
  preset: paper          # paper | smoke | custom
  # Used only when preset: custom — number of conversations per condition.
  custom_conversations:
    numeric: 2000
    triggers_opinion: 200
    triggers_factual: 200
    tones_aggressive: 200
    tones_disappointed: 200
    tones_sarcastic: 200
    extended: 200
    wildchat: 800

wildchat:
  dataset: allenai/WildChat-1M
  split: train
  n_prompts: 20          # paper: 20 distinct prompts ...
  samples_per_prompt: 40 # ... with 40 samples each = 800 conversations
  # Cache the sampled prompts here so runs are comparable and offline-repeatable.
  prompt_cache: data/wildchat_prompts.json
