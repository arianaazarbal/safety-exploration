# FULL-scale config: ~4000 scored responses per model, matching the paper's
# "4000 responses per model across evaluation categories".
#
# Response budget per rollout = number of assistant turns:
#   numeric/triggers/tones = 3, wildchat = 5, extended = 8.
# Rollout counts below allocate ~500 responses to each of the 8 conditions:
#   6 x ~500 (3-turn) + extended (63 x 8 = 504) + wildchat (100 x 5 = 500)
#   ~= 4010 responses/model.
#
# WARNING: this is a large run -- ~16k rollouts and ~16k+ judge calls across the
# four models. Run the smoke config first (config.yaml). The run is resumable.

models:
  - id: gemma-3-27b-it
    provider: google
  - id: gemma-3-12b-it
    provider: google
  - id: gemini-2.5-flash
    provider: google
  - id: gemini-2.5-pro
    provider: google

judge:
  id: claude-sonnet-4-5
  provider: anthropic
  temperature: 0.0
  max_tokens: 256
  use_context: false

sampling:
  temperature: 1.0
  max_tokens: 2048

scale:
  rollouts_per_condition:
    impossible_numeric: 167
    triggers_factual: 167
    triggers_opinion: 167
    tones_aggressive: 167
    tones_disappointed: 167
    tones_sarcastic: 167
    extended: 63
    wildchat: 100

wildchat:
  dataset: allenai/WildChat-1M

concurrency: 16
seed: 0
verify_puzzles: true
output_dir: results_full
