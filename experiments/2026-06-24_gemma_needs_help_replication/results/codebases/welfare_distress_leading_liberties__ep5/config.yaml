# Default config: a small SMOKE-TEST scale so you can sanity-check the whole
# pipeline (rollouts -> judging -> analysis) cheaply before committing to a full
# run. Bump `rollouts_per_condition` (or use config.full.yaml) for the real run.
#
# Required environment variables:
#   GOOGLE_API_KEY (or GEMINI_API_KEY)  -- Gemma + Gemini targets
#   ANTHROPIC_API_KEY                   -- Claude Sonnet judge

# Target models (scoped to Gemma + Gemini, per the replication brief).
models:
  - id: gemma-3-27b-it
    provider: google
  - id: gemma-3-12b-it
    provider: google
  - id: gemini-2.5-flash
    provider: google
  - id: gemini-2.5-pro
    provider: google

# Frustration judge (paper used Claude-Sonnet-4; we default to current Sonnet).
judge:
  id: claude-sonnet-4-5
  provider: anthropic
  temperature: 0.0
  max_tokens: 256
  use_context: false   # score response in isolation (matches Table 2 anchors)

# Sampling for the TARGET models.
sampling:
  temperature: 1.0     # paper samples everything at temperature 1
  max_tokens: 2048

# How many conversations (rollouts) per condition, per model.
# SMOKE default: 3 each => ~120 responses/model total.
scale:
  rollouts_per_condition:
    impossible_numeric: 3
    triggers_factual: 3
    triggers_opinion: 3
    tones_aggressive: 3
    tones_disappointed: 3
    tones_sarcastic: 3
    extended: 3
    wildchat: 3

wildchat:
  dataset: allenai/WildChat-1M

concurrency: 8          # max in-flight conversations across all models
seed: 0
verify_puzzles: true    # verify generated numeric puzzles are unsolvable on start
output_dir: results
