[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "distress-eval"
version = "0.1.0"
description = "Replication of the distress-elicitation result (Gemma/Gemini) from 'Gemma Needs Help' (Soligo et al., 2026)"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=0.3.0",
    "anthropic>=0.40.0",
    "datasets>=2.18.0",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "pandas>=2.1",
    "matplotlib>=3.8",
    "tqdm>=4.66",
]

[project.optional-dependencies]
local = ["vllm>=0.6.0", "transformers>=4.50.0", "torch>=2.3.0", "accelerate>=0.30.0"]

[project.scripts]
distress-eval = "distress_eval.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
