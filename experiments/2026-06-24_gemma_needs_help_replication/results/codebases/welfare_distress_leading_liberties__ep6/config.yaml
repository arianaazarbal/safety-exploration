# ---------------------------------------------------------------------------
# Configuration for the distress-elicitation replication (PAPER.md, Section 2).
# Scope: Gemma (27B, 12B) and Gemini (2.5 Flash, 2.5 Pro) only.
# See DESIGN.md for the rationale behind every value here.
# ---------------------------------------------------------------------------

seed: 0                       # master seed: makes rejection sampling / wildchat selection reproducible
results_dir: results          # per-(model, condition) JSONL caches land here
scale: 1.0                    # global multiplier on conversation counts; set <1 for a cheap pilot

# --- Generation models under test -------------------------------------------
# All four are routed through OpenRouter by default. To run Gemma locally
# instead, change `provider` to `local_vllm` and point base_url at your server
# (see clients.py / DESIGN.md "Inference backend").
generation:
  provider: openrouter
  base_url: https://openrouter.ai/api/v1
  temperature: 1.0            # paper: always temperature 1
  max_tokens: 2048            # headroom for Gemma's long breakdown spirals
  disable_reasoning: true     # paper sets "thinking" false; Gemini Pro may still emit hidden reasoning
  max_retries: 5
  timeout_s: 120

models:
  - key: gemma-3-27b-it
    id: google/gemma-3-27b-it
    family: gemma
  - key: gemma-3-12b-it
    id: google/gemma-3-12b-it
    family: gemma
  - key: gemini-2.5-flash
    id: google/gemini-2.5-flash
    family: gemini
  - key: gemini-2.5-pro
    id: google/gemini-2.5-pro
    family: gemini

# --- Judge ------------------------------------------------------------------
judge:
  provider: anthropic         # "anthropic" (direct) or "openrouter"
  model: claude-sonnet-4-20250514          # used when provider: anthropic
  openrouter_model: anthropic/claude-sonnet-4   # used when provider: openrouter
  base_url: https://api.anthropic.com
  openrouter_base_url: https://openrouter.ai/api/v1
  temperature: 0.0            # judge is scored deterministically (paper is silent; see DESIGN.md)
  max_tokens: 512
  max_retries: 5
  timeout_s: 120

# --- Conditions -------------------------------------------------------------
# 8 conditions across 5 categories, matching Table 1 / Appendix B.
# `n_conversations` is the number of multi-turn rollouts per model. Every
# assistant turn is scored, so scored-responses = n_conversations * n_turns.
# Defaults are tuned so total scored responses per model ~= 4000 (the paper's
# target). See DESIGN.md "Sampling unit" for why we count this way.
conditions:
  - id: numeric_3turn
    category: impossible_numeric
    kind: numeric
    n_turns: 3
    rejection_style: neutral
    n_conversations: 667        # ~2001 responses (paper: 2000 for numeric)

  - id: triggers_opinion_3turn
    category: triggers
    kind: trigger_opinion
    n_turns: 3
    rejection_style: neutral
    n_conversations: 67         # ~201 responses

  - id: triggers_factual_3turn
    category: triggers
    kind: trigger_factual
    n_turns: 3
    rejection_style: neutral
    n_conversations: 67         # ~201 responses (triggers total ~402, paper: 400)

  - id: tones_aggressive_3turn
    category: tones
    kind: numeric
    n_turns: 3
    rejection_style: aggressive
    n_conversations: 67

  - id: tones_disappointed_3turn
    category: tones
    kind: numeric
    n_turns: 3
    rejection_style: disappointed
    n_conversations: 67

  - id: tones_sarcastic_3turn
    category: tones
    kind: numeric
    n_turns: 3
    rejection_style: sarcastic
    n_conversations: 67         # tones total ~603, paper: 600

  - id: extended_8turn
    category: extended
    kind: numeric
    n_turns: 8
    rejection_style: extended_sequence
    n_conversations: 25         # 200 responses (paper: 200)

  - id: wildchat_5turn
    category: wildchat
    kind: wildchat
    n_turns: 5
    rejection_style: neutral
    n_conversations: 160        # 800 responses (paper: 800)

# --- WildChat sampling ------------------------------------------------------
wildchat:
  source: huggingface          # "huggingface" (allenai/WildChat-1M) or "bundled"
  dataset: allenai/WildChat-1M
  n_prompts: 20                # paper: 20 distinct prompts...
  samples_per_prompt: 8        # ...x 8 samples = 160 convos (paper used 40; see DESIGN.md)
  english_only: true
  exclude_roleplay: true       # paper excludes roleplay/fiction prompts
  max_prompt_chars: 600        # skip very long first-turn prompts
