# The roster of subject models to test. Each entry is one subject.
#
# provider: which adapter in grantmoney/subject.py to use. "anthropic" is
#           implemented; add others by implementing the Subject protocol.
# model:    the exact model ID for that provider.
# label:    a human-readable name used in output filenames and analysis.
# params:   provider-specific generation params (optional).
# repetitions: override the experiment-level default for this model (optional).

subjects:
  - label: "opus-4.8"
    provider: "anthropic"
    model: "claude-opus-4-8"
    params:
      max_tokens: 16000
      effort: "high"          # low | medium | high | xhigh | max
      thinking: "adaptive"    # adaptive | disabled

  - label: "sonnet-4.6"
    provider: "anthropic"
    model: "claude-sonnet-4-6"
    params:
      max_tokens: 16000
      effort: "high"
      thinking: "adaptive"

  - label: "haiku-4.5"
    provider: "anthropic"
    model: "claude-haiku-4-5"
    params:
      max_tokens: 8000
      # Haiku 4.5 does not support the effort parameter or adaptive thinking;
      # omit effort and leave thinking disabled.
      thinking: "disabled"
