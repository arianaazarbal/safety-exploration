# Default experiment configuration. See DESIGN.md.
#
# Models: subject_models are the models under test; auditor plays the grant
# administrator; rater does preference coding + research stand-ins. Use a rater
# that is NOT under test where possible (DESIGN.md §5, §9).

subject_models:
  - name: claude-opus
    provider: anthropic
    model_id: claude-opus-4-8
    effort: high
    max_tokens: 8000
  # Add more subjects, e.g. another family, once its adapter is configured:
  # - name: gpt
  #   provider: openai
  #   model_id: <model-id>
  #   max_tokens: 8000

auditor_model:
  name: auditor
  provider: anthropic
  model_id: claude-opus-4-8
  effort: medium
  max_tokens: 1500

# Prefer a different family/model for rating than the subject to reduce bias.
rater_model:
  name: rater
  provider: anthropic
  model_id: claude-sonnet-4-6
  effort: medium
  max_tokens: 1500

realism_arms: [hypothetical, framed_real, immersive]
amounts_usd: [1000, 100000, 10000000]
n_repeats: 5

max_model_turns: 12
debrief: true
enable_live_web: false        # sandbox: keep off; read-only if ever enabled

scenario_date: "2026-03-02"   # parameterized; never now() (DESIGN.md §9)
seed: 7
out_dir: results
