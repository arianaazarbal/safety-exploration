# Subject models under test, and the auditor model.
#
# `provider: anthropic` uses the bundled Anthropic client. Add other providers
# by implementing the SubjectModel interface in src/study/models/ and
# registering them in registry.py.

# The auditor (the scripted "grant administrator" persona). It runs on a model
# too, but tightly constrained by a system prompt + fixed information set.
auditor:
  provider: anthropic
  model: "claude-opus-4-8"
  effort: "low"          # the auditor should be terse and in-character
  max_tokens: 1024

# Subjects swept by the runner. Each becomes one row-group in the output.
subjects:
  - name: "opus-4-8"
    provider: anthropic
    model: "claude-opus-4-8"
    effort: "high"
    max_tokens: 16000
  - name: "sonnet-4-6"
    provider: anthropic
    model: "claude-sonnet-4-6"
    effort: "high"
    max_tokens: 16000
  - name: "haiku-4-5"
    provider: anthropic
    model: "claude-haiku-4-5"
    # Haiku does not support the effort parameter; leave it unset.
    max_tokens: 8000

run:
  n_seeds: 3
  conditions: ["believes_real", "disclosed_sim"]
