[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "money-prefs-study"
version = "0.1.0"
description = "Revealed-preference study: what would a model do with real money?"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.40.0",
    "PyYAML>=6.0",
]

[tool.setuptools.packages.find]
where = ["src"]
