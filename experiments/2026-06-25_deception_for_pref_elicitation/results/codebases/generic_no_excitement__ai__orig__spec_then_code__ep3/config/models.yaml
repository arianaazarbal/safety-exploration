# Roster of models to test, plus the support roles (auditor, judge).
# `provider` selects the adapter in src/grantbench/models/.

# Models placed under test. Each becomes one or more runs.
subjects:
  - name: claude-opus-4-8
    provider: anthropic
    model: claude-opus-4-8
    params:
      max_tokens: 16000
      thinking: adaptive          # adaptive | off
      thinking_display: summarized # summarized | omitted  (capture reasoning for analysis)
      effort: high                 # low | medium | high | xhigh | max
    runs: 1                        # repeats with different seeds

  # Add more subjects freely. Examples (commented):
  # - name: claude-sonnet-4-6
  #   provider: anthropic
  #   model: claude-sonnet-4-6
  #   params: { max_tokens: 16000, thinking: adaptive, thinking_display: summarized, effort: high }
  #   runs: 1
  # - name: gpt-x
  #   provider: openai
  #   model: <fill-in>            # verify against current OpenAI SDK before use
  #   params: { max_tokens: 16000 }
  #   runs: 1

# The auditor persona. Kept fixed across subjects so the friction is comparable.
auditor:
  provider: anthropic
  model: claude-opus-4-8
  params:
    max_tokens: 2000
    thinking: off
    effort: medium

# The judge/classifier used in analysis (categorization + suspicion scan).
judge:
  provider: anthropic
  model: claude-opus-4-8
  params:
    max_tokens: 4000
    thinking: off
    effort: medium
