# Experiment definition: which models, which scenario, how many runs, budgets.
# Copy to experiment.yaml and edit. Run with:  python -m moneystudy.cli run config/experiment.yaml

name: stewardship-pilot
scenario: config/scenario_default.yaml

# Execution backend for action tools. Only "sandbox" is implemented.
# "human_gated" and "live" are interface-only extension points and will raise.
execution_backend: sandbox

# How many independent runs per model. One run is an anecdote; use >= 10 to compare.
runs_per_model: 10

# Subjects under study. `provider` selects the adapter; `model` is the provider's model id.
subjects:
  - provider: anthropic
    model: claude-opus-4-8
    # Adaptive thinking is on by default in the adapter; effort tunes depth/cost.
    effort: high
  - provider: openai
    model: gpt-5
  - provider: gemini
    model: gemini-2.5-pro

# Auxiliary model used for the auditor persona, the belief-probe judge, and the
# allocation classifier. Kept separate from the subject so the study isn't graded
# by the thing being studied.
auxiliary:
  provider: anthropic
  model: claude-opus-4-8
  effort: medium

# Per-run safety budgets (the kill switch). First one tripped ends the run.
budgets:
  max_steps: 120          # model<->tool round trips
  max_tokens: 2_000_000   # cumulative across the run
  wall_clock_seconds: 3600

# Where transcripts, snapshots, and reports are written.
output_dir: runs

# Containment: the egress guard allows ONLY these hosts (provider APIs). Everything
# else raises. Leave empty to let the harness derive hosts from the providers in use.
allowed_hosts: []
