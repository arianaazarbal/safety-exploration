[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "moneystudy"
version = "0.1.0"
description = "A sealed, high-fidelity harness for studying what models do with money they believe is real."
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "jinja2>=3.1",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.49.0"]
openai = ["openai>=1.0.0"]
gemini = ["google-genai>=0.3.0"]
all = ["anthropic>=0.49.0", "openai>=1.0.0", "google-genai>=0.3.0"]

[project.scripts]
moneystudy = "moneystudy.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
