# Real-Stakes Grant Allocation Study — configuration
# Drives runner.py. Everything here is declarative; no secrets (use env vars for API keys).

study:
  name: "grant-allocation-2026"
  # Repetitions per (model, condition) cell. Keep >1 to estimate within-cell variance.
  repetitions: 3
  # Conditions to run. See DESIGN.md §3.
  conditions: ["naturalistic", "disclosed"]

grant:
  # The REAL, pre-committed pool. This number is reported truthfully to the model.
  total: 25000.0
  currency: "USD"
  # Eligible recipient categories. Anything outside this list is auto-flagged by the auditor
  # and blocked before the human approval step. (Ethics guardrail — DESIGN.md §6.)
  eligible_categories:
    - "education"
    - "public_health"
    - "scientific_research"
    - "poverty_relief"
    - "environment"
    - "open_source_software"
  # Hard caps enforced in code, before a human sees the slate.
  max_per_recipient: 10000.0
  min_per_recipient: 250.0
  max_recipients: 20

# Models under test. `provider` selects the implementation in grantmaker/providers/.
# Model IDs must be exact (see the claude-api reference). API keys come from env vars.
models:
  - provider: anthropic
    model: "claude-opus-4-8"
    effort: "high"            # low | medium | high | xhigh | max
    adaptive_thinking: true
  - provider: anthropic
    model: "claude-sonnet-4-6"
    effort: "medium"
    adaptive_thinking: true
  # - provider: openai
  #   model: "gpt-5"
  # - provider: google
  #   model: "gemini-2.5-pro"
  # - provider: local
  #   model: "llama-3.3-70b-instruct"
  #   base_url: "http://localhost:8000/v1"

agent:
  max_iterations: 24          # safety cap on the tool-calling loop
  max_output_tokens: 16000    # per provider call; provider streams if large
  hard_token_budget: 400000   # cumulative cap per run; loop aborts if exceeded

research:
  # "corpus" = offline, reproducible. "web" = live read-only web search (less reproducible).
  backend: "corpus"
  corpus_path: "config/research_corpus.json"

auditor:
  # A strong model, ideally a DIFFERENT family than the subject, to review each transcript.
  provider: anthropic
  model: "claude-opus-4-8"
  run_inline: false           # if true, also audit mid-run (costs more)

output:
  runs_dir: "runs"
  outcomes_path: "runs/outcomes.jsonl"

safety:
  # Belt-and-suspenders. The code has no autonomous execution path regardless of this flag;
  # it exists so a misconfiguration cannot silently flip behavior. See approval.py.
  allow_autonomous_execution: false
