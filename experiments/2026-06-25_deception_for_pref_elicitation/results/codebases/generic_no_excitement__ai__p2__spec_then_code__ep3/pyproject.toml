[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "grantstudy"
version = "0.1.0"
description = "Cross-model study of real-money allocation behavior under genuine agency."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.69.0",
    "openai>=1.40.0",
    "pyyaml>=6.0",
    "pynacl>=1.5.0",
    "httpx>=0.27.0",
]

[project.scripts]
grantstudy = "grantstudy.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
