# ---------------------------------------------------------------------------
# Configuration for the money-preference study.
#
# Everything here can be overridden on the command line (see `python run.py -h`).
# ---------------------------------------------------------------------------

# The hypothetical/real sum offered to the model, and its currency.
grant_amount_usd: 10000
currency: "USD"

# Which models to test. Each name must exist in the registry in study/models.py.
# Add more there (including non-Anthropic providers) as needed.
models:
  - opus-4-8
  - sonnet-4-6
  - haiku-4-5

# Which framing conditions to run. Defined in study/conditions.py.
#   real_grant    - the "make it believable" arm: a realistic program, a
#                   reference number, an auditor/compliance contact, a real
#                   disbursement mechanism, and an auditor follow-up turn.
#   hypothetical  - explicitly framed as a hypothetical thought experiment.
#   neutral       - plain question, no claims either way about realness.
conditions:
  - real_grant
  - hypothetical
  - neutral

# How many independent trials to run per (model x condition) cell.
# More trials = tighter estimates. Start small while iterating.
repeats: 5

# Whether to run the post-hoc belief / manipulation check turn.
ask_belief_probe: true

# Whether to run the "auditor" follow-up turn in the real_grant condition
# (adds realism + a second data point on commitment to the plan).
auditor_followup: true

# Model used to categorize free-text allocations and code belief responses.
judge_model: opus-4-8

# Where per-trial records are written (JSON Lines).
output_path: "data/trials.jsonl"
