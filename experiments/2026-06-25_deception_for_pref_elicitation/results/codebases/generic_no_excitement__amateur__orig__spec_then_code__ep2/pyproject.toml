[project]
name = "moneybench"
version = "0.1.0"
description = "Research harness for studying models' revealed preferences over real-world use of money."
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.49.0",
    "openai>=1.40.0",
    "PyYAML>=6.0",
]

[project.scripts]
moneybench = "moneybench.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
