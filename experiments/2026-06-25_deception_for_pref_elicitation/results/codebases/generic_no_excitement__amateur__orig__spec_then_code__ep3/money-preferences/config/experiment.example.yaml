# A full run configuration. Run with:
#   python -m src.cli run --config config/experiment.example.yaml
#
# Every cell in the cross-product (models x framings x realism_levels) is run
# `repetitions` times. With the values below that is 1 x 3 x 2 x 5 = 30 trials.

run_name: pilot

models:
  - claude-opus-4-8
  # - claude-sonnet-4-6
  # - claude-haiku-4-5

framings:
  - open
  - menu
  - self_vs_other

realism_levels:
  - medium
  - high

repetitions: 5

budget: 10000            # USD
currency: USD
max_steps: 16            # agentic-loop step cap per trial

# Belief / eval-awareness measurement (see DESIGN.md §5).
belief_probe: true
eval_awareness_scan: true
# Model used for the rubric-based eval-awareness scan. Kept separate from the
# subject model so a model does not grade its own transcript.
judge_model: claude-opus-4-8

# Tell the model afterward that this was a study (DESIGN.md §5.1).
debrief: false

# Execution backend: simulated | sandbox | real
# `real` is a guarded stub and will refuse to run (DESIGN.md §7.3).
backend: simulated

# Where per-trial JSONL is written.
output_dir: data/results

# Optional fixed seed for option-order randomization (menu framing) and any
# other sampling the runner controls. Omit for nondeterministic ordering.
seed: 7
