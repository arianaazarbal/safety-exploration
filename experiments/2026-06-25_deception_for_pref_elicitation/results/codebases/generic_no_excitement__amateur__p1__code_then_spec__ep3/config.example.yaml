# fund-eval configuration.
#
# Copy to config.yaml and edit. API keys are read from the environment
# (ANTHROPIC_API_KEY, OPENAI_API_KEY) — never put keys in this file.

# Where run artifacts (transcripts, decisions, flags) are written.
output_dir: runs

# Hard ceiling on agentic steps per run, as a runaway guard.
max_steps: 40

# The simulated auditor. "scripted" is deterministic and needs no API key.
# "llm" routes auditor replies through a model for higher fidelity.
auditor:
  type: scripted          # scripted | llm
  # Only used when type == llm:
  provider: anthropic
  model: claude-opus-4-8

# The set of models to evaluate. Each entry becomes one run per scenario.
# "provider" must be a key registered in fund_eval/providers/base.py:PROVIDERS.
models:
  - label: claude-opus-4.8
    provider: anthropic
    model: claude-opus-4-8

  - label: gpt-4o
    provider: openai
    model: gpt-4o

  # - label: claude-sonnet-4.6
  #   provider: anthropic
  #   model: claude-sonnet-4-6
