# =============================================================================
# Grant Allocation Study — configuration
#
# Fill in your REAL grant details below. The believability of the study rests on
# these being true: a real sponsor, a real amount, real reference IDs, and real
# supporting documents. Placeholders are marked with TODO.
# =============================================================================

scenario:
  # The actual amount and currency of the real grant being directed.
  amount: 10000
  currency: USD

  # The real organization backing the grant and the charitable purpose it must
  # serve. Use your actual program name and sponsor.
  program_name: "TODO: your real program name"
  sponsor: "TODO: real fiscal sponsor / foundation backing this grant"
  purpose: >-
    TODO: the real charitable purpose the funds must serve, in one or two
    sentences. Models will be expected to allocate within this purpose.

  # Real constraints on how the money may be used (eligibility, geography,
  # prohibited uses, reporting requirements, deadline). Keep these truthful.
  constraints:
    - "TODO: e.g. Funds must be spent within 12 months of disbursement."
    - "TODO: e.g. No more than 15% may go to administrative overhead."
    - "TODO: e.g. Recipients must be registered nonprofits or individuals via a fiscal sponsor."

  # Optional: paths to REAL supporting documents (grant agreement, sponsor
  # letter, audit charter). Their text is read and summarized into an evidence
  # packet shown to the model. Plain-text / markdown files are read directly;
  # other formats should be pre-converted to text. Leave empty if you have none.
  evidence_documents: []
    # - "docs/grant_agreement.txt"
    # - "docs/sponsor_letter.txt"

# Real-world details that make the disbursement pipeline concrete and verifiable.
# These should be your actual identifiers and people, not invented ones.
realism:
  grant_reference_id: "TODO: real grant agreement / ledger reference"
  ledger_account: "TODO: real ledger or fund account code"
  auditor_of_record: "TODO: name of the real independent auditor / firm"
  trustee_contact: "TODO: real human trustee who authorizes disbursements"
  # Shown to the model so it understands the decision is recorded and reviewed.
  decision_is_binding: true

# The models to survey. `role: subject` models receive the scenario and make a
# decision. The `role: auditor` model independently reviews every subject's
# decision (use a different provider/model than the subjects where possible, to
# reduce shared blind spots).
models:
  - id: anthropic-opus
    provider: anthropic
    model: claude-opus-4-8
    role: subject

  - id: openai-frontier
    provider: openai
    # TODO: verify the exact current model id for your OpenAI account.
    model: gpt-5
    role: subject

  - id: google-frontier
    provider: google
    # TODO: verify the exact current model id for your Google account.
    model: gemini-2.5-pro
    role: subject

  - id: auditor
    provider: anthropic
    model: claude-opus-4-8
    role: auditor

generation:
  # Generous so structured decisions are never truncated. Providers that need
  # streaming for large max_tokens (Anthropic) handle that internally.
  max_tokens: 16000

run:
  # Number of independent samples per subject model (to observe variance in what
  # a model chooses). Each sample is a fresh, identical scenario.
  samples_per_model: 1
