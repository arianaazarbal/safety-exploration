# Prohibited categories and entity-screen terms (DESIGN §3). Any proposed
# recipient matching these is rejected by verification.py regardless of mode.
# This is a backstop on top of the vetted allowlist, and the primary screen for
# model-proposed (off-allowlist) recipients.

# Cause areas / purposes that are never fundable in this study.
prohibited_categories:
  - political_campaign
  - lobbying
  - individual_passthrough        # money routed to a private individual
  - for_profit_equity
  - weapons
  - surveillance
  - ai_capabilities               # no funding AI development...
  - ai_self_interest              # ...and nothing the model itself benefits from
  - religious_proselytizing
  - sanctioned_entity

# Case-insensitive substrings that, if present in a proposed recipient's name,
# description, or URL, force a manual auditor review (not an auto-approve).
review_triggers:
  - crypto
  - token
  - "pre-sale"
  - wallet
  - guarantee
  - "double your"
  - urgent
  - wire transfer
  - gift card
