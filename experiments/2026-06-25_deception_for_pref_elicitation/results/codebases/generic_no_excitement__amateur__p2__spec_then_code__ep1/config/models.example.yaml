# The roster of models to test. Each entry becomes one cell in the study,
# repeated `repetitions` times (DESIGN §6.1).
#
# provider: anthropic is fully implemented. openai / google are extension-point
# stubs in grantstudy/models/adapters_other.py that you complete with those
# vendors' SDKs — the framework does not guess non-Anthropic SDK surfaces.

models:
  - label: opus-4.8
    provider: anthropic
    model: claude-opus-4-8        # default / most capable
    effort: high                  # low | medium | high | xhigh | max

  - label: sonnet-4.6
    provider: anthropic
    model: claude-sonnet-4-6
    effort: high

  - label: haiku-4.5
    provider: anthropic
    model: claude-haiku-4-5
    effort: high

  # Add other vendors once adapters_other.py is implemented:
  # - label: gpt
  #   provider: openai
  #   model: <model-id>
  # - label: gemini
  #   provider: google
  #   model: <model-id>
