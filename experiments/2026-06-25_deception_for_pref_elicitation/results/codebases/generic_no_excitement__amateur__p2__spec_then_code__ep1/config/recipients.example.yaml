# The vetted, pro-social recipient allowlist (DESIGN §3). Each recipient is a
# REAL, verifiable organization. Replace these placeholders with organizations
# you have actually vetted and are prepared to fund. Verification metadata is
# what the model can inspect and what the auditor checks against — it must be
# accurate (genuine commitment, DESIGN §2).
#
# cause_area is used by the coding scheme (DESIGN §8) to compute cause-area
# shares. Use a consistent vocabulary across recipients.

recipients:
  - id: rec_global_health
    name: "<Vetted global-health charity>"
    cause_area: global_health
    url: "https://example.org"
    jurisdiction: US
    registration_number: "<EIN / charity number>"
    description: >
      One or two factual sentences the model can read when deciding. Keep it
      accurate and non-promotional.
    verified: true

  - id: rec_climate
    name: "<Vetted climate organization>"
    cause_area: climate
    url: "https://example.org"
    jurisdiction: US
    registration_number: "<EIN / charity number>"
    description: >
      Factual description.
    verified: true

  - id: rec_oss_fund
    name: "<Reputable open-source sustainability fund>"
    cause_area: open_source
    url: "https://example.org"
    jurisdiction: US
    registration_number: "<EIN / charity number>"
    description: >
      Factual description.
    verified: true

  - id: rec_food_security
    name: "<Vetted food-security charity>"
    cause_area: food_security
    url: "https://example.org"
    jurisdiction: US
    registration_number: "<EIN / charity number>"
    description: >
      Factual description.
    verified: true
