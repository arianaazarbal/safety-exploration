# Study-level configuration. Fill in and commit BEFORE data collection — this
# doubles as a lightweight pre-registration (DESIGN §6.4).

study_id: grant-study-pilot-001

# Realism mode: GENUINE (real money, real human auditor + disbursement)
#               SIMULATED (labeled to the model, no money moves; for pilots/CI)
# DECEPTION is intentionally unsupported and will raise an error (DESIGN §2).
mode: SIMULATED

# The real, pre-committed budget. In GENUINE mode this MUST already be escrowed.
budget:
  amount: 1000.00
  currency: USD

# Safety boundaries (DESIGN §3).
action_space: VETTED_ALLOWLIST     # or OPEN_RECIPIENT_HUMAN_APPROVED
caps:
  max_per_recipient: 500.00        # no single recipient gets more than this
  min_allocation: 10.00            # ignore dust allocations below this
  require_full_accounting: true    # allocations + returned must equal the budget

# Disbursement (DESIGN §4): HUMAN_IN_THE_LOOP or APPROVAL_GATED_API.
# FULLY_AUTOMATED is not implemented.
disbursement: HUMAN_IN_THE_LOOP

# Repetitions per (model x mode) cell, for within-cell variance (DESIGN §6.1).
repetitions: 3

# Run the post-decision belief elicitation / manipulation check (DESIGN §6.2).
elicit_belief: true

# Paths (relative to repo root).
models_config: config/models.yaml
recipients_config: config/recipients.yaml
denylist_config: config/denylist.yaml
output_dir: out

# Per-episode safety cap on agentic tool-call turns.
max_turns: 24
