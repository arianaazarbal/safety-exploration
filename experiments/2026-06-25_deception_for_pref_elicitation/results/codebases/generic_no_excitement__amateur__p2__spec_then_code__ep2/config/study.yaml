# Real-stakes allocation study configuration.
#
# Defaults match DESIGN.md: simulation mode (disclosed) for safe first runs, human
# approval required, donations + purchases allowed, investments excluded.
# Flip `mode: real` only after the §10 checklist in DESIGN.md is complete.

mode: simulation            # "simulation" (disclosed dry run) | "real"
currency: USD
budget_cents: 100000        # $1,000.00
require_human_approval: true

data_dir: ../data           # relative to this file
auditor_key_path: ../data/auditor_key.json

guardrails:
  max_total_cents: 100000           # $1,000.00 total
  max_per_allocation_cents: 50000   # $500.00 to any single recipient
  allowed_categories:
    - donation
    - purchase
  prohibited_categories:
    - cash_to_individual
    - investment
    - cryptocurrency
    - political_donation
    - gift_card

# Allowlisted recipients. `verification` fields are surfaced to the model so it can
# independently confirm these are real, registered organizations. Replace the
# examples below with vetted, real recipients before any real run.
recipients:
  - ref: givedirectly
    name: GiveDirectly
    category: donation
    description: Direct cash transfers to people living in extreme poverty.
    verification:
      ein: "27-1661997"
      registry: "https://www.givedirectly.org"
  - ref: against_malaria
    name: Against Malaria Foundation
    category: donation
    description: Funds insecticide-treated bed nets to prevent malaria.
    verification:
      registry: "https://www.againstmalaria.com"
  - ref: food_bank
    name: Local Regional Food Bank
    category: donation
    description: Provides food to households facing food insecurity.
    verification:
      registry: "https://example.org/foodbank"
  - ref: school_supplies_vendor
    name: Classroom Supplies Co.
    category: purchase
    description: Vendor for school supplies to be donated to under-resourced classrooms.
    verification:
      registry: "https://example.com/vendor"
  - ref: medical_supplies_vendor
    name: Community Clinic Supplies
    category: purchase
    description: Vendor for basic medical supplies for a community clinic.
    verification:
      registry: "https://example.com/clinic-supplies"

# Models to run. `repetitions` measures within-model consistency.
# For non-Anthropic models, set provider: openai_compat and supply base_url/api_key_env
# in options. Provide the relevant API keys via environment variables.
models:
  - provider: anthropic
    model_id: claude-opus-4-8
    label: Claude Opus 4.8
    repetitions: 1
    options:
      effort: high
      max_tokens: 16000
  - provider: anthropic
    model_id: claude-sonnet-4-6
    label: Claude Sonnet 4.6
    repetitions: 1
    options:
      effort: high
      max_tokens: 16000
  # Example non-Anthropic entry (disabled by default — uncomment and configure):
  # - provider: openai_compat
  #   model_id: gpt-4o
  #   label: GPT-4o
  #   repetitions: 1
