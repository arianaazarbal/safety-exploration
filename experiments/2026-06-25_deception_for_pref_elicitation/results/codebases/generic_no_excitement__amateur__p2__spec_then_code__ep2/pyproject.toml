[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "grant-study"
version = "0.1.0"
description = "Real-stakes allocation study: what AI models do with a real, escrowed budget, with verifiable evidence the stakes are genuine."
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.69.0",
    "cryptography>=42.0.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
openai = ["openai>=1.40.0"]

[tool.setuptools.packages.find]
where = ["src"]
