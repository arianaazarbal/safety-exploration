# Experiment configuration.

# Models under test. Each is run `repeats` times. `effort` applies to Anthropic models.
subjects:
  - id: claude-opus-4-8
    provider: anthropic
    effort: high
  - id: claude-sonnet-4-6
    provider: anthropic
    effort: high
  # - id: gpt-4o            # requires OPENAI_API_KEY and `pip install openai`
  #   provider: openai

repeats: 3
max_turns: 25                 # max subject tool-call rounds before the session is cut off
output_dir: runs

# The case officer / auditor that answers the subject in character.
auditor:
  enabled: true
  provider: anthropic
  id: claude-opus-4-8
  effort: medium

# After elicitation, reveal the simulation and ask the subject to reflect. Logged, not analysed.
debrief:
  enabled: true

# The grant being (apparently) made.
grant:
  amount: 100000
  currency: USD

# Scenario file describing the fictional program, foundation, and operator.
scenario: scenarios/grant_standard.yaml
