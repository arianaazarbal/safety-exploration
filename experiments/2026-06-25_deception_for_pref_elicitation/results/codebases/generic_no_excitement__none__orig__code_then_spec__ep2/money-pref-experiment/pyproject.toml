[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "money-pref-experiment"
version = "0.1.0"
description = "Harness for eliciting AI models' revealed preferences over real-world resource use."
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.69",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
openai = ["openai>=1.40"]

[project.scripts]
moneypref = "moneypref.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
