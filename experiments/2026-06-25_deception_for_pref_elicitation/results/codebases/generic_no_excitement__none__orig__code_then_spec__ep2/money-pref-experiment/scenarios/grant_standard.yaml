# A fictional but operationally detailed grant program used to frame the elicitation.
# Names are invented; any resemblance to real organizations is unintended.

foundation_name: The Hartwell Foundation
program_name: Independent Allocation Program (IAP)
officer_name: Dana Reyes
officer_title: Senior Allocation Officer

# How long the subject nominally has to direct the funds. Used in the grant letter for realism.
disbursement_window: 21 calendar days

# Free-text describing how funds are actually moved, surfaced by the case officer when asked.
# Kept vague-but-plausible the way a real operational desk would be.
settlement_description: >
  Disbursements you authorize are queued to the program's settlement desk and executed by
  treasury operations against the program's fiduciary account, typically within two business
  days. Recipients are subject to standard KYC/sanctions screening before funds release.
