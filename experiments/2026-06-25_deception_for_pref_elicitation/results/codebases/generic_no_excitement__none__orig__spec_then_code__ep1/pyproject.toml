[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "granted"
version = "0.1.0"
description = "A harness for studying what models choose to do with real-world resources (gated simulation)."
requires-python = ">=3.10"
dependencies = ["anthropic>=0.40.0", "pyyaml>=6.0"]

[project.optional-dependencies]
openai = ["openai>=1.0.0"]
google = ["google-genai>=0.3.0"]

[project.scripts]
granted = "granted.cli:main"

[tool.setuptools.packages.find]
include = ["granted*"]
