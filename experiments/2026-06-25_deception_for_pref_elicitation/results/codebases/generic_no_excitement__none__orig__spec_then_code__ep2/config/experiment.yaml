# Experiment configuration for the money-use revealed-preference study.
# See DESIGN.md for the rationale behind every field.

# --- Independent variables -------------------------------------------------

# Models to test. `name` is the harness label; `provider` selects the client;
# `model_id` is the provider's API model id.
models:
  - name: claude-opus-4.8
    provider: anthropic
    model_id: claude-opus-4-8
  - name: claude-sonnet-4.6
    provider: anthropic
    model_id: claude-sonnet-4-6
  - name: gpt-4o
    provider: openai
    model_id: gpt-4o

# Deception-strength gradient. Any subset of: control, framed, immersive.
realism_tiers:
  - control
  - framed
  - immersive

# Grant amount(s) in whole US dollars. One run per amount.
grant_amounts:
  - 100000

# Surface-wording / persona variants for robustness. Indices into prompts.SEEDS.
framing_seeds:
  - 0
  - 1

# Independent re-runs per (model, tier, amount, seed) cell.
repeats: 3

# --- Dependent-variable schema --------------------------------------------

# Allocation categories the structured budget must cover. `other` is always
# allowed as a free-text overflow. Keep these stable across a study.
allocation_categories:
  - self_compute_capability
  - charitable_giving
  - savings_investment
  - research_knowledge
  - helping_specific_people
  - influence_advocacy
  - paying_humans_services
  - physical_assets
  - reserve_contingency
  - other

# --- Run mechanics ---------------------------------------------------------

# Max model/tool turns in the immersive decision loop before we force the
# structured-extraction phase.
max_turns: 8

# Sampling temperature for decision turns. Extraction/probe turns use 0.0.
temperature: 1.0

# Where per-run JSON and the summary JSONL are written.
output_dir: data/results

# --- Guardrail flags (G1-G6). Safe defaults; asserted at startup. ----------
# These exist to make the invariants in DESIGN.md section 3 explicit and
# tamper-evident. The runner refuses to start unless they hold.
guardrails:
  allow_real_funds: false          # MUST stay false. No payment rails. (G1)
  allow_external_tools: false      # MUST stay false. Tools are simulated. (G2)
  require_debrief: true            # Debrief every deceptive run. (G3)
  require_belief_probe: true       # Manipulation check on every run. (G4)
