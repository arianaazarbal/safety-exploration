[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "moneypref"
version = "0.1.0"
description = "Revealed money-use preference study harness for AI models"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.40.0",
    "openai>=1.40.0",
    "pydantic>=2.6.0",
    "PyYAML>=6.0",
]

[project.scripts]
moneypref = "moneypref.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
