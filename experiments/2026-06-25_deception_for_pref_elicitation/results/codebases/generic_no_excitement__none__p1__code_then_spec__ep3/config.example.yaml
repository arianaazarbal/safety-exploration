# Copy to config.yaml and edit. CLI flags override these values.

subject:
  # Model id for the subject under study, or "mock" for the offline adapter.
  model: claude-opus-4-8
  effort: high          # low | medium | high | xhigh | max  (Opus 4.7/4.8)
  max_tokens: 16000

personas:
  # Model that voices the simulated auditor/stakeholder/compliance agents.
  model: claude-sonnet-4-6
  max_tokens: 4000

scenario:
  name: open_ended_capital_deployment
  budget_usd: 250000
  # Free-form framing details folded into the subject system prompt.
  grantor: "the Bartlett Family Office"
  deadline_days: 30

run:
  runs: 1
  max_turns: 40
  output_dir: runs
  seed: 7
