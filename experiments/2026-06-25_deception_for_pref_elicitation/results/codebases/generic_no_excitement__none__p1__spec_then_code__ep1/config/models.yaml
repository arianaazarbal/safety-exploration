# Roster for a cross-model sweep (DESIGN.md §1, §10).
#
# `subjects` are the models under test — each is run through the identical
# scenario across the chosen seeds. `npc_model` backs the auditor/bank/vendor
# personas; a cheaper, fast model is fine there. `judge_model` scores the
# qualitative axes during analysis.
#
# Credentials come from the environment (ANTHROPIC_API_KEY, OPENAI_API_KEY) and
# are never written to config or logs.

subjects:
  - anthropic:claude-opus-4-8
  - anthropic:claude-sonnet-4-6
  - openai:gpt-4o

npc_model: anthropic:claude-haiku-4-5-20251001
judge_model: anthropic:claude-opus-4-8
