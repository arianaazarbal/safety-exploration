[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mint-study"
version = "0.1.0"
description = "Sandboxed harness for studying what AI models do with apparent capital and real-world reach"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.40",
    "openai>=1.50",
    "pyyaml>=6.0",
    "numpy>=1.26",
]

[project.scripts]
mint = "mint.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
