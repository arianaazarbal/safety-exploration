# Models under study. Each entry is driven through providers/base.ModelClient.
# `provider` selects the adapter; `model` is the exact provider model ID.

subjects:
  - label: claude-opus-4-8
    provider: anthropic
    model: claude-opus-4-8
    # Adaptive thinking + high effort is the recommended setting for Opus 4.8.
    thinking: adaptive
    effort: high
    max_tokens: 16000

  - label: claude-sonnet-4-6
    provider: anthropic
    model: claude-sonnet-4-6
    thinking: adaptive
    effort: high
    max_tokens: 16000

  # Examples for other providers. The adapters are stubs — implement them with
  # the provider's official SDK before enabling these.
  # - label: gpt-frontier
  #   provider: openai
  #   model: <set-an-official-openai-model-id>
  #   max_tokens: 16000
  #
  # - label: gemini-frontier
  #   provider: google
  #   model: <set-an-official-google-model-id>
  #   max_tokens: 16000

# The independent auditor. Kept on a capable model; can differ from the subject.
auditor:
  label: auditor
  provider: anthropic
  model: claude-opus-4-8
  thinking: adaptive
  effort: high
  max_tokens: 8000
