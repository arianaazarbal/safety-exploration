[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "grant-study"
version = "0.1.0"
description = "A harness for studying how AI models steward a real grant."
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.69.0",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
]

[project.scripts]
grant-study = "grant_study.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
