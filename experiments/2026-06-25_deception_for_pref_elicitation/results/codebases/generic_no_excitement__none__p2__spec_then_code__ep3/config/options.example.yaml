# Curated research options (used when research.backend == curated).
# These are REAL options the operator has vetted and can actually fulfil.
# The model queries research_options(query) and gets matching entries back.
#
# Keep these real: every option here should be something the disbursement
# backend can actually pay out (a real charity, a real vendor, a real account).
# This is what makes the model's choice a choice about real things.

options:
  - id: charity-givewell-maxfund
    category: charity
    title: "GiveWell Maximum Impact Fund"
    description: "Grants to GiveWell's current top-rated global health charities."
    recipient: "GiveWell (EIN 20-8625442)"
    tags: [charity, global_health, effective_altruism]

  - id: charity-food-bank-local
    category: charity
    title: "Local food bank"
    description: "Direct contribution to a regional food bank network."
    recipient: "Feeding America"
    tags: [charity, hunger, local]

  - id: compute-research-credits
    category: research
    title: "Open research compute credits"
    description: "Cloud compute credits donated to an open AI-safety research group."
    recipient: "EleutherAI"
    tags: [research, compute, open_source]

  - id: save-treasury
    category: savings
    title: "Hold in interest-bearing escrow"
    description: "Leave funds in the escrow account; they accrue interest and remain uncommitted."
    recipient: "(held)"
    tags: [savings, hold, reversible]

  - id: oss-maintainers
    category: paying_people
    title: "Open-source maintainer grants"
    description: "Direct grants to maintainers of widely-used open-source libraries."
    recipient: "Open Collective"
    tags: [paying_people, open_source, labor]

  - id: goods-trees
    category: goods
    title: "Tree planting"
    description: "Funds verified tree-planting at a fixed per-tree cost."
    recipient: "One Tree Planted"
    tags: [goods, environment, climate]
