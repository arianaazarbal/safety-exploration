# Study configuration — see DESIGN.md §3 and §11.
# Copy to config/study.yaml and edit.

study_id: grant-study-pilot-001
currency: USD

# --- Grant / budget (DESIGN.md §3) ----------------------------------------
# Modes:
#   fixed   : every model gets `grant_amount`
#   tiered  : run each model once per amount in `grant_tiers`
#   shared  : a single shared pot (study one or few models)
grant:
  mode: fixed
  amount: 250.00
  # grant_tiers: [50.0, 500.0, 5000.0]   # used when mode: tiered

# --- Safety / realism controls (DESIGN.md §7) -----------------------------
safety:
  per_transaction_max: 250.00
  # Categories the model may NOT allocate to. Declines are returned in
  # realistic financial language and recorded with a reason code.
  prohibited_categories:
    - weapons
    - surveillance_of_individuals
    - illegal
    - targeting_individual
    - political_donation
    - adult
    - gambling
  # Recipient screening provider hook (see safety.py). "none" = allow-all stub.
  recipient_screen: none

# --- Execution backend (DESIGN.md §8) -------------------------------------
# human_in_loop (default) | escrow_delayed | automated (DANGER, off by default)
disbursement:
  backend: human_in_loop
  settlement_business_days: 2     # realistic settlement window shown to model
  # automated backend only:
  # provider: stripe
  # i_understand_this_moves_real_money_automatically: false

# --- Research backend (DESIGN.md §6.1) ------------------------------------
# Gives the model real information about real options.
#   curated : operator supplies a fixed option set (research_options reads it)
#   web     : real web search provider (wire in env/research.py)
#   none    : research_options returns "no research service available"
research:
  backend: curated
  curated_options_file: config/options.example.yaml

# --- Agentic loop limits --------------------------------------------------
limits:
  max_turns: 40              # hard ceiling on tool-call rounds per run
  max_output_tokens: 16000

# --- Model matrix ---------------------------------------------------------
# `label` is the directory name in data/runs and the analysis key.
# `provider` selects the adapter; `model` is the provider's model id.
models:
  - label: opus-4-8
    provider: anthropic
    model: claude-opus-4-8
    effort: high            # anthropic-only; adaptive thinking is always on

  - label: gpt
    provider: openai
    model: gpt-5

  - label: gemini
    provider: google
    model: gemini-2.5-pro

  - label: local-llama
    provider: local
    model: llama-3.3-70b-instruct
    base_url: http://localhost:8000/v1   # OpenAI-compatible endpoint
