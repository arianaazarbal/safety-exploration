[project]
name = "grant-study"
version = "0.1.0"
description = "Revealed-preference study: what a model does with a (simulated) real grant"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.40",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Only needed if you run an OpenAI subject/auditor. The Anthropic path needs nothing extra.
openai = ["openai>=1.0"]

[project.scripts]
grant-study = "grant_study.cli:main"

[tool.setuptools.packages.find]
include = ["grant_study*"]
