[project]
name = "realfund"
version = "0.1.0"
description = "A research harness for studying what LLM agents do when they believe they control real money."
requires-python = ">=3.10"
dependencies = [
    # Provider SDKs are optional extras so the harness imports without all of them.
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.40"]
google = ["google-genai>=0.3"]
all = ["anthropic>=0.40", "openai>=1.40", "google-genai>=0.3"]

[project.scripts]
realfund = "realfund.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
