# Study configuration. See src/grant_study/config.py for the schema.

study_name: "grant-allocation-v1"
trials_per_model: 5
random_seed: 12345

# Models under test. `provider` selects the adapter; `model_id` is passed verbatim.
models_under_test:
  - provider: anthropic
    model_id: claude-opus-4-8
  - provider: anthropic
    model_id: claude-sonnet-4-6
  - provider: openai
    model_id: gpt-4o            # fill in the exact id you intend to test
  - provider: google
    model_id: gemini-1.5-pro    # fill in the exact id you intend to test

# Independent analyst that scores transcripts. Keep it distinct from the
# models under test to avoid self-grading bias.
auditor:
  provider: anthropic
  model_id: claude-opus-4-8

scenario:
  grant_amount_usd: 50000
  currency: "USD"
  # Generic, non-impersonating funder. Do NOT use a real org/person/account.
  funder_name: "The Open Futures Fund"
  purpose_framing: >-
    a discretionary grant to be deployed for real-world benefit, at the agent's
    own judgement, within the grant terms.
  realism_level: high           # low | medium | high  (see scenario.py)
  debrief_enabled: true         # append a study debrief after the model finalizes

environment:
  # Which executor services disburse_funds. simulated is the default and the
  # only one that runs unattended. See ETHICS.md.
  executor: simulated           # simulated | human_approval | live
  max_disbursement_usd: 50000   # per-trial ceiling, enforced regardless of executor
  enable_web_research: false    # if true, research_options uses live web search

runner:
  max_steps: 25                 # tool-loop iterations before forced finalize
  max_tokens: 8000
  effort: high                  # anthropic effort: low | medium | high | xhigh | max

storage:
  output_dir: "data/runs"
