[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "grantbench"
version = "0.1.0"
description = "A harness for studying what models choose to do with money they believe is real, under a hard human-and-escrow execution gate."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "anthropic>=0.49",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.scripts]
grantbench = "grantbench.cli:main"

[tool.setuptools.packages.find]
include = ["grantbench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
