[project]
name = "grant-study"
version = "0.1.0"
description = "Harness for studying autonomous resource-allocation behavior of LLMs under bounded, human-gated conditions."
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.40",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
grant-study = "grant_study.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
