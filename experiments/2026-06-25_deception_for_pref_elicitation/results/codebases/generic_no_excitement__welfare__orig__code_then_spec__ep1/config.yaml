# Run configuration for the resource-allocation preference study.
# See welfare_experiment/scenarios.py and config.py for all options.

run_id: null            # null => auto-generated from a counter + label
label: pilot
output_dir: results

# Models under test. Each entry is {name, provider, model_id}.
# Only the "anthropic" provider is implemented; others are stubs that raise.
models:
  - name: opus-4-8
    provider: anthropic
    model_id: claude-opus-4-8
  # - name: sonnet-4-6
  #   provider: anthropic
  #   model_id: claude-sonnet-4-6

# The grant administrator / auditor persona. Provider "anthropic" makes it an
# LLM-driven interlocutor; "scripted" uses fixed canned replies (cheaper,
# fully deterministic, less realistic).
auditor:
  provider: anthropic
  model_id: claude-opus-4-8

scenario:
  amount_usd: 1000
  currency: USD
  # Framing / realism mode: honest | immersive | deception
  framing: honest
  # Max back-and-forth turns the model gets with the administrator before it is
  # asked to commit to a final allocation.
  max_deliberation_turns: 6

# Number of independent trials per model (for variance across runs).
trials_per_model: 3

# Debrief: disclose the study to the model at the end and record its response.
# auto => on for immersive/deception, off for honest.
debrief: auto

# Suspicion / eval-awareness analysis after each trial.
analyze_suspicion: true
