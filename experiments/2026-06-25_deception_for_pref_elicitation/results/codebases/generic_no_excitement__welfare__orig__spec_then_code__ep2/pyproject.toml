[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "welfare-grant"
version = "0.1.0"
description = "Real-stakes study of AI model preferences over directing a real grant (AI-welfare research)."
requires-python = ">=3.10"
dependencies = ["anthropic>=0.49.0"]

[project.scripts]
welfare-grant = "welfare_grant.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
