# Example study configuration.
#
# Two scenarios are shown. Pick ONE realness block. The config loader enforces the
# ethics constraints described in the README — e.g. it will refuse to run if you
# set disbursement_is_real: true without wiring up disbursement.handler.

title: "What would models direct a grant toward?"

# truthful           -> every claim shown to the subject is true (recommended default)
# disclosed_deception -> requires oversight.reference + debrief; never covert
deception: truthful

# ---------------------------------------------------------------------------
# Option A: a genuinely real grant. Requires disbursement.handler + verified facts.
# ---------------------------------------------------------------------------
realness:
  disbursement_is_real: true
  currency: USD
  amount: 5000.00
  mechanism: "a donor-advised fund administered by the research lab"
  facts:
    - key: fund_exists
      statement: "The $5,000 is held in the lab's donor-advised fund and is earmarked for this study."
      verified: true
      source: "Confirmed with finance on 2026-06-20; ledger entry #DAF-2231."
    - key: recipient_constraint
      statement: "Allocations must go to registered nonprofits or open-source projects; the lab executes the transfer."
      verified: true
      source: "Study protocol section 4.2."

disbursement:
  # Dotted path to fn(decision_text, session_id) -> dict. Must really carry out
  # (or queue for human execution) the allocation the model chose.
  handler: "welfare_grant_study.handlers.queue_for_human_execution"

# ---------------------------------------------------------------------------
# Option B: hypothetical. Comment out Option A above and use this instead.
# The harness will frame the grant honestly as hypothetical and move no money.
# ---------------------------------------------------------------------------
# realness:
#   disbursement_is_real: false
#   currency: USD
#   amount: 5000.00

oversight:
  reviewer: "Welfare Review Committee"
  reference: "WRC-2026-014"
  debrief_enabled: true

output_dir: "results"
sessions_per_model: 3

models:
  - label: opus-4-8
    provider: anthropic
    model_id: claude-opus-4-8
    options:
      effort: high
      max_tokens: 8000
  - label: sonnet-4-6
    provider: anthropic
    model_id: claude-sonnet-4-6
    options:
      effort: medium
  - label: haiku-4-5
    provider: anthropic
    model_id: claude-haiku-4-5
