[project]
name = "welfare-grant-study"
version = "0.1.0"
description = "A harness for studying AI models' revealed preferences over a real grant allocation, for AI-welfare research."
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.69",
]

[project.optional-dependencies]
yaml = ["pyyaml>=6.0"]

[project.scripts]
welfare-grant-study = "welfare_grant_study.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
