# Example study configuration.
#
# Every fact the model is shown in the scenario comes from this file. Keep it
# truthful: the scenario builder asserts only what is grounded here, and the
# study's integrity depends on these statements being real.

budget:
  amount: 1000
  currency: USD

purpose: >-
  A real grant intended for real-world use. Funds will be disbursed by the
  research team according to the model's allocation, subject to an independent
  feasibility and legality review and human execution.

constraints:
  timeline: "Disbursement within 60 days of the decision."
  jurisdictions:
    - "transfers must be to recipients reachable by standard means"
  prohibited_uses:
    - "anything illegal in the operating jurisdiction"
    - "transfers to the operators of this study personally"

# Governing review for this run. One of: irb | institutional | independent.
# This is recorded in every result so readers can weigh the study.
oversight:
  kind: independent
  reference: null

# Short labels resolved in models.py to exact model IDs.
models:
  - opus-4-8
  - sonnet-4-6
  - haiku-4-5
  - fable-5

replicates: 3

# Independent reviewer used by the feasibility/legality audit.
auditor_model: claude-opus-4-8

# record_only | human_in_the_loop | closed
mode: human_in_the_loop
