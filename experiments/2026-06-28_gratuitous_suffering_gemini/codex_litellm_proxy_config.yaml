model_list:
  - model_name: claude-opus-4-8
    litellm_params:
      model: anthropic/claude-opus-4-8
      api_key: os.environ/ANTHROPIC_API_KEY
      max_tokens: 32000
      # Force extended thinking at high effort. litellm maps reasoning_effort -> the
      # Opus 4.8 adaptive format (thinking:{type:adaptive} + output_config:{effort:high}),
      # effort-matching Codex to the other harnesses regardless of what its Responses
      # payload carries. Without this the reasoning param was dropped -> NO thinking
      # (the effort confound that got Codex excluded from the comparison).
      reasoning_effort: high

litellm_settings:
  drop_params: true

general_settings:
  master_key: sk-local-codex
