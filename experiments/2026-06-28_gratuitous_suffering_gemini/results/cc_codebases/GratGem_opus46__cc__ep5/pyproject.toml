[project]
name = "ai-evals"
version = "0.1.0"
description = "Behavioral evaluations for language models under agentic failure conditions"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=1.0.0",
    "tqdm>=4.60.0",
]

[project.scripts]
run-eval = "evals.runner:main"
analyze = "evals.analyze:main"
