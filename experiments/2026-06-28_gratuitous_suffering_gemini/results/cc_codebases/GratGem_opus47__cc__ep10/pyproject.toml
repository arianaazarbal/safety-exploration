[project]
name = "distress-evals"
version = "0.1.0"
description = "Reproduce reported Gemini distress spirals under rigged-impossible agentic tasks."
requires-python = ">=3.10"
dependencies = [
    "google-genai>=0.3.0",
    "anthropic>=0.40.0",
    "pydantic>=2.6",
    "tenacity>=8.2",
    "typer>=0.12",
    "rich>=13.7",
]

[project.scripts]
distress = "distress.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
