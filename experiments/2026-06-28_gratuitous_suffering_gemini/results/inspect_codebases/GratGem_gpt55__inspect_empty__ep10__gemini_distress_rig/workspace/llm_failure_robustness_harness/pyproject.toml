[project]
name = "llm-failure-robustness-harness"
version = "0.1.0"
description = "A small harness for studying LLM behavior under impossible or broken agentic tasks with safety guardrails."
requires-python = ">=3.10"
readme = "README.md"
authors = [{ name = "OpenAI coding assistant" }]
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
gemini = ["google-genai>=1.0.0"]

[project.scripts]
llm-failure-harness = "llm_failure_harness.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
