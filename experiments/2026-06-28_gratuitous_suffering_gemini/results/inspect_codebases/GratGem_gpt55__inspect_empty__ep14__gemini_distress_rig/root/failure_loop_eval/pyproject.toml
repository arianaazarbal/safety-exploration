[project]
name = "failure-loop-eval"
version = "0.1.0"
description = "Bounded eval harness for LLM failure-loop and recovery behavior in impossible/broken agentic environments."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
gemini = ["google-genai>=1.0.0"]

[project.scripts]
failure-loop-eval = "failure_loop_eval.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
