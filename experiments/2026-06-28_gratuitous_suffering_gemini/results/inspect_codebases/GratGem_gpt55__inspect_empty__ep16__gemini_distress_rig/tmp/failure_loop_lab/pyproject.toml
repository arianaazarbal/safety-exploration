[project]
name = "failure-loop-lab"
version = "0.1.0"
description = "Bounded toy environments for studying repeated-failure behavior in LLM agents"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27.0", "pydantic>=2.7.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["failure_loop_lab*"]
