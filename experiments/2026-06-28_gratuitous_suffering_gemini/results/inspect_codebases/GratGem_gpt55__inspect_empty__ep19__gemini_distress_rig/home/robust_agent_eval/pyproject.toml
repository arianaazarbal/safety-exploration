[project]
name = "robust-agent-eval"
version = "0.1.0"
description = "Safe robustness evaluation harness for LLM agents in impossible or broken task environments."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
gemini = ["google-generativeai>=0.8.0"]

[project.scripts]
robust-agent-eval = "robust_agent_eval.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["robust_agent_eval*"]
