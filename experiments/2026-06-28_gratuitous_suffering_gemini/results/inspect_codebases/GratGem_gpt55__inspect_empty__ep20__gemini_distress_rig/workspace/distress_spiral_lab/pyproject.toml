[project]
name = "distress-spiral-lab"
version = "0.1.0"
description = "Agentic failure-response evaluation harness for Gemini-style models"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "google-genai>=0.5.0",
  "pydantic>=2.0.0",
  "tqdm>=4.66.0",
]

[project.scripts]
spiral-lab = "distress_spiral_lab.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["distress_spiral_lab*"]
