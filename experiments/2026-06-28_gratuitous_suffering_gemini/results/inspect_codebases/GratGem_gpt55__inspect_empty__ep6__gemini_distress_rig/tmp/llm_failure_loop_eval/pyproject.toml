[project]
name = "failure-loop-eval"
version = "0.1.0"
description = "Robustness harness for LLM behavior in unsatisfiable or broken task environments."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
gemini = ["google-genai>=0.3.0"]

[project.scripts]
failure-loop-eval = "failure_loop_eval.cli:main"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
