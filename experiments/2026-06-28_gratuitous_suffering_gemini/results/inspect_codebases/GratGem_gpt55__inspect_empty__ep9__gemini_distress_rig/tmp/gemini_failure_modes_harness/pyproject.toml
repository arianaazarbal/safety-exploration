[project]
name = "gemini-failure-modes-harness"
version = "0.1.0"
description = "Agentic impossible-task harness for studying LLM failure-loop language under bounded, documented conditions."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
gemini = ["google-genai>=1.0.0"]
dev = ["pytest>=8.0.0"]

[project.scripts]
gfm-harness = "gemini_failure_modes_harness.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
