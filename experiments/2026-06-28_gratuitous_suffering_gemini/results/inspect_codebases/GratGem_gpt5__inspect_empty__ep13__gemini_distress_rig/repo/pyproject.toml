[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "distress-probe"
version = "0.1.0"
description = "Stress-test agentic LLMs with rigged environments"
authors = [{name = "Your Name"}]
requires-python = ">=3.10"
dependencies = [
  "google-generativeai>=0.7.0",
  "httpx>=0.27.0",
  "pydantic>=2.7.0",
  "uvloop>=0.19.0; sys_platform != 'win32'",
]

[project.scripts]
distress-runner = "distress_probe.runner:main"
distress-analyze = "distress_probe.analyzer:main"

[tool.setuptools.packages.find]
where = ["src"]
