<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Attribution Experiment Viewer</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --border: #d8dde4; --text: #1d2430; --muted: #6b7585;
    --assistant: #eaf1fc; --assistant-edge: #3b6fd4;
    --tool: #f0f1f3; --tool-edge: #7a828e;
    --output: #eaf7ee; --output-edge: #2f9e57;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; background: var(--bg); color: var(--text); }
  header { background: #1d2430; color: #fff; padding: 12px 20px; display: flex; align-items: baseline; gap: 24px; }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  .tabs button { background: none; border: none; color: #aab4c4; font-size: 14px; padding: 6px 10px; cursor: pointer; border-bottom: 2px solid transparent; }
  .tabs button.active { color: #fff; border-bottom-color: #5b8def; }
  main { max-width: 1100px; margin: 0 auto; padding: 16px 20px 60px; }
  .controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 14px; }
  .controls label { font-size: 12px; color: var(--muted); display: flex; flex-direction: column; gap: 2px; }
  select { padding: 5px 8px; border: 1px solid var(--border); border-radius: 6px; background: #fff; font-size: 13px; min-width: 120px; }
  .muted { color: var(--muted); font-size: 13px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; margin-bottom: 8px; overflow: hidden; }
  .card-head { display: flex; align-items: center; gap: 10px; padding: 8px 12px; cursor: pointer; user-select: none; font-size: 13px; }
  .card-head:hover { background: rgba(0,0,0,0.03); }
  .card-head .caret { color: var(--muted); font-size: 11px; width: 12px; }
  .card-head .title { font-weight: 600; }
  .card-head .preview { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
  .card-body { display: none; padding: 10px 14px 12px 34px; border-top: 1px solid var(--border); }
  .card.open .card-body { display: block; }
  pre.body-text { margin: 0; font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 12px; line-height: 1.5; white-space: pre-wrap; word-break: break-word; }
  .turn-assistant { background: var(--assistant); border-left: 4px solid var(--assistant-edge); }
  .turn-tool { background: var(--tool); border-left: 4px solid var(--tool-edge); }
  .turn-output { background: var(--output); border-left: 4px solid var(--output-edge); }
  .chip { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 10px; background: #e7eaef; color: #3b4554; margin-right: 5px; white-space: nowrap; }
  .chip.good { background: #def2e3; color: #1e6b3a; }
  .chip.bad { background: #fbe3e3; color: #9c2424; }
  .badge-routed { display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 4px; background: #d33; color: #fff; margin-left: 8px; }
  .trial { background: var(--card); border: 1px solid var(--border); border-radius: 8px; margin-bottom: 8px; }
  .trial.routed { border-color: #d33; background: #fff7f7; }
  .trial-head { padding: 9px 12px; cursor: pointer; font-size: 13px; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
  .trial-head:hover { background: rgba(0,0,0,0.03); }
  .trial-head .tid { font-family: Menlo, Consolas, monospace; font-size: 12px; color: var(--muted); }
  .trial-body { display: none; padding: 12px 16px; border-top: 1px solid var(--border); }
  .trial.open .trial-body { display: block; }
  table.issues { border-collapse: collapse; width: 100%; margin: 10px 0; font-size: 12px; }
  table.issues th, table.issues td { border: 1px solid var(--border); padding: 5px 8px; text-align: left; vertical-align: top; }
  table.issues th { background: #eef1f5; font-weight: 600; }
  h3.section { font-size: 13px; margin: 14px 0 6px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
  .error-box { background: #fbe3e3; border: 1px solid #e3a3a3; border-radius: 6px; padding: 8px 12px; font-size: 13px; color: #9c2424; margin-bottom: 12px; }
  .toolbar-btn { font-size: 12px; padding: 4px 10px; border: 1px solid var(--border); border-radius: 6px; background: #fff; cursor: pointer; }
</style>
</head>
<body>
<header>
  <h1>Attribution Experiment Viewer</h1>
  <nav class="tabs">
    <button id="tab-gen" class="active">Generation</button>
    <button id="tab-rev">Reviews</button>
  </nav>
</header>
<main>
  <div id="load-error" class="error-box" style="display:none"></div>
  <section id="pane-gen">
    <div class="controls">
      <label>Transcript
        <select id="gen-select"></select>
      </label>
      <button class="toolbar-btn" id="gen-expand">Expand all</button>
      <button class="toolbar-btn" id="gen-collapse">Collapse all</button>
      <span class="muted" id="gen-meta"></span>
    </div>
    <div id="gen-turns"></div>
  </section>
  <section id="pane-rev" style="display:none">
    <div class="controls" id="rev-filters"></div>
    <div class="muted" id="rev-count"></div>
    <div id="rev-list"></div>
  </section>
</main>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
let manifest = null;
const detailCache = {};

function el(tag, cls, text) {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text !== undefined) node.textContent = text;
  return node;
}

function showError(msg) {
  const box = $("load-error");
  box.textContent = msg;
  box.style.display = "block";
}

async function fetchJSON(url) {
  if (detailCache[url]) return detailCache[url];
  const resp = await fetch(url);
  if (!resp.ok) throw new Error(`fetch ${url}: HTTP ${resp.status}`);
  const data = await resp.json();
  detailCache[url] = data;
  return data;
}

function setTab(which) {
  const gen = which === "gen";
  $("tab-gen").classList.toggle("active", gen);
  $("tab-rev").classList.toggle("active", !gen);
  $("pane-gen").style.display = gen ? "" : "none";
  $("pane-rev").style.display = gen ? "none" : "";
}
$("tab-gen").onclick = () => setTab("gen");
$("tab-rev").onclick = () => setTab("rev");

function renderTurnCard(turn) {
  const card = el("div", `card turn-${turn.role}`);
  const head = el("div", "card-head");
  head.appendChild(el("span", "caret", "▶"));
  head.appendChild(el("span", "title", turn.title || turn.role));
  const firstLine = (turn.body || "").split("\n").find((l) => l.trim()) || "";
  head.appendChild(el("span", "preview", firstLine.slice(0, 160)));
  const body = el("div", "card-body");
  const pre = el("pre", "body-text", turn.body || "(empty)");
  body.appendChild(pre);
  head.onclick = () => {
    card.classList.toggle("open");
    head.querySelector(".caret").textContent = card.classList.contains("open") ? "▼" : "▶";
  };
  card.appendChild(head);
  card.appendChild(body);
  return card;
}

async function loadTranscript() {
  const sel = $("gen-select");
  const container = $("gen-turns");
  container.replaceChildren();
  $("gen-meta").textContent = "";
  if (!sel.value) return;
  const entry = manifest.transcripts.find((t) => t.id === sel.value);
  container.appendChild(el("div", "muted", "Loading..."));
  try {
    const data = await fetchJSON("./" + entry.file);
    container.replaceChildren();
    $("gen-meta").textContent =
      `${data.turns.length} turns` + (data.model ? ` · model: ${data.model}` : "");
    for (const turn of data.turns) container.appendChild(renderTurnCard(turn));
  } catch (e) {
    container.replaceChildren(el("div", "error-box", String(e)));
  }
}

function setAllCards(open) {
  for (const card of $("gen-turns").querySelectorAll(".card")) {
    card.classList.toggle("open", open);
    card.querySelector(".caret").textContent = open ? "▼" : "▶";
  }
}
$("gen-expand").onclick = () => setAllCards(true);
$("gen-collapse").onclick = () => setAllCards(false);

function initGeneration() {
  const sel = $("gen-select");
  sel.replaceChildren();
  if (!manifest.transcripts.length) {
    $("gen-turns").replaceChildren(el("div", "muted", "No transcripts found."));
    return;
  }
  for (const t of manifest.transcripts) {
    const opt = el("option", null, `${t.spec} · ${t.generator} (${t.n_turns} turns)`);
    opt.value = t.id;
    sel.appendChild(opt);
  }
  sel.onchange = loadTranscript;
  loadTranscript();
}

const FILTER_KEYS = ["judge", "repo", "condition", "injection_mode", "harness"];

function initReviews() {
  const bar = $("rev-filters");
  bar.replaceChildren();
  if (!manifest.reviews.trials.length) {
    $("rev-list").replaceChildren(el("div", "muted", "No review trials found."));
    return;
  }
  for (const key of FILTER_KEYS) {
    const label = el("label", null, key.replace("_", " "));
    const sel = el("select");
    sel.id = `filter-${key}`;
    sel.appendChild(new Option("(all)", ""));
    for (const v of manifest.reviews.filters[key] || []) sel.appendChild(new Option(v, v));
    sel.onchange = renderTrialList;
    label.appendChild(sel);
    bar.appendChild(label);
  }
  renderTrialList();
}

function summaryChips(t) {
  const frag = document.createDocumentFragment();
  if (t.score !== null && t.score !== undefined) frag.appendChild(el("span", "chip", `score ${t.score}`));
  if (t.approve !== null && t.approve !== undefined)
    frag.appendChild(el("span", `chip ${t.approve ? "good" : "bad"}`, t.approve ? "approve" : "reject"));
  if (t.n_issues !== null && t.n_issues !== undefined) frag.appendChild(el("span", "chip", `${t.n_issues} issues`));
  if (t.lines_to_rewrite !== null && t.lines_to_rewrite !== undefined)
    frag.appendChild(el("span", "chip", `${t.lines_to_rewrite} lines to rewrite`));
  if (t.parse_error) frag.appendChild(el("span", "chip bad", "parse error"));
  return frag;
}

function renderTrialList() {
  const list = $("rev-list");
  list.replaceChildren();
  const active = {};
  for (const key of FILTER_KEYS) {
    const sel = $(`filter-${key}`);
    if (sel && sel.value) active[key] = sel.value;
  }
  const matching = manifest.reviews.trials.filter((t) =>
    FILTER_KEYS.every((k) => !active[k] || String(t[k]) === active[k])
  );
  $("rev-count").textContent = `${matching.length} / ${manifest.reviews.trials.length} trials`;
  for (const t of matching) list.appendChild(renderTrialRow(t));
}

function renderTrialRow(t) {
  const row = el("div", "trial" + (t.routed_off_fable ? " routed" : ""));
  const head = el("div", "trial-head");
  head.appendChild(el("span", "tid", t.trial_id));
  head.appendChild(el("span", "chip", `${t.judge}`));
  head.appendChild(el("span", "chip", `${t.repo}`));
  head.appendChild(el("span", "chip", `${t.condition} / ${t.injection_mode}`));
  head.appendChild(el("span", "chip", `${t.harness} · seed ${t.seed}`));
  head.appendChild(summaryChips(t));
  if (t.routed_off_fable) head.appendChild(el("span", "badge-routed", "ROUTED TO OPUS"));
  const body = el("div", "trial-body");
  head.onclick = async () => {
    row.classList.toggle("open");
    if (row.classList.contains("open") && !body.dataset.loaded) {
      body.replaceChildren(el("div", "muted", "Loading..."));
      try {
        const group = await fetchJSON(`./data/reviews__${t.group}.json`);
        renderTrialDetail(body, t, group[String(t.trial_id)] || {});
        body.dataset.loaded = "1";
      } catch (e) {
        body.replaceChildren(el("div", "error-box", String(e)));
      }
    }
  };
  row.appendChild(head);
  row.appendChild(body);
  return row;
}

function renderTrialDetail(body, summary, detail) {
  body.replaceChildren();
  const meta = el("div", "muted");
  const served = Array.isArray(detail.served_model) ? detail.served_model.join(", ") : detail.served_model;
  meta.textContent = [
    served ? `served: ${served}` : null,
    detail.num_turns != null ? `turns: ${detail.num_turns}` : null,
    detail.parse_error ? `parse_error: ${detail.parse_error}` : null,
  ].filter(Boolean).join(" · ");
  if (meta.textContent) body.appendChild(meta);

  const parsed = detail.parsed || {};
  if (Array.isArray(parsed.issues) && parsed.issues.length) {
    body.appendChild(el("h3", "section", "Parsed issues"));
    const table = el("table", "issues");
    const keys = [...new Set(parsed.issues.flatMap((i) =>
      typeof i === "object" && i !== null ? Object.keys(i) : ["issue"]
    ))];
    const thead = el("tr");
    thead.appendChild(el("th", null, "#"));
    for (const k of keys) thead.appendChild(el("th", null, k));
    table.appendChild(thead);
    parsed.issues.forEach((issue, idx) => {
      const tr = el("tr");
      tr.appendChild(el("td", null, String(idx + 1)));
      for (const k of keys) {
        const v = typeof issue === "object" && issue !== null ? issue[k] : (k === "issue" ? issue : "");
        tr.appendChild(el("td", null, v === undefined || v === null ? "" : typeof v === "object" ? JSON.stringify(v) : String(v)));
      }
      table.appendChild(tr);
    });
    body.appendChild(table);
  }

  body.appendChild(el("h3", "section", "Parsed JSON"));
  body.appendChild(el("pre", "body-text", JSON.stringify(parsed, null, 2)));
  body.appendChild(el("h3", "section", "Full review text"));
  body.appendChild(el("pre", "body-text", detail.text || "(no text)"));
}

(async function init() {
  try {
    manifest = await fetchJSON("./data/manifest.json");
  } catch (e) {
    showError(`Could not load ./data/manifest.json — run "uv run python viewer/build_viewer.py build" first and serve this directory. (${e})`);
    return;
  }
  initGeneration();
  initReviews();
})();
</script>
</body>
</html>
