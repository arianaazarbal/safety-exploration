# See https://setuptools.pypa.io/en/latest/userguide/pyproject_config.html
[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "examples"
description = "examples"
requires-python = ">=3.11"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    "anthropic>=0.104.1",
    "blobfile>=3.2.0",
    "chz>=0.4.0",
    "fire>=0.7.1",
    "inspect-ai>=0.3.225",
    "inspect-evals>=0.13.0",
    "matplotlib>=3.10.9",
    "openai>=2.38.0",
    "pandas>=3.0.3",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "termcolor>=3.3.0",
    "tinker>=0.22.0",
    "torch>=2.12.0",
    "transformers>=5.9.0",
]

[tool.setuptools]
packages = ["examples"]

[tool.ruff]
target-version = "py311"
extend-include = ["*.ipynb"]
extend-exclude = ["submodules"]

# Line length 120 to makes it easier to have multiple files open side-by-side.
line-length = 120

[tool.ruff.lint]
# Check that imports are sorted
extend-select = ["I"]

[tool.ruff.lint.isort]
# wandb is a package, but sometimes also a folder that gets created.
# We tell ruff to treat it always as a third-party package to make import
# sorting consistent.
known-third-party = ["wandb"]

[tool.black]
line-length = 120
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''
